function trOrigId(){ return $('#trOrig')?$('#trOrig').value:(state.obras[0]&&state.obras[0].id); }
function drawTrResults(q){ const box=$('#trResults'); if(!box)return; const orig=trOrigId(); const list=searchProducts(q).filter(p=>saldoOf(orig,p.code)>0).slice(0,8); if(!q){box.innerHTML='';return;} if(!list.length){box.innerHTML=`<div class="muted" style="font-size:12px;padding:8px 2px">Nenhum item com saldo na obra de origem.</div>`;return;}
  box.innerHTML=`<div class="tbl-wrap" style="margin-top:10px"><table><tbody>`+list.map(p=>`<tr><td>${esc(p.desc)}<br><span class="muted" style="font-size:11px">${esc(p.code)}${p.aux?' · aux '+esc(p.aux):''} · saldo ${numf(saldoOf(orig,p.code))} ${esc(p.unit||'')}</span></td><td class="num" style="width:80px"><button class="btn ghost sm" onclick="addTr('${esc(p.code)}')">+ Add</button></td></tr>`).join('')+`</tbody></table></div>`; }
function addTr(code){ const orig=trOrigId(); if(saldoOf(orig,code)<=0){toast('Item sem saldo na obra de origem.','err');return;} if(!trCart.some(i=>i.code===code))trCart.push({code,qty:1}); if($('#trScan'))$('#trScan').value=''; if($('#trResults'))$('#trResults').innerHTML=''; drawTrCart(); if($('#trScan'))$('#trScan').focus(); }
function rmTr(code){ trCart=trCart.filter(i=>i.code!==code); drawTrCart(); }
function setTrQty(code,v){ const it=trCart.find(i=>i.code===code); if(it)it.qty=parseFloat(v)||0; const p=findProduct(code); const cell=$('#tv_'+CSS.escape(code)); if(cell&&p)cell.textContent=money((it?it.qty:0)*((p.custo)||0)); updateTrTotal(); }
function updateTrTotal(){ const el=$('#trTotal'); if(!el)return; let t=0; trCart.forEach(i=>{const p=findProduct(i.code); t+=(i.qty||0)*((p&&p.custo)||0);}); el.textContent=money(t); }
function drawTrCart(){ const b=$('#trCartBody'); if(!b)return; const orig=trOrigId();
  if(!trCart.length){ b.innerHTML=`<tr><td colspan="5" class="empty" style="padding:20px">Nenhum item. Pesquise acima e adicione.</td></tr>`; updateTrTotal(); return; }
  b.innerHTML=trCart.map(i=>{const p=findProduct(i.code);const s=saldoOf(orig,i.code);const tot=(i.qty||0)*((p.custo)||0);return `<tr><td>${esc(p.desc)}<br><span class="muted" style="font-size:11px">${esc(p.code)}${p.aux?' · aux '+esc(p.aux):''}</span></td><td class="num ${i.qty>s?'neg':''}">${numf(s)} ${esc(p.unit||'')}</td><td class="num"><input class="inline-edit" type="number" step="any" min="0" value="${i.qty}" oninput="setTrQty('${esc(i.code)}',this.value)"></td><td class="num" id="tv_${esc(i.code)}">${money(tot)}</td><td class="num"><button class="btn danger sm" onclick="rmTr('${esc(i.code)}')">✕</button></td></tr>`;}).join(''); updateTrTotal(); }

  $('#trHist').innerHTML=list.length?list.map(m=>`<tr><td class="muted" style="font-size:12px">${fmtDate(m.ts)}</td><td class="mono">${m.seq?seqf(m.seq):'—'}</td><td style="font-size:12.5px">${esc(obraName(m.obra))} → ${esc(obraName(m.obraDest))}</td><td>${esc(m.desc)}${m.obs?`<br><span class="muted" style="font-size:11px">obs: ${esc(m.obs)}</span>`:''}</td><td class="num"><span class="pill tr">${numf(m.qty)}</span></td><td class="num">${money(m.valorTotal)}</td><td class="num"><button class="btn ghost sm" title="Romaneio (agrupado)" onclick="reportRomaneio('${m.romaneioId||m.id}')">🖨</button> <button class="btn danger sm" title="Excluir e estornar (supervisor)" onclick="delTrMov('${m.id}')">🗑</button></td></tr>`).join(''):`<tr><td colspan="7" class="empty" style="padding:24px">Nenhuma transferência.</td></tr>`; }
function delTrMov(id){ const m=state.movements.find(x=>x.id===id&&x.tipo==='transferencia'); if(!m)return; requireSupervisor('Excluir transferência Nº '+seqf(m.seq),()=>{ addSaldo(m.obra,m.code,m.qty,m.lotes); addSaldo(m.obraDest,m.code,-m.qty,m.lotes); state.movements=state.movements.filter(x=>x.id!==id); sb.from('movimentos_estoque').delete().eq('id',id).then(({error})=>{ if(error)toast('Erro ao excluir movimentação no banco: '+error.message,'err'); }); save('Transferência Nº '+seqf(m.seq)+' excluída e estornada'); drawTrHist(); toast('Transferência excluída e estornada.','warn'); }); }
async function confirmTransfer(){ const orig=$('#trOrig').value, dest=$('#trDest').value;
  if(orig===dest){toast('Origem e destino devem ser diferentes.','err');return;}
  const oOrig=state.obras.find(o=>o.id===orig), oDest=state.obras.find(o=>o.id===dest);
  if(oOrig&&oDest&&oOrig.empresa&&oDest.empresa&&oOrig.empresa.trim().toLowerCase()!==oDest.empresa.trim().toLowerCase()){
    toast('Empresas diferentes — transferência direta não é permitida. Faça baixa por consumo e registre o mútuo.','err'); return; }
  if(!trCart.length){toast('Adicione itens.','err');return;}
  const itens=trCart.filter(i=>i.qty>0); if(!itens.length){toast('Informe as quantidades.','err');return;}
  for(const i of itens){ const s=saldoOf(orig,i.code); if(i.qty>s){const p=findProduct(i.code); toast(`Saldo insuficiente: ${p.desc} (${numf(s)}).`,'err'); return;} }
  const wantReport=$('#trReport')&&$('#trReport').checked; const obs=($('#trObs')?$('#trObs').value.trim():'');
  const {data:numData,error:eNum}=await sb.rpc('proximo_numero_documento',{p_tipo:'transferencia'});
  const seq=eNum?0:numData; if(eNum)console.warn('Falha ao gerar numeração da transferência, seguindo sem número:',eNum);
  const romaneioId=uid(); const ts=Date.now(); const repItens=[];
  itens.forEach(i=>{const p=findProduct(i.code); const vu=p.custo||0; const lt=addSaldo(orig,p.code,-i.qty); addSaldo(dest,p.code,i.qty,lt); /* os mesmos lotes chegam ao destino */
    pushMov({id:uid(),ts,seq,romaneioId,tipo:'transferencia',obra:orig,obraDest:dest,obs,code:p.code,desc:p.desc,qty:i.qty,valorUnit:vu,valorTotal:i.qty*vu,doc:`Romaneio Nº ${seqf(seq)} · ${obraName(orig)} → ${obraName(dest)}`,saldo:saldoOf(orig,p.code),saldoDest:saldoOf(dest,p.code),lotes:lt||undefined});
    repItens.push({code:p.code,aux:p.aux,desc:p.desc,qty:i.qty,unit:p.unit,valor:vu}); });
  save('Transferência Nº '+seqf(seq)+' · '+obraName(orig)+' → '+obraName(dest)); toast(`Romaneio Nº ${seqf(seq)} · ${itens.length} item(ns) · ${esc(obraName(orig))} → ${esc(obraName(dest))}`,'ok');
  if(wantReport)printSignReport({titulo:'Romaneio de Transferência de Estoque',numero:seqf(seq),conferencia:true,recebimento:true,subtitulo:'Movimentação entre obras',data:fmtDate(ts),obra:obraName(orig),obraDest:obraName(dest),obs,itens:repItens,assinaturas:['Responsável obra origem','Responsável obra destino','Transportador / Conferente']});
  trCart=[]; drawTrCart(); drawTrHist(); if($('#trScan'))$('#trScan').focus(); }
function reportRomaneio(id){ const ms=state.movements.filter(m=>m.tipo==='transferencia'&&(m.romaneioId||m.id)===id); if(!ms.length)return; const m0=ms[0];
  const itens=ms.map(m=>{const p=findProduct(m.code); return {code:m.code,aux:p?p.aux:'',desc:m.desc,qty:m.qty,unit:p?p.unit:'',valor:m.valorUnit};});
  printSignReport({titulo:'Romaneio de Transferência de Estoque',numero:seqf(m0.seq),conferencia:true,recebimento:true,subtitulo:'Movimentação entre obras',data:fmtDate(m0.ts),obra:obraName(m0.obra),obraDest:obraName(m0.obraDest),obs:m0.obs,itens,assinaturas:['Responsável obra origem','Responsável obra destino','Transportador / Conferente']}); }

      g.itens.map(m=>`<tr><td class="muted" style="font-size:12px">${fmtDate(new Date(m.criado_em).getTime())}${m.registrado_por_nome?'<br><span style="font-size:10.5px">'+esc(m.registrado_por_nome)+'</span>':''}</td><td>${esc(m.descricao||'—')}</td><td class="muted" style="font-size:12px">${esc(m.obra_origem_nome||'')} → ${esc(m.obra_destino_nome||'')}</td><td class="num">${money(m.valor)}</td><td class="num" style="white-space:nowrap">${podeAlterarMutuo(m)?`<button class="btn ghost sm" title="Editar" onclick="editarMutuoModal('${m.id}')">✎</button> <button class="btn danger sm" title="Excluir" onclick="excluirMutuo('${m.id}')">✕</button>`:''}</td></tr>`).join('')
    }</tbody></table>
    <div style="display:flex;justify-content:flex-end;gap:8px;margin-top:10px;flex-wrap:wrap"><button class="btn ghost sm" onclick="imprimirComprovMutuo('aberto',${gi})">📄 Comprovante do período</button>${isAdminOuEncAlmox()?`<button class="btn primary sm" onclick="fecharPeriodoMutuo(${gi})">🔒 Fechar período</button>`:''}</div>
  </div>`).join('');
}

async function salvarMutuo(){

  const obraOrigem=$('#muObraOrigem').value.trim(), obraDestino=$('#muObraDestino').value.trim();
  const desc=$('#muDesc').value.trim(); const valor=parseFloat($('#muValor').value);
  if(!origem||!destino){toast('Informe as duas empresas.','err');return;}
  if(origem.trim().toLowerCase()===destino.trim().toLowerCase()){toast('As empresas devem ser diferentes.','err');return;}
  if(!(valor>0)){toast('Informe um valor válido.','err');return;}
  const {error}=await sb.from('mutuos_intercompany').insert({periodo:periodoAtual(),empresa_origem:origem,empresa_destino:destino,obra_origem_nome:obraOrigem||null,obra_destino_nome:obraDestino||null,descricao:desc||null,valor,registrado_por:session.user.id,registrado_por_nome:profile.nome||profile.email});
  if(error){toast('Erro: '+error.message,'err');return;}
  toast('Mútuo registrado.','ok'); closeModal(); drawMutuoAbertos();
}
let mutuoCache={};
/* Só lançamentos em aberto (período não fechado). Admin / encarregado do almoxarifado alteram qualquer um; demais encarregados só os que registraram. */
function podeAlterarMutuo(m){ if(!m||m.status!=='aberto')return false; return isAdminOuEncAlmox()||(session&&m.registrado_por===session.user.id); }
function editarMutuoModal(id){ const m=mutuoCache[id]; if(!podeAlterarMutuo(m)){toast('Sem permissão para editar este lançamento.','err');return;}
  const empresas=[...new Set(state.obras.map(o=>o.empresa).filter(Boolean))];
  const obrasNomes=[...new Set(state.obras.map(o=>o.nome).filter(Boolean))];
  modal(`<h3>Editar mútuo</h3><p class="mp">Lançamento de ${fmtDate(new Date(m.criado_em).getTime())} · período ${periodoLabel(m.periodo)}${m.registrado_por_nome?' · registrado por '+esc(m.registrado_por_nome):''}.${/\(REQ-\d+\)/.test(m.descricao||'')?'<br><span style="color:#8a5a00">⚠ Gerado automaticamente na separação de uma requisição — alterar aqui não muda a baixa de estoque, só o valor devido.</span>':''}</p>
    <div class="row c2"><div class="field"><label>Empresa origem (que forneceu)</label><input id="muEdOrigem" list="muEdEmpresasList" value="${esc(m.empresa_origem||'')}"></div><div class="field"><label>Empresa destino (que recebeu)</label><input id="muEdDestino" list="muEdEmpresasList" value="${esc(m.empresa_destino||'')}"></div></div>

    <div class="row c2"><div class="field"><label>Obra origem (opcional)</label><input id="muEdObraOrigem" list="muEdObrasList" value="${esc(m.obra_origem_nome||'')}"></div><div class="field"><label>Obra destino (opcional)</label><input id="muEdObraDestino" list="muEdObrasList" value="${esc(m.obra_destino_nome||'')}"></div></div>
    <div class="field"><label>Descrição / itens</label><input id="muEdDesc" value="${esc(m.descricao||'')}"></div>
    <div class="field"><label>Valor (R$)</label><input id="muEdValor" type="number" step="0.01" value="${Number(m.valor)||''}"></div>
    <div style="display:flex;gap:10px;justify-content:flex-end"><button class="btn ghost" onclick="closeModal()">Cancelar</button><button class="btn primary" onclick="salvarEdicaoMutuo('${m.id}')">Salvar alterações</button></div>`);
}
async function salvarEdicaoMutuo(id){ const m=mutuoCache[id]; if(!podeAlterarMutuo(m)){toast('Sem permissão para editar este lançamento.','err');return;}
  const origem=$('#muEdOrigem').value.trim(), destino=$('#muEdDestino').value.trim();
  const valor=parseFloat($('#muEdValor').value);
  if(!origem||!destino){toast('Informe as duas empresas.','err');return;}
  if(origem.toLowerCase()===destino.toLowerCase()){toast('As empresas devem ser diferentes.','err');return;}
  if(!(valor>0)){toast('Informe um valor válido.','err');return;}
  const upd={empresa_origem:origem,empresa_destino:destino,obra_origem_nome:$('#muEdObraOrigem').value.trim()||null,obra_destino_nome:$('#muEdObraDestino').value.trim()||null,descricao:$('#muEdDesc').value.trim()||null,valor};
  const {data,error}=await sb.from('mutuos_intercompany').update(upd).eq('id',id).eq('status','aberto').select('id');
  if(error){toast('Erro ao salvar: '+error.message,'err');return;}
  if(!data||!data.length){toast('Nada foi alterado — o período pode ter sido fechado ou o banco bloqueou a edição (permissão).','err');closeModal();drawMutuoAbertos();return;}
  toast('Mútuo atualizado.','ok'); closeModal(); drawMutuoAbertos();
}
function excluirMutuo(id){ const m=mutuoCache[id]; if(!podeAlterarMutuo(m)){toast('Sem permissão para excluir este lançamento.','err');return;}
  requireSupervisor('Excluir mútuo de '+money(m.valor)+' ('+m.empresa_origem+' → '+m.empresa_destino+')'+(m.descricao?' — '+m.descricao:''),async()=>{
    const {data,error}=await sb.from('mutuos_intercompany').delete().eq('id',id).eq('status','aberto').select('id');
    if(error){toast('Erro ao excluir: '+error.message,'err');return;}
    if(!data||!data.length){toast('Nada foi excluído — o período pode ter sido fechado ou o banco bloqueou a exclusão (permissão).','err');drawMutuoAbertos();return;}
    toast('Mútuo excluído.','ok'); drawMutuoAbertos();
  });
}
/* O botão passa só o índice do grupo. Antes passava as razões sociais com JSON.stringify dentro de
   onclick="..." — as aspas duplas fechavam o atributo e o clique não fazia nada (erro de sintaxe silencioso). */
let _mutuoGrupos=[], _fechandoMutuo=false;
function fecharPeriodoMutuo(gi){
  const g=_mutuoGrupos[gi]; if(!g){ toast('Grupo não encontrado — atualize a tela.','err'); return; }
  if(!isAdminOuEncAlmox()){ toast('Somente administrador ou encarregado do almoxarifado fecha período.','err'); return; }
  const {periodo,origem,destino}=g;
  const aviso=periodo===periodoAtual()?' — o mês ainda está em andamento: lançamentos registrados depois do fechamento abrem um novo grupo deste mesmo período':'';
  requireSupervisor('Fechar período de mútuo '+periodoLabel(periodo)+' ('+origem+' → '+destino+') · '+g.itens.length+' lançamento(s) · '+money(g.total)+aviso,async()=>{
    if(_fechandoMutuo)return; _fechandoMutuo=true;
    try{
      /* 1) cria o fechamento */
      const {data:fech,error:e1}=await sb.from('mutuo_fechamentos').insert({periodo,empresa_origem:origem,empresa_destino:destino,total_valor:g.total,fechado_por:session.user.id,fechado_por_nome:profile.nome||profile.email}).select('id').maybeSingle();
      if(e1){ toast('Erro ao criar o fechamento: '+e1.message,'err'); return; }
      if(!fech||!fech.id){ toast('O banco não devolveu o fechamento criado (permissão de leitura em mutuo_fechamentos). Nada foi travado — verifique no Supabase.','err'); drawMutuoFechados(); return; }
      /* 2) trava os lançamentos e confere quantos foram de fato travados */
      const {data:trav,error:e2}=await sb.from('mutuos_intercompany').update({status:'fechado',fechamento_id:fech.id}).eq('periodo',periodo).eq('empresa_origem',origem).eq('empresa_destino',destino).eq('status','aberto').select('id,valor');
      if(e2||!trav||!trav.length){
        /* desfaz o fechamento vazio para não sobrar um período "fechado" com lançamentos ainda abertos */
        const {error:e3}=await sb.from('mutuo_fechamentos').delete().eq('id',fech.id);
        toast((e2?'Erro ao travar os lançamentos: '+e2.message:'Nenhum lançamento foi travado (o banco bloqueou a alteração — permissão).')+(e3?' Atenção: o registro do fechamento não pôde ser desfeito ('+e3.message+').':' O fechamento foi cancelado.'),'err');
        drawMutuoAbertos(); drawMutuoFechados(); return; }
      /* 3) total definitivo = o que realmente foi travado (pode ter entrado lançamento depois que a tela abriu) */
      const total=Math.round(trav.reduce((t,r)=>t+Number(r.valor||0),0)*100)/100;
      if(Math.abs(total-g.total)>0.004){ const {error:e4}=await sb.from('mutuo_fechamentos').update({total_valor:total}).eq('id',fech.id); if(e4)toast('Período fechado, mas o total não pôde ser corrigido: '+e4.message,'warn'); }
      toast('Período fechado · '+trav.length+' lançamento(s) · '+money(total)+'.','ok');
    }finally{ _fechandoMutuo=false; drawMutuoAbertos(); drawMutuoFechados(); }
  });
}

/* Reabre um período: devolve os lançamentos para "aberto" e remove o registro do fechamento
   (a reabertura fica registrada na Auditoria). Se não der para remover o fechamento, os lançamentos
   voltam a ficar travados — nunca fica um período "fechado" com lançamentos abertos. */
let _mutuoFechados={}, _reabrindoMutuo=false;
function reabrirPeriodoMutuo(id){
  const f=_mutuoFechados[id]; if(!f){ toast('Fechamento não encontrado — atualize a tela.','err'); return; }
  if(!isAdmin()){ toast('Somente o administrador pode reabrir período.','err'); return; }
  requireSupervisor('Reabrir período de mútuo '+periodoLabel(f.periodo)+' ('+f.empresa_origem+' → '+f.empresa_destino+') · '+money(f.total_valor)+' — os lançamentos voltam a poder ser editados e excluídos',async()=>{
    if(_reabrindoMutuo)return; _reabrindoMutuo=true;
    try{
      const {data:reab,error:e1}=await sb.from('mutuos_intercompany').update({status:'aberto',fechamento_id:null}).eq('fechamento_id',id).eq('status','fechado').select('id,valor');
      if(e1){ toast('Erro ao reabrir os lançamentos: '+e1.message,'err'); return; }
      const {error:e2}=await sb.from('mutuo_fechamentos').delete().eq('id',id);
      if(e2){
        if(reab&&reab.length){ const {error:e3}=await sb.from('mutuos_intercompany').update({status:'fechado',fechamento_id:id}).in('id',reab.map(r=>r.id));
          toast('Não foi possível remover o fechamento ('+e2.message+').'+(e3?' ATENÇÃO: os lançamentos ficaram reabertos e não puderam ser travados de novo ('+e3.message+').':' Os lançamentos continuam fechados.'),'err'); }
        else toast('Não foi possível reabrir: '+e2.message,'err');
        return; }
      if(!reab||!reab.length) toast('Fechamento removido, mas nenhum lançamento foi reaberto (o banco pode ter bloqueado a alteração — confira as permissões).','warn');
      else toast('Período reaberto · '+reab.length+' lançamento(s) voltaram para "em aberto".','ok');
      try{ await sb.rpc('log_event',{p_acao:'mutuo_periodo_reaberto',p_entidade:'mutuo_fechamentos',p_entidade_id:id,p_detalhes:{periodo:f.periodo,empresa_origem:f.empresa_origem,empresa_destino:f.empresa_destino,total_valor:f.total_valor,fechado_por:f.fechado_por_nome||null,lancamentos:(reab||[]).length}}); }catch(e){}
    }finally{ _reabrindoMutuo=false; drawMutuoAbertos(); drawMutuoFechados(); }
  });
}

/* ===== REPOSIÇÃO DE ESTOQUE =====
   Itens abaixo do mínimo por obra/estoque → registra a solicitação de compra feita no Sienge (com o nº).
   Enquanto a solicitação estiver aberta, o item fica travado: não dá para pedir de novo (a trava também
   existe no banco — índice único por obra+produto com status "solicitada"). */
const REPOS_SQL="-- Reposição de estoque: registro das solicitações de compra feitas no Sienge\n-- Rodar uma vez no Supabase (SQL Editor). Pode rodar de novo sem problema.\n\ncreate table if not exists public.reposicoes_estoque (\n  id                         bigint generated always as identity primary key,\n  obra_id                    text        not null,\n  obra_nome                  text,\n  code                       text        not null,\n  descricao                  text,\n  unidade                    text,\n  quantidade                 numeric     not null check (quantidade > 0),\n  saldo_na_solicitacao       numeric,\n  numero_solicitacao_sienge  text        not null check (length(trim(numero_solicitacao_sienge)) > 0),\n  observacao                 text,\n  status                     text        not null default 'solicitada'\n                                         check (status in ('solicitada','recebida','cancelada')),\n  solicitado_por             uuid        default auth.uid(),\n  solicitado_por_nome        text,\n  criado_em                  timestamptz not null default now(),\n  finalizado_em              timestamptz,\n  finalizado_por_nome        text,\n  motivo_cancelamento        text\n);\n\n-- Trava de duplicidade no próprio banco: só pode existir UMA solicitação em aberto\n-- por produto em cada obra/estoque (vale mesmo se duas pessoas clicarem ao mesmo tempo).\ncreate unique index if not exists reposicoes_estoque_uma_aberta\n  on public.reposicoes_estoque (obra_id, code)\n  where status = 'solicitada';\n\ncreate index if not exists reposicoes_estoque_status_idx on public.reposicoes_estoque (status);\n\nalter table public.reposicoes_estoque enable row level security;\n\n-- Leitura: qualquer usuário ativo\ndrop policy if exists \"reposicoes: leitura\" on public.reposicoes_estoque;\ncreate policy \"reposicoes: leitura\" on public.reposicoes_estoque\n  for select to authenticated\n  using (exists (select 1 from public.profiles p where p.id = auth.uid() and p.ativo));\n\n-- Registrar: administrador, almoxarifado e compras\ndrop policy if exists \"reposicoes: registrar\" on public.reposicoes_estoque;\ncreate policy \"reposicoes: registrar\" on public.reposicoes_estoque\n  for insert to authenticated\n  with check (\n    solicitado_por = auth.uid()\n    and exists (select 1 from public.profiles p where p.id = auth.uid() and p.ativo\n                and (p.papel = 'admin' or p.setor in ('almoxarifado','compras')))\n  );\n\n-- Atualizar (recebida / cancelada / nº do Sienge): mesmos perfis\ndrop policy if exists \"reposicoes: atualizar\" on public.reposicoes_estoque;\ncreate policy \"reposicoes: atualizar\" on public.reposicoes_estoque\n  for update to authenticated\n  using (exists (select 1 from public.profiles p where p.id = auth.uid() and p.ativo\n                 and (p.papel = 'admin' or p.setor in ('almoxarifado','compras'))))\n  with check (exists (select 1 from public.profiles p where p.id = auth.uid() and p.ativo\n                 and (p.papel = 'admin' or p.setor in ('almoxarifado','compras'))));\n\n-- Sem política de DELETE: nada é apagado, só cancelado (fica o histórico).\n\n-- Atualização em tempo real entre usuários\ndo $$ begin\n  alter publication supabase_realtime add table public.reposicoes_estoque;\nexception when duplicate_object then null; end $$;\n\n-- ===== Recebimento por nota fiscal VINCULADA =====\n-- Entregue = soma das notas vinculadas à solicitação (reposicoes_recebimentos).\n-- Só entra a nota lançada pela solicitação ou vinculada explicitamente; nota lançada\n-- direto na Entrada não abate nada sozinha. Pode rodar de novo sem problema.\n\nalter table public.reposicoes_estoque add column if not exists nota_recebimento        text;\nalter table public.reposicoes_estoque add column if not exists quantidade_recebida     numeric not null default 0;\nalter table public.reposicoes_estoque add column if not exists quantidade_nao_entregue numeric;\nalter table public.reposicoes_estoque add column if not exists motivo_encerramento     text;\n\ncreate table if not exists public.reposicoes_recebimentos (\n  id               bigint generated always as identity primary key,\n  reposicao_id     bigint      not null references public.reposicoes_estoque(id) on delete cascade,\n  movimento_id     text        not null,\n  nota_id          text,\n  doc              text,\n  quantidade       numeric     not null check (quantidade > 0),\n  criado_por       uuid        default auth.uid(),\n  criado_por_nome  text,\n  criado_em        timestamptz not null default now()\n);\n-- Cada linha de entrada da nota só pode abater UMA solicitação (não conta duas vezes)\ncreate unique index if not exists reposicoes_recebimentos_mov_uk on public.reposicoes_recebimentos (movimento_id);\ncreate index if not exists reposicoes_recebimentos_rep_idx on public.reposicoes_recebimentos (reposicao_id);\n\nalter table public.reposicoes_recebimentos enable row level security;\ndrop policy if exists \"reposicoes_receb: leitura\" on public.reposicoes_recebimentos;\ncreate policy \"reposicoes_receb: leitura\" on public.reposicoes_recebimentos\n  for select to authenticated\n  using (exists (select 1 from public.profiles p where p.id = auth.uid() and p.ativo));\ndrop policy if exists \"reposicoes_receb: vincular\" on public.reposicoes_recebimentos;\ncreate policy \"reposicoes_receb: vincular\" on public.reposicoes_recebimentos\n  for insert to authenticated\n  with check (\n    criado_por = auth.uid()\n    and exists (select 1 from public.profiles p where p.id = auth.uid() and p.ativo\n                and (p.papel = 'admin' or p.setor in ('almoxarifado','compras')))\n  );\n-- Sem UPDATE/DELETE pelo app: o vínculo só some junto com a nota (gatilho abaixo).\n\n-- Valida o vínculo: entrada por NF, mesma obra e produto, depois da solicitação, solicitação em aberto.\n-- A quantidade e o documento vêm da própria movimentação (o app não consegue inflar o entregue).\ncreate or replace function public.reposicao_receb_valida()\nreturns trigger language plpgsql security definer set search_path = public as $$\ndeclare r public.reposicoes_estoque; m record;\nbegin\n  select * into r from public.reposicoes_estoque where id = new.reposicao_id;\n  if r.id is null then raise exception 'Solicitação de reposição não encontrada.'; end if;\n  if r.status <> 'solicitada' then\n    raise exception 'A solicitação Sienge % deste item não está mais em aberto.', r.numero_solicitacao_sienge;\n  end if;\n  select mv.tipo, mv.nota_id, mv.obra, mv.code, mv.ts, mv.qty, mv.doc into m\n    from public.movimentos_estoque mv where mv.id::text = new.movimento_id;\n  if not found then raise exception 'Movimentação da nota não encontrada no banco.'; end if;\n  if m.tipo <> 'entrada' or m.nota_id is null then\n    raise exception 'Só é possível vincular entrada por nota fiscal.';\n  end if;\n  if m.obra::text <> r.obra_id or m.code::text <> r.code then\n    raise exception 'A nota é de outra obra ou de outro produto.';\n  end if;\n  if m.ts < (extract(epoch from r.criado_em) * 1000)::bigint then\n    raise exception 'A nota foi lançada antes da solicitação.';\n  end if;\n  new.nota_id    := m.nota_id::text;\n  new.doc        := coalesce(m.doc, new.doc);\n  new.quantidade := m.qty;\n  new.criado_por_nome := coalesce((select nome from public.profiles where id = auth.uid()), new.criado_por_nome);\n  return new;\nend $$;\ndrop trigger if exists trg_reposicao_receb_valida on public.reposicoes_recebimentos;\ncreate trigger trg_reposicao_receb_valida\n  before insert on public.reposicoes_recebimentos\n  for each row execute function public.reposicao_receb_valida();\n\n-- Recalcula o entregue a cada vínculo; encerra sozinho quando chega tudo e\n-- reabre se uma nota for excluída (desde que não haja outra solicitação aberta do mesmo item).\ncreate or replace function public.reposicao_receb_atualiza()\nreturns trigger language plpgsql security definer set search_path = public as $$\ndeclare rid bigint := coalesce(new.reposicao_id, old.reposicao_id); tot numeric; r public.reposicoes_estoque;\nbegin\n  select * into r from public.reposicoes_estoque where id = rid;\n  if r.id is null then return null; end if;\n  select coalesce(sum(quantidade), 0) into tot from public.reposicoes_recebimentos where reposicao_id = rid;\n  if r.status = 'solicitada' and tot >= r.quantidade then\n    update public.reposicoes_estoque\n       set status = 'recebida', finalizado_em = now(),\n           finalizado_por_nome = coalesce((select nome from public.profiles where id = auth.uid()), 'automático')\n     where id = rid;\n  elsif r.status = 'recebida' and tot < r.quantidade and r.motivo_encerramento is null\n        and not exists (select 1 from public.reposicoes_estoque x\n                         where x.obra_id = r.obra_id and x.code = r.code and x.status = 'solicitada' and x.id <> rid) then\n    update public.reposicoes_estoque\n       set status = 'solicitada', finalizado_em = null, finalizado_por_nome = null\n     where id = rid;\n  else\n    update public.reposicoes_estoque set quantidade_recebida = tot where id = rid;\n  end if;\n  return null;\nend $$;\ndrop trigger if exists trg_reposicao_receb_atualiza on public.reposicoes_recebimentos;\ncreate trigger trg_reposicao_receb_atualiza\n  after insert or delete on public.reposicoes_recebimentos\n  for each row execute function public.reposicao_receb_atualiza();\n\n-- Toda alteração na solicitação recalcula entregue / notas a partir dos vínculos (o app não edita isso).\n-- Encerrar exige nota vinculada; encerrar com saldo não entregue exige motivo; cancelar só sem nota.\ncreate or replace function public.reposicao_exige_nota()\nreturns trigger language plpgsql security definer set search_path = public as $$\ndeclare tot numeric; docs text;\nbegin\n  select coalesce(sum(quantidade), 0), string_agg(distinct doc, ', ')\n    into tot, docs from public.reposicoes_recebimentos where reposicao_id = new.id;\n  new.quantidade_recebida := tot;\n  new.nota_recebimento    := left(docs, 500);\n  if new.status = 'recebida' and old.status is distinct from 'recebida' then\n    if tot <= 0 then\n      raise exception 'Recebimento bloqueado: dê entrada da nota fiscal de % pela solicitação (ou vincule a nota) antes de encerrar.',\n        coalesce(new.descricao, new.code) using errcode = 'P0001';\n    end if;\n    new.quantidade_nao_entregue := greatest(new.quantidade - tot, 0);\n    if new.quantidade_nao_entregue > 0 and coalesce(trim(new.motivo_encerramento), '') = '' then\n      raise exception 'Informe o motivo para encerrar com % não entregue.', new.quantidade_nao_entregue using errcode = 'P0001';\n    end if;\n  elsif new.status = 'solicitada' then\n    new.quantidade_nao_entregue := null;\n    new.motivo_encerramento := null;\n  end if;\n  if new.status = 'cancelada' and old.status is distinct from 'cancelada' and tot > 0 then\n    raise exception 'Já há nota vinculada a este item — encerre com saldo não entregue em vez de cancelar.' using errcode = 'P0001';\n  end if;\n  return new;\nend $$;\ndrop trigger if exists trg_reposicao_exige_nota on public.reposicoes_estoque;\ncreate trigger trg_reposicao_exige_nota\n  before update on public.reposicoes_estoque\n  for each row execute function public.reposicao_exige_nota();\n\n-- Nota excluída (movimentação apagada) => some o vínculo e o entregue é recalculado\ncreate or replace function public.reposicao_mov_excluido()\nreturns trigger language plpgsql security definer set search_path = public as $$\nbegin\n  delete from public.reposicoes_recebimentos where movimento_id = old.id::text;\n  return old;\nend $$;\ndrop trigger if exists trg_reposicao_mov_excluido on public.movimentos_estoque;\ncreate trigger trg_reposicao_mov_excluido\n  after delete on public.movimentos_estoque\n  for each row execute function public.reposicao_mov_excluido();\n";

function reposAbertasDoCodigo(code){ if(!_reposAbertas)return []; const c=String(code); return [..._reposAbertas.values()].filter(r=>String(r.code)===c); }

function reposTabelaFaltando(e){ const m=(e&&e.message)||''; return !!e&&(e.code==='42P01'||e.code==='PGRST205'||(/reposicoes_estoque/.test(m)&&/(could not find|does not exist|não existe|schema cache)/i.test(m))); }

function reposSugerida(p,s,obra){ const L=limDe(p,obra); let q=L.max>0?L.max-s:L.min-s; if(!(q>0))q=L.min>0?L.min:1; return Math.round(q*1000)/1000; }

function reposUn(r){ const p=findProduct(r.code); return r.unidade||(p?p.unit:'')||''; }
function reposPend(r){ return Math.max(Number(r.quantidade)-(Number(r.quantidade_recebida)||0),0); }

/* Abre a Entrada / Nota Fiscal já com a obra e os itens pendentes (ids=null → todos os pendentes do grupo) */
function reposLancarNota(gi,ids){ const g=_reposGrupos[gi]; if(!g)return; const itens=g.itens.filter(r=>(!ids||ids.includes(r.id))&&reposPend(r)>0);

/* Depois de lançar a nota pela solicitação: vincula as linhas da nota aos itens (o banco recalcula e encerra o que completou) */
async function reposAposNota(ctx,obraNota,movs){
  const abrir=()=>{ _comprasAba='reposicao'; go(abaPermitida('compras')?'compras':'produtos'); };
  if(obraNota!==ctx.obra_id){ toast(`A nota entrou em ${esc(obraName(obraNota))}, mas a solicitação Sienge ${esc(ctx.sienge)} é de ${esc(ctx.obra_nome)} — a nota não foi vinculada.`,'warn'); abrir(); return; }
  try{
    await aguardarMovs();
    const rows=[], fora=[];
    ctx.itens.forEach(i=>{ const ms=(movs||[]).filter(m=>String(m.code)===i.code&&Number(m.qty)>0);
      if(!ms.length){ fora.push(i); return; }
      ms.forEach(m=>rows.push({reposicao_id:i.id,movimento_id:String(m.id),nota_id:m.notaId||null,doc:m.doc||null,quantidade:Number(m.qty),criado_por_nome:profile.nome||profile.email})); });
    if(rows.length){ const {error}=await sb.from('reposicoes_recebimentos').insert(rows);
      if(error) toast('Nota lançada, mas não foi possível vincular à solicitação: '+esc(error.message)+' — use Receber › Vincular nota já lançada.','err');
      else{ await loadReposAbertas(); const vinc=[...new Set(rows.map(x=>x.reposicao_id))];
        const abertas=_reposAbertas?[..._reposAbertas.values()]:[];
        const parc=vinc.filter(id=>abertas.some(r=>r.id===id)).length, comp=vinc.length-parc;
        if(comp)toast(`${comp} item(ns) da solicitação Sienge ${esc(ctx.sienge)} recebido(s) por completo.`,'ok');
        if(parc)toast(`${parc} item(ns) com entrega parcial — o pendente continua em aberto.`,'warn');
        try{ await sb.rpc('log_event',{p_acao:'reposicao_nota_vinculada',p_entidade:'reposicoes_estoque',p_entidade_id:null,p_detalhes:{sienge:ctx.sienge,notas:[...new Set(rows.map(x=>x.doc))],itens:rows.map(x=>({id:x.reposicao_id,qtd:x.quantidade}))}}); }catch(e){}
      } }
    if(fora.length)toast(`${fora.length} item(ns) da solicitação não estavam na nota e continuam pendentes.`,'warn');
  }catch(e){ toast('Nota lançada, mas houve um erro ao vincular à solicitação: '+esc(e.message||String(e)),'err'); }
  abrir(); }

const DEVREQ_MOTIVOS=['Sobra de material (não utilizado)','Material errado / não era o aplicável','Material com defeito ou avariado','Serviço cancelado ou alterado','Requisitado em duplicidade','Outro'];
let _devReqRows=[], _devReqCtx=null, _devReqSalvando=false, _drReqs=[];

const DEVREQ_MSG_SEM_TABELA='A tabela desta rotina ainda não existe no banco. Rode o script <b>devolucao_requisicao.sql</b> no SQL Editor do Supabase e recarregue a página.';

function drawDevolReqHist(){ const box=$('#devReqHist'); if(!box)return;

/* A referência da devolução é o Nº DA SAÍDA (o número grande do comprovante de saída = seq da baixa na separação).
   Cada item separado tem a sua saída; a requisição (REQ) fica como informação de apoio. */
function devSaidasFmt(seqs){ seqs=[...new Set((seqs||[]).map(Number).filter(n=>n>0))].sort((x,y)=>x-y); if(!seqs.length)return '';
  return (seqs.length>2&&seqs[seqs.length-1]-seqs[0]===seqs.length-1)?seqf(seqs[0])+' a '+seqf(seqs[seqs.length-1]):seqs.map(seqf).join(', '); }
function devReqDocSep(id){ return 'Separação REQ-'+String(id).padStart(5,'0'); }
/* Passo 1: localizar a saída (só de requisições que já saíram do almoxarifado) */
async function devolReqModal(reqId){

    <div style="display:flex;justify-content:flex-end;margin-top:14px"><button class="btn ghost" onclick="closeModal()">Cancelar</button></div>`);

  if(error){ const l=$('#drLista'); if(l)l.innerHTML='<div class="empty" style="padding:14px">Erro: '+esc(error.message)+'</div>'; return; }
  _drReqs=data||[];
  if(_drReqs.length){ /* nºs de saída de cada requisição listada */
    const {data:mv}=await fetchAllRows(()=>sb.from('movimentos_estoque').select('id,seq,doc').eq('tipo','baixa').in('doc',_drReqs.map(r=>devReqDocSep(r.id))).order('id'));
    const por={}; (mv||[]).forEach(m=>{ const id=reqIdFromDoc(m.doc); if(id&&m.seq)(por[id]=por[id]||[]).push(Number(m.seq)); });
    _drReqs.forEach(r=>r.saidas=por[r.id]||[]); }
  devolReqListar($('#drBusca')?$('#drBusca').value:'');
}
/* Linha da busca: clicável só se a requisição já saiu do almoxarifado. seq = saída que casou com o número digitado */
function devolReqLinha(r,seq){ const ok=STATUS_ATENDIDA.includes(r.status); const sd=seq?seqf(seq):devSaidasFmt(r.saidas);
  return `<tr ${ok?`style="cursor:pointer" onclick="devolReqEscolher(${r.id},${seq||'null'})"`:'style="opacity:.6" title="Ainda não saiu do almoxarifado — sem devolução por aqui"'}><td style="white-space:nowrap">${sd?`<b class="mono" style="font-size:13px">Saída ${sd}</b><br>`:''}<span class="mono muted" style="font-size:11px">REQ-${String(r.id).padStart(5,'0')}</span></td><td>${esc(r.aplicacao_nome||'—')}${r.ordem_servico?' · OS '+esc(r.ordem_servico):''}<br><span class="muted" style="font-size:11px">${esc(r.obra_nome||'')} · ${esc(r.solicitante_nome||'')} · ${fmtDate(new Date(r.criado_em).getTime())}</span></td><td><span class="pill ${r.status}">${reqStatusLabel(r.status)}</span>${ok?'':'<br><span class="muted" style="font-size:11px">ainda não saiu</span>'}</td></tr>`; }
let _drNumTk=0, _drNumTimer=null;
function devolReqListar(q){ const box=$('#drLista'); if(!box)return; q=String(q||'').toLowerCase().trim();
  const qn=q.replace(/^(req|dev|sa[ií]da)?[\s\-nº°.:]*/,''); const num=/^\d+$/.test(qn)?parseInt(qn,10):null;
  const temSaida=r=>num!==null&&(r.saidas||[]).includes(num);
  let list=!q?_drReqs:_drReqs.filter(r=>temSaida(r)||(num!==null&&r.id===num)||[r.aplicacao_nome,r.ordem_servico,r.solicitante_nome,r.obra_nome].some(v=>String(v||'').toLowerCase().includes(q)));
  if(num!==null)list=list.slice().sort((x,y)=>(temSaida(y)?1:0)-(temSaida(x)?1:0)); /* a saída com esse número vem antes da requisição com o mesmo número */
  list=list.slice(0,12);
  box.innerHTML=(list.length?`<div class="tbl-wrap" style="max-height:300px;overflow:auto"><table><tbody>${list.map(r=>devolReqLinha(r,temSaida(r)?num:null)).join('')}</tbody></table></div>`
    :(num!==null?'':'<div class="empty" style="padding:14px">Nenhuma saída de requisição retirada/despachada encontrada'+(q?' para "<b>'+esc(q)+'</b>"':'')+'.</div>'))+'<div id="drNum"></div>';
  /* número digitado e fora da lista recente: confere no banco (saída de qualquer data, ou requisição em qualquer situação) */
  clearTimeout(_drNumTimer); const tk=++_drNumTk;
  if(num!==null&&!list.some(temSaida)){ $('#drNum').innerHTML='<p class="muted" style="font-size:12px;margin:8px 2px">Procurando a saída nº '+seqf(num)+' no banco...</p>';
    _drNumTimer=setTimeout(()=>devolReqBuscaNumero(num,tk,list.map(r=>r.id)),350); } }
async function devolReqBuscaNumero(num,tk,jaListadas){
  const cols='id,obra_nome,aplicacao_nome,ordem_servico,solicitante_nome,status,criado_em';
  const [{data:mv,error:e2},{data:r,error:e1}]=await Promise.all([
    sb.from('movimentos_estoque').select('seq,doc,descricao').eq('tipo','baixa').eq('seq',num).limit(30),
    sb.from('requisicoes').select(cols).eq('id',num).maybeSingle()]);
  if(tk!==_drNumTk)return;
  const idsDoc=[...new Set((mv||[]).map(m=>reqIdFromDoc(m.doc)).filter(Boolean))];
  const semReq=(mv||[]).filter(m=>!reqIdFromDoc(m.doc));
  let reqsDoc=[]; if(idsDoc.length){ const {data}=await sb.from('requisicoes').select(cols).in('id',idsDoc); reqsDoc=data||[]; if(tk!==_drNumTk)return; }
  const box=$('#drNum'); if(!box)return;
  const rows=reqsDoc.map(x=>devolReqLinha(x,num)); if(r&&!jaListadas.includes(r.id)&&!idsDoc.includes(r.id))rows.push(devolReqLinha(r));
  let html=rows.length?`<div class="tbl-wrap" style="margin-top:8px"><table><tbody>${rows.join('')}</tbody></table></div>`:'';
  if(semReq.length&&!reqsDoc.length)html+='<p class="mp" style="margin-top:8px;font-size:12.5px">A saída nº <b>'+seqf(num)+'</b> ('+esc(semReq[0].descricao||'')+') é uma baixa sem requisição — esta rotina só devolve material que saiu por requisição.</p>';
  if(!rows.length&&!semReq.length&&!jaListadas.length)html='<div class="empty" style="padding:14px">'+((e1||e2)?'Erro na busca: '+esc((e1||e2).message):'Não há saída nº <b>'+seqf(num)+'</b> nem requisição nº <b>'+num+'</b> visível para o seu usuário.<br><span style="font-size:12px">O número da saída é o "Documento Nº" do comprovante de saída de material.</span>')+'</div>';
  box.innerHTML=html; }
/* Passo 2: itens (cada um com o seu nº de saída), quantidades, motivo. seqSel = saída digitada na busca (fica em destaque) */
async function devolReqEscolher(id,seqSel){
  const [{data:r,error:e1},{data:its,error:e2},{data:devs,error:e3},{data:mvs}]=await Promise.all([
    sb.from('requisicoes').select('*').eq('id',id).maybeSingle(),
    sb.from('requisicao_itens_status').select('id,code,descricao,unidade,quantidade_separada').eq('requisicao_id',id).gt('quantidade_separada',0).order('id',{ascending:true}),
    sb.from('devolucoes_requisicao').select('item_code,quantidade').eq('requisicao_id',id),
    sb.from('movimentos_estoque').select('seq,code,qty,valor_total').eq('tipo','baixa').eq('doc',devReqDocSep(id)).gt('qty',0)]);
  if(e3&&devReqSemTabela(e3)){ toast(DEVREQ_MSG_SEM_TABELA,'err'); return; }
  if(e1||e2||e3){ toast('Erro ao carregar a requisição: '+esc((e1||e2||e3).message),'err'); return; }
  if(!r){ toast('Requisição REQ-'+String(id).padStart(5,'0')+' não encontrada.','err'); return; }
  if(!STATUS_ATENDIDA.includes(r.status)){ toast('A REQ-'+String(r.id).padStart(5,'0')+' ainda não saiu do almoxarifado (situação: '+esc(reqStatusLabel(r.status))+'). A devolução só pode ser registrada depois da retirada ou do despacho.','err'); return; }
  const dev={}; (devs||[]).forEach(d=>{ dev[d.item_code]=(dev[d.item_code]||0)+Number(d.quantidade||0); });
  /* saída(s) e valor unitário de cada item, pelas baixas da separação desta requisição */
  const sai={}; (mvs||[]).forEach(m=>{ const c=String(m.code); if(!sai[c])sai[c]={seqs:[],q:0,v:0}; if(m.seq)sai[c].seqs.push(Number(m.seq)); sai[c].q+=Number(m.qty)||0; sai[c].v+=Number(m.valor_total)||0; });
  const porCode={}; (its||[]).forEach(i=>{ const c=String(i.code); if(!porCode[c])porCode[c]={code:c,desc:i.descricao,unit:i.unidade||'',sep:0}; porCode[c].sep+=Number(i.quantidade_separada)||0; });
  const itens=Object.values(porCode).map(i=>{ const d=dev[i.code]||0, sx=sai[i.code], p=findProduct(i.code);
    return {...i,dev:d,max:Math.max(0,Math.round((i.sep-d)*1e6)/1e6),seqs:sx?sx.seqs:[],saida:sx?devSaidasFmt(sx.seqs):'',vu:(sx&&sx.q>0)?sx.v/sx.q:(p?(p.custo||0):0)}; });
  if(!itens.length){ toast('Esta requisição não tem item separado para devolver.','err'); return; }
  const obraSaldo=obraEstoqueParaRequisicao(r);
  _devReqCtx={r,itens,obraSaldo};
  const reqN='REQ-'+String(r.id).padStart(5,'0');
  const nada=itens.every(i=>!(i.max>0));
  const sel=x=>!!seqSel&&x.seqs.includes(Number(seqSel));
  const titulo=seqSel?'saída '+seqf(seqSel):(devSaidasFmt(itens.flatMap(i=>i.seqs))?'saída '+devSaidasFmt(itens.flatMap(i=>i.seqs)):reqN);
  modal(`<h3>📥 Devolução — ${titulo}</h3>
    <p class="mp">${reqN} · Obra: <b>${esc(r.obra_nome||'')}</b>${r.aplicacao_nome?' · Aplicação: <b>'+esc(r.aplicacao_nome)+'</b>':''}${r.ordem_servico?' · OS <b>'+esc(r.ordem_servico)+'</b>':''} · <span class="pill ${r.status}">${reqStatusLabel(r.status)}</span></p>
    <p class="mp" style="font-size:12px">Solicitante: ${esc(r.solicitante_nome||'—')} · o material volta para o estoque <b>${esc(obraName(obraSaldo))}</b>.${seqSel&&itens.length>1?' Os outros itens da mesma requisição aparecem abaixo, cada um com a sua saída.':''}</p>
    <div class="tbl-wrap"><table><thead><tr><th style="padding-right:6px">Saída</th><th>Item</th><th class="num">Saiu</th><th class="num" style="width:96px">Devolver</th></tr></thead><tbody>${
      itens.map((i,x)=>`<tr${sel(i)?' style="background:#fff7e6"':''}><td class="mono" style="font-size:12.5px;padding-right:6px;${sel(i)?'font-weight:700':''}">${i.saida||'—'}</td><td>${esc(i.desc||'')}<br><span class="muted" style="font-size:11px">${esc(i.code)}</span></td><td class="num" style="white-space:nowrap">${numf(i.sep)} ${esc(i.unit)}${i.dev?`<br><span class="muted" style="font-size:11px">já devolvido: ${numf(i.dev)}</span>`:''}</td><td class="num">${i.max>0?`<input class="inline-edit" id="drQ_${x}" type="number" min="0" max="${i.max}" step="any" placeholder="0" title="Máximo: ${numf(i.max)}" style="width:76px">`:'<span class="muted" style="font-size:11.5px">tudo devolvido</span>'}</td></tr>`).join('')

    <div class="row c2"><div class="field"><label>Nº da nota de devolução</label><input id="dvNumNotaC" inputmode="numeric" pattern="[0-9]*" oninput="this.value=this.value.replace(/\D/g,'')"></div><div class="field"><label>Data de emissão</label><input id="dvDataNotaC" type="date" value="${new Date().toISOString().slice(0,10)}"></div></div>
    <div class="field"><label>Documento assinado (imagem ou PDF)</label><input id="dvDoc" type="file" accept="image/*,.pdf"></div>
    <div style="display:flex;gap:10px;justify-content:flex-end"><button class="btn ghost" onclick="closeModal()">Cancelar</button><button class="btn primary" onclick="concluirDevolucao(${id})">Concluir e estornar saldo</button></div>`);
}
function fileToDataURL(file){ return new Promise((res,rej)=>{ const r=new FileReader(); r.onload=()=>res(r.result); r.onerror=rej; r.readAsDataURL(file); }); }
async function concluirDevolucao(id){
  const numero=$('#dvNumNotaC').value.replace(/\D/g,''); const data=$('#dvDataNotaC').value||null;
  const fileEl=$('#dvDoc'); const file=fileEl&&fileEl.files[0];
  let docB64=null,docNome=null;
  if(file){ if(file.size>4*1024*1024){toast('Arquivo muito grande (máx. 4MB).','err');return;} docB64=await fileToDataURL(file); docNome=file.name; }
  const {data:d,error:e1}=await sb.from('devolucoes').select('*').eq('id',id).maybeSingle();
  if(e1||!d){toast('Erro ao carregar devolução.','err');return;}
  (d.itens||[]).forEach(it=>{ const lt=addSaldo(d.obra_id,it.code,-Number(it.qty||0));
    pushMov({lotes:lt||undefined,id:uid(),ts:Date.now(),tipo:'devolucao',obra:d.obra_id,code:it.code,desc:it.desc,qty:Number(it.qty||0),valorUnit:Number(it.valorUnit||0),valorTotal:Number(it.qty||0)*Number(it.valorUnit||0),doc:'Devolução #'+d.id,obs:d.fornecedor?('Fornecedor: '+d.fornecedor):'',saldo:saldoTotalOf(d.obra_id,it.code)}); });
  await save('Devolução #'+d.id+' concluída — saldo estornado');
  const {error:e2}=await sb.from('devolucoes').update({status:'concluida',numero_nota_devolucao:numero||d.numero_nota_devolucao,data_nota_devolucao:data,doc_devolucao_base64:docB64,doc_devolucao_nome:docNome,concluido_em:new Date().toISOString(),concluido_por_nome:profile.nome||profile.email}).eq('id',id);
  if(e2){toast('Saldo estornado, mas houve erro ao atualizar o registro: '+e2.message,'err');return;}
  toast('Devolução concluída — saldo estornado.','ok'); closeModal(); await refreshDevolucoesBloqueio(); refreshBadge(); refreshDevolucaoBadge(); drawDevolAbertas(); drawDevolConcluidas(); refreshGlobalAlerts();
}
function cancelarDevolucao(id){
  requireSupervisor('Cancelar devolução #'+id+' (libera o saldo bloqueado)',async()=>{
    const {error}=await sb.from('devolucoes').update({status:'cancelada'}).eq('id',id);
    if(error){toast('Erro: '+error.message,'err');return;}
    toast('Devolução cancelada — saldo liberado.','warn'); await refreshDevolucoesBloqueio(); refreshBadge(); refreshDevolucaoBadge(); drawDevolAbertas(); refreshGlobalAlerts();
  });
}

async function showConsulta(p){ _consAtual=p.code; const o=curObra(); const all=o==='__all'||!o;
  const movsAll=await movsDoProduto(p.code);
  const movs=all?movsAll:movsAll.filter(m=>m.obra===o||(m.tipo==='transferencia'&&m.obraDest===o));
  /* efeito de cada movimento no saldo (da obra filtrada, ou do total quando "todas") — ajustes e devoluções também contam */
  const efeito=m=>{ const q=Number(m.qty)||0;
    if(m.tipo==='entrada')return q; if(m.tipo==='ajuste')return q; if(m.tipo==='baixa'||m.tipo==='devolucao')return -q;
    if(m.tipo==='transferencia'){ if(all)return 0; return (m.obraDest===o?q:0)-(m.obra===o?q:0); } return 0; };
  const valMov=m=>{ const q=Number(m.qty)||0; return Math.abs(m.valorTotal||(q*(m.valorUnit||0))); };
  let totIn=0,totOut=0,valIn=0,valOut=0;
  movs.forEach(m=>{ const e=efeito(m); if(e>0){totIn+=e;valIn+=valMov(m);} else if(e<0){totOut+=-e;valOut+=valMov(m);} });
  const tot=all?totalSaldo(p.code):saldoOf(o,p.code);
  const box=$('#consResult');

  box.innerHTML=`<div class="panel">
    <div style="display:flex;justify-content:space-between;align-items:flex-start;gap:20px;flex-wrap:wrap">
      <div style="display:flex;gap:18px;align-items:flex-start">${photoList(p.code).length?`<div style="display:flex;flex-wrap:wrap;gap:6px;max-width:170px">${photoList(p.code).map((s,i)=>`<img src="${s}" style="width:${photoList(p.code).length>1?'78px':'150px'};height:${photoList(p.code).length>1?'78px':'150px'};object-fit:cover;border-radius:10px;border:1px solid #e4dfd4;cursor:zoom-in" onclick="openPhoto('${esc(p.code)}',${i})">`).join('')}</div>`:''}
        <div><div class="mono muted" style="font-size:12px">${esc(p.code)}${p.aux?' · aux: '+esc(p.aux):''}</div><h3 style="font-size:22px">${esc(p.desc)}</h3>
        <div class="muted" style="font-size:12.5px;margin-top:2px">Unidade: ${esc(p.unit||'UN')} · Mín/Máx ${all?'padrão '+numf(p.min)+' / '+(p.max>0?numf(p.max):'—'):limTxt(p,o)+(limDe(p,o).proprio?'':' (padrão)')}</div>
        ${p.ref?`<div style="margin-top:10px;font-size:13px;color:#6a6357;max-width:420px;line-height:1.5"><b style="color:#4a443a">Referências / Aplicação:</b><br>${esc(p.ref).replace(/\n/g,'<br>')}</div>`:''}</div></div>
      <svg id="consBc"></svg></div></div>
    <div class="cards" style="grid-template-columns:repeat(4,1fr)">
      <div class="card neutral"><div class="stripe"></div><div class="lbl">${all?'Saldo total':'Saldo em '+esc(obraName(o))}</div><div class="val">${numf(tot)}</div><div class="sub">${esc(p.unit||'')} · ${money(tot*(p.custo||0))}</div></div>
      <div class="card ok"><div class="stripe"></div><div class="lbl">Total entradas</div><div class="val" style="font-size:19px">${numf(totIn)}</div><div class="sub pos">${money(valIn)}</div></div>
      <div class="card alert"><div class="stripe"></div><div class="lbl">Total saídas</div><div class="val" style="font-size:19px">${numf(totOut)}</div><div class="sub neg">${money(valOut)}</div></div>
      <div class="card neutral"><div class="stripe"></div><div class="lbl">Custo méd. / Venda</div><div class="val" style="font-size:16px">${money(p.custo||0)}</div><div class="sub">venda: ${p.preco?money(p.preco):'—'}</div></div></div>
    <div class="sechead"><h3>${all?'Saldo por obra':'Saldo em '+esc(obraName(o))}</h3></div>
    <div class="tbl-wrap" style="margin-bottom:22px"><table><thead><tr><th>Obra</th><th class="num">Saldo</th><th class="num">Valor</th><th>Situação</th></tr></thead><tbody>${obrasRows||`<tr><td colspan="4" class="empty" style="padding:20px">Sem saldo.</td></tr>`}</tbody></table></div>
    <div class="sechead"><h3>Histórico de movimentações${all?'':' · '+esc(obraName(o))}</h3></div>
    <div class="tbl-wrap"><table><thead><tr><th>Data</th><th>Tipo</th><th>Obra</th><th>Documento</th><th class="num">Qtd</th><th class="num">Valor un.</th><th class="num">Total</th></tr></thead><tbody>`+
    (movs.length?movs.map(m=>{ const tp=m.tipo==='entrada'?'<span class="pill in">Entrada</span>':m.tipo==='baixa'?(isMovDevolReq(m)?'<span class="pill in">Devol. requisição</span>':'<span class="pill out">Baixa</span>'):m.tipo==='ajuste'?'<span class="pill high">Ajuste</span>':m.tipo==='devolucao'?'<span class="pill out">Devolução</span>':'<span class="pill tr">Transf.</span>';
      const obraCell=m.tipo==='transferencia'?`${esc(obraName(m.obra))} → ${esc(obraName(m.obraDest))}`:esc(obraName(m.obra));

      return `<tr><td class="muted" style="font-size:12px">${fmtDate(m.ts)}</td><td>${tp}</td><td style="font-size:12.5px">${obraCell}</td><td style="font-size:12.5px">${esc(m.doc||'')}${m.aplic?' · '+esc(aplicName(m.aplic)):''}${m.lotes&&m.lotes.length?`<div style="font-size:11px;color:#2766b8">🏷 ${esc(lotesTxt(m.lotes))}</div>`:''}</td><td class="num ${cls}">${qtdTxt}</td><td class="num">${money(m.valorUnit)}</td><td class="num">${money(m.valorTotal)}</td></tr>`;}).join('')
      :`<tr><td colspan="7" class="empty" style="padding:24px">Sem movimentações.</td></tr>`)+`</tbody></table></div>`;
  withBarcode(()=>{try{JsBarcode('#consBc',String(p.code),{format:'CODE128',width:1.6,height:46,fontSize:13,margin:4});}catch(e){}});
}

let importRows=[];
const COLMAP={codigo:'code','código':'code',code:'code',descricao:'desc','descrição':'desc',produto:'desc',nome:'desc',unidade:'unit',unid:'unit',un:'unit',quantidade:'qty',qtd:'qty',saldo:'qty',estoque:'qty',minimo:'min','mínimo':'min',min:'min',maximo:'max','máximo':'max',max:'max',custo:'custo','custo unitario':'custo',valor:'custo',preco:'preco','preço':'preco',venda:'preco',referencia:'ref','referência':'ref',aplicacao:'ref','aplicação':'ref','codigo auxiliar':'aux','código auxiliar':'aux','cod auxiliar':'aux',auxiliar:'aux','codigo outro sistema':'aux','outro sistema':'aux'};
function renderImportar(){ if(needObra())return;
  $('#view').innerHTML=`<div class="panel"><h3>Carga inicial por planilha</h3><p class="desc">Importe Excel/CSV para a obra selecionada. Produtos existentes têm o saldo <b>somado</b> na obra.</p>
    <button class="btn dark sm" onclick="downloadTemplate()">↓ Baixar modelo em Excel (.xlsx)</button>
    <div class="field" style="max-width:340px;margin-top:14px"><label>Obra de destino</label><select id="impObra">${obraOptions(curObra()==='__all'?(state.obras[0]&&state.obras[0].id):curObra(),false)}</select></div>
    <div class="filebox" onclick="document.getElementById('fileInput').click()"><div class="ico">↥</div><b>Selecionar planilha</b><br><span class="muted" style="font-size:12px">.xlsx, .xls ou .csv</span><input type="file" id="fileInput" accept=".xlsx,.xls,.csv" style="display:none"></div>
    <div class="help"><b>Colunas:</b> <code>codigo</code> · <code>codigo auxiliar</code> · <code>descricao</code> · <code>unidade</code> · <code>quantidade</code> · <code>minimo</code> · <code>maximo</code> · <code>custo</code> · <code>preco</code> · <code>referencia</code><br>Código vazio gera etiqueta automática.</div></div>
    <div id="importPreview"></div>`;
  $('#fileInput').onchange=handleFile; }
async function handleFile(e){ const f=e.target.files[0]; if(!f)return;
  try{ await ensureXLSX(); }catch(err){ toast('Não foi possível carregar o leitor de planilha (verifique a conexão).','err'); return; }
  const r=new FileReader();
  r.onload=ev=>{ try{ const wb=XLSX.read(ev.target.result,{type:'binary'}); const json=XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]],{defval:''});
    if(!json.length){toast('Planilha vazia.','err');return;}
    importRows=json.map(row=>{ const o={}; Object.keys(row).forEach(k=>{const key=COLMAP[String(k).trim().toLowerCase().replace(/\s+/g,' ')]; if(key)o[key]=row[k];});
      const num=v=>parseFloat(String(v).replace(',','.'))||0;
      return {code:String(o.code||'').trim(),desc:String(o.desc||'').trim(),unit:String(o.unit||'UN').trim()||'UN',aux:String(o.aux||'').trim(),qty:num(o.qty),min:num(o.min),max:num(o.max),custo:num(o.custo),preco:num(o.preco),ref:String(o.ref||'').trim()}; }).filter(r=>r.desc);
    previewImport(); }catch(err){toast('Erro: '+err.message,'err');} };
  r.readAsBinaryString(f); }
function previewImport(){ if(!importRows.length){toast('Nenhuma linha válida.','err');return;} const box=$('#importPreview');
  box.innerHTML=`<div class="sechead"><h3>Pré-visualização · ${importRows.length} linha(s) → ${esc(obraName($('#impObra').value))}</h3><button class="btn primary sm" onclick="commitImport()">✓ Confirmar</button></div>
  <div class="tbl-wrap"><table><thead><tr><th>Código</th><th>Descrição</th><th>Un.</th><th class="num">Qtd</th><th class="num">Mín</th><th class="num">Máx</th><th class="num">Custo</th><th>Ação</th></tr></thead><tbody>`+importRows.map(r=>{const ex=r.code&&findProduct(r.code);return `<tr><td class="mono">${r.code?esc(r.code):'<span class="muted">auto</span>'}</td><td>${esc(r.desc)}</td><td>${esc(r.unit)}</td><td class="num">${numf(r.qty)}</td><td class="num">${numf(r.min)}</td><td class="num">${r.max>0?numf(r.max):'—'}</td><td class="num">${money(r.custo)}</td><td>${ex?'<span class="pill high">Atualiza</span>':'<span class="pill good">Novo</span>'}</td></tr>`;}).join('')+`</tbody></table></div>`; }
function commitImport(){ const obra=$('#impObra').value; let novos=0,atual=0;
  importRows.forEach(r=>{ let p=r.code?findProduct(r.code):null;
    if(p){ p.desc=r.desc||p.desc;p.unit=r.unit||p.unit; if((r.min||r.max)&&podeEditarLimites()){ if(!state.limitesObra)state.limitesObra={}; if(!state.limitesObra[obra])state.limitesObra[obra]={}; state.limitesObra[obra][p.code]={min:r.min,max:r.max}; }if(r.custo>0)p.custo=r.custo;if(r.preco>0)p.preco=r.preco;if(r.ref)p.ref=r.ref;if(r.aux)p.aux=r.aux; atual++; }
    else{ const code=r.code||genCode(); p={code,desc:r.desc,unit:r.unit,aux:r.aux,min:r.min,max:r.max,custo:r.custo,preco:r.preco,ref:r.ref}; state.products.push(p); novos++; }
    if(r.qty>0){ addSaldo(obra,p.code,r.qty); pushMov({ts:Date.now(),tipo:'entrada',obra,code:p.code,desc:p.desc,qty:r.qty,valorUnit:p.custo||0,valorTotal:r.qty*(p.custo||0),doc:'Carga inicial (planilha)',saldo:saldoOf(obra,p.code)}); } });
  save('Importação de planilha em '+obraName(obra)+' · '+novos+' novo(s), '+atual+' atualizado(s)'); importRows=[]; toast(`Importado em ${esc(obraName(obra))} · ${novos} novo(s), ${atual} atualizado(s).`,'ok'); go('produtos'); }
async function downloadTemplate(){

  const ws=XLSX.utils.aoa_to_sheet([['codigo','codigo auxiliar','descricao','unidade','quantidade','minimo','maximo','custo','preco','referencia'],['','SAP-1001','Cimento CP-II 50kg','SC',120,30,300,32.50,41.90,''],['','SAP-2050','Filtro hidráulico 1234','UN',8,2,20,180.00,0,'Escavadeira CAT 320'],['7891234560001','','Areia média','M3',15,5,40,55.00,90.00,'']]);
  const wb=XLSX.utils.book_new(); XLSX.utils.book_append_sheet(wb,ws,'Produtos'); XLSX.writeFile(wb,'modelo_estoque.xlsx'); }

async function renderAdmin(){

  if(uerr)toast('Erro ao carregar usuários: '+uerr.message,'err');

  const uRows=(users||[]).map(u=>{ const vinc=Array.isArray(u.obras_vinculadas)?u.obras_vinculadas:[];
    const obrasCell=u.papel==='encarregado'?`<button class="btn ghost sm" onclick="abrirObrasVinculadas('${u.id}')">🏗 ${vinc.length?vinc.length+' vinculada(s)':'Nenhuma — não aprova nada'}</button>`:'<span class="muted">—</span>';

    <td><select id="us_${u.id}" style="width:auto"><option value=""${!u.setor?' selected':''}>—</option><option value="almoxarifado"${u.setor==='almoxarifado'?' selected':''}>Almoxarifado</option><option value="compras"${u.setor==='compras'?' selected':''}>Compras</option><option value="frotas"${u.setor==='frotas'?' selected':''}>Frotas</option></select></td>

/* Estorno do custo médio da nota (antes de tirar o saldo): se o custo não mudou desde a entrada, volta ao custo anterior

function estornarCustoNota(n){ (n.itens||[]).slice().reverse().forEach(it=>{ const p=findProduct(it.code); if(!p||!(it.qty>0)||!(it.custo>0))return;

  const S=Math.max(0,totalSaldo(p.code)), rest=S-it.qty;
  if(rest>0){ const c=(S*(p.custo||0)-it.qty*it.custo)/rest; if(c>=0)p.custo=c; else if(it.custoAnt!=null)p.custo=it.custoAnt; }
  else if(it.custoAnt!=null)p.custo=it.custoAnt; }); }
/* ===== Recálculo do custo médio pelo histórico =====
   Refaz a média ponderada de cada produto em ordem de data: entradas (custo do item da nota, que já inclui frete/impostos
   quando houve) e ajustes positivos entram na média; saídas e ajustes negativos só baixam o saldo; transferências não mudam
   o total. Base = saldo de todas as obras; saldo negativo conta como zero. Saldo que existe sem movimentação (importação ou

async function recalcCalcular(codes){
  const {data,error}=await fetchAllRows(()=>{ let q=sb.from('movimentos_estoque').select('id,ts,tipo,code,qty,valor_unit,nota_id,doc'); if(codes&&codes.length)q=q.in('code',codes.map(String)); return q.order('ts',{ascending:true}).order('id'); });
  if(error)throw new Error(error.message);

  const porCod=new Map(); (data||[]).forEach(r=>{ const c=String(r.code); if(!porCod.has(c))porCod.set(c,[]); porCod.get(c).push(rowToMov(r)); });
  const res=[];
  (codes&&codes.length?codes.map(findProduct).filter(Boolean):state.products).forEach(p=>{
    const movs=(porCod.get(String(p.code))||[]).sort((a,b)=>a.ts-b.ts||String(a.id).localeCompare(String(b.id)));
    const atualS=totalSaldo(p.code); const s0=+(atualS-movs.reduce((t,m)=>t+recalcEfeito(m),0)).toFixed(6);
    let S=s0, C=null; const passos=[];

      if(e>0&&vu>0&&(m.tipo==='entrada'||m.tipo==='ajuste')){ const base=Math.max(0,S), antes=C; C=C==null?vu:((base*C)+(e*vu))/(base+e); passos.push({m,base,e,vu,antes,C,origem}); }

  return res; }
async function recalcAbrir(codes){ if(!isEncarregado()){ toast('Recálculo restrito a encarregados/administradores.','err'); return; }

/* ===== Relatório: possíveis duplicidades no cadastro de produtos =====
   Não depende do período. Junta em grupos os produtos que parecem ser o mesmo item, pelos critérios:
     Alta  · descrição igual (sem acento, pontuação, espaços e maiúsc./minúsc.)
           · mesmo código auxiliar, código de fabricante (código de barras) ou referência em produtos diferentes
     Média · mesmo código de peça escrito na descrição (ex.: "5280585", "7W-5495" = "7W5495", "132-8876" = "1328876")
     Baixa · descrições muito parecidas (pelo menos 75% das palavras em comum)
   Usa Obra (saldo mostrado), Grupo, Localização e Produto. "Não é duplicidade" guarda o grupo em
   state.config.dupIgnorados (vale para todos) e ele deixa de aparecer, a não ser que se peça para mostrar. */
let _relDupConf='media', _relDupIgn=false;
const _DUP_STOP=new Set(['DE','DA','DO','DAS','DOS','E','EM','NA','NO','COM','SEM','PARA','P','C','A','O','AS','OS','UN','PC','PCS','CX','KG','LT','L','M','MM','CM','ORIGINAL','GENUINO','CAT','CATERPILLAR','TIPO','REF','COD','MOD','MODELO']);
function dupNorm(x){ return String(x==null?'':x).normalize('NFD').replace(/[̀-ͯ]/g,'').toUpperCase(); }
function dupPecas(desc){ const out=new Set(); (dupNorm(desc).match(/[A-Z0-9][A-Z0-9.\-\/]*[A-Z0-9]/g)||[]).forEach(t=>{ const k=t.replace(/[.\-\/]/g,'');
    if(k.length>=4&&(k.match(/\d/g)||[]).length>=4)out.add(k); }); return out; }
function dupGrupos(prods){
  const n=prods.length, pai=prods.map((_,i)=>i), motivos=new Map();
  const raiz=i=>{ while(pai[i]!==i){ pai[i]=pai[pai[i]]; i=pai[i]; } return i; };
  const par=(i,j,nivel,txt)=>{ if(i===j)return; const a=Math.min(i,j), b=Math.max(i,j), k=a+'|'+b;
    const m=motivos.get(k)||{nivel:0,txt:new Set()}; m.nivel=Math.max(m.nivel,nivel); m.txt.add(txt); motivos.set(k,m); pai[raiz(a)]=raiz(b); };
  const porChave=(chaveDe,nivel,rotulo,maxGrupo)=>{ const idx=new Map();
    prods.forEach((p,i)=>chaveDe(p,i).forEach(k=>{ if(!k)return; if(!idx.has(k))idx.set(k,[]); idx.get(k).push(i); }));
    idx.forEach((l,k)=>{ const u=[...new Set(l)]; if(u.length<2||(maxGrupo&&u.length>maxGrupo))return; for(let x=1;x<u.length;x++)par(u[0],u[x],nivel,rotulo(k)); }); return idx; };
  const descKey=prods.map(p=>dupNorm(p.desc).replace(/[^A-Z0-9]/g,''));
  porChave((p,i)=>[descKey[i]].filter(k=>k.length>=3),3,()=>'descrição igual');
  const codigos=p=>{ const s=new Set(); [p.aux,p.ref].forEach(v=>{ const k=dupNorm(v).replace(/[^A-Z0-9]/g,''); if(k.length>=3)s.add(k); });
    String(p.fab||'').split(/[\s,;]+/).forEach(v=>{ const k=dupNorm(v).replace(/[^A-Z0-9]/g,''); if(k.length>=4)s.add(k); }); return [...s]; };
  porChave(codigos,3,k=>'mesmo cód. auxiliar/fabricante/referência ('+k+')');
  porChave(p=>[...dupPecas(p.desc)],2,k=>'mesmo código de peça na descrição ('+k+')',8);
  /* descrições parecidas: compara só produtos que têm alguma palavra pouco comum em comum */
  const palavras=prods.map(p=>new Set(dupNorm(p.desc).split(/[^A-Z0-9]+/).filter(w=>w.length>=2&&!_DUP_STOP.has(w))));
  const freq=new Map(); palavras.forEach(ws=>ws.forEach(w=>freq.set(w,(freq.get(w)||0)+1)));
  const blocos=new Map(); palavras.forEach((ws,i)=>ws.forEach(w=>{ if(freq.get(w)<=40){ if(!blocos.has(w))blocos.set(w,[]); blocos.get(w).push(i); } }));
  const visto=new Set();
  blocos.forEach(l=>{ for(let x=0;x<l.length;x++)for(let y=x+1;y<l.length;y++){ const i=l[x], j=l[y], k=i+'|'+j; if(visto.has(k))continue; visto.add(k);
    const A=palavras[i], B=palavras[j]; if(A.size<2||B.size<2)continue; let c=0; A.forEach(w=>{ if(B.has(w))c++; });
    const jac=c/(A.size+B.size-c); if(jac>=0.75)par(i,j,1,'descrição parecida ('+Math.round(jac*100)+'%)'); } });
  /* monta os grupos com o nível mais alto entre os pares de cada um */
  const g=new Map(); prods.forEach((_,i)=>{ const r=raiz(i); if(!g.has(r))g.set(r,{itens:[],nivel:0,motivos:new Set()}); g.get(r).itens.push(i); });
  motivos.forEach((m,k)=>{ const gr=g.get(raiz(+k.split('|')[0])); gr.nivel=Math.max(gr.nivel,m.nivel); m.txt.forEach(t=>gr.motivos.add(t)); });
  return [...g.values()].filter(x=>x.itens.length>1).map(x=>({nivel:x.nivel,motivos:[...x.motivos],itens:x.itens.map(i=>prods[i])})); }
function dupChave(gr){ return gr.itens.map(p=>String(p.code)).sort().join('|'); }
async function dupIgnorar(chave,ign){ if(!state.config)state.config={supHash:null}; const l=new Set(state.config.dupIgnorados||[]);

  await save((ign?'Marcado como não duplicidade: ':'Volta a aparecer em duplicidades: ')+chave.split('|').join(', ')); drawRelatorio(); }

  const nOpen=open.filter(Boolean).length;
  const head=_rel.headers.map((h,i)=>`<th style="${S(i)}">${esc(h)}</th>`).join('');
  const body=_rel.rows.map((r,i)=>{
    let h=`<tr class="m">${r.map((c,j)=>`<td style="${S(j)}">${esc(c)}</td>`).join('')}</tr>`;
    if(open[i]&&_rel.detail[i]&&_rel.detail[i].length){ h+=`<tr class="d"><td colspan="${N}"><table class="sub"><thead><tr>${_rel.detailHeaders.map((x,j)=>`<th style="${dS(j)}">${esc(x)}</th>`).join('')}</tr></thead><tbody>${_rel.detail[i].map(d=>`<tr>${d.map((c,j)=>`<td style="${dS(j)}">${esc(c)}</td>`).join('')}</tr>`).join('')}</tbody></table></td></tr>`; }
    return h; }).join('');
  const foot=_rel.foot?`<tfoot><tr>${_rel.foot.map((c,i)=>`<td style="${S(i)}">${esc(c)}</td>`).join('')}</tr></tfoot>`:'';
  const resumo=_rel.resumo?`<div class="res">${_rel.resumo.map(x=>`<div class="rc"><b>Classe ${esc(x.cls)}</b>${esc(x.txt)}</div>`).join('')}</div>`:'';
  const visao=(REL_VISAO[_rel.view]||'')+(_rel.abc?' · Curva ABC':'')+(nOpen?` · detalhado (${nOpen} de ${_rel.rows.length} com itens)`:'');
  const chips=String(_rel.sub||'').split(' · ').filter(Boolean).map(x=>`<span class="chip">${esc(x)}</span>`).join('');
  const quem=(typeof profile!=='undefined'&&profile)?(profile.nome||profile.email||''):'';
  const css=`@page{size:A4 ${N>=7?'landscape':'portrait'};margin:12mm}body{font-family:Arial,Helvetica,sans-serif;margin:0;color:#1c1c1c}.hd{display:flex;justify-content:space-between;align-items:flex-end;border-bottom:3px solid #9b1c31;padding-bottom:8px;margin-bottom:8px;gap:16px}.emp{font-size:10px;letter-spacing:1.5px;text-transform:uppercase;color:#9b1c31;font-weight:bold}h1{font-size:19px;margin:2px 0 0}.gen{font-size:10.5px;color:#555;text-align:right;line-height:1.5;white-space:nowrap}.vis{font-size:12px;font-weight:bold;margin:4px 0 6px}.chip{display:inline-block;border:1px solid #c9d3e0;background:#eef3f9;border-radius:10px;padding:2px 8px;font-size:10.5px;margin:0 4px 4px 0}table{width:100%;border-collapse:collapse;margin-top:6px}th,td{border:1px solid #999;padding:5px 7px;font-size:11px;vertical-align:top}thead{display:table-header-group}tfoot{display:table-row-group}th{background:#e4ebf4}tr{page-break-inside:avoid}tr.d>td{padding:6px 6px 8px 26px;background:#faf8f3}table.sub{margin-top:0}table.sub th{background:#f0ece2;font-size:10px}table.sub td{font-size:10.5px;background:#fff}tfoot td{font-weight:bold;background:#f0f0f0}.res{display:flex;gap:10px;margin:8px 0 4px}.rc{flex:1;border:1px solid #999;border-radius:6px;padding:6px 10px;font-size:11px}.rc b{display:block;font-size:12px;margin-bottom:2px}`;
  w.document.write(`<html><head><meta charset="utf-8"><title>${esc(_rel.titulo)}</title><style>${css}</style></head><body><div class="hd"><div><div class="emp">AMETA Engenharia · Almoxarifado</div><h1>${esc(_rel.titulo)}</h1></div><div class="gen">Gerado em ${esc(fmtDate(Date.now()))}${quem?'<br>por '+esc(quem):''}</div></div><div class="vis">Visão: ${esc(visao)}</div><div>${chips}</div>${resumo}<table><thead><tr>${head}</tr></thead><tbody>${body}</tbody>${foot}</table><script>setTimeout(()=>window.print(),300);<\/script></body></html>`); w.document.close(); }

/* ===== Ordenação de tabelas e MAIÚSCULAS ===== */
function cellKey(txt){ txt=(txt||'').replace(/\s+/g,' ').trim().replace(/\u2212/g,'-');
  const dm=txt.match(/^(\d{2})\/(\d{2})\/(\d{4})/); if(dm)return {n:+(dm[3]+dm[2]+dm[1]),s:txt.toLowerCase()};
  const m=txt.match(/^[R$\s-]*(-?\d[\d.]*(?:,\d+)?)/);
  if(m && /^[R$\s-]*-?[\d.,]+\s*[a-zA-Z³ºª%]*$/.test(txt)){ let t=m[1]; if(t.indexOf(',')>-1)t=t.replace(/\./g,'').replace(',','.'); else if((t.match(/\./g)||[]).length>1)t=t.replace(/\./g,''); const n=parseFloat(t); if(!isNaN(n))return {n,s:txt.toLowerCase()}; }
  return {n:null,s:txt.toLowerCase()}; }
document.addEventListener('click',function(e){ const th=e.target.closest('th'); if(!th)return; const table=th.closest('table'); if(!table||!table.closest('.tbl-wrap'))return;
  const tbody=table.tBodies[0]; if(!tbody)return; const ths=[...th.parentNode.children]; const idx=ths.indexOf(th);
  let rows=[...tbody.rows].filter(r=>r.cells.length>1 && !r.querySelector('.empty')); if(rows.length<2)return;
  const cellTxt=r=>{ const c=r.cells[idx]; if(!c)return ''; const f=c.querySelector('input,select,textarea'); return f?(f.value||''):c.textContent; };
  const asc=!(table.dataset.sc==idx && table.dataset.sd==='asc'); table.dataset.sc=idx; table.dataset.sd=asc?'asc':'desc';
  rows.map(r=>[cellKey(cellTxt(r)),r]).sort((a,b)=>{const A=a[0],B=b[0]; if(A.n!=null&&B.n!=null)return asc?A.n-B.n:B.n-A.n; if(A.n!=null)return asc?-1:1; if(B.n!=null)return asc?1:-1; return asc?A.s.localeCompare(B.s,'pt-BR'):B.s.localeCompare(A.s,'pt-BR');}).forEach(x=>tbody.appendChild(x[1]));
  ths.forEach(h=>{const i=h.querySelector('.si-sort'); if(i)i.remove();}); const ind=document.createElement('span'); ind.className='si-sort'; ind.style.cssText='font-size:9px;opacity:.6;margin-left:3px'; ind.textContent=asc?'▲':'▼'; th.appendChild(ind); });
document.addEventListener('input',function(e){ const el=e.target; if(!el||(el.tagName!=='INPUT'&&el.tagName!=='TEXTAREA'))return; const t=(el.type||'text').toLowerCase(); if(['password','number','date','datetime-local','time','email','file','checkbox','radio','color','range'].includes(t))return; if(el.dataset.noupper!==undefined)return; const a=el.selectionStart,b=el.selectionEnd; const up=el.value.toUpperCase(); if(up!==el.value){ el.value=up; try{el.setSelectionRange(a,b);}catch(_){} } });
(function(){ const s=document.createElement('style'); s.textContent='.tbl-wrap table thead th{cursor:pointer;user-select:none}.tbl-wrap table thead th:hover{background:#e4dfd4}'; document.head.appendChild(s); })();

  const {data}=await sb.auth.getSession(); session=data.session; await onAuthReady();
})();
