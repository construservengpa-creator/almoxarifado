let _ajTravaSalvando=false;
async function setAjusteManual(aberto){
  if(!podeControlarAjusteManual()){ toast('Somente o administrador responsável pode liberar ou bloquear o ajuste manual.','err'); return; }
  if(_ajTravaSalvando)return; _ajTravaSalvando=true;
  try{ if(!state.config)state.config={supHash:null};
    state.config.ajusteManual={aberto:!!aberto,por:profile.nome||profile.email||'',em:Date.now()};
    await save('Ajuste manual '+(aberto?'LIBERADO':'BLOQUEADO')+' para os demais perfis');
    toast(aberto?'Ajuste manual liberado para os demais perfis.':'Ajuste manual bloqueado para os demais perfis.',aberto?'warn':'ok');
  } finally { _ajTravaSalvando=false; }
  if(activeTab==='ajuste')renderAjuste(); }
function ajTravaInfo(){ const a=state.config&&state.config.ajusteManual; return a&&a.em?(' por '+esc(a.por||'—')+' em '+fmtDate(a.em)):''; }
function ajTravaBanner(){ const ab=ajusteManualLiberado();

      <div><b>${ab?'🔓 Ajuste manual LIBERADO para os demais perfis':'🔒 Ajuste manual BLOQUEADO para os demais perfis'}</b>
        <div class="muted" style="font-size:12px;margin-top:3px">${ab?'Encarregados conseguem ajustar saldo enquanto estiver liberado':'Só você consegue ajustar saldo'}${ajTravaInfo()?' · '+(ab?'liberado':'bloqueado')+ajTravaInfo():''}.</div></div>
      <button class="btn ${ab?'danger':'primary'}" onclick="setAjusteManual(${ab?'false':'true'})">${ab?'🔒 Bloquear':'🔓 Liberar'}</button></div>`;
  return ab?`<div class="panel" style="margin-bottom:14px;border-left:5px solid #c98a1a;font-size:13px">🔓 Ajuste manual liberado${ajTravaInfo()}. Ele pode ser bloqueado a qualquer momento.</div>`:''; }

  $('#ajForm').innerHTML=`<div class="panel" style="background:var(--panel2);margin-top:12px"><h3 style="margin-bottom:4px">${esc(p.desc)} <span class="muted" style="font-size:12px">(${esc(p.code)})</span></h3>

    <div class="row c2">

function aplicarAjuste(code){ if(ajTravaBarrar())return; const p=findProduct(code); if(!p)return; const obra=$('#ajObra').value; const atual=saldoOf(obra,code);
  const novo=parseFloat($('#ajNovoSaldo').value); if(isNaN(novo)||novo<0){toast('Informe um saldo válido.','err');return;}
  const delta=novo-atual; if(delta===0){toast('Nenhuma mudança — o saldo já é esse.','err');return;}
  const custoInformado=parseFloat($('#ajCusto').value); const motivo=$('#ajMotivo').value.trim()||'Ajuste manual';
  let custoFinal=p.custo||0;
  if(!isNaN(custoInformado)&&custoInformado>=0){
    if(delta>0){ custoFinal = custoMedioEntrada(p,delta,custoInformado).custoMedio; } /* mesma regra da entrada de nota: base = saldo de todas as obras */
    else { custoFinal = custoInformado; }
  }
  requireSupervisor(`Ajustar saldo de "${p.desc}" em ${obraName(obra)} de ${numf(atual)} para ${numf(novo)}`,async()=>{
    if(ajTravaBarrar())return; /* pode ter sido bloqueado enquanto a confirmação estava aberta */
    const lt=addSaldo(obra,code,delta); p.custo=custoFinal;
    pushMov({id:uid(),ts:Date.now(),tipo:'ajuste',obra,code:p.code,desc:p.desc,qty:delta,valorUnit:custoFinal,valorTotal:delta*custoFinal,doc:'Ajuste: '+motivo,saldo:saldoOf(obra,code),lotes:lt||undefined});
    toast('Salvando...','warn');
    await save('Ajuste de saldo: '+p.desc+' em '+obraName(obra)+' ('+(delta>0?'+':'')+numf(delta)+') · '+motivo);
    toast('Saldo ajustado e salvo.','ok'); renderAjuste(); }); }

/* ===== INVENTÁRIO: ajustes aprovados na contagem (contagem.html) aguardando autorização ===== */
/* Lê contagem_itens (divergências) e contagem_extras (itens fora da lista/cadastro) com status 'aprovado',
   mostra o efeito no saldo e, ao autorizar, lança tudo de uma vez: saldo + movimento 'ajuste' + produto novo,
   com uma única gravação do estado (mesma rotina do "Ajuste de Saldo"). Depois marca as linhas como 'ajustado'.
   Cada movimento leva um invId; se a marcação falhar, repetir a ação não lança em duplicidade. */
let invRows=[], invSel={}, invModo={};
async function invCarregar(){
  const ri=await sb.from('contagem_itens').select('*').eq('status','aprovado').limit(1000); if(ri.error)throw ri.error;
  const re=await sb.from('contagem_extras').select('*').eq('status','aprovado').limit(1000); if(re.error)throw re.error;
  const ids=[...new Set(ri.data.map(x=>x.ciclo_id).concat(re.data.map(x=>x.ciclo_id)))]; const ciclos={};
  if(ids.length){ const rc=await sb.from('contagem_ciclos').select('id,obra_id,obra_nome,nome').in('id',ids); if(rc.error)throw rc.error; rc.data.forEach(c=>ciclos[c.id]=c); }
  const rows=[];
  ri.data.forEach(i=>{ const c=ciclos[i.ciclo_id]; if(!c)return;
    rows.push({key:'inv:item:'+i.id,tipo:'item',rowId:i.id,ciclo:c,obra:c.obra_id,code:i.code,desc:i.descricao||'',unit:i.unidade||'',snapshot:Number(i.saldo_sistema),contado:Number(i.qtd_final),lista:c.nome}); });
  re.data.forEach(x=>{ const c=ciclos[x.ciclo_id]; if(!c)return;
    rows.push({key:'inv:extra:'+x.id,tipo:'extra',rowId:x.id,ciclo:c,obra:c.obra_id,decisao:x.decisao,code:x.code_final||'',desc:x.desc_final||x.descricao||'',unit:x.unid_final||x.unidade||'UN',contado:Number(x.quantidade),modo:x.modo,custo:x.custo==null?null:Number(x.custo),lista:c.nome,lido:x.code_lido||''}); });
  return rows;
}
/* calcula o efeito das linhas sobre o estado atual, em sequência (várias linhas do mesmo produto se somam);
   não altera nada. Só entram no acumulado as linhas marcadas. */
function invCalcUma(r,run){
  const o={...r,erro:'',criar:false}; const p=r.code?findProduct(r.code):null;
  const rk=r.obra+'|'+(r.code||('#'+r.key)); o.rk=rk;
  o.jaLancado=state.movements.some(m=>m.invId===r.key);
  if(!state.obras.some(ob=>ob.id===r.obra)){ o.erro='Obra não existe mais'; return o; }
  const real=p?saldoOf(r.obra,r.code):0;
  o.atual=run[rk]!==undefined?run[rk]:real;
  if(r.tipo==='item'){
    if(!p){ o.erro='Produto não existe mais no cadastro'; return o; }
    o.mudou=real!==r.snapshot;
    o.modoEf=o.mudou?(invModo[r.key]||'diferenca'):'definir';
    o.novo=o.modoEf==='diferenca'?o.atual+(r.contado-r.snapshot):r.contado;
  } else {
    if(r.decisao==='vincular'&&!p){ o.erro='O produto vinculado não existe mais'; return o; }
    if(r.decisao!=='vincular'&&r.decisao!=='cadastrar'){ o.erro='Item sem decisão'; return o; }
    o.criar=!p&&run[rk]===undefined; o.modoEf=r.modo;
    o.novo=r.modo==='somar'?o.atual+r.contado:r.contado;
  }
  if(o.jaLancado){ o.novo=o.atual; o.delta=0; return o; }
  if(!(o.novo>=0))o.erro='O saldo ficaria negativo';
  o.delta=o.novo-o.atual; return o;
}
function invCalcLote(rows){
  const run={};
  return rows.map(r=>{ const o=invCalcUma(r,run); if(!o.erro&&invSel[r.key]!==false&&!o.jaLancado)run[o.rk]=o.novo; return o; });
}
/* Etapa 1 do lançamento: cadastra os produtos que ainda não existem (itens novos da contagem / lista livre).
   O cadastro vive no documento compartilhado (app_kv); saldo e movimento vivem em tabelas próprias e são gravados
   na hora por addSaldo/pushMov. Por isso o cadastro é gravado ANTES: se ele falhar, nada é lançado. Antes era tudo
   junto — o saldo ia para o banco, a gravação do cadastro falhava e era desfeita, e ao repetir o item aparecia como
   "já lançado" e era só marcado: ficava com saldo, mas sem cadastro, e não aparecia no estoque.
   Também recria o cadastro de linhas já lançadas cujo produto não existe (mesma situação). */
function invProdutosNovos(linhas){
  const novos=[];
  for(const L of linhas){
    const ja=state.movements.find(m=>m.invId===L.key);
    if(ja&&!L.code)L.code=ja.code;
    if(!L.code)L.code=genCode();
    if(findProduct(L.code))continue;
    const p={code:L.code,desc:L.desc||(ja&&ja.desc)||L.code,unit:L.unit||'UN',aux:'',min:0,max:0,custo:ja?(Number(ja.valorUnit)||0):0,preco:0,ref:''};
    state.products.push(p); novos.push(p);
  }
  return novos;
}
/* Etapa 2: aplica as linhas no state em memória (mesma regra do aplicarAjuste); devolve o que precisa ser marcado */
function invAplicar(linhas){
  const marcas=[];
  for(const L of linhas){
    const ja=state.movements.find(m=>m.invId===L.key);
    if(ja){ marcas.push({...L,ja:true,mov:ja.id,code:L.code||ja.code,novo:ja.saldo,modoEf:ja.invModo||L.modoEf}); continue; }
    const p=findProduct(L.code); if(!p)continue; /* cadastrado na etapa 1 */
    const atual=saldoOf(L.obra,L.code), delta=L.novo-atual;
    if(delta===0){ marcas.push({...L,semMov:true}); continue; }
    let custoFinal=p.custo||0; const ci=L.custo;
    if(delta>0&&ci!=null&&ci>0){ custoFinal=custoMedioEntrada(p,delta,ci).custoMedio; }
    const lt=addSaldo(L.obra,L.code,delta); p.custo=custoFinal;
    const mid=uid();
    pushMov({id:mid,ts:Date.now(),tipo:'ajuste',obra:L.obra,code:L.code,desc:p.desc,qty:delta,valorUnit:custoFinal,valorTotal:delta*custoFinal,doc:'Ajuste de inventário: '+L.lista+(L.tipo==='extra'?' · item fora da lista':''),saldo:saldoOf(L.obra,L.code),invId:L.key,invModo:L.modoEf,lotes:lt||undefined});
    marcas.push({...L,mov:mid});
  }
  return marcas;
}
/* Grava pelo mesmo caminho do save(): fila única por chave e SEM movimentos/saldos/obra atual dentro do documento.

/* Recuperação: lançamentos de inventário já feitos (movimento com inv_id) cujo produto não está no cadastro.
   O saldo existe no banco, mas o estoque lista pelo cadastro — então o item some das telas. Reconstrói o cadastro
   com a descrição/unidade/custo da contagem e do próprio movimento. */
let invOrfaos=[];
async function invCarregarOrfaos(){
  const {data,error}=await fetchAllRows(()=>sb.from('movimentos_estoque').select('id,ts,code,descricao,valor_unit,inv_id').like('inv_id','inv:%').order('ts',{ascending:false}).order('id'));
  if(error)throw error;
  const porCode={};
  (data||[]).forEach(m=>{ if(!m.code||findProduct(m.code)||porCode[m.code])return; porCode[m.code]=m; }); /* mais recente primeiro */
  const ign=new Set((state.config&&state.config.invOrfaosIgnorados)||[]);
  /* produto excluído de propósito (sem saldo, ou dispensado aqui) não é "sem cadastro" */
  const lst=Object.values(porCode).filter(m=>!ign.has(String(m.code))&&state.obras.some(o=>saldoTotalOf(o.id,m.code)!==0)); if(!lst.length)return [];
  const exIds=[...new Set(lst.map(m=>/^inv:extra:(.+)$/.exec(m.inv_id)).filter(Boolean).map(x=>x[1]))], ex={};
  for(let i=0;i<exIds.length;i+=100){ const r=await sb.from('contagem_extras').select('id,descricao,desc_final,unidade,unid_final,custo,ciclo_id').in('id',exIds.slice(i,i+100)); if(r.error)throw r.error; r.data.forEach(x=>ex[x.id]=x); }
  return lst.map(m=>{ const x=ex[(/^inv:extra:(.+)$/.exec(m.inv_id)||[])[1]]||{};
    return {code:m.code,desc:x.desc_final||m.descricao||x.descricao||m.code,unit:x.unid_final||x.unidade||'UN',custo:Number(m.valor_unit)||Number(x.custo)||0,extraId:x.id||null,saldo:state.obras.reduce((a,o)=>a+saldoTotalOf(o.id,m.code),0)}; });
}

async function invDispensarOrfao(code){
  if(!state.config)state.config={supHash:null};

function invRecadastrarOrfaos(){
  if(!invOrfaos.length)return;

    const novos=invOrfaos.filter(o=>!findProduct(o.code)).map(o=>({code:o.code,desc:o.desc,unit:o.unit,aux:'',min:0,max:0,custo:o.custo,preco:0,ref:''}));

      const cods=new Set(novos.map(p=>p.code)); state.products=state.products.filter(p=>!cods.has(p.code));
      toast('Os produtos não foram cadastrados. Tente novamente.','err'); return; }
    for(const o of invOrfaos)if(o.extraId)await fotosExtraParaProduto(o.extraId,o.code);

async function renderInventario(){

  catch(e){ $('#view').innerHTML='<div class="panel"><h3>Inventário</h3><p class="desc">Não consegui ler as tabelas da contagem ('+esc(e.message)+'). Confira se os arquivos SQL da contagem cíclica foram executados neste projeto.</p></div>'; return; }
  try{ invOrfaos=await invCarregarOrfaos(); }catch(e){ console.warn('invCarregarOrfaos',e); invOrfaos=[]; }

}

function invToggle(key,v){ invSel[key]=!!v; invDraw(); }
function invSetModo(key,v){ invModo[key]=v; invDraw(); }
function invLancar(){
  const linhas=invCalcLote(invRows.filter(r=>podeAprovarObra(r.obra)&&invSel[r.key]!==false)).filter(l=>!l.erro);
  if(!linhas.length){ toast('Nenhum ajuste selecionado.','err'); return; }
  const novos=linhas.filter(l=>l.criar).length;
  requireSupervisor('Autorizar e lançar '+linhas.length+' ajuste(s) de inventário no estoque'+(novos?' ('+novos+' produto(s) novo(s))':''),async()=>{
    // recalcula no momento da confirmação (o estado pode ter mudado enquanto o aviso estava aberto)
    const atuais=invCalcLote(linhas).filter(l=>!l.erro);
    const listas=[...new Set(atuais.map(l=>l.lista))].join(', ');
    const novos=invProdutosNovos(atuais);
    if(novos.length){
      toast('Cadastrando '+novos.length+' produto(s)...','warn');
      const ok=await invSalvar('Produtos cadastrados pelo inventário: '+novos.length+' · '+listas);
      if(!ok){ const cods=new Set(novos.map(p=>p.code)); state.products=state.products.filter(p=>!cods.has(p.code));
        toast('Os produtos novos não foram cadastrados e o estoque não foi alterado. Tente novamente.','err'); invDraw(); return; }
    }
    const marcas=invAplicar(atuais);
    if(marcas.some(m=>!m.ja&&!m.semMov)){
      toast('Salvando...','warn');
      /* saldo e movimentos já foram para o banco (tabelas próprias); aqui vai só o custo médio atualizado */
      if(!(await invSalvar('Ajuste de inventário: '+marcas.length+' item(ns) · '+listas)))
        toast('Saldos lançados, mas o custo médio não foi gravado. Confira o custo dos itens lançados.','warn');
    }
    const agora=new Date().toISOString(); let falhas=0;
    for(const m of marcas){
      const patch={status:'ajustado',ajustado_por:session.user.id,ajustado_em:agora,mov_id:m.mov||null}; let tab;
      if(m.tipo==='item'){ tab='contagem_itens'; patch.novo_saldo=m.novo; patch.modo_ajuste=m.modoEf; }
      else{ tab='contagem_extras'; if(m.code)patch.code_final=m.code; }
      const {data,error}=await sb.from(tab).update(patch).eq('id',m.rowId).eq('status','aprovado').select('id');
      if(error||!data||!data.length)falhas++;
      if(m.tipo!=='item'&&m.code)await fotosExtraParaProduto(m.rowId,m.code);
    }
    loadFotosExt();
    if(falhas)toast('Estoque ajustado, mas '+falhas+' linha(s) não foram marcadas como lançadas. Abra o Inventário e repita: nada será lançado em duplicidade.','warn');
    else toast('Ajustes de inventário lançados e salvos.','ok');
    await renderInventario();
  });
}

async function aprovarRequisicao(id){
  const {data:r,error:e1}=await sb.from('requisicoes').select('*').eq('id',id).maybeSingle();
  if(e1||!r){toast('Erro ao carregar pedido.','err');return;}
  if(!podeAprovarObra(r.obra_id)){toast('Você não está vinculado à obra (centro de custo) desta requisição.','err');return;}
  const obraSaldo=obraEstoqueParaRequisicao(r);
  // Verifica o saldo item a item — não bloqueia mais a aprovação por falta de estoque.
  const itensAvaliados=r.itens.map(i=>{
    const disponivel=Math.max(Math.min(saldoOf(obraSaldo,i.code), i.qty),0);
    return {code:i.code, desc:i.desc, unit:i.unit||'', qty:i.qty, disponivel, faltante:Math.max(i.qty-disponivel,0)};
  });
  const temFaltante=itensAvaliados.some(i=>i.faltante>0);
  const rowsStatus=itensAvaliados.map(i=>({
    requisicao_id:r.id, code:i.code, descricao:i.desc, unidade:i.unit,
    quantidade_solicitada:i.qty, quantidade_disponivel:i.disponivel,
    status: i.faltante>0?'faltante':'disponivel'
  }));
  const {error:e2}=await sb.from('requisicao_itens_status').upsert(rowsStatus,{onConflict:'requisicao_id,code'});
  if(e2){toast('Erro ao gravar verificação de estoque: '+e2.message,'err');return;}
  const faltantes=itensAvaliados.filter(i=>i.faltante>0);
  if(faltantes.length){
    const rowsCompra=faltantes.map(i=>({requisicao_id:r.id, code:i.code, descricao:i.desc, quantidade:i.faltante, status:'pendente'}));
    const {error:e3}=await sb.from('compras_pendentes').insert(rowsCompra);
    if(e3){toast('Verificação salva, mas houve erro ao gerar compra pendente: '+e3.message,'err');return;}
  }
  const novoStatus=temFaltante?'aguardando_compra':'em_separacao';
  const {error:e4}=await updReq(id,{status:novoStatus,decidido_por:session.user.id,decidido_por_nome:profile.nome||profile.email,decidido_em:new Date().toISOString()});
  if(e4){toast('Erro ao atualizar a requisição: '+e4.message,'err');return;}
  toast(temFaltante?'Requisição aprovada. Itens faltantes enviados para compras.':'Requisição aprovada — pronta para separação.','ok');
  drawAprovPend(); drawAprovHist(); refreshAprovBadge(); refreshSeparacaoBadge(); refreshComprasBadge(); refreshMinhasBadge(); refreshGlobalAlerts(); }

async function marcarCompraRecebida(id){
  const {data:c,error:e1}=await sb.from('compras_pendentes').select('*').eq('id',id).maybeSingle();
  if(e1||!c){toast('Erro ao carregar a compra.','err');return;}
  modal(`<h3>Confirmar recebimento</h3><p class="mp">${esc(c.descricao)} — faltavam ${numf(c.quantidade)}.</p>
    <div class="field"><label>Quantidade recebida</label><input id="mcrQtd" type="number" step="any" value="${c.quantidade}"></div>
    <div style="display:flex;gap:10px;justify-content:flex-end"><button class="btn ghost" onclick="closeModal()">Cancelar</button><button class="btn primary" id="mcrOk">Confirmar</button></div>`);
  $('#mcrOk').onclick=async()=>{
    const qtd=parseFloat($('#mcrQtd').value);
    if(isNaN(qtd)||qtd<=0){toast('Informe uma quantidade válida.','err');return;}
    closeModal();
    const restante=c.quantidade-qtd;
    if(restante<=0.0001){
      await sb.from('compras_pendentes').update({status:'recebida',quantidade:qtd,data_recebimento:new Date().toISOString()}).eq('id',id);
    } else {
      await sb.from('compras_pendentes').update({quantidade:restante}).eq('id',id);
      await sb.from('compras_pendentes').insert({requisicao_id:c.requisicao_id,code:c.code,descricao:c.descricao,quantidade:qtd,status:'recebida',data_recebimento:new Date().toISOString(),atribuido_a:c.atribuido_a,atribuido_a_nome:c.atribuido_a_nome,numero_solicitacao_sienge:c.numero_solicitacao_sienge});
    }

    if(!e2&&item){
      const faltaAinda=item.quantidade_solicitada-item.quantidade_separada-item.quantidade_disponivel;
      const novaDisp=item.quantidade_disponivel+Math.min(qtd,Math.max(faltaAinda,0));
      const novoStatus=(item.quantidade_separada+novaDisp)>=item.quantidade_solicitada?'disponivel':'faltante';
      await sb.from('requisicao_itens_status').update({quantidade_disponivel:novaDisp,status:novoStatus,atualizado_em:new Date().toISOString()}).eq('id',item.id);
    }
    const {count,error:eCnt}=await sb.from('requisicao_itens_status').select('id',{count:'exact',head:true}).eq('requisicao_id',c.requisicao_id).eq('status','faltante');
    let avisoReq='';

      const {data:upd,error:eU}=await sb.from('requisicoes').update({status:'em_separacao'}).eq('id',c.requisicao_id).eq('status','aguardando_compra').select('id');
      if(eU) avisoReq=eU.message;
      else if(!upd||!upd.length){ const {data:cur}=await sb.from('requisicoes').select('status').eq('id',c.requisicao_id).maybeSingle();
        if(cur&&cur.status==='aguardando_compra') avisoReq='o seu usuário ('+papelLabel(profile.papel||'')+(profile.setor?' · '+profile.setor:'')+') não tem permissão para alterar a requisição. Avise o administrador.'; }
    }
    if(avisoReq) toast('Recebimento registrado, mas a requisição NÃO voltou para a separação: '+avisoReq,'err'); else
    toast('Recebimento registrado.','ok'); drawComprasPendentes(); drawSeparacaoList(); refreshSeparacaoBadge(); refreshComprasBadge(); refreshMinhasBadge(); refreshGlobalAlerts();
  };
}

  const payload=ehBalcao(tipo)?{tipo_envio:tipo,status:'romaneio_emitido'}:{tipo_envio:tipo};
  const win=(ehMutuo&&ehBalcao(tipo))?abrirJanelaImpressao():null; /* na retirada interna o romaneio é emitido aqui mesmo */
  updReq(reqId,payload).then(({error})=>{ if(error){ if(win)win.close(); toast('Erro: '+error.message,'err');return;}
    if(win) imprimirRomaneioMutuo(reqId,win);
    toast(ehBalcao(tipo)?'Retirada no balcão — indo direto pra embalagem (sem romaneio).':'Tipo de envio definido.','ok');
    drawSeparacaoList(); drawExpedicaoList(); refreshExpedBadge(); }); }
async function trocarTipoEnvio(reqId){

/* Passa a requisição para "separado" e CONFERE se o banco gravou. Antes era um update sem conferência: quando o
   banco recusava por permissão do usuário (RLS devolve zero linhas, sem erro) ou a rotina era interrompida no meio
   (aba fechada, queda de conexão), a tela dizia "tudo separado" e a requisição ficava presa em "Em separação" com
   todos os itens já separados — sem botão para seguir. */
/* Alteração na requisição que CONFERE se o banco gravou. Quando a permissão do usuário (RLS) não cobre a etapa,
   o Supabase não devolve erro — só zero linhas alteradas — e a tela seguia como se tivesse dado certo. */
async function updReq(reqId,payload){
  let data=null,error=null;
  try{ ({data,error}=await sb.from('requisicoes').update(payload).eq('id',reqId).select('id')); }
  catch(e){ error={message:(e&&e.message)||String(e)}; }
  if(!error&&(!data||!data.length)) error={message:'a alteração não foi gravada — a requisição não existe mais ou o seu usuário ('+papelLabel((profile&&profile.papel)||'')+(profile&&profile.setor?' · '+profile.setor:'')+') não tem permissão para esta etapa. Avise o administrador.'};
  return {error};
}
const SEP_ABERTA=['em_separacao','aguardando_compra'];
const _sepPresas=new Map(); /* reqId -> motivo da última tentativa que falhou (evita insistir a cada redesenho) */
async function concluirSeparacaoReq(reqId){
  let data=null,error=null;
  try{ ({data,error}=await sb.from('requisicoes').update({status:'separado'}).eq('id',reqId).in('status',SEP_ABERTA).select('id')); }
  catch(e){ error={message:(e&&e.message)||String(e)}; }
  if(error) return {ok:false,motivo:error.message};
  if(data&&data.length){ try{ await sb.rpc('log_event',{p_acao:'separacao_concluida',p_entidade:'requisicoes',p_entidade_id:String(reqId)}); }catch(e){} return {ok:true}; }
  const {data:cur}=await sb.from('requisicoes').select('status').eq('id',reqId).maybeSingle();
  if(cur&&!SEP_ABERTA.includes(cur.status)) return {ok:true}; /* outra pessoa/aba já avançou */
  return {ok:false,motivo:'o banco não permitiu que o seu usuário ('+papelLabel(profile.papel||'')+(profile.setor?' · '+profile.setor:'')+') altere a requisição. Avise o administrador.'};
}
async function tentarConcluirSeparacao(reqId){
  const c=await concluirSeparacaoReq(reqId);
  if(c.ok){ _sepPresas.delete(reqId); toast('Requisição liberada para a próxima etapa.','ok'); }
  else { _sepPresas.set(reqId,c.motivo); toast('Não foi possível concluir: '+c.motivo,'err'); }
  drawSeparacaoList(); refreshSeparacaoBadge(); refreshExpedBadge(); refreshRetiradasBadge(); refreshGlobalAlerts();
}
const _separandoItens=new Set();
async function separarItem(id){
  if(_separandoItens.has(id))return; /* clique duplo / repetido no mesmo item */
  _separandoItens.add(id);
  try{ await _separarItem(id); } finally { _separandoItens.delete(id); }
}
async function _separarItem(id){
  const {data:item,error:e1}=await sb.from('requisicao_itens_status').select('*').eq('id',id).maybeSingle();
  if(e1||!item){toast('Erro ao carregar item.','err');return;}
  if(!(item.quantidade_disponivel>0)){toast('Nada disponível pra separar neste item.','err');return;}
  const {data:r,error:e2}=await sb.from('requisicoes').select('*').eq('id',item.requisicao_id).maybeSingle();
  if(e2||!r){toast('Erro ao carregar requisição.','err');return;}
  const p=findProduct(item.code); const vu=p?(p.custo||0):0;
  const qtdSeparar=item.quantidade_disponivel;
  const obraSaldo=obraEstoqueParaRequisicao(r);
  const novaSeparada=item.quantidade_separada+qtdSeparar;
  const novoStatus=novaSeparada>=item.quantidade_solicitada?'separado':'faltante';
  /* "reserva" o item ANTES de mexer no saldo: só passa se ninguém separou este item nesse meio-tempo
     (evita baixa em dobro por clique duplo ou dois aparelhos ao mesmo tempo) */
  const {data:claim,error:eC}=await sb.from('requisicao_itens_status')
    .update({quantidade_disponivel:0,quantidade_separada:novaSeparada,status:novoStatus,atualizado_em:new Date().toISOString()})
    .eq('id',id).eq('quantidade_disponivel',item.quantidade_disponivel).eq('quantidade_separada',item.quantidade_separada).select('id');
  if(eC){toast('Erro ao separar: '+eC.message,'err');return;}
  if(!claim||!claim.length){toast('Este item já foi separado por outra pessoa/aba — atualizando a lista.','warn'); drawSeparacaoList(); return;}
  const lt=addSaldo(obraSaldo,item.code,-qtdSeparar);
  const {data:numData,error:eNum}=await sb.rpc('proximo_numero_documento',{p_tipo:'baixa'});
  const numero=eNum?0:numData;
  if(eNum) console.warn('Falha ao gerar numeração da baixa, seguindo sem número:',eNum);
  pushMov({id:uid(),ts:Date.now(),seq:numero,tipo:'baixa',obra:obraSaldo,aplic:r.aplicacao_id||'',obs:r.observacao||'',os:r.ordem_servico||'',code:item.code,desc:item.descricao,qty:qtdSeparar,valorUnit:vu,valorTotal:qtdSeparar*vu,doc:'Separação REQ-'+String(r.id).padStart(5,'0'),saldo:saldoOf(obraSaldo,item.code),lotes:lt||undefined});
  await save('Separação REQ-'+String(r.id).padStart(5,'0')+': '+item.descricao);
  if(r.mutuo_empresa_destino){
    const estObra=state.obras.find(x=>x.id===r.mutuo_estoque_obra_id);
    const {error:e3}=await sb.from('mutuos_intercompany').insert({periodo:periodoAtual(),empresa_origem:r.mutuo_empresa_origem,empresa_destino:r.mutuo_empresa_destino,obra_origem_nome:estObra?estObra.nome:'',obra_destino_nome:r.obra_nome,descricao:item.descricao+' (REQ-'+String(r.id).padStart(5,'0')+')',requisicao_id:r.id,item_code:item.code,valor:qtdSeparar*vu,registrado_por:session.user.id,registrado_por_nome:profile.nome||profile.email});
    if(e3)toast('Baixa feita, mas houve erro ao registrar o mútuo: '+e3.message,'err');
  }
  const {count,error:eCnt}=await sb.from('requisicao_itens_status').select('id',{count:'exact',head:true}).eq('requisicao_id',r.id).neq('status','separado');
  if(!eCnt&&count===0){
    const c=await concluirSeparacaoReq(r.id);
    if(c.ok){ _sepPresas.delete(r.id); toast('Todos os itens separados! Requisição pronta para embalamento.','ok'); }
    else { _sepPresas.set(r.id,c.motivo); toast('Item separado e baixado do estoque, mas a requisição NÃO avançou para a próxima etapa: '+c.motivo,'err'); }
    refreshExpedBadge(); refreshRetiradasBadge(); }
  else toast(novoStatus==='separado'?'Item totalmente separado.':'Separado o que estava disponível — o restante continua aguardando compra.','ok');
  drawSeparacaoList(); refreshSeparacaoBadge(); refreshComprasBadge(); refreshMinhasBadge(); refreshRetiradasBadge(); refreshGlobalAlerts();
}

/* ===== ENTREGA PARCIAL NO BALCÃO =====
   Retirada no balcão em mais de uma vez: cada entrega registra quem retirou e quais itens/quantidades levou
   (retiradas_internas.itens) e soma em requisicao_itens_status.quantidade_entregue. A requisição só vira
   "retirado" quando tudo o que foi solicitado já foi entregue; até lá continua na etapa em que está e o saldo
   pendente segue em "Aguardando Retirada". Gravação atômica pelas funções registrar_entrega_balcao /
   estornar_entrega_balcao (script ENTREGA_SQL — rodar uma vez no Supabase). Sem o script, vale o fluxo antigo. */
const ENTREGA_SQL="-- Entrega parcial no balcão (retirada no balcão em mais de uma vez)\n-- Rodar uma vez no Supabase (SQL Editor) do projeto Estoque. Pode rodar de novo sem problema.\n\nalter table public.requisicao_itens_status add column if not exists quantidade_entregue numeric not null default 0;\nalter table public.retiradas_internas add column if not exists itens jsonb;\nalter table public.retiradas_internas add column if not exists parcial boolean not null default false;\nalter table public.retiradas_internas add column if not exists status_anterior text;\n\n-- Registra uma entrega no balcão (total ou parcial) de uma vez só: soma o entregue em cada item,\n-- grava quem retirou e, se tudo o que foi solicitado já foi entregue, encerra a requisição como \"retirado\".\ncreate or replace function public.registrar_entrega_balcao(\n  p_requisicao_id bigint, p_colaborador text, p_documento text, p_observacao text,\n  p_registrado_por_nome text, p_itens jsonb, p_tipo_envio text default null)\nreturns jsonb language plpgsql security invoker set search_path = public as $$\ndeclare\n  v_req record; v_el jsonb; v_row record; v_q numeric; v_lista jsonb := '[]'::jsonb;\n  v_falta integer; v_final boolean; v_tipo text;\nbegin\n  if coalesce(btrim(p_colaborador),'') = '' then raise exception 'Informe o colaborador que retirou.'; end if;\n  select * into v_req from requisicoes where id = p_requisicao_id for update;\n  if not found then raise exception 'Requisição não encontrada.'; end if;\n  if v_req.status not in ('em_separacao','aguardando_compra','separado','romaneio_emitido','embalado','faturado') then\n    raise exception 'A requisição está em \"%\" e não aceita entrega no balcão.', v_req.status; end if;\n  v_tipo := coalesce(v_req.tipo_envio, p_tipo_envio);\n  if v_tipo is null or v_tipo not in ('interna','aplicacao_direta') then\n    raise exception 'Entrega parcial só vale para retirada no balcão.'; end if;\n  if p_itens is null or jsonb_typeof(p_itens) <> 'array' then raise exception 'Nenhum item informado.'; end if;\n\n  for v_el in select * from jsonb_array_elements(p_itens) loop\n    v_q := nullif(v_el->>'quantidade','')::numeric;\n    if v_q is null or v_q <= 0 then continue; end if;\n    select * into v_row from requisicao_itens_status\n      where requisicao_id = p_requisicao_id and id::text = (v_el->>'id') for update;\n    if not found then raise exception 'Item não pertence a esta requisição.'; end if;\n    if v_q > coalesce(v_row.quantidade_separada,0) - coalesce(v_row.quantidade_entregue,0) + 0.0001 then\n      raise exception 'Quantidade maior que o separado ainda não entregue: %', v_row.descricao; end if;\n    update requisicao_itens_status set quantidade_entregue = coalesce(quantidade_entregue,0) + v_q\n      where requisicao_id = p_requisicao_id and id::text = (v_el->>'id');\n    v_lista := v_lista || jsonb_build_array(jsonb_build_object(\n      'id', v_el->>'id', 'code', v_row.code, 'descricao', v_row.descricao, 'unidade', v_row.unidade, 'quantidade', v_q));\n  end loop;\n  if jsonb_array_length(v_lista) = 0 then raise exception 'Informe a quantidade de pelo menos um item.'; end if;\n\n  select count(*) into v_falta from requisicao_itens_status\n    where requisicao_id = p_requisicao_id\n      and coalesce(quantidade_entregue,0) < coalesce(quantidade_solicitada,0) - 0.0001;\n  v_final := (v_falta = 0);\n\n  insert into retiradas_internas (requisicao_id, colaborador_nome, colaborador_documento, registrado_por,\n      registrado_por_nome, observacao, itens, parcial, status_anterior)\n    values (p_requisicao_id, btrim(p_colaborador), nullif(btrim(coalesce(p_documento,'')),''), auth.uid(),\n      p_registrado_por_nome, nullif(btrim(coalesce(p_observacao,'')),''), v_lista, not v_final, v_req.status);\n\n  if v_req.tipo_envio is null then update requisicoes set tipo_envio = v_tipo where id = p_requisicao_id; end if;\n  if v_final then update requisicoes set status = 'retirado' where id = p_requisicao_id; end if;\n  return jsonb_build_object('final', v_final, 'itens', jsonb_array_length(v_lista));\nend $$;\n\n-- Desfaz a entrega mais recente de uma requisição: devolve as quantidades para \"aguardando retirada\"\n-- e, se a requisição tinha sido encerrada por essa entrega, volta para a etapa em que estava.\ncreate or replace function public.estornar_entrega_balcao(p_retirada_id text)\nreturns jsonb language plpgsql security invoker set search_path = public as $$\ndeclare v_ret record; v_req record; v_el jsonb;\nbegin\n  select * into v_ret from retiradas_internas where id::text = p_retirada_id for update;\n  if not found then raise exception 'Entrega não encontrada.'; end if;\n  if v_ret.itens is null or jsonb_typeof(v_ret.itens) <> 'array' then\n    raise exception 'Esta retirada é anterior à entrega parcial e não tem itens registrados.'; end if;\n  if exists (select 1 from retiradas_internas where requisicao_id = v_ret.requisicao_id and id > v_ret.id) then\n    raise exception 'Só é possível desfazer a entrega mais recente da requisição.'; end if;\n  select * into v_req from requisicoes where id = v_ret.requisicao_id for update;\n  for v_el in select * from jsonb_array_elements(v_ret.itens) loop\n    update requisicao_itens_status\n      set quantidade_entregue = greatest(coalesce(quantidade_entregue,0) - coalesce(nullif(v_el->>'quantidade','')::numeric,0), 0)\n      where requisicao_id = v_ret.requisicao_id and id::text = (v_el->>'id');\n  end loop;\n  if v_req.status = 'retirado' then\n    update requisicoes set status = coalesce(v_ret.status_anterior,'faturado') where id = v_req.id; end if;\n  delete from retiradas_internas where id::text = p_retirada_id;\n  return jsonb_build_object('ok', true);\nend $$;\n\ngrant execute on function public.registrar_entrega_balcao(bigint,text,text,text,text,jsonb,text) to authenticated;\ngrant execute on function public.estornar_entrega_balcao(text) to authenticated;\n";
let _entParcialOk=null, _entSalvando=false;
async function checkEntregaParcial(){ try{ const {error}=await sb.from('requisicao_itens_status').select('quantidade_entregue').limit(1); _entParcialOk=!error; }catch(e){ _entParcialOk=false; } return _entParcialOk; }
function qEntregue(i){ return Number(i&&i.quantidade_entregue)||0; }
function pendEntrega(i){ return Math.max((Number(i&&i.quantidade_separada)||0)-qEntregue(i),0); }
const ENT_STATUS=['em_separacao','aguardando_compra','separado','romaneio_emitido','embalado','faturado'];
function copiarEntregaSQL(){ navigator.clipboard.writeText(ENTREGA_SQL).then(()=>toast('Script copiado.','ok'),()=>toast('Não foi possível copiar — use o arquivo entrega_parcial.sql.','err')); }

      ${x.observacao?`<div class="muted" style="font-size:11.5px;margin-top:4px">Obs.: ${esc(x.observacao)}</div>`:''}

    }</tbody></table></div>
    <div style="display:flex;gap:6px;margin-bottom:12px"><button class="btn ghost sm" onclick="entregaPreencher(true)">Entregar tudo o que está separado</button><button class="btn ghost sm" onclick="entregaPreencher(false)">Zerar</button></div>
    ${!r.tipo_envio?`<div class="field"><label>Tipo de retirada</label><select id="epTipo"><option value="interna">Tramitação interna (retirada no balcão)</option><option value="aplicacao_direta">Retirada no balcão — compra p/ aplicação direta</option></select></div>`:''}
    <div class="row c2"><div class="field"><label>Colaborador que retirou</label><input id="epColab" ${_comprovOk?'list="epUsersList" oninput="epRetiranteChange()" autocomplete="off" placeholder="Digite o nome"':''}>${_comprovOk?`<datalist id="epUsersList">${(_comprovUsers||[]).filter(u=>u.id!==session.user.id).map(u=>`<option value="${esc(u.nome)}">`).join('')}</datalist>`:''}</div><div class="field"><label>Documento (opcional)</label><input id="epDoc"></div></div>
    <div class="field"><label>Observação</label><input id="epObs"></div>
    ${_comprovOk?comprovFormHTML('ep'):''}
    <button class="btn primary sm" id="epOk" onclick="registrarEntregaBalcao(${r.id})">Registrar entrega</button>`;
  }
  return h+hist; }
function entregaPreencher(tudo){ document.querySelectorAll('#modalRoot input.ep-q').forEach(el=>{ el.value=tudo?el.dataset.max:0; }); }
function entregaRefreshTelas(){ try{ if(_comprovOk){ refreshComprovBadge(); if(activeTab==='comprovantes')drawComprovantes(); } drawExpedicaoList(); refreshExpedBadge(); refreshRetiradasBadge(); drawSeparacaoList(); refreshSeparacaoBadge(); drawRetiradaPendente(); refreshMinhasBadge(); refreshGlobalAlerts(); }catch(e){ console.warn(e); } }
async function registrarEntregaBalcao(reqId){ if(_entSalvando)return;
  if(!podeOperarRetiradas()){ toast('Sem permissão para registrar entrega.','err'); return; }
  const {r,itens}=window._expedCtx; const lista=[]; let erro='';
  itens.forEach(i=>{ const el=document.getElementById('epQ_'+i.id); if(!el||erro)return; const v=String(el.value).trim()===''?0:parseFloat(el.value);
    if(isNaN(v)||v<0){ erro='Quantidade inválida em: '+i.descricao; return; }
    if(v>pendEntrega(i)+0.0001){ erro='Quantidade maior que o separado ainda não entregue em: '+i.descricao; return; }
    if(v>0)lista.push({id:String(i.id),quantidade:v}); });
  if(erro){ toast(erro,'err'); return; }
  if(!lista.length){ toast('Informe a quantidade de pelo menos um item.','err'); return; }
  const colab=$('#epColab').value.trim(); if(!colab){ toast('Informe o colaborador que retirou.','err'); $('#epColab').focus(); return; }
  const tipo=r.tipo_envio||($('#epTipo')?$('#epTipo').value:'');
  if(!ehBalcao(tipo)){ toast('Entrega parcial só vale para retirada no balcão.','err'); return; }
  let comp=null, avisoComp='';
  if(_comprovOk){ comp=comprovFormRead('ep'); if(!comp)return; }
  _entSalvando=true; const b=$('#epOk'); if(b){ b.disabled=true; b.textContent='Registrando...'; }
  let fim=false;
  try{
    const {data,error}=await sb.rpc('registrar_entrega_balcao',{p_requisicao_id:reqId,p_colaborador:colab,p_documento:$('#epDoc').value.trim()||null,p_observacao:$('#epObs').value.trim()||null,p_registrado_por_nome:profile.nome||profile.email,p_itens:lista,p_tipo_envio:r.tipo_envio?null:tipo});
    if(error){ toast('Erro ao registrar a entrega: '+error.message,'err'); return; }
    fim=!!(data&&data.final);
    try{ await sb.rpc('log_event',{p_acao:fim?'entrega_balcao_final':'entrega_balcao_parcial',p_entidade:'requisicoes',p_entidade_id:String(reqId)}); }catch(e){}
    if(comp){ /* a comprovação é gravada logo depois da entrega; se falhar, a entrega fica marcada como "sem comprovação" e dá para colher de novo */
      const {data:ult}=await sb.from('retiradas_internas').select('id').eq('requisicao_id',reqId).order('id',{ascending:false}).limit(1);
      const eC=(ult&&ult[0])?await gravarComprovacao(ult[0].id,comp):{message:'entrega não localizada para vincular'};
      if(eC)avisoComp=eC.message||'falha ao gravar'; }
  } finally { _entSalvando=false; const b2=$('#epOk'); if(b2){ b2.disabled=false; b2.textContent='Registrar entrega'; } }
  toast(fim?'Entrega registrada — requisição encerrada (tudo retirado).':'Entrega parcial registrada — o restante continua aguardando retirada.','ok');
  if(avisoComp)toast('A entrega foi registrada, mas a comprovação NÃO foi gravada: '+esc(avisoComp)+' — colha de novo no histórico da entrega.','err');
  else if(comp&&comp.tipo==='login')toast('Aviso enviado: o retirante confirma o recebimento no usuário dele.','ok');
  await abrirExpedicao(reqId); entregaRefreshTelas(); }
function estornarEntregaBalcao(retId){ const {r}=window._expedCtx;
  requireSupervisor('Desfazer a última entrega no balcão da REQ-'+String(r.id).padStart(5,'0')+' (os itens voltam a aguardar retirada)',async()=>{
    const {error}=await sb.rpc('estornar_entrega_balcao',{p_retirada_id:String(retId)});
    if(error){ toast('Erro ao desfazer a entrega: '+error.message,'err'); return; }
    try{ await sb.rpc('log_event',{p_acao:'entrega_balcao_estornada',p_entidade:'requisicoes',p_entidade_id:String(r.id)}); }catch(e){}
    toast('Entrega desfeita — os itens voltaram a aguardar retirada.','warn');
    await abrirExpedicao(r.id); entregaRefreshTelas(); }); }
function imprimirComprovanteEntrega(retId){ const {r,rets}=window._expedCtx; const x=(rets||[]).find(y=>String(y.id)===String(retId)); if(!x)return; _printComprovEntrega(r,x); }

/* ===== COMPROVAÇÃO DIGITAL DE ENTREGA =====
   Substitui o comprovante impresso e o arquivo físico:
   · Balcão   — assinatura na tela (quem retira não tem usuário) ou confirmação pelo login de quem retirou.
   · Despacho — foto do canhoto no embarque + recebimento na obra (QR da etiqueta do volume ou pela lista).
   · Mútuo    — comprovante do período reunindo os lançamentos e a comprovação de cada entrega.
   Tudo é gravado por funções do banco (script COMPROV_SQL — rodar uma vez no Supabase), que conferem quem pode
   fazer o quê e não deixam alterar uma entrega depois de comprovada. Sem o script instalado, nada muda nas telas. */
const COMPROV_SQL="-- Comprovação digital de entrega\n--   Balcão: assinatura na tela ou confirmação pelo login de quem retirou\n--   Despacho: foto do canhoto no embarque e recebimento na obra (QR do volume)\n-- Rodar uma vez no Supabase (SQL Editor) do projeto Estoque. Pode rodar de novo sem problema.\n--\n-- O script é gravado em etapas (os \"commit\" abaixo): cada tabela é alterada sozinha, para não travar com quem está\n-- usando o sistema. Se parar com \"lock timeout\" ou \"deadlock\", é só rodar de novo: ele continua de onde parou.\n\n-- 0) Trava de segurança: o status \"recebido\" precisa ser aceito pela tabela de requisições\ndo $$ declare c record; begin\n  for c in select conname, pg_get_constraintdef(oid) as def from pg_constraint\n           where conrelid = 'public.requisicoes'::regclass and contype = 'c' loop\n    if c.def ilike '%embarcado%' and c.def not ilike '%recebido%' then\n      raise exception 'A restrição \"%\" da tabela requisicoes não aceita o status \"recebido\". Nada foi alterado. Definição atual: %', c.conname, c.def;\n    end if;\n  end loop;\nend $$;\ncommit;\n\n-- 1) Colunas — uma tabela por vez. Na primeira instalação, o que já existia fica marcado como\n--    \"comprovante em papel\", para não aparecer como pendência de comprovação digital.\n\n-- 1a) Entregas no balcão\nset local lock_timeout = '10s';\ndo $$ begin\n  if not exists (select 1 from information_schema.columns where table_schema = 'public'\n                 and table_name = 'retiradas_internas' and column_name = 'comprov_tipo') then\n    alter table public.retiradas_internas add column comprov_tipo text;\n    update public.retiradas_internas set comprov_tipo = 'papel';\n  end if;\nend $$;\nalter table public.retiradas_internas\n  add column if not exists itens jsonb,\n  add column if not exists parcial boolean not null default false,\n  add column if not exists comprov_assinatura text,\n  add column if not exists retirante_id uuid,\n  add column if not exists retirante_nome text,\n  add column if not exists comprov_em timestamptz,\n  add column if not exists comprov_por uuid,\n  add column if not exists comprov_por_nome text;\ncommit;\n\n-- 1b) Despachos\nset local lock_timeout = '10s';\ndo $$ begin\n  if not exists (select 1 from information_schema.columns where table_schema = 'public'\n                 and table_name = 'embarques' and column_name = 'comprov_legado') then\n    alter table public.embarques add column comprov_legado boolean not null default false;\n    update public.embarques set comprov_legado = true;\n  end if;\nend $$;\nalter table public.embarques\n  add column if not exists canhoto_path text,\n  add column if not exists canhoto_em timestamptz,\n  add column if not exists canhoto_por_nome text,\n  add column if not exists recebido_em timestamptz,\n  add column if not exists recebido_por uuid,\n  add column if not exists recebido_por_nome text,\n  add column if not exists recebimento_obs text;\ncommit;\n\n-- 1c) Volumes\nset local lock_timeout = '10s';\nalter table public.caixas\n  add column if not exists recebida_em timestamptz,\n  add column if not exists recebida_por_nome text;\ncommit;\n\n-- 2) Arquivo das fotos (canhotos): pasta privada, só JPEG até 2 MB.\n--    Não há regra de alteração nem de exclusão: depois de enviada, a foto não pode ser trocada nem apagada pelo sistema.\nset local lock_timeout = '10s';\ninsert into storage.buckets (id, name, public, file_size_limit, allowed_mime_types)\nvalues ('comprovantes', 'comprovantes', false, 2097152, array['image/jpeg'])\non conflict (id) do nothing;\n\ndrop policy if exists \"comprovantes: leitura\" on storage.objects;\ncreate policy \"comprovantes: leitura\" on storage.objects\n  for select to authenticated\n  using (bucket_id = 'comprovantes'\n         and exists (select 1 from public.profiles p where p.id = auth.uid() and p.ativo));\n\ndrop policy if exists \"comprovantes: envio\" on storage.objects;\ncreate policy \"comprovantes: envio\" on storage.objects\n  for insert to authenticated\n  with check (bucket_id = 'comprovantes'\n              and exists (select 1 from public.profiles p where p.id = auth.uid() and p.ativo\n                          and (p.papel in ('admin','encarregado') or p.setor = 'almoxarifado')));\ncommit;\n\n-- 3) Quem pode confirmar o recebimento na obra: o solicitante, o encarregado vinculado à obra,\n--    o encarregado do almoxarifado e o administrador.\ncreate or replace function public.comprov_pode_receber(p_requisicao_id bigint)\nreturns boolean language sql stable security definer set search_path = public as $$\n  select exists (\n    select 1 from requisicoes r, profiles p\n    where r.id = p_requisicao_id and p.id = auth.uid() and p.ativo\n      and (p.papel = 'admin' or r.solicitante_id = auth.uid()\n           or (p.papel = 'encarregado'\n               and (p.setor = 'almoxarifado'\n                    or coalesce(to_jsonb(p.obras_vinculadas), '[]'::jsonb) ? (r.obra_id)::text))));\n$$;\n\n-- 4) Usuários ativos (para escolher quem está retirando no balcão)\ncreate or replace function public.comprov_usuarios()\nreturns jsonb language sql stable security definer set search_path = public as $$\n  select coalesce(jsonb_agg(jsonb_build_object('id', p.id, 'nome', coalesce(nullif(btrim(p.nome), ''), p.email))\n                            order by coalesce(nullif(btrim(p.nome), ''), p.email)), '[]'::jsonb)\n  from profiles p\n  where p.ativo and exists (select 1 from profiles me where me.id = auth.uid() and me.ativo);\n$$;\n\n-- 5) Balcão: grava a comprovação de uma entrega (assinatura na tela, ou indica o usuário que vai confirmar pelo login).\n--    Depois de comprovada, a entrega não pode mais ser alterada.\ncreate or replace function public.comprovar_entrega_balcao(\n  p_retirada_id text, p_tipo text, p_assinatura text default null, p_retirante_id uuid default null)\nreturns jsonb language plpgsql security definer set search_path = public as $$\ndeclare v_ret record; v_eu text; v_nome text;\nbegin\n  select coalesce(nullif(btrim(nome), ''), email) into v_eu from profiles\n    where id = auth.uid() and ativo and (papel in ('admin','encarregado') or setor = 'almoxarifado');\n  if not found then raise exception 'Seu usuário não tem permissão para registrar a comprovação de entrega.'; end if;\n  select * into v_ret from retiradas_internas where id::text = p_retirada_id for update;\n  if not found then raise exception 'Entrega não encontrada.'; end if;\n  if v_ret.comprov_em is not null then raise exception 'Esta entrega já está comprovada e não pode ser alterada.'; end if;\n\n  if p_tipo = 'assinatura' then\n    if coalesce(length(p_assinatura), 0) < 30 then raise exception 'Assinatura em branco.'; end if;\n    if length(p_assinatura) > 60000 then raise exception 'Assinatura grande demais — limpe e assine de novo.'; end if;\n    update retiradas_internas\n      set comprov_tipo = 'assinatura', comprov_assinatura = p_assinatura, retirante_id = null, retirante_nome = null,\n          comprov_em = now(), comprov_por = auth.uid(), comprov_por_nome = v_eu\n      where id::text = p_retirada_id;\n  elsif p_tipo = 'login' then\n    if p_retirante_id is null then raise exception 'Informe o usuário que vai confirmar o recebimento.'; end if;\n    if p_retirante_id = auth.uid() or p_retirante_id = v_ret.registrado_por then\n      raise exception 'Quem registra a entrega não pode ser o mesmo usuário que confirma o recebimento. Use a assinatura na tela.'; end if;\n    select coalesce(nullif(btrim(nome), ''), email) into v_nome from profiles where id = p_retirante_id and ativo;\n    if not found then raise exception 'Usuário do retirante não encontrado ou inativo.'; end if;\n    update retiradas_internas\n      set comprov_tipo = 'login', comprov_assinatura = null, retirante_id = p_retirante_id, retirante_nome = v_nome,\n          comprov_em = null, comprov_por = null, comprov_por_nome = null\n      where id::text = p_retirada_id;\n  else\n    raise exception 'Tipo de comprovação inválido.';\n  end if;\n  return jsonb_build_object('ok', true);\nend $$;\n\n-- 6) Balcão: o próprio retirante confirma, com o login dele, que recebeu o material\ncreate or replace function public.confirmar_entrega_login(p_retirada_id text)\nreturns jsonb language plpgsql security definer set search_path = public as $$\ndeclare v_ret record; v_eu text;\nbegin\n  select coalesce(nullif(btrim(nome), ''), email) into v_eu from profiles where id = auth.uid() and ativo;\n  if not found then raise exception 'Usuário inativo.'; end if;\n  select * into v_ret from retiradas_internas where id::text = p_retirada_id for update;\n  if not found then raise exception 'Entrega não encontrada — pode ter sido desfeita pelo almoxarifado.'; end if;\n  if v_ret.comprov_tipo is distinct from 'login' or v_ret.retirante_id is distinct from auth.uid() then\n    raise exception 'Esta entrega não está aguardando a sua confirmação.'; end if;\n  if v_ret.comprov_em is not null then return jsonb_build_object('ok', true, 'ja', true); end if;\n  update retiradas_internas set comprov_em = now(), comprov_por = auth.uid(), comprov_por_nome = v_eu\n    where id::text = p_retirada_id;\n  return jsonb_build_object('ok', true);\nend $$;\n\n-- 7) O que está esperando por mim: entregas no balcão para eu confirmar e despachos para eu receber na obra\ncreate or replace function public.comprov_minhas_pendencias()\nreturns jsonb language sql stable security definer set search_path = public as $$\n  select jsonb_build_object(\n    'confirmar', coalesce((\n      select jsonb_agg(jsonb_build_object('id', t.id::text, 'requisicao_id', t.requisicao_id, 'obra_nome', r.obra_nome,\n               'ordem_servico', r.ordem_servico, 'data_retirada', t.data_retirada, 'registrado_por_nome', t.registrado_por_nome,\n               'itens', t.itens, 'parcial', t.parcial, 'observacao', t.observacao) order by t.data_retirada)\n      from retiradas_internas t join requisicoes r on r.id = t.requisicao_id\n      where t.comprov_tipo = 'login' and t.retirante_id = auth.uid() and t.comprov_em is null), '[]'::jsonb),\n    'receber', coalesce((\n      select jsonb_agg(jsonb_build_object('requisicao_id', r.id, 'obra_nome', r.obra_nome, 'ordem_servico', r.ordem_servico,\n               'transportadora', e.transportadora, 'data_embarque', e.data_embarque,\n               'data_prevista_entrega', e.data_prevista_entrega) order by e.data_embarque)\n      from requisicoes r join embarques e on e.requisicao_id = r.id\n        join profiles p on p.id = auth.uid() and p.ativo\n      where r.status = 'embarcado' and not e.comprov_legado and e.recebido_em is null\n        and (r.solicitante_id = auth.uid()\n             or (p.papel = 'encarregado' and coalesce(to_jsonb(p.obras_vinculadas), '[]'::jsonb) ? (r.obra_id)::text))), '[]'::jsonb));\n$$;\n\n-- 8) Despacho: registra a foto do canhoto (o arquivo já foi enviado para a pasta \"comprovantes\")\ncreate or replace function public.registrar_canhoto(p_embarque_id text, p_path text)\nreturns jsonb language plpgsql security definer set search_path = public as $$\ndeclare v_emb record; v_eu text; v_papel text;\nbegin\n  select coalesce(nullif(btrim(nome), ''), email), papel into v_eu, v_papel from profiles\n    where id = auth.uid() and ativo and (papel in ('admin','encarregado') or setor = 'almoxarifado');\n  if not found then raise exception 'Seu usuário não tem permissão para anexar o canhoto.'; end if;\n  if coalesce(btrim(p_path), '') = '' then raise exception 'Arquivo não informado.'; end if;\n  select * into v_emb from embarques where id::text = p_embarque_id for update;\n  if not found then raise exception 'Despacho não encontrado.'; end if;\n  if v_emb.canhoto_path is not null and v_papel <> 'admin' then\n    raise exception 'Este despacho já tem canhoto anexado. Só o administrador pode substituir.'; end if;\n  update embarques set canhoto_path = p_path, canhoto_em = now(), canhoto_por_nome = v_eu where id::text = p_embarque_id;\n  return jsonb_build_object('ok', true);\nend $$;\n\n-- 9) Recebimento na obra: dados do despacho para a tela de recebimento\ncreate or replace function public.dados_recebimento_obra(p_requisicao_id bigint)\nreturns jsonb language plpgsql stable security definer set search_path = public as $$\ndeclare v_req record; v_pode boolean; v_opera boolean;\nbegin\n  select * into v_req from requisicoes where id = p_requisicao_id;\n  if not found then raise exception 'Requisição não encontrada.'; end if;\n  v_pode := comprov_pode_receber(p_requisicao_id);\n  select exists (select 1 from profiles p where p.id = auth.uid() and p.ativo\n                 and (p.papel in ('admin','encarregado') or p.setor in ('almoxarifado','compras'))) into v_opera;\n  if not v_pode and not v_opera then\n    raise exception 'Seu usuário não tem acesso a esta requisição (só o solicitante, o encarregado da obra ou o administrador confirmam o recebimento).'; end if;\n  return jsonb_build_object(\n    'pode', v_pode,\n    'req', jsonb_build_object('id', v_req.id, 'obra_nome', v_req.obra_nome, 'ordem_servico', v_req.ordem_servico, 'status', v_req.status),\n    'embarque', (select to_jsonb(e) || jsonb_build_object('id', e.id::text) from embarques e\n                 where e.requisicao_id = p_requisicao_id order by e.data_embarque desc nulls last limit 1),\n    'caixas', coalesce((\n      select jsonb_agg(jsonb_build_object('codigo', c.codigo, 'recebida_em', c.recebida_em, 'recebida_por_nome', c.recebida_por_nome,\n               'itens', coalesce((select jsonb_agg(jsonb_build_object('descricao', ic.descricao, 'quantidade', ic.quantidade))\n                                  from itens_caixa ic where ic.caixa_id = c.id), '[]'::jsonb)) order by c.codigo)\n      from caixas c where c.requisicao_id = p_requisicao_id), '[]'::jsonb));\nend $$;\n\n-- 10) Recebimento na obra: confirma os volumes recebidos. Quando todos chegaram, a requisição vira \"recebido\".\ncreate or replace function public.confirmar_recebimento_obra(p_requisicao_id bigint, p_codigos jsonb default null, p_obs text default null)\nreturns jsonb language plpgsql security definer set search_path = public as $$\ndeclare v_req record; v_eu text; v_n integer; v_falta integer; v_obs text;\nbegin\n  if not comprov_pode_receber(p_requisicao_id) then\n    raise exception 'Seu usuário não pode confirmar o recebimento desta requisição (só o solicitante, o encarregado da obra ou o administrador).'; end if;\n  select coalesce(nullif(btrim(nome), ''), email) into v_eu from profiles where id = auth.uid();\n  select * into v_req from requisicoes where id = p_requisicao_id for update;\n  if not found then raise exception 'Requisição não encontrada.'; end if;\n  if v_req.status = 'recebido' then return jsonb_build_object('final', true, 'ja', true); end if;\n  if v_req.status <> 'embarcado' then\n    raise exception 'A requisição está em \"%\" — só dá para confirmar o recebimento de material já embarcado.', v_req.status; end if;\n  if p_codigos is not null and jsonb_typeof(p_codigos) <> 'array' then raise exception 'Lista de volumes inválida.'; end if;\n\n  update caixas set recebida_em = now(), recebida_por_nome = v_eu\n    where requisicao_id = p_requisicao_id and recebida_em is null\n      and (p_codigos is null or codigo in (select jsonb_array_elements_text(p_codigos)));\n  get diagnostics v_n = row_count;\n  select count(*) into v_falta from caixas where requisicao_id = p_requisicao_id and recebida_em is null;\n  if v_n = 0 and v_falta > 0 then raise exception 'Nenhum volume marcado para receber.'; end if;\n\n  v_obs := nullif(btrim(coalesce(p_obs, '')), '');\n  if v_obs is not null then\n    update embarques set recebimento_obs = concat_ws(' | ', nullif(recebimento_obs, ''), v_obs || ' (' || v_eu || ')')\n      where requisicao_id = p_requisicao_id;\n  end if;\n  if v_falta = 0 then\n    update embarques set recebido_em = now(), recebido_por = auth.uid(), recebido_por_nome = v_eu\n      where requisicao_id = p_requisicao_id and recebido_em is null;\n    update requisicoes set status = 'recebido' where id = p_requisicao_id;\n  end if;\n  return jsonb_build_object('final', v_falta = 0, 'recebidos_agora', v_n, 'faltam', v_falta);\nend $$;\n\n-- 11) Desfaz o recebimento na obra (administrador ou encarregado do almoxarifado): volta para \"embarcado\"\ncreate or replace function public.desfazer_recebimento_obra(p_requisicao_id bigint)\nreturns jsonb language plpgsql security definer set search_path = public as $$\nbegin\n  if not exists (select 1 from profiles p where p.id = auth.uid() and p.ativo\n                 and (p.papel = 'admin' or (p.papel = 'encarregado' and p.setor = 'almoxarifado'))) then\n    raise exception 'Só o administrador ou o encarregado do almoxarifado desfaz o recebimento na obra.'; end if;\n  update caixas set recebida_em = null, recebida_por_nome = null where requisicao_id = p_requisicao_id;\n  update embarques set recebido_em = null, recebido_por = null, recebido_por_nome = null, recebimento_obs = null\n    where requisicao_id = p_requisicao_id;\n  update requisicoes set status = 'embarcado' where id = p_requisicao_id and status = 'recebido';\n  return jsonb_build_object('ok', true);\nend $$;\n\n-- 12) Arquivo de comprovantes: entregas do período + tudo o que ainda está pendente de comprovação\ncreate or replace function public.comprov_arquivo(p_de timestamptz, p_ate timestamptz)\nreturns jsonb language plpgsql stable security definer set search_path = public as $$\nbegin\n  if not exists (select 1 from profiles p where p.id = auth.uid() and p.ativo\n                 and (p.papel in ('admin','encarregado') or p.setor in ('almoxarifado','compras'))) then\n    raise exception 'Acesso restrito ao almoxarifado, compras e encarregados/administradores.'; end if;\n  return jsonb_build_object(\n    'balcao', coalesce((\n      select jsonb_agg((to_jsonb(t) - 'comprov_assinatura' - 'itens') || jsonb_build_object('id', t.id::text,\n               'obra_nome', r.obra_nome, 'ordem_servico', r.ordem_servico, 'req_status', r.status,\n               'mutuo', r.mutuo_empresa_destino is not null) order by t.data_retirada desc)\n      from retiradas_internas t join requisicoes r on r.id = t.requisicao_id\n      where (t.data_retirada >= p_de and t.data_retirada <= p_ate)\n         or (t.comprov_em is null and t.comprov_tipo is distinct from 'papel')), '[]'::jsonb),\n    'despachos', coalesce((\n      select jsonb_agg(to_jsonb(e) || jsonb_build_object('id', e.id::text,\n               'obra_nome', r.obra_nome, 'ordem_servico', r.ordem_servico, 'req_status', r.status,\n               'mutuo', r.mutuo_empresa_destino is not null,\n               'volumes', (select count(*) from caixas c where c.requisicao_id = e.requisicao_id),\n               'volumes_recebidos', (select count(*) from caixas c where c.requisicao_id = e.requisicao_id and c.recebida_em is not null))\n             order by e.data_embarque desc)\n      from embarques e join requisicoes r on r.id = e.requisicao_id\n      where (e.data_embarque >= p_de and e.data_embarque <= p_ate)\n         or (not e.comprov_legado and (e.canhoto_path is null or e.recebido_em is null))), '[]'::jsonb));\nend $$;\n\n-- 13) Dados completos de comprovação de uma ou mais requisições (comprovante individual e comprovante do mútuo)\ncreate or replace function public.comprov_dados(p_requisicoes jsonb)\nreturns jsonb language plpgsql stable security definer set search_path = public as $$\ndeclare v_ids bigint[];\nbegin\n  if not exists (select 1 from profiles p where p.id = auth.uid() and p.ativo\n                 and (p.papel in ('admin','encarregado') or p.setor in ('almoxarifado','compras'))) then\n    raise exception 'Acesso restrito ao almoxarifado, compras e encarregados/administradores.'; end if;\n  select coalesce(array_agg(x::bigint), '{}') into v_ids from jsonb_array_elements_text(coalesce(p_requisicoes, '[]'::jsonb)) x;\n  return jsonb_build_object(\n    'reqs', coalesce((select jsonb_agg(to_jsonb(r)) from requisicoes r where r.id = any(v_ids)), '[]'::jsonb),\n    'balcao', coalesce((select jsonb_agg(to_jsonb(t) || jsonb_build_object('id', t.id::text) order by t.data_retirada)\n                        from retiradas_internas t where t.requisicao_id = any(v_ids)), '[]'::jsonb),\n    'despachos', coalesce((select jsonb_agg(to_jsonb(e) || jsonb_build_object('id', e.id::text) order by e.data_embarque)\n                           from embarques e where e.requisicao_id = any(v_ids)), '[]'::jsonb),\n    'caixas', coalesce((select jsonb_agg(jsonb_build_object('requisicao_id', c.requisicao_id, 'codigo', c.codigo,\n                          'recebida_em', c.recebida_em, 'recebida_por_nome', c.recebida_por_nome) order by c.requisicao_id, c.codigo)\n                        from caixas c where c.requisicao_id = any(v_ids)), '[]'::jsonb));\nend $$;\n\ngrant execute on function public.comprov_pode_receber(bigint) to authenticated;\ngrant execute on function public.comprov_usuarios() to authenticated;\ngrant execute on function public.comprovar_entrega_balcao(text, text, text, uuid) to authenticated;\ngrant execute on function public.confirmar_entrega_login(text) to authenticated;\ngrant execute on function public.comprov_minhas_pendencias() to authenticated;\ngrant execute on function public.registrar_canhoto(text, text) to authenticated;\ngrant execute on function public.dados_recebimento_obra(bigint) to authenticated;\ngrant execute on function public.confirmar_recebimento_obra(bigint, jsonb, text) to authenticated;\ngrant execute on function public.desfazer_recebimento_obra(bigint) to authenticated;\ngrant execute on function public.comprov_arquivo(timestamptz, timestamptz) to authenticated;\ngrant execute on function public.comprov_dados(jsonb) to authenticated;\n";
let _comprovOk=null, _comprovPend={confirmar:[],receber:[]}, _comprovUsers=null, _gaBaseHTML='', _comprovArq=null;

/* --- O que está esperando por mim (entregas para confirmar com o meu login · despachos para receber na obra) --- */
async function refreshComprovPend(){
  if(!session||!profile||!isOnline)return;
  try{ const {data,error}=await sb.rpc('comprov_minhas_pendencias');
    if(error){ if(_comprovOk===null&&(error.code==='PGRST202'||error.code==='42883'||/schema cache|does not exist/i.test(error.message||'')))_comprovOk=false; return; }
    _comprovOk=true; _comprovPend={confirmar:(data&&data.confirmar)||[],receber:(data&&data.receber)||[]};
  }catch(e){ return; }
  renderGlobalAlerts(); }
function comprovAlertsHTML(){ if(!_comprovOk)return ''; const c=_comprovPend.confirmar.length, r=_comprovPend.receber.length; let h='';
  if(c)h+=`<div class="galert err" onclick="abrirMinhasPendencias()"><span>${c===1?'Você tem 1 entrega':'Você tem '+c+' entregas'} do almoxarifado para confirmar o recebimento.</span><span class="ga-cta">Confirmar →</span></div>`;
  if(r)h+=`<div class="galert warn" onclick="abrirMinhasPendencias()"><span>${r===1?'1 despacho a caminho':r+' despachos a caminho'} para você — confirme o recebimento quando chegar.</span><span class="ga-cta">Receber →</span></div>`;
  return h; }
function renderGlobalAlerts(){ const box=$('#globalAlerts'); if(box)box.innerHTML=comprovAlertsHTML()+_gaBaseHTML; }
setInterval(()=>{ if(_comprovOk&&session&&profile&&document.visibilityState==='visible')refreshComprovPend(); },90000);
document.addEventListener('visibilitychange',()=>{ if(document.visibilityState==='visible'&&_comprovOk&&session&&profile)refreshComprovPend(); });
async function loadComprovUsuarios(force){ if(_comprovUsers&&!force)return _comprovUsers;
  const {data,error}=await sb.rpc('comprov_usuarios'); if(!error&&Array.isArray(data))_comprovUsers=data; return _comprovUsers||[]; }

  if(c.length){ h+=`<div class="sechead" style="margin-top:10px"><h3 style="font-size:13px">🤝 Retiradas no balcão para você confirmar</h3></div>
    <p class="mp" style="font-size:12px">Confira os itens e confirme. A confirmação fica registrada com o seu usuário, data e hora. <b>Não recebeu?</b> Não confirme e procure o almoxarifado.</p>`+
    c.map(x=>`<div class="panel" style="margin-bottom:8px;padding:10px 14px"><b style="font-size:13px">${reqNum(x.requisicao_id)} — ${esc(x.obra_nome||'')}</b>${x.ordem_servico?' · OS '+esc(x.ordem_servico):''}
      <div class="muted" style="font-size:11.5px">${fmtTs(x.data_retirada)}${x.registrado_por_nome?' · entregue por '+esc(x.registrado_por_nome):''}${x.parcial?' · entrega parcial':''}</div>
      ${Array.isArray(x.itens)&&x.itens.length?`<ul style="margin:6px 0 0;padding-left:18px;font-size:12.5px">${x.itens.map(it=>`<li>${esc(it.descricao||it.code||'')} — ${numf(it.quantidade)} ${esc(it.unidade||'')}</li>`).join('')}</ul>`:''}
      ${x.observacao?`<div class="muted" style="font-size:11.5px;margin-top:4px">Obs.: ${esc(x.observacao)}</div>`:''}
      <div style="margin-top:8px"><button class="btn primary sm" onclick="confirmarEntregaLogin('${esc(String(x.id))}',this)">✔ Confirmo que recebi estes itens</button></div></div>`).join(''); }
  if(r.length){ h+=`<div class="sechead" style="margin-top:14px"><h3 style="font-size:13px">🚚 Despachos a caminho</h3></div>`+
    r.map(x=>`<div class="panel" style="margin-bottom:8px;padding:10px 14px"><b style="font-size:13px">${reqNum(x.requisicao_id)} — ${esc(x.obra_nome||'')}</b>${x.ordem_servico?' · OS '+esc(x.ordem_servico):''}
      <div class="muted" style="font-size:11.5px">Transportadora: ${esc(x.transportadora||'—')} · embarcado em ${fmtTs(x.data_embarque)}${x.data_prevista_entrega?' · previsão '+new Date(x.data_prevista_entrega+'T00:00:00').toLocaleDateString('pt-BR'):''}</div>
      <div style="margin-top:8px"><button class="btn primary sm" onclick="abrirRecebimentoObra(${Number(x.requisicao_id)})">📦 Chegou — conferir e receber</button></div></div>`).join(''); }
  if(!c.length&&!r.length)h+=`<p class="mp">Nada pendente para você no momento.</p>`;
  h+=`<div style="display:flex;justify-content:space-between;gap:10px;margin-top:14px;flex-wrap:wrap"><button class="btn ghost" onclick="lerQrRecebimento()">📷 Ler QR do volume</button><button class="btn ghost" onclick="closeModal()">Fechar</button></div>`;
  modal(h); }
async function confirmarEntregaLogin(retId,btn){ if(btn){ btn.disabled=true; btn.textContent='Confirmando...'; }
  const {error}=await sb.rpc('confirmar_entrega_login',{p_retirada_id:String(retId)});
  if(error){ toast('Não foi possível confirmar: '+esc(error.message),'err'); if(btn){ btn.disabled=false; btn.textContent='✔ Confirmo que recebi estes itens'; } return; }
  try{ await sb.rpc('log_event',{p_acao:'entrega_confirmada_login',p_entidade:'retiradas_internas',p_entidade_id:String(retId)}); }catch(e){}
  toast('Recebimento confirmado.','ok'); await refreshComprovPend();
  if(_comprovPend.confirmar.length||_comprovPend.receber.length)abrirMinhasPendencias(); else closeModal();
  refreshComprovBadge(); if(activeTab==='comprovantes')drawComprovantes(); }

/* --- Quadro de assinatura: guarda o traço como vetor (leve, nítido na impressão) --- */
const SIG_W=600, SIG_H=260, _sigPads={};
function sigPadHTML(id){ return `<canvas id="${id}" style="width:100%;aspect-ratio:${SIG_W}/${SIG_H};border:1.5px dashed #b9b2a3;border-radius:8px;background:#fff;touch-action:none;display:block;cursor:crosshair"></canvas>
  <div style="display:flex;justify-content:space-between;align-items:center;gap:8px;margin-top:4px"><span class="muted" style="font-size:11px">Quem está retirando assina com o dedo (ou o mouse) dentro do quadro.</span><button type="button" class="btn ghost sm" onclick="sigPadClear('${id}')">Limpar</button></div>`; }
function sigPadRedraw(id){ const cv=document.getElementById(id), pad=_sigPads[id]; if(!cv||!pad)return; const ctx=cv.getContext('2d'); const k=cv.width/SIG_W;
  ctx.setTransform(1,0,0,1,0,0); ctx.clearRect(0,0,cv.width,cv.height); ctx.setTransform(k,0,0,cv.height/SIG_H,0,0);
  ctx.lineWidth=3; ctx.lineCap='round'; ctx.lineJoin='round'; ctx.strokeStyle='#111';
  pad.strokes.forEach(s=>{ ctx.beginPath(); ctx.moveTo(s[0][0],s[0][1]); if(s.length===1)ctx.lineTo(s[0][0]+1,s[0][1]); for(let i=1;i<s.length;i++)ctx.lineTo(s[i][0],s[i][1]); ctx.stroke(); }); }
function sigPadFit(id){ const cv=document.getElementById(id); if(!cv)return; const r=cv.getBoundingClientRect(); if(!r.width)return; const dpr=window.devicePixelRatio||1;
  cv.width=Math.max(1,Math.round(r.width*dpr)); cv.height=Math.max(1,Math.round(r.height*dpr)); sigPadRedraw(id); }
function sigPadInit(id){ const cv=document.getElementById(id); if(!cv)return; const pad={strokes:[],cur:null}; _sigPads[id]=pad;
  const pos=e=>{ const r=cv.getBoundingClientRect(); return [Math.max(0,Math.min(SIG_W,Math.round((e.clientX-r.left)/r.width*SIG_W))),Math.max(0,Math.min(SIG_H,Math.round((e.clientY-r.top)/r.height*SIG_H)))]; };
  cv.addEventListener('pointerdown',e=>{ e.preventDefault(); try{ cv.setPointerCapture(e.pointerId); }catch(_){} pad.cur=[pos(e)]; pad.strokes.push(pad.cur); sigPadRedraw(id); });
  cv.addEventListener('pointermove',e=>{ if(!pad.cur)return; e.preventDefault(); const p=pos(e), l=pad.cur[pad.cur.length-1]; if(Math.abs(p[0]-l[0])+Math.abs(p[1]-l[1])<3)return; pad.cur.push(p); sigPadRedraw(id); });
  const fim=()=>{ pad.cur=null; }; cv.addEventListener('pointerup',fim); cv.addEventListener('pointercancel',fim);
  sigPadFit(id); }
function sigPadClear(id){ const pad=_sigPads[id]; if(pad){ pad.strokes=[]; pad.cur=null; sigPadRedraw(id); } }
/* devolve o traço pronto para gravar, ou '' se o quadro está vazio / só com um risquinho */
function sigPadData(id){ const pad=_sigPads[id]; if(!pad||!pad.strokes.length)return '';
  let strokes=pad.strokes, n=0, x0=1e9,x1=-1e9,y0=1e9,y1=-1e9;
  strokes.forEach(s=>s.forEach(p=>{ n++; if(p[0]<x0)x0=p[0]; if(p[0]>x1)x1=p[0]; if(p[1]<y0)y0=p[1]; if(p[1]>y1)y1=p[1]; }));
  if(n<8||((x1-x0)<40&&(y1-y0)<25))return '';
  const mk=ss=>ss.map(s=>'M'+s[0][0]+' '+s[0][1]+(s.length===1?'L'+(s[0][0]+1)+' '+s[0][1]:s.slice(1).map(p=>'L'+p[0]+' '+p[1]).join(''))).join('');
  let d=mk(strokes);
  while(d.length>45000){ strokes=strokes.map(s=>s.filter((p,i)=>i%2===0||i===s.length-1)); d=mk(strokes); }
  return 'v1|'+SIG_W+'|'+SIG_H+'|'+d; }
function sigSvg(val,h){ const m=/^v1\|(\d+)\|(\d+)\|([\s\S]*)$/.exec(val||''); if(!m)return '';
  return `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 ${m[1]} ${m[2]}" style="height:${h||70}px;width:auto;max-width:100%"><path d="${m[3].replace(/[^ML0-9 ]/g,'')}" fill="none" stroke="#111" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/></svg>`; }

    <div id="${pfx}SigWrap" style="margin-bottom:12px">${sigPadHTML(pfx+'Sig')}</div>

function comprovModoSet(pfx,modo){ const el=document.querySelector('input[name='+pfx+'Modo][value='+modo+']'); if(el){ el.checked=true; comprovModoChange(pfx); } }

/* --- Despacho: foto do canhoto --- */
function comprimirFoto(file,max,q){ return new Promise((res,rej)=>{ const fr=new FileReader();
  fr.onerror=()=>rej(new Error('não foi possível ler o arquivo'));
  fr.onload=e=>{ const img=new Image(); img.onerror=()=>rej(new Error('o arquivo escolhido não é uma imagem'));
    img.onload=()=>{ const k=Math.min(1,max/Math.max(img.width,img.height)); const w=Math.max(1,Math.round(img.width*k)), h=Math.max(1,Math.round(img.height*k));
      const c=document.createElement('canvas'); c.width=w; c.height=h; const ctx=c.getContext('2d'); ctx.fillStyle='#fff'; ctx.fillRect(0,0,w,h); ctx.drawImage(img,0,0,w,h);
      c.toBlob(b=>b?res(b):rej(new Error('falha ao preparar a imagem')),'image/jpeg',q); };
    img.src=e.target.result; };
  fr.readAsDataURL(file); }); }
/* devolve '' se deu certo, ou o motivo da falha */
async function enviarCanhoto(reqId,file){
  let blob; try{ blob=await comprimirFoto(file,1400,0.62); }catch(e){ return e.message; }
  const path='embarques/'+reqNum(reqId)+'/'+Date.now()+'-'+Math.random().toString(36).slice(2,8)+'.jpg';
  let up; try{ up=await sb.storage.from('comprovantes').upload(path,blob,{contentType:'image/jpeg',upsert:false}); }catch(e){ return 'envio da foto: '+((e&&e.message)||e); }
  if(up.error)return 'envio da foto: '+up.error.message;
  const {data:embs,error:eE}=await sb.from('embarques').select('id').eq('requisicao_id',reqId).order('id',{ascending:false}).limit(1);
  if(eE||!embs||!embs.length)return 'despacho não localizado para vincular a foto';
  const {error}=await sb.rpc('registrar_canhoto',{p_embarque_id:String(embs[0].id),p_path:path}); if(error)return error.message;
  try{ await sb.rpc('log_event',{p_acao:'canhoto_anexado',p_entidade:'requisicoes',p_entidade_id:String(reqId)}); }catch(e){}
  return ''; }

/* --- Recebimento na obra (QR da etiqueta do volume, aviso no topo ou "Minhas requisições") --- */
function parseRecCodigo(t){ t=String(t||'').trim(); let m=/[?&]rec=([^&#\s]+)/.exec(t); let v=t; if(m){ try{ v=decodeURIComponent(m[1]); }catch(e){ v=m[1]; } }
  m=/^(\d{1,9})(?:\.(.+))?$/.exec(v); return m?{reqId:parseInt(m[1],10),codigo:m[2]||null}:null; }
function recLinkVolume(reqId,codigo){ return location.origin+location.pathname+'?rec='+reqId+'.'+encodeURIComponent(codigo); }
function processarLinkRecebimento(){ let p=null; try{ p=new URLSearchParams(location.search).get('rec'); }catch(e){} if(!p)return;
  try{ history.replaceState(null,'',location.pathname+location.hash); }catch(e){}
  const r=parseRecCodigo(p); if(!r){ toast('O código lido não é de um volume de despacho.','err'); return; }
  abrirRecebimentoObra(r.reqId,r.codigo); }
function lerQrRecebimento(){ openCameraScanner(t=>{ const r=parseRecCodigo(t); if(!r){ toast('Este código não é de um volume de despacho.','err'); return; } abrirRecebimentoObra(r.reqId,r.codigo); }); }

/* ===== EXPEDIÇÃO (embalagem, romaneio, NF, etiquetas de volume, envio) ===== */
const EXPED_STAGES=['Separado','Romaneio','Embalado','Nota Fiscal','Etiquetas','Envio'];
function caixaStatusLabel(s){ return {em_montagem:'Em montagem',fechada:'Fechada',etiquetada:'Etiquetada',embarcada:'Embarcada',recebida:'Recebida'}[s]||s; }
function expedDoneCount(r,caixas){
  if(r.status==='embarcado'||r.status==='retirado'||r.status==='recebido')return 6;
  if(r.status==='faturado'){ const todas=caixas.length>0&&caixas.every(c=>c.status!=='em_montagem'&&c.status!=='fechada'); return todas?5:4; }
  if(r.status==='embalado')return 3;
  if(r.status==='romaneio_emitido')return 2;
  if(r.status==='separado')return 1;
  return 0;
}
function expedStepperHTML(r,caixas){

function voltarEtapa(reqId){
  const {r,caixas}=window._expedCtx;
  const map={romaneio_emitido:'separado',embalado:'romaneio_emitido',faturado:'embalado',embarcado:'faturado',retirado:'faturado',recebido:'embarcado'};
  const prev=map[r.status]; if(!prev)return;
  requireSupervisor('Voltar REQ-'+String(reqId).padStart(5,'0')+' para a etapa anterior ('+reqStatusLabel(prev)+')',async()=>{
    if(r.status==='recebido'){ /* desfaz o recebimento na obra pela função do banco (só administrador ou encarregado do almoxarifado) */
      const {error:eR}=await sb.rpc('desfazer_recebimento_obra',{p_requisicao_id:reqId});
      if(eR){ toast('Erro: '+esc(eR.message),'err'); return; }
      try{ await sb.rpc('log_event',{p_acao:'recebimento_obra_desfeito',p_entidade:'requisicoes',p_entidade_id:String(reqId)}); }catch(e){}
      toast('Recebimento na obra desfeito — voltou para Embarcado.','warn');
      await abrirExpedicao(reqId); refreshComprovPend(); refreshComprovBadge(); if(activeTab==='comprovantes')drawComprovantes(); return; }
    if(r.status==='faturado'){
      const {nf}=window._expedCtx; if(nf) await sb.from('notas_fiscais_saida').update({status:'cancelada'}).eq('id',nf.id);
      const etiquetadas=caixas.filter(c=>c.status==='etiquetada'); if(etiquetadas.length) await sb.from('caixas').update({status:'fechada'}).in('id',etiquetadas.map(c=>c.id));
    } else if(r.status==='embarcado'){ const {emb}=window._expedCtx; if(emb) await sb.from('embarques').delete().eq('id',emb.id); }
    else if(r.status==='retirado'){ const {ret}=window._expedCtx;
      if(ret&&Array.isArray(ret.itens)&&ret.itens.length){ /* entrega registrada com itens: desfaz pela função do banco (devolve as quantidades e a etapa anterior) */
        const {error:eE}=await sb.rpc('estornar_entrega_balcao',{p_retirada_id:String(ret.id)});
        if(eE){ toast('Erro: '+eE.message,'err'); return; }
        toast('Última entrega desfeita — os itens voltaram a aguardar retirada.','warn');
        await abrirExpedicao(reqId); entregaRefreshTelas(); return; }
      if(ret) await sb.from('retiradas_internas').delete().eq('id',ret.id); }
    else if(r.status==='embalado'){
      const fechadas=caixas.filter(c=>c.status==='fechada'); if(fechadas.length) await sb.from('caixas').update({status:'em_montagem',data_fechamento:null}).in('id',fechadas.map(c=>c.id));
    }
    const {error}=await updReq(reqId,{status:prev});
    if(error){toast('Erro: '+error.message,'err');return;}
    toast('Voltou para: '+reqStatusLabel(prev),'warn');
    await abrirExpedicao(reqId); drawExpedicaoList(); refreshExpedBadge(); refreshRetiradasBadge(); drawSeparacaoList(); refreshSeparacaoBadge();
  });
}

const STATUS_AINDA_NAO_SAIU=['em_separacao','aguardando_compra','separado','embalado','romaneio_emitido','faturado'];

   certo volume os pendentes mais recentes ficavam de fora e o relatório/tela aparecia vazio.

function fetchItensAguardandoRetirada(itemCols,reqCols){

function notifBeep(freq,dur,delay,vol){ if(!_notifAudioCtx)return; const t0=_notifAudioCtx.currentTime+(delay||0);
  const osc=_notifAudioCtx.createOscillator(); const gain=_notifAudioCtx.createGain();

  gain.gain.setValueAtTime(0,t0); gain.gain.linearRampToValueAtTime(vol||0.35,t0+0.02); gain.gain.linearRampToValueAtTime(0,t0+dur);
  osc.connect(gain); gain.connect(_notifAudioCtx.destination); osc.start(t0); osc.stop(t0+dur+0.02); }

function checkTrEmpresa(){ const box=$('#trEmpresaWarn'); if(!box)return;
