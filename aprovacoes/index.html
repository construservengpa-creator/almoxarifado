        : n === 'InvalidStateError' || n === 'SecurityError' || n === 'sem-chave' ? 'A chave deste aparelho não foi encontrada. Entre com email e senha.'
        : n === 'senha-recusada' ? 'A senha guardada não foi aceita (pode ter mudado). Entre com email e senha uma vez; depois a digital volta a funcionar.'
        : n === 'sem-rede' ? 'Sem conexão com o servidor. Verifique a internet e tente de novo.'
        : 'Não foi possível confirmar. Tente de novo ou entre com email e senha.');
    });
  }

  function usarSenha() {
    if (modo === 'trava') {
      chavesSessao().forEach(function (s) { gravar(localStorage, s.chave, null); });
      gravar(sessionStorage, CHAVE_OK, null);
      gravar(sessionStorage, CHAVE_PULAR, PROJETO);
      location.reload();
      return;
    }
    gravar(sessionStorage, CHAVE_PULAR, PROJETO);
    fechar();
  }

  /* Botão flutuante na tela de login do app. Sem ativação ainda, explica o primeiro passo. */
  var pilula = null, temLeitor = false;
  function mostrarPilula() {
    if (pilula || trava || oferta || !document.body || logado() || !temLeitor || !PROJETO || !SESSOES.length) return;
    estilo();
    pilula = document.createElement('button');
    pilula.type = 'button'; pilula.id = 'cbio-pilula';
    pilula.innerHTML = ICONE + '<span>Entrar com digital, rosto ou PIN</span>';
    pilula.addEventListener('click', function () {
      gravar(sessionStorage, CHAVE_PULAR, null);
      if (podeEntrar()) abrir('entrar', false); else abrir('ativar', false);
    });
    document.body.appendChild(pilula);
  }
  function fecharPilula() { if (pilula) { pilula.remove(); pilula = null; } }

  /* ---------- ativar / desativar ---------- */
  function ativar() {
    if (!suportado) return Promise.reject(new Error('nao-suportado'));
    var s = chavesSessao()[0] || chavesSessao(true)[0];
    var email = (s && s.email) || (pendente && pendente.corpo.email) || 'usuario';
    var cred, prfSaida = null, prfOk = false;
    return navigator.credentials.create({ publicKey: {
      challenge: aleatorio(32),
      rp: { name: 'Capivara' },
      user: { id: aleatorio(16), name: email, displayName: email },
      pubKeyCredParams: [{ type: 'public-key', alg: -7 }, { type: 'public-key', alg: -257 }],
      authenticatorSelection: { authenticatorAttachment: 'platform', userVerification: 'required', residentKey: 'discouraged' },
      attestation: 'none',
      timeout: 60000,
      extensions: { prf: { eval: { first: SAL } } }
    } }).then(function (c) {
      cred = c;
      var ext = (c.getClientExtensionResults && c.getClientExtensionResults()) || {};
      prfOk = !!(ext.prf && ext.prf.enabled);
      if (ext.prf && ext.prf.results && ext.prf.results.first) { prfSaida = ext.prf.results.first; prfOk = true; return; }
      if (!prfOk) return;
      // alguns aparelhos só entregam a chave do cofre num segundo toque
      return navigator.credentials.get({ publicKey: {
        challenge: aleatorio(32),
        allowCredentials: [{ type: 'public-key', id: cred.rawId, transports: ['internal'] }],
        userVerification: 'required', timeout: 60000,
        extensions: { prf: { eval: { first: SAL } } }
      } }).then(function (a) {
        var e2 = (a.getClientExtensionResults && a.getClientExtensionResults()) || {};
        if (e2.prf && e2.prf.results && e2.prf.results.first) prfSaida = e2.prf.results.first; else prfOk = false;
      }, function () { prfOk = false; });
    }).then(function () {
      return SUB.generateKey({ name: 'RSA-OAEP', modulusLength: 2048, publicExponent: new Uint8Array([1, 0, 1]), hash: 'SHA-256' },
        prfOk, ['encrypt', 'decrypt']);
    }).then(function (par) {
      var nova = { v: 2, id: b64u(cred.rawId), email: email, criado: new Date().toISOString(), prf: prfOk };
      return SUB.exportKey('spki', par.publicKey).then(function (spki) {
        nova.pub = b64u(spki);
        if (prfOk) {
          var iv = aleatorio(12);
          return SUB.exportKey('pkcs8', par.privateKey).then(function (pk) {
            return chaveDoPrf(prfSaida).then(function (k) { return SUB.encrypt({ name: 'AES-GCM', iv: iv }, k, pk); });
          }).then(function (ct) {
            nova.priv = { iv: b64u(iv), ct: b64u(ct) };
            return idb('readwrite', function (st) { return st.delete('priv'); }).catch(function () {});
          });
        }
        return idb('readwrite', function (st) { return st.put(par.privateKey, 'priv'); });
      }).then(function () {
        gravar(localStorage, CHAVE, JSON.stringify(nova));
        gravar(localStorage, CHAVE_COFRE, null);   // o cofre antigo era de outra chave
        gravar(localStorage, CHAVE_RECUSA, null);
        marcarOk();
        return guardar(pendente).catch(function () {});
      });
    }).then(function () { avisar(); return true; });
  }

  /* Desligar com sessão aberta exige a digital/rosto (senão bastaria desligar para passar a trava). */
  function desativar() {
    var fim = function () {
      gravar(localStorage, CHAVE, null); gravar(localStorage, CHAVE_COFRE, null);
      return idb('readwrite', function (st) { return st.delete('priv'); }).catch(function () {})
        .then(function () { fecharPilula(); avisar(); return true; });
    };
    if (!config()) return Promise.resolve(true);
    if (!chavesSessao(true).length) return fim();
    return verificar().then(fim);
  }

  function avisar() { try { window.dispatchEvent(new CustomEvent('capivara-biometria', { detail: { ativo: !!config() } })); } catch (e) {} }

  /* ---------- oferta depois do login ---------- */
  var oferta = null;
  function oferecer() {
    if (oferta || trava || completo(config()) || !logado()) return;
    var recusa = +ler(localStorage, CHAVE_RECUSA) || 0;
    if (Date.now() - recusa < REOFERTA && ler(sessionStorage, CHAVE_QUER) !== '1') return;
    PublicKeyCredential.isUserVerifyingPlatformAuthenticatorAvailable().then(function (tem) {
      if (!tem || oferta || trava || completo(config()) || !logado() || !document.body) return;
      estilo();
      oferta = document.createElement('div');
      oferta.id = 'cbio-oferta'; oferta.setAttribute('role', 'dialog'); oferta.setAttribute('aria-label', 'Entrar com digital, rosto ou PIN');
      oferta.innerHTML = '<b>Entrar com digital, rosto ou PIN?</b>' +
        '<span>Neste aparelho, os apps do Capivara passam a entrar com sua digital, rosto ou PIN do aparelho, sem digitar email e senha.</span>' +
        '<div class="cbio-acoes"><button type="button" class="cbio-btn cbio-sec">Agora não</button>' +
        '<button type="button" class="cbio-btn cbio-pri">Ativar</button></div>';
      oferta.querySelector('.cbio-sec').addEventListener('click', function () {
        gravar(localStorage, CHAVE_RECUSA, String(Date.now())); gravar(sessionStorage, CHAVE_QUER, null); fecharOferta();
      });
      oferta.querySelector('.cbio-pri').addEventListener('click', function () {
        var b = this; b.disabled = true; b.textContent = 'Aguarde…';
        ativar().then(function () { gravar(sessionStorage, CHAVE_QUER, null); fecharOferta(); }).catch(function () { b.disabled = false; b.textContent = 'Tentar de novo'; });
      });
      document.body.appendChild(oferta);
    }).catch(function () {});
  }
  function fecharOferta() { if (oferta) { oferta.remove(); oferta = null; } }

  window.CapivaraBiometria = {
    suportado: suportado,
    ativo: function () { return !!config(); },
    entraSemSenha: function () { return completo(config()); },
    ativar: ativar,
    desativar: desativar,
    bloquear: function () { gravar(sessionStorage, CHAVE_OK, null); abrir('trava', true); },
    entrar: function () { gravar(sessionStorage, CHAVE_PULAR, null); abrir('entrar', false); },
    disponivel: function () { return suportado ? PublicKeyCredential.isUserVerifyingPlatformAuthenticatorAvailable().catch(function () { return false; }) : Promise.resolve(false); }
  };
  if (!suportado) return;
  PublicKeyCredential.isUserVerifyingPlatformAuthenticatorAvailable().then(function (v) { temLeitor = !!v; mostrarPilula(); }, function () {});

  /* ---------- ciclo ---------- */
  var tinhaSessao = logado();
  if (tinhaSessao && config() && !okRecente()) abrir('trava', true);
  else if (tinhaSessao) marcarOk();
  else if (podeEntrar() && !pulado()) abrir('entrar', true);

  var escondidoEm = 0;
  document.addEventListener('visibilitychange', function () {
    if (document.visibilityState === 'hidden') {
      if (!trava) marcarOk();
      escondidoEm = Date.now();
    } else if (escondidoEm && Date.now() - escondidoEm >= PRAZO) {
      abrir('trava', true);
    }
  });
  window.addEventListener('pagehide', function () { if (!trava) marcarOk(); });

  setInterval(function () {
    var agora = logado();
    if (agora && !tinhaSessao) { marcarOk(); gravar(sessionStorage, CHAVE_PULAR, null); } // acabou de entrar nesta aba
    if (agora) fecharPilula();
    else { fecharOferta(); if (modo === 'trava') fechar(); }
    if (agora && (modo === 'entrar' || modo === 'ativar')) fechar();
    tinhaSessao = agora;
    if (!trava && agora && document.visibilityState === 'visible') marcarOk();
    oferecer();
    mostrarPilula();
  }, 1500);
  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', function () { setTimeout(oferecer, 1500); });
  else setTimeout(oferecer, 1500);
})();

<script>
/* Tela de abertura Capivara: sai com fade depois de um tempo mínimo (para a
   animação não "piscar"). Por padrão sai quando a página termina de carregar;
   com data-manual="1" a própria aplicação chama capivaraFecharAbertura().
   Clique pula; após 8 s sai de qualquer jeito, para nunca prender a tela. */
(function(){
  var inicio = Date.now(), MINIMO = 1600;
  window.capivaraFecharAbertura = function(imediato){
    var el = document.getElementById('capAbertura');
    if (!el || el.classList.contains('saindo')) return;
    setTimeout(function(){
      el.classList.add('saindo');
      setTimeout(function(){ if (el.parentNode) el.parentNode.removeChild(el); }, 600);
    }, imediato ? 0 : Math.max(0, MINIMO - (Date.now() - inicio)));
  };
  var el = document.getElementById('capAbertura');
  if (!el) return;
  el.addEventListener('click', function(){ window.capivaraFecharAbertura(true); });
  setTimeout(function(){ window.capivaraFecharAbertura(true); }, 8000);
  if (!el.hasAttribute('data-manual')) {
    if (document.readyState === 'complete') window.capivaraFecharAbertura();
    else window.addEventListener('load', function(){ window.capivaraFecharAbertura(); });
  }
})();
</script>

<script>
/* App de celular para aprovar/rejeitar requisições de material.
   Mesmas regras da tela Aprovações do sistema (index.html → aprovarRequisicao / rejeitarRequisicao):
   - quem aprova: admin e encarregados; encarregado só das obras vinculadas a ele (admin e encarregado do
     almoxarifado aprovam de qualquer obra);
   - ao aprovar, confere o saldo item a item na obra de onde o material sai (no mútuo, a obra de estoque),
     descontando o que está bloqueado por devolução em aberto; o que faltar vira compra pendente e a
     requisição vai para "aguardando compra" — senão vai direto para separação. */
const SUPABASE_URL='https://qjmqburjyqlgwjihvlgp.supabase.co';
const SUPABASE_ANON_KEY='eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InFqbXFidXJqeXFsZ3dqaWh2bGdwIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODg4NzU0NzIsImV4cCI6MjEwNDQ1MTQ3Mn0.cOdmVw3W0HCilACqZIVFMCwsr6zxA0g_3CreKIuk9kw';
const sb=window.supabase.createClient(SUPABASE_URL,SUPABASE_ANON_KEY);

const $=s=>document.querySelector(s);
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const numf=n=>(Number(n)||0).toLocaleString('pt-BR',{maximumFractionDigits:3});
const reqN=id=>'REQ-'+String(id).padStart(5,'0');
const quando=iso=>{ if(!iso)return''; const d=new Date(iso); return d.toLocaleDateString('pt-BR',{day:'2-digit',month:'2-digit'})+' '+d.toLocaleTimeString('pt-BR',{hour:'2-digit',minute:'2-digit'}); };
function toast(msg,tipo='ok'){ const t=document.createElement('div'); t.className='toast '+tipo; t.textContent=msg; document.body.appendChild(t); setTimeout(()=>t.remove(),3600); }

let user=null, profile=null, aba='pend', pendentes=[], canal=null;

/* ---------- permissões (iguais às do sistema) ---------- */
const isAdmin=()=>!!profile&&profile.papel==='admin'&&profile.ativo;
/* quem aprova: marcação "Aprova requisições" de Administração → Usuários (state.config.aprovadores no app_kv);
   sem marcação vale o papel — admin e encarregado aprovam. Admin sempre aprova. */
let aprovadores={};
const podeAprovar=()=>!!profile&&profile.ativo&&(profile.papel==='admin'||(Object.prototype.hasOwnProperty.call(aprovadores,profile.id)?!!aprovadores[profile.id]:profile.papel==='encarregado'));
const isEncAlmox=()=>!!profile&&profile.papel==='encarregado'&&profile.setor==='almoxarifado'&&profile.ativo;
const veTodas=()=>podeAprovar()&&(isAdmin()||isEncAlmox());
const vinculadas=()=>Array.isArray(profile&&profile.obras_vinculadas)?profile.obras_vinculadas:[];
const podeAprovarObra=obraId=>veTodas()||(podeAprovar()&&vinculadas().includes(obraId));
const obraEstoque=r=>r.mutuo_estoque_obra_id?r.mutuo_estoque_obra_id:r.obra_id;
/* retornar para aprovação: somente encarregado (supervisor) e administrador — igual ao sistema */
const isEncarregado=()=>!!profile&&profile.ativo&&(profile.papel==='admin'||profile.papel==='encarregado');
const RET_APROV=['em_separacao','aguardando_compra','separado'];
const podeRetornar=r=>isEncarregado()&&!!r&&RET_APROV.includes(r.status)&&!r.tipo_envio;

/* ---------- login ---------- */
async function carregarPerfil(){
  const {data,error}=await sb.from('profiles').select('id,nome,email,papel,ativo,setor,obras_vinculadas').eq('id',user.id).maybeSingle();
  if(error)throw new Error('Não foi possível carregar o seu perfil: '+error.message);
  if(!data)throw new Error('Usuário sem cadastro no sistema de estoque — peça ao administrador.');
  if(!data.ativo)throw new Error('Seu usuário ainda não foi liberado pelo administrador.');
  const {data:kv,error:e2}=await sb.from('app_kv').select('aprov:value->config->aprovadores').eq('key','controle-estoque-obras-v1').maybeSingle();
  if(e2)throw new Error('Não foi possível conferir a sua permissão de aprovação: '+e2.message);
  aprovadores=(kv&&kv.aprov&&typeof kv.aprov==='object')?kv.aprov:{};
  profile=data;
  if(!podeAprovar()){ profile=null; throw new Error('Seu usuário não está marcado para aprovar requisições. Peça ao administrador: Administração → Usuários → "Aprova requisições".'); }
}
async function iniciar(){
  const {data}=await sb.auth.getSession();
  if(!data.session){ mostrarLogin(); return; }
  user=data.session.user;
  try{ await carregarPerfil(); }catch(e){ await sb.auth.signOut({scope:'local'}).catch(()=>{}); mostrarLogin(e.message); return; }
  mostrarApp();
}
function mostrarLogin(msg){ $('#vApp').hidden=true; $('#vLogin').hidden=false; $('#lgErr').textContent=msg||''; if(canal){ sb.removeChannel(canal); canal=null; } }
$('#fLogin').addEventListener('submit',async ev=>{
  ev.preventDefault(); const b=$('#lgBtn'); b.disabled=true; $('#lgErr').textContent='';
  try{
    const {data,error}=await sb.auth.signInWithPassword({email:$('#lgE').value.trim().toLowerCase(),password:$('#lgS').value});
    if(error){ const m=String(error.message||'');
      throw new Error(/invalid login credentials/i.test(m)?'E-mail ou senha inválidos.':/email not confirmed/i.test(m)?'O e-mail deste usuário ainda não foi confirmado.':/fetch|network/i.test(m)?'Sem conexão com o servidor. Verifique a internet.':'Não foi possível entrar: '+m); }
    user=data.user; await carregarPerfil(); mostrarApp();
  }catch(e){ await sb.auth.signOut({scope:'local'}).catch(()=>{}); $('#lgErr').textContent=e.message; }
  finally{ b.disabled=false; }
});
$('#bSair').onclick=async()=>{ await sb.auth.signOut({scope:'local'}); user=null; profile=null; mostrarLogin(); };

/* ---------- app ---------- */
function mostrarApp(){
  $('#vLogin').hidden=true; $('#vApp').hidden=false;
  $('#who').textContent=(profile.nome||profile.email)+(isAdmin()?' · Admin':isEncAlmox()?' · Encarregado do almoxarifado':profile.papel==='encarregado'?' · Encarregado':' · Aprovador');
  $('#escopo').textContent=veTodas()?'Requisições de todas as obras.':(vinculadas().length?'Somente das obras (centros de custo) vinculadas a você.':'Você ainda não tem obra vinculada — peça ao administrador.');
  if(!canal){
    /* Só recarrega quando a mudança interessa a esta tela: requisição pendente (nova ou alterada) ou uma das que estão
       na lista saindo de pendente. Antes recarregava (requisições + saldos) a cada separação, embalagem, expedição etc.
       de qualquer requisição do sistema. */
    canal=sb.channel('app_aprovacoes').on('postgres_changes',{event:'*',schema:'public',table:'requisicoes'},pl=>{
      const n=pl.new||{}, o=pl.old||{}, id=n.id??o.id;
      const interessa=n.status==='pendente'||pendentes.some(r=>r.id===id)||(aba==='hist'&&n.decidido_em);
      if(!interessa)return;
      clearTimeout(window._rt); window._rt=setTimeout(atualizar,600); }).subscribe();
  }
  atualizar();
}
$('#tPend').onclick=()=>{ aba='pend'; $('#tPend').classList.add('on'); $('#tHist').classList.remove('on'); atualizar(); };
$('#tHist').onclick=()=>{ aba='hist'; $('#tHist').classList.add('on'); $('#tPend').classList.remove('on'); atualizar(); };
$('#bRefresh').onclick=()=>{ atualizar(); toast('Atualizado.'); };
/* ao voltar para o app: atualiza, mas não mais de uma vez a cada 20 s (o tempo real já mantém a lista em dia) */
let _ultAtual=0;
document.addEventListener('visibilitychange',()=>{ if(!document.hidden&&profile&&Date.now()-_ultAtual>20000)atualizar(); });

function filtroObras(q){ if(veTodas())return q; const v=vinculadas(); return v.length?q.in('obra_id',v):null; }

let _atualizando=null, _deNovo=false;
async function atualizar(){
  if(!profile)return;
  if(_atualizando){ _deNovo=true; return _atualizando; }   /* chamadas em sequência viram uma só rodada a mais */
  _atualizando=(async()=>{ do{ _deNovo=false; _ultAtual=Date.now(); await _atualizar(); }while(_deNovo); })();
  try{ await _atualizando; } finally{ _atualizando=null; }
}
async function _atualizar(){
  if(aba==='pend')await desenharPendentes(); else await desenharHistorico();
}

/* Prefixo (placa/tag) do equipamento: vem do cadastro de Aplicações, que fica no documento compartilhado (app_kv).
   Busca só o array de aplicações (não o documento inteiro) e guarda por 5 min. */
const STATE_KEY='controle-estoque-obras-v1'; let _tags=null, _tagsTs=0;
async function tagsAplicacoes(){
  if(_tags&&Date.now()-_tagsTs<300000)return _tags;
  try{ const {data,error}=await sb.from('app_kv').select('aplicacoes:value->aplicacoes').eq('key',STATE_KEY).maybeSingle(); if(error)throw error;
    const m={}; ((data&&data.aplicacoes)||[]).forEach(a=>{ if(a&&a.id&&a.tag)m[a.id]=String(a.tag); }); _tags=m; _tagsTs=Date.now();
  }catch(e){ console.warn('tagsAplicacoes',e); if(!_tags)_tags={}; }
  return _tags;
}
function equipHTML(r,tags,vazio){ const t=r.aplicacao_id&&tags[r.aplicacao_id];
  return t?'⚙ Prefixo <b class="pref">'+esc(t)+'</b> · '+esc(r.aplicacao_nome||''):esc(r.aplicacao_nome||vazio); }

/* saldo disponível = saldo da obra − bloqueado por devolução ao fornecedor em aberto */
async function saldosPara(reqs){
  const obras=[...new Set(reqs.map(obraEstoque))]; const codes=[...new Set(reqs.flatMap(r=>(r.itens||[]).map(i=>String(i.code))))];
  const saldo={};
  if(!obras.length||!codes.length)return saldo;
  const [s,d]=await Promise.all([
    sb.from('saldos_estoque').select('obra_id,code,saldo').in('obra_id',obras).in('code',codes),
    sb.from('devolucoes').select('obra_id,itens').in('status',['aguardando_nota','em_envio']).in('obra_id',obras)
  ]);
  if(s.error)throw s.error;
  (s.data||[]).forEach(x=>{ saldo[x.obra_id+'|'+x.code]=Number(x.saldo)||0; });
  (d.data||[]).forEach(dv=>(dv.itens||[]).forEach(it=>{ const k=dv.obra_id+'|'+it.code; if(k in saldo)saldo[k]-=Number(it.qty)||0; }));
  Object.keys(saldo).forEach(k=>{ if(saldo[k]<0)saldo[k]=0; });
  return saldo;
}

async function desenharPendentes(){
  const box=$('#lista');
  let q=filtroObras(sb.from('requisicoes').select('id,obra_id,obra_nome,ordem_servico,aplicacao_id,aplicacao_nome,solicitante_nome,observacao,itens,criado_em,status,mutuo_estoque_obra_id').eq('status','pendente').order('criado_em',{ascending:true}));
  if(!q){ pendentes=[]; contar(); box.innerHTML='<div class="empty"><b>Nenhuma obra vinculada</b>Peça ao administrador para vincular suas obras.</div>'; return; }
  const [{data,error},tags]=await Promise.all([q,tagsAplicacoes()]);
  if(error){ box.innerHTML='<div class="empty"><b>Erro ao carregar</b>'+esc(error.message)+'</div>'; return; }
  pendentes=data||[]; contar();
  if(!pendentes.length){ box.innerHTML='<div class="empty"><b>Tudo em dia ✓</b>Nenhuma requisição aguardando aprovação.</div>'; return; }
  let saldo={}; try{ saldo=await saldosPara(pendentes); }catch(e){ toast('Não foi possível conferir o saldo agora.','warn'); }
  box.innerHTML=pendentes.map(r=>{
    const ob=obraEstoque(r);
    const itens=(r.itens||[]).map(i=>{ const disp=saldo[ob+'|'+i.code]; const falta=disp!=null?Math.max((Number(i.qty)||0)-disp,0):null;
      return `<li><span>${esc(i.desc||i.code)}</span><span class="q">${numf(i.qty)} ${esc(i.unit||'')}${disp==null?'<small>saldo —</small>':falta>0?`<small class="falta">falta ${numf(falta)} · disp. ${numf(disp)}</small>`:`<small>disp. ${numf(disp)}</small>`}</span></li>`; }).join('');
    const nFalta=(r.itens||[]).filter(i=>{ const disp=saldo[ob+'|'+i.code]; return disp!=null&&(Number(i.qty)||0)>disp; }).length;
    return `<article class="card" id="r${r.id}">
      <div class="card-hd"><span class="req">${reqN(r.id)}</span><span class="when">${quando(r.criado_em)}</span></div>
      <div class="obra">${esc(r.obra_nome)}</div>
      <div class="meta">${r.ordem_servico?'OS <b>'+esc(r.ordem_servico)+'</b> · ':''}${equipHTML(r,tags,'Sem aplicação')}</div>
      <div class="meta">Solicitante: <b>${esc(r.solicitante_nome||'—')}</b></div>
      ${r.mutuo_estoque_obra_id?`<span class="tag mutuo">💱 Mútuo — sai do estoque de outra empresa</span>`:''}
      ${nFalta?`<span class="tag falta">${nFalta} item(ns) sem saldo suficiente → vira compra</span>`:'<span class="tag ok">Saldo suficiente</span>'}
      ${r.observacao?`<div class="obs">${esc(r.observacao)}</div>`:''}
      <ul class="itens">${itens}</ul>
      ${podeAprovarObra(r.obra_id)?`<div class="acts"><button class="btn no" onclick="rejeitar(${r.id})">Rejeitar</button><button class="btn ok" onclick="aprovar(${r.id},this)">Aprovar</button></div>`:'<div class="meta" style="margin-top:10px">Você não está vinculado a esta obra.</div>'}
    </article>`; }).join('');
}
function contar(){ const n=pendentes.length, b=$('#nPend'); b.hidden=!n; b.textContent=n; document.title=(n?'('+n+') ':'')+'Aprovações · AMETA';
  try{ if(navigator.setAppBadge){ n?navigator.setAppBadge(n):navigator.clearAppBadge(); } }catch(e){} }

async function desenharHistorico(){
  const box=$('#lista');
  let q=filtroObras(sb.from('requisicoes').select('id,obra_nome,ordem_servico,aplicacao_id,aplicacao_nome,solicitante_nome,status,tipo_envio,decidido_por_nome,decidido_em,motivo_rejeicao').neq('status','pendente').not('decidido_em','is',null).order('decidido_em',{ascending:false}).limit(30));
  if(!q){ box.innerHTML='<div class="empty"><b>Nenhuma obra vinculada</b></div>'; return; }
  const [{data,error},tags]=await Promise.all([q,tagsAplicacoes()]);
  if(error){ box.innerHTML='<div class="empty"><b>Erro ao carregar</b>'+esc(error.message)+'</div>'; return; }
  if(!(data||[]).length){ box.innerHTML='<div class="empty"><b>Nada por aqui</b>Nenhuma requisição decidida ainda.</div>'; return; }
  box.innerHTML=data.map(r=>`<article class="card">
      <div class="card-hd"><span class="req">${reqN(r.id)}</span><span class="when">${quando(r.decidido_em)}</span></div>
      <div class="obra">${esc(r.obra_nome)}</div>
      <div class="meta">${r.ordem_servico?'OS <b>'+esc(r.ordem_servico)+'</b> · ':''}${equipHTML(r,tags,'')} · ${esc(r.solicitante_nome||'')}</div>
      <span class="tag ${r.status==='rejeitada'?'rej':r.status==='cancelada'?'falta':'ok'}">${r.status==='rejeitada'?'Rejeitada':r.status==='cancelada'?'Cancelada':'Aprovada'}</span>
      <div class="meta" style="margin-top:6px">por ${esc(r.decidido_por_nome||'—')}</div>
      ${r.motivo_rejeicao?`<div class="obs">${esc(r.motivo_rejeicao)}</div>`:''}
      ${podeRetornar(r)?`<div class="acts"><button class="btn ghost" onclick="retornar(${r.id})">↩ Retornar para aprovação</button></div>`:''}
    </article>`).join('');
}

/* ---------- aprovar (mesma lógica de aprovarRequisicao do sistema) ---------- */
async function aprovar(id,btn){
  btn.disabled=true; btn.textContent='Aprovando…';
  try{
    const {data:r,error:e1}=await sb.from('requisicoes').select('id,obra_id,obra_nome,ordem_servico,aplicacao_nome,solicitante_nome,observacao,itens,criado_em,status,mutuo_estoque_obra_id').eq('id',id).maybeSingle();
    if(e1||!r)throw new Error('Requisição não encontrada.');
    if(r.status!=='pendente'){ toast(reqN(id)+' já foi decidida por outra pessoa.','warn'); atualizar(); return; }
    if(!podeAprovarObra(r.obra_id))throw new Error('Você não está vinculado à obra desta requisição.');
    const ob=obraEstoque(r); const saldo=await saldosPara([r]);
    const avaliados=(r.itens||[]).map(i=>{ const disponivel=Math.max(Math.min(saldo[ob+'|'+i.code]||0,Number(i.qty)||0),0);
      return {code:i.code,desc:i.desc,unit:i.unit||'',qty:Number(i.qty)||0,disponivel,faltante:Math.max((Number(i.qty)||0)-disponivel,0)}; });
    const {error:e2}=await sb.from('requisicao_itens_status').upsert(avaliados.map(i=>({requisicao_id:r.id,code:i.code,descricao:i.desc,unidade:i.unit,
      quantidade_solicitada:i.qty,quantidade_disponivel:i.disponivel,status:i.faltante>0?'faltante':'disponivel'})),{onConflict:'requisicao_id,code'});
    if(e2)throw new Error('Erro ao gravar a verificação de estoque: '+e2.message);
    const faltantes=avaliados.filter(i=>i.faltante>0);
    /* compras ainda abertas desta requisição (ex.: solicitadas no Sienge antes de ela voltar para aprovação): entram só pela diferença */
    const jaEmCompra={};
    if(faltantes.length){ const {data:abertas}=await sb.from('compras_pendentes').select('code,quantidade').eq('requisicao_id',r.id).in('status',['pendente','solicitada']);
      (abertas||[]).forEach(c=>{ jaEmCompra[String(c.code)]=(jaEmCompra[String(c.code)]||0)+(Number(c.quantidade)||0); }); }
    const rowsCompra=faltantes.map(i=>({requisicao_id:r.id,code:i.code,descricao:i.desc,quantidade:i.faltante-(jaEmCompra[String(i.code)]||0),status:'pendente'})).filter(x=>x.quantidade>0.0001);
    if(rowsCompra.length){
      const {error:e3}=await sb.from('compras_pendentes').insert(rowsCompra);
      if(e3)throw new Error('Verificação salva, mas houve erro ao gerar a compra pendente: '+e3.message);
    }
    const {data:upd,error:e4}=await sb.from('requisicoes').update({status:faltantes.length?'aguardando_compra':'em_separacao',decidido_por:user.id,decidido_por_nome:profile.nome||profile.email,decidido_em:new Date().toISOString()})
      .eq('id',id).eq('status','pendente').select('id');
    if(e4)throw new Error('Erro ao atualizar a requisição: '+e4.message);
    if(!upd||!upd.length)throw new Error('A aprovação não foi gravada — a requisição mudou ou seu usuário não tem permissão.');
    toast(faltantes.length?reqN(id)+' aprovada — faltantes enviados para compras.':reqN(id)+' aprovada — pronta para separação.','ok');
  }catch(e){ toast(e.message,'err'); }
  atualizar();
}

/* ---------- rejeitar ---------- */
function rejeitar(id){
  const bg=document.createElement('div'); bg.className='sheet-bg';
  bg.innerHTML=`<div class="sheet"><h3>Rejeitar ${reqN(id)}</h3><p>Informe o motivo — o solicitante vai ver.</p>
    <textarea class="f" id="rjM" placeholder="Motivo da rejeição"></textarea><div class="err" id="rjErr"></div>
    <div class="acts"><button class="btn ghost" id="rjC">Cancelar</button><button class="btn no" id="rjOk">Rejeitar</button></div></div>`;
  document.body.appendChild(bg); setTimeout(()=>$('#rjM').focus(),50);
  const fechar=()=>bg.remove();
  bg.addEventListener('click',ev=>{ if(ev.target===bg)fechar(); });
  $('#rjC').onclick=fechar;
  $('#rjOk').onclick=async()=>{
    const motivo=$('#rjM').value.trim(); if(!motivo){ $('#rjErr').textContent='Informe o motivo.'; return; }
    $('#rjOk').disabled=true;
    const {data:r}=await sb.from('requisicoes').select('obra_id,status').eq('id',id).maybeSingle();
    if(!r||r.status!=='pendente'){ fechar(); toast(reqN(id)+' já foi decidida por outra pessoa.','warn'); atualizar(); return; }
    if(!podeAprovarObra(r.obra_id)){ $('#rjErr').textContent='Você não está vinculado à obra desta requisição.'; $('#rjOk').disabled=false; return; }
    const {data:upd,error}=await sb.from('requisicoes').update({status:'rejeitada',motivo_rejeicao:motivo,decidido_por:user.id,decidido_por_nome:profile.nome||profile.email,decidido_em:new Date().toISOString()})
      .eq('id',id).eq('status','pendente').select('id');
    if(error||!upd||!upd.length){ $('#rjErr').textContent='Não foi possível rejeitar: '+(error?error.message:'a requisição mudou ou seu usuário não tem permissão.'); $('#rjOk').disabled=false; return; }
    fechar(); toast(reqN(id)+' rejeitada.','warn'); atualizar();
  };
}

/* ---------- retornar para aprovação (mesma lógica de retornarParaAprovacao do sistema) ----------
   Estorna no estoque o que já foi separado, apaga a verificação de itens, as compras ainda não solicitadas
   (as já solicitadas no Sienge ficam) e o mútuo em aberto, e volta a requisição para "Pendente". */
const _semIdem=e=>!!e&&(e.code==='PGRST202'||/_idem|could not find the function/i.test(e.message||''));
async function _rpcIdem(nome,args,opId){
  let r=await sb.rpc(nome+'_idem',Object.assign({p_op_id:opId},args));
  if(_semIdem(r.error)) r=await sb.rpc(nome,args);
  return r.error; }
async function retornar(id){
  if(!isEncarregado()){ toast('Somente supervisor (encarregado) ou administrador pode retornar para aprovação.','err'); return; }
  const {data:r,error:e1}=await sb.from('requisicoes').select('*').eq('id',id).maybeSingle();
  if(e1||!r){ toast('Erro ao carregar '+reqN(id)+(e1?': '+e1.message:'.'),'err'); return; }
  if(!RET_APROV.includes(r.status)){ toast(reqN(id)+' já saiu da separação — não volta mais para aprovação.','err'); atualizar(); return; }
  if(r.tipo_envio){ toast(reqN(id)+' já tem tipo de envio definido. Troque o tipo de envio no sistema antes de retornar.','err'); return; }
  const [{count:cDev,error:eD},{count:cRet,error:eR},{data:its,error:eI},{data:mut,error:eM}]=await Promise.all([
    sb.from('devolucoes_requisicao').select('id',{count:'exact',head:true}).eq('requisicao_id',id),
    sb.from('retiradas_internas').select('id',{count:'exact',head:true}).eq('requisicao_id',id),
    sb.from('requisicao_itens_status').select('*').eq('requisicao_id',id),
    r.mutuo_empresa_destino?sb.from('mutuos_intercompany').select('id,status').eq('requisicao_id',id):Promise.resolve({data:[]})]);
  if(eI){ toast('Erro ao carregar os itens: '+eI.message,'err'); return; }
  if(!eD&&cDev){ toast(reqN(id)+' tem devolução de material registrada — não dá para retornar.','err'); return; }
  if(!eR&&cRet){ toast(reqN(id)+' já teve entrega no balcão — não dá para retornar.','err'); return; }
  if((its||[]).some(i=>Number(i.quantidade_entregue)>0)){ toast(reqN(id)+' já teve itens entregues — não dá para retornar.','err'); return; }
  if(!eM&&(mut||[]).some(m=>m.status!=='aberto')){ toast('O mútuo da '+reqN(id)+' está em período fechado — reabra o período no sistema antes.','err'); return; }
  const separados=(its||[]).filter(i=>Number(i.quantidade_separada)>0);

  const bg=document.createElement('div'); bg.className='sheet-bg';
  bg.innerHTML=`<div class="sheet"><h3>Retornar ${reqN(id)} para aprovação</h3>
    <p>Você está logado como <b>${esc(profile.nome||profile.email)}</b>. A requisição volta para <b>Pendente</b>.</p>
    ${separados.length?`<p>Volta para o estoque o que já foi separado: ${separados.map(i=>esc(i.descricao)+' ('+numf(i.quantidade_separada)+' '+esc(i.unidade||'')+')').join(', ')}.</p>`:''}
    <p>As compras ainda não solicitadas são removidas; as já solicitadas no Sienge são mantidas.</p>
    <div class="err" id="rtErr"></div>
    <div class="acts"><button class="btn ghost" id="rtC">Cancelar</button><button class="btn pri" id="rtOk">Retornar</button></div></div>`;
  document.body.appendChild(bg);
  const fechar=()=>bg.remove();
  bg.addEventListener('click',ev=>{ if(ev.target===bg)fechar(); });
  $('#rtC').onclick=fechar;
  $('#rtOk').onclick=async()=>{
    $('#rtOk').disabled=true;
    /* 1) trava: só passa se ainda estiver na separação e sem tipo de envio */
    const {data:upd,error:eU}=await sb.from('requisicoes').update({status:'pendente',decidido_por:null,decidido_por_nome:null,decidido_em:null,motivo_rejeicao:null})
      .eq('id',id).in('status',RET_APROV).is('tipo_envio',null).select('id');
    if(eU||!upd||!upd.length){ $('#rtErr').textContent='Não foi possível retornar: '+(eU?eU.message:'a requisição mudou de etapa ou seu usuário não tem permissão.'); $('#rtOk').disabled=false; return; }
    fechar();
    const avisos=[];
    /* 2) estorna o estoque: remove as baixas da separação e devolve saldo (e lotes) pela mesma função do banco do sistema */
    if(separados.length){
      const {data:movs,error:eMv}=await sb.from('movimentos_estoque').select('*').eq('tipo','baixa').eq('doc','Separação '+reqN(id));
      if(eMv) avisos.push('baixas não localizadas ('+eMv.message+')');
      for(const m of (movs||[])){
        const {error:eDel}=await sb.from('movimentos_estoque').delete().eq('id',m.id);
        if(eDel){ avisos.push('baixa de '+(m.descricao||m.code)+' não removida ('+eDel.message+')'); continue; }
        const q=Number(m.qty)||0;
        const eS=await _rpcIdem('ajustar_saldo',{p_obra:m.obra,p_code:String(m.code),p_delta:q},'retaprov_'+m.id);
        if(eS) avisos.push('saldo de '+(m.descricao||m.code)+' não estornado ('+eS.message+')');
        for(const l of (Array.isArray(m.lotes)?m.lotes:[])){ if(!l||!l.lote)continue;
          const eL=await _rpcIdem('mover_lote',{p_obra:m.obra,p_code:String(m.code),p_lote:l.lote,p_validade:l.validade||null,p_fabricacao:l.fabricacao||null,p_delta:Math.abs(Number(l.qty)||0)},'retaprov_'+m.id+'_'+l.lote);
          if(eL) avisos.push('lote '+l.lote+' não estornado ('+eL.message+')'); }
      }
    }
    /* 3) limpa o que a aprovação gerou */
    const {error:eIt}=await sb.from('requisicao_itens_status').delete().eq('requisicao_id',id);
    if(eIt) avisos.push('verificação de itens não apagada ('+eIt.message+')');
    const {error:eCp}=await sb.from('compras_pendentes').delete().eq('requisicao_id',id).eq('status','pendente');
    if(eCp) avisos.push('compras pendentes não removidas ('+eCp.message+')');
    if(r.mutuo_empresa_destino){ const {error:eMu}=await sb.from('mutuos_intercompany').delete().eq('requisicao_id',id).eq('status','aberto');
      if(eMu) avisos.push('mútuo não removido ('+eMu.message+')'); }
    try{ await sb.rpc('log_event',{p_acao:'requisicao_retornada_aprovacao',p_entidade:'requisicoes',p_entidade_id:String(id)}); }catch(e){}
    if(avisos.length) toast(reqN(id)+' voltou para aprovação, mas: '+avisos.join('; ')+'. Avise o administrador.','err');
    else toast(reqN(id)+' voltou para aprovação'+(separados.length?' — estoque separado estornado.':'.'),'warn');
    atualizar();
  };
}

iniciar();
</script>
<!-- ===== Controle de inatividade (padrão Capivara): desconecta após 10 minutos sem uso =====
     Conta como uso: clique, toque, tecla, rolagem ou movimento do mouse em qualquer aba aberta deste
     sistema (o horário do último uso fica no navegador, compartilhado entre as abas). Aos 9 minutos
     aparece um aviso com contagem regressiva; aos 10 a sessão é encerrada pelo logout normal do app.
     Quem fecha o navegador e volta depois de 10 minutos também é desconectado ao abrir. -->
<script>
(function(){
  var PROJETO = 'qjmqburjyqlgwjihvlgp';                          // projeto Supabase deste app
  function cliente(){ return sb; }
  function sairDoApp(){ return document.querySelector('#bSair').onclick(); }              // o mesmo "Sair" do app

  var LIMITE = 10 * 60 * 1000, AVISO = 60 * 1000;
  var CHAVE_SESSAO = 'sb-' + PROJETO + '-auth-token';
  var CHAVE_USO = 'capivara_ultimo_uso_' + PROJETO;
  var CHAVE_MSG = 'capivara_saiu_inatividade';
  var memoria = 0, gravadoEm = 0, saindo = false, caixa = null;

  function ler(k){ try { return localStorage.getItem(k); } catch(e){ return null; } }
  function logado(){ return !!ler(CHAVE_SESSAO); }
  function ultimoUso(){ return Math.max(Number(ler(CHAVE_USO)) || 0, memoria); }
  function marcarUso(forcar){
    var t = Date.now(); memoria = t;
    if(forcar || t - gravadoEm > 5000){ gravadoEm = t; try { localStorage.setItem(CHAVE_USO, String(t)); } catch(e){} }
  }
  function emUso(){
    if(saindo) return;
    marcarUso(false);
    if(caixa && caixa.tipo === 'aviso') fechar();
  }

  /* ---- caixas de aviso ---- */
  function fechar(){ if(caixa){ caixa.el.remove(); caixa = null; } }
  function abrir(tipo, html){
    fechar();
    var fundo = document.createElement('div');
    fundo.setAttribute('role', 'alertdialog');
    fundo.setAttribute('aria-modal', 'true');
    fundo.style.cssText = 'position:fixed;inset:0;z-index:2147483000;background:rgba(8,10,14,.62);display:flex;align-items:center;justify-content:center;padding:16px;font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;';
    fundo.innerHTML = '<div style="background:#1A1E24;color:#EDEFF2;border:1px solid #333A44;border-top:3px solid #F5C433;border-radius:12px;max-width:380px;width:100%;padding:22px 22px 18px;box-shadow:0 18px 50px rgba(0,0,0,.5);line-height:1.45;">' + html + '</div>';
    document.body.appendChild(fundo);
    caixa = { tipo: tipo, el: fundo };
    var b = fundo.querySelector('button'); if(b) b.focus();
    return fundo;
  }
  var BOTAO = 'margin-top:16px;width:100%;padding:11px 14px;border:0;border-radius:8px;background:#F5C433;color:#1A1E24;font:700 14px system-ui,-apple-system,"Segoe UI",sans-serif;cursor:pointer;';
  function mmss(s){ s = Math.max(0, s); return Math.floor(s / 60) + ':' + String(s % 60).padStart(2, '0'); }
  function mostrarAviso(seg){
    if(caixa && caixa.tipo === 'aviso'){ caixa.el.querySelector('[data-cont]').textContent = mmss(seg); return; }
    var el = abrir('aviso',
      '<div style="font-size:17px;font-weight:700;margin-bottom:6px;">⏳ Você ainda está aí?</div>' +
      '<div style="font-size:14px;color:#B3BCC8;">Por segurança, sua sessão será encerrada por inatividade em <b data-cont style="color:#F5C433;font-variant-numeric:tabular-nums;">' + mmss(seg) + '</b>.</div>' +
      '<button type="button" style="' + BOTAO + '">Continuar conectado</button>');
    el.querySelector('button').addEventListener('click', function(){ marcarUso(true); fechar(); });
  }
  function mostrarEncerrada(){
    var el = abrir('fim',
      '<div style="font-size:17px;font-weight:700;margin-bottom:6px;">🔒 Sessão encerrada</div>' +
      '<div style="font-size:14px;color:#B3BCC8;">Você foi desconectado depois de 10 minutos sem uso. Entre novamente para continuar.</div>' +
      '<button type="button" style="' + BOTAO + '">Entendi</button>');
    el.querySelector('button').addEventListener('click', fechar);
  }

  /* ---- encerrar a sessão ---- */
  function comLimite(p, ms){ return Promise.race([p, new Promise(function(r){ setTimeout(r, ms); })]); }
  function sair(){
    if(saindo) return;
    saindo = true; fechar();
    var c = null; try { c = cliente(); } catch(e){}
    comLimite(Promise.resolve().then(sairDoApp), 8000).catch(function(){})
      .then(function(){ if(logado() && c) return comLimite(c.auth.signOut({ scope: 'local' }), 5000).catch(function(){}); })
      .then(function(){
        if(logado()){
          // sem internet o logout pode falhar: apaga a sessão guardada e recarrega
          try { localStorage.removeItem(CHAVE_SESSAO); sessionStorage.setItem(CHAVE_MSG, '1'); } catch(e){}
          location.reload(); return;
        }
        saindo = false; estavaLogado = false;
        mostrarEncerrada();
      });
  }

  /* ---- verificação ---- */
  var estavaLogado = logado();
  function verificar(){
    if(saindo) return;
    var agoraLogado = logado();
    if(agoraLogado && !estavaLogado) marcarUso(true);   // acabou de entrar
    estavaLogado = agoraLogado;
    if(!agoraLogado){ if(caixa && caixa.tipo === 'aviso') fechar(); return; }
    var ocioso = Date.now() - ultimoUso();
    if(ocioso >= LIMITE) sair();
    else if(ocioso >= LIMITE - AVISO) mostrarAviso(Math.ceil((LIMITE - ocioso) / 1000));
    else if(caixa && caixa.tipo === 'aviso') fechar();
  }

  ['pointerdown', 'pointermove', 'keydown', 'wheel', 'touchstart', 'scroll', 'input'].forEach(function(ev){
    document.addEventListener(ev, emUso, { capture: true, passive: true });
  });
  document.addEventListener('visibilitychange', function(){ if(!document.hidden) verificar(); });
  window.addEventListener('focus', verificar);

  var usoGuardado = Number(ler(CHAVE_USO)) || 0;
  var veioDeSaida = false; try { veioDeSaida = sessionStorage.getItem(CHAVE_MSG) === '1'; sessionStorage.removeItem(CHAVE_MSG); } catch(e){}
  if(veioDeSaida) mostrarEncerrada();
  if(estavaLogado && usoGuardado && Date.now() - usoGuardado >= LIMITE){
    // voltou depois de mais de 10 minutos: espera o app terminar de abrir e encerra a sessão
    saindo = true;
    setTimeout(function(){ saindo = false; sair(); }, 1500);
  } else {
    marcarUso(true);
  }
  setInterval(verificar, 1000);
})();
</script>

<script>
/* Aplicativo instalado: cada app (Estoque, Aprovações, Contagem, Notificações, CAP-Refeições...) fica na própria janela.
   Link para fora deste app (ex.: "⌂ página inicial do Capivara" e, de lá, outro sistema) abre no navegador,
   em vez de trocar o conteúdo da janela do app — antes, quem ia ao início e abria o CAP-Refeições ficava com a
   janela do Estoque mostrando o Refeições, sem caminho de volta. No navegador comum nada muda. */
(function(){
  function instalado(){ try{ return matchMedia('(display-mode: standalone)').matches||matchMedia('(display-mode: minimal-ui)').matches||matchMedia('(display-mode: window-controls-overlay)').matches||navigator.standalone===true; }catch(e){ return false; } }
  var base=new URL('./',location.href).pathname;
  document.addEventListener('click',function(e){
    if(e.defaultPrevented||e.button!==0||e.ctrlKey||e.metaKey||e.shiftKey||e.altKey||!instalado())return;
    var a=e.target&&e.target.closest?e.target.closest('a[href]'):null;
    if(!a||a.hasAttribute('download')||(a.target&&a.target!=='_self'))return;
    var u; try{ u=new URL(a.getAttribute('href'),location.href); }catch(x){ return; }
    if(u.protocol!=='http:'&&u.protocol!=='https:')return;
    if(u.origin===location.origin&&(u.pathname===location.pathname||u.pathname===base||u.pathname===base+'index.html'))return;
    e.preventDefault();
    window.open(u.href,'_blank','noopener');
  });
})();
</script>
