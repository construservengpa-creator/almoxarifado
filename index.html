<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Controle de Estoque por Obra</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jsbarcode/3.11.6/JsBarcode.all.min.js"></script>

<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#0f1419; --panel:#1a2129; --panel2:#222b35; --line:#2c3742;
    --ink:#e8edf2; --muted:#8a98a8; --muted2:#5d6b7a;
    --amber:#f5a623; --amber-dim:#a8731a; --green:#3ec98a; --red:#ef5b5b; --blue:#4aa8ff;
    --content:#f4f1ea;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:'IBM Plex Sans',sans-serif;background:var(--bg);color:var(--ink);display:flex;min-height:100vh;font-size:14px}
  .mono{font-family:'IBM Plex Mono',monospace}
  aside{width:236px;background:var(--panel);border-right:1px solid var(--line);display:flex;flex-direction:column;position:sticky;top:0;height:100vh;flex-shrink:0}
  .brand{padding:20px 20px;border-bottom:1px solid var(--line)}

  .brand .dot{width:11px;height:11px;background:var(--amber);border-radius:2px;transform:rotate(45deg)}
  .brand p{font-size:10.5px;color:var(--muted2);margin-top:4px;letter-spacing:1.5px;text-transform:uppercase}
  nav{padding:10px 10px;flex:1;overflow-y:auto}
  nav button{width:100%;text-align:left;background:none;border:none;color:var(--muted);padding:10px 13px;border-radius:8px;cursor:pointer;font-family:inherit;font-size:13.5px;display:flex;align-items:center;gap:11px;margin-bottom:2px;transition:.15s;font-weight:500}
  nav button:hover{background:var(--panel2);color:var(--ink)}
  nav button.active{background:var(--amber);color:#1a1206;font-weight:600}
  nav button .ic{width:18px;text-align:center;font-size:15px}
  nav button .badge{margin-left:auto;background:var(--red);color:#fff;font-size:10px;font-weight:700;padding:1px 7px;border-radius:10px}
  nav button.active .badge{background:#1a1206;color:var(--amber)}
  .navsep{font-size:9.5px;letter-spacing:1.5px;text-transform:uppercase;color:var(--muted2);padding:14px 14px 6px;font-weight:600}
  .side-foot{padding:14px 18px;border-top:1px solid var(--line);font-size:10.5px;color:var(--muted2);line-height:1.6}
  main{flex:1;background:var(--content);color:#1c1c1c;min-width:0}
  .topbar{background:#fff;border-bottom:2px solid #e4dfd4;padding:16px 30px;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:20;gap:16px;flex-wrap:wrap}
  .topbar h2{font-size:19px;font-weight:700}
  .topbar h2 small{display:block;font-size:12px;font-weight:400;color:#8a8377;margin-top:2px}
  .wrap{padding:26px 30px;max-width:1200px}
  .cards{display:flex;flex-wrap:wrap;gap:16px;margin-bottom:24px}
  .cards>.card{flex:1 1 220px}
  .card{background:#fff;border:1px solid #e4dfd4;border-radius:12px;padding:18px 20px;position:relative;overflow:hidden}
  .card .lbl{font-size:11px;text-transform:uppercase;letter-spacing:.8px;color:#8a8377;font-weight:600}
  .card .val{font-size:26px;font-weight:700;margin-top:8px;font-family:'IBM Plex Mono',monospace}
  .card .sub{font-size:11.5px;color:#a09a8d;margin-top:3px}
  .card .stripe{position:absolute;left:0;top:0;bottom:0;width:4px}
  .card.alert .stripe{background:var(--red)} .card.alert .val{color:var(--red)}
  .card.warn .stripe{background:var(--amber)} .card.warn .val{color:var(--amber-dim)}
  .card.ok .stripe{background:var(--green)} .card.neutral .stripe{background:#c9c2b3}
  .tbl-wrap{background:#fff;border:1px solid #e4dfd4;border-radius:12px;overflow:auto}
  table{width:100%;border-collapse:collapse}
  th{background:#faf8f3;text-align:left;padding:11px 15px;font-size:11px;text-transform:uppercase;letter-spacing:.5px;color:#8a8377;font-weight:600;border-bottom:1px solid #e4dfd4;white-space:nowrap}
  td{padding:11px 15px;border-bottom:1px solid #f0ece3;font-size:13.5px;vertical-align:middle}
  tr:last-child td{border-bottom:none}
  tr:hover td{background:#fcfbf7}
  td.num,th.num{text-align:right;font-family:'IBM Plex Mono',monospace}
  .pill{display:inline-block;padding:2px 9px;border-radius:20px;font-size:11px;font-weight:600}
  .pill.low{background:#fde8e8;color:#c0392b} .pill.high{background:#fff3da;color:#a8731a}
  .pill.good{background:#e3f7ee;color:#1c7a52}
  .pill.in{background:#e3f7ee;color:#1c7a52} .pill.out{background:#fde8e8;color:#c0392b} .pill.tr{background:#e6effc;color:#2766b8}
  .field{margin-bottom:14px}
  label{display:block;font-size:12px;font-weight:600;color:#5a544a;margin-bottom:6px;text-transform:uppercase;letter-spacing:.4px}
  input,select,textarea{width:100%;padding:10px 12px;border:1px solid #d8d2c4;border-radius:8px;font-family:inherit;font-size:14px;background:#fff;color:#1c1c1c;transition:.15s}
  textarea{resize:vertical}
  input:focus,select:focus,textarea:focus{outline:none;border-color:var(--amber);box-shadow:0 0 0 3px rgba(245,166,35,.15)}
  input.mono,textarea.mono{font-family:'IBM Plex Mono',monospace}
  .row{display:grid;gap:14px}
  .row.c2{grid-template-columns:1fr 1fr} .row.c3{grid-template-columns:1fr 1fr 1fr} .row.c4{grid-template-columns:repeat(4,1fr)}
  .btn{padding:10px 18px;border:none;border-radius:8px;font-family:inherit;font-weight:600;font-size:13.5px;cursor:pointer;transition:.15s;display:inline-flex;align-items:center;gap:8px}
  .btn.primary{background:var(--amber);color:#1a1206} .btn.primary:hover{background:#ffb735}
  .btn.dark{background:#2a2520;color:#fff} .btn.dark:hover{background:#3d362d}
  .btn.ghost{background:#fff;border:1px solid #d8d2c4;color:#5a544a} .btn.ghost:hover{border-color:#b0a892}
  .btn.danger{background:#fbe5e5;color:#c0392b} .btn.danger:hover{background:#f7d3d3}
  .btn.sm{padding:6px 11px;font-size:12px}
  .panel{background:#fff;border:1px solid #e4dfd4;border-radius:12px;padding:22px;margin-bottom:18px}
  .panel h3{font-size:15px;font-weight:700;margin-bottom:4px}
  .panel .desc{font-size:12.5px;color:#8a8377;margin-bottom:16px}
  .sechead{display:flex;align-items:center;justify-content:space-between;margin-bottom:16px;gap:12px;flex-wrap:wrap}

  #toasts{position:fixed;bottom:24px;right:24px;z-index:100;display:flex;flex-direction:column;gap:10px}
  .toast{background:#2a2520;color:#fff;padding:12px 17px;border-radius:9px;font-size:13.5px;box-shadow:0 8px 30px rgba(0,0,0,.3);min-width:250px;border-left:4px solid var(--amber);animation:slidein .25s}

  @keyframes slidein{from{transform:translateX(40px);opacity:0}to{transform:translateX(0);opacity:1}}
  .ovl{position:fixed;inset:0;background:rgba(15,20,25,.6);display:flex;align-items:center;justify-content:center;z-index:90;padding:20px}
  .modal{background:#fff;border-radius:14px;padding:26px;max-width:460px;width:100%;color:#1c1c1c;max-height:90vh;overflow:auto}
  .modal h3{font-size:17px;margin-bottom:6px} .modal .mp{font-size:13px;color:#8a8377;margin-bottom:16px}
  .scan-box{background:linear-gradient(135deg,#1a2129,#222b35);border-radius:14px;padding:26px;color:#fff;margin-bottom:20px}
  .scan-box label{color:#8a98a8}
  .scan-box input{font-size:22px;padding:15px 18px;background:#0f1419;border:2px solid var(--amber);color:#fff;text-align:center;letter-spacing:2px;font-family:'IBM Plex Mono',monospace}
  .scan-hint{font-size:12.5px;color:#8a98a8;margin-top:12px}
  .found-card{background:#fff;border:2px solid var(--amber);border-radius:12px;padding:20px;display:none}
  .found-card.show{display:block;animation:slidein .2s}
  .fc-head{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:16px;gap:16px}
  .fc-head .code{font-family:'IBM Plex Mono',monospace;font-size:12px;color:#8a8377}
  .fc-head .name{font-size:18px;font-weight:700}
  .fc-stats{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-bottom:16px}
  .fc-stat{background:#faf8f3;border-radius:9px;padding:11px 13px}
  .fc-stat .l{font-size:10.5px;text-transform:uppercase;letter-spacing:.5px;color:#8a8377;font-weight:600}
  .fc-stat .v{font-size:19px;font-weight:700;font-family:'IBM Plex Mono',monospace;margin-top:3px}
  .filebox{border:2px dashed #d8d2c4;border-radius:12px;padding:28px;text-align:center;cursor:pointer;transition:.15s;background:#faf8f3}
  .filebox:hover{border-color:var(--amber);background:#fffaf0}
  .filebox .ico{font-size:30px;margin-bottom:8px}
  .help{background:#faf8f3;border:1px solid #e4dfd4;border-radius:10px;padding:14px 16px;font-size:12.5px;color:#6a6357;line-height:1.7;margin-top:14px}
  .help code{background:#ece7dc;padding:1px 6px;border-radius:4px;font-family:'IBM Plex Mono',monospace;font-size:12px}
  .inline-edit{width:72px;padding:5px 7px;font-size:13px;text-align:right;font-family:'IBM Plex Mono',monospace}
  .muted{color:#a09a8d} .neg{color:var(--red)} .pos{color:#1c7a52}
  .thumb{width:44px;height:44px;border-radius:8px;object-fit:cover;border:1px solid #e4dfd4;cursor:pointer;display:block}
  .thumb.ph{display:flex;align-items:center;justify-content:center;background:#faf8f3;color:#c9c2b3;font-size:18px}
  .editphoto{width:120px;height:120px;border-radius:10px;object-fit:cover;border:1px solid #e4dfd4;display:block}
  .editphoto.ph{display:flex;align-items:center;justify-content:center;background:#faf8f3;color:#a09a8d;font-size:12px;text-align:center}
  .refline{font-size:11px;color:#8a7a55;margin-top:4px;line-height:1.4}
  .consphoto{width:150px;height:150px;border-radius:12px;object-fit:cover;border:1px solid #e4dfd4;flex-shrink:0}
  .danger-zone{background:#fdf2f2;border:1px solid #f3c9c9;border-radius:12px;padding:20px}
  .danger-zone h3{color:#b03030}
  .tabs{display:flex;gap:6px;margin-bottom:16px;border-bottom:1px solid #e4dfd4}
  .tabs button{background:none;border:none;border-bottom:3px solid transparent;padding:9px 14px;font-family:inherit;font-size:13px;font-weight:600;color:#8a8377;cursor:pointer;margin-bottom:-1px}
  .tabs button.on{color:#1c1c1c;border-color:var(--amber)}
  #gate{position:fixed;inset:0;background:var(--bg);z-index:200;display:flex;align-items:center;justify-content:center;padding:20px;overflow:auto}
  .gate-card{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:30px;max-width:520px;width:100%;color:var(--ink)}
  .gate-card h1{font-size:20px;display:flex;align-items:center;gap:10px;margin-bottom:6px}
  .gate-step{background:var(--panel2);border:1px solid var(--line);border-radius:10px;padding:15px;margin-bottom:13px}
  .gate-step .gt{font-weight:600;font-size:13px;margin-bottom:9px}
  @media print{aside,.topbar,.noprint{display:none!important}main{background:#fff}}
  @media(max-width:860px){.cards>.card{flex-basis:42%}.row.c4,.row.c3{grid-template-columns:1fr 1fr}}
  .pill.pendente{background:#fff3da;color:#a8731a} .pill.aprovada{background:#e3f7ee;color:#1c7a52} .pill.rejeitada{background:#fde8e8;color:#c0392b} .pill.cancelada{background:#eee;color:#777}
  .userbox{display:flex;align-items:center;gap:10px;padding:11px 18px;border-top:1px solid var(--line)}
  .userbox .av{width:30px;height:30px;border-radius:50%;background:var(--amber);color:#1a1206;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:13px;flex-shrink:0}
  .userbox .nm{font-size:12.5px;font-weight:600;line-height:1.3} .userbox .rl{font-size:10.5px;color:var(--muted2);text-transform:uppercase;letter-spacing:.4px}
  .userbox button{margin-left:auto;background:none;border:none;color:var(--muted);cursor:pointer;font-size:15px}
  .authwrap{max-width:400px;width:100%}
  .authtabs{display:flex;gap:6px;margin-bottom:18px}
  .authtabs button{flex:1;background:var(--panel2);border:1px solid var(--line);color:var(--muted);padding:9px;border-radius:8px;font-family:inherit;font-weight:600;font-size:13px;cursor:pointer}
  .authtabs button.on{background:var(--amber);color:#1a1206;border-color:var(--amber)}
  #authView .field label{color:var(--muted)}
  #authView input{background:var(--panel2);border-color:var(--line);color:var(--ink)}
  .pendbox{text-align:center;padding:10px 0}
  .pendbox .ico{font-size:36px;margin-bottom:10px}
</style>
</head>
<body>
<div id="gate">
  <div class="gate-card authwrap">
    <h1><span class="dot" style="display:inline-block;width:12px;height:12px;background:var(--amber);border-radius:2px;transform:rotate(45deg)"></span>Controle de Estoque</h1>
    <p style="color:var(--muted);font-size:13px;margin-bottom:20px">Acesso restrito aos usuários cadastrados da AMETA Engenharia.</p>
    <div id="authView"></div>
  </div>
</div>
<aside>
  <div class="brand">
    <h1><span class="dot"></span>ESTOQUE</h1>
    <p>Controle por Obra</p>
  </div>
  <nav id="nav">
    <button data-tab="painel" class="active"><span class="ic">▦</span><span>Painel</span><span class="badge" id="navBadge" style="display:none"></span></button>
    <button data-tab="entrada"><span class="ic">⊕</span><span>Entrada / Nota Fiscal</span></button>
    <button data-tab="baixa"><span class="ic">⊖</span><span>Consumo de Estoque</span></button>
    <button data-tab="requisicoes"><span class="ic">📋</span><span>Requisições</span></button>
    <button data-tab="aprovacoes" data-role="encarregado"><span class="ic">✔</span><span>Aprovações</span><span class="badge" id="navBadgeAprov" style="display:none"></span></button>
    <button data-tab="transfer"><span class="ic">⇄</span><span>Transferência entre Obras</span></button>
    <button data-tab="consulta"><span class="ic">⌕</span><span>Consulta</span></button>

<main>
  <div class="topbar">

  </div>

<div id="toasts"></div>
<div id="modalRoot"></div>

<script>
/* ===== Supabase ===== */
const SUPABASE_URL='https://qjmqburjyqlgwjihvlgp.supabase.co';
const SUPABASE_ANON_KEY='eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InFqbXFidXJqeXFsZ3dqaWh2bGdwIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODg4NzU0NzIsImV4cCI6MjEwNDQ1MTQ3Mn0.cOdmVw3W0HCilACqZIVFMCwsr6zxA0g_3CreKIuk9kw';
const sb=window.supabase.createClient(SUPABASE_URL,SUPABASE_ANON_KEY);
let session=null, profile=null;
function isAdmin(){ return !!profile && profile.papel==='admin' && profile.ativo; }
function isEncarregado(){ return !!profile && (profile.papel==='admin'||profile.papel==='encarregado') && profile.ativo; }
function isAtivo(){ return !!profile && profile.ativo; }

/* ===== Persistência (Supabase: tabela app_kv + auditoria via RPC) ===== */
const KEY='controle-estoque-obras-v1';
const Store={
  async get(k){ const {data,error}=await sb.from('app_kv').select('value').eq('key',k).maybeSingle(); if(error){console.error(error);return null;} return data?data.value:null; },
  async set(k,v,label){ const {error}=await sb.rpc('save_estado',{p_key:k,p_value:v,p_label:label||null}); if(error){console.error(error); toast('Erro ao salvar: '+error.message,'err');} }
};
let state={ obras:[], aplicacoes:[], products:[], estoque:{}, movements:[], notas:[], seq:{baixa:0,transfer:0}, config:{supHash:null}, currentObra:null };
let photos={};
async function load(){ const d=await Store.get(KEY); if(d&&d.products){state=d;}
  if(!state.obras)state.obras=[]; if(!state.aplicacoes)state.aplicacoes=[]; if(!state.estoque)state.estoque={}; if(!state.movements)state.movements=[]; if(!state.notas)state.notas=[]; if(!state.seq)state.seq={baixa:0,transfer:0}; if(!state.config)state.config={supHash:null};
  state.movements.forEach(m=>{ if(!m.id)m.id=uid(); });
  if(!state.currentObra || !state.obras.some(o=>o.id===state.currentObra)) state.currentObra=state.obras[0]?state.obras[0].id:null;
}
async function loadPhotos(){ const d=await Store.get(KEY+':fotos'); if(d&&typeof d==='object'){ photos=d; Object.keys(photos).forEach(k=>{ if(typeof photos[k]==='string')photos[k]=[photos[k]]; if(!Array.isArray(photos[k]))delete photos[k]; }); } }
async function savePhotos(){ await Store.set(KEY+':fotos', photos, 'Fotos atualizadas'); }
async function save(label){ await Store.set(KEY, state, label); refreshBadge(); }

/* ===== Utils ===== */
const $=s=>document.querySelector(s);
const money=n=>'R$ '+(Number(n)||0).toLocaleString('pt-BR',{minimumFractionDigits:2,maximumFractionDigits:2});
const numf=n=>(Number(n)||0).toLocaleString('pt-BR',{maximumFractionDigits:3});
const esc=s=>String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const fmtDate=ts=>new Date(ts).toLocaleString('pt-BR',{day:'2-digit',month:'2-digit',year:'2-digit',hour:'2-digit',minute:'2-digit'});
function uid(){ return 'o'+Date.now().toString(36)+Math.random().toString(36).slice(2,5); }
function seqf(n){ return String(n||0).padStart(4,'0'); }
function genCode(){ let b='789'+Date.now().toString().slice(-9); while(state.products.some(p=>p.code===b))b=(Number(b)+1).toString(); return b; }
function findProduct(code){ return state.products.find(p=>String(p.code)===String(code).trim()); }
function findByCodeOrAux(term){ term=String(term).trim(); if(!term)return null; return state.products.find(p=>String(p.code)===term||(p.aux&&String(p.aux)===term)); }
function searchProducts(q){ q=String(q).toLowerCase().trim(); if(!q)return []; return state.products.filter(p=>p.desc.toLowerCase().includes(q)||String(p.code).includes(q)||(p.aux&&String(p.aux).toLowerCase().includes(q))||(p.ref&&p.ref.toLowerCase().includes(q))); }
function aplicName(id){ if(!id)return''; const a=state.aplicacoes.find(a=>a.id===id); return a?(a.nome+(a.tag?' ('+a.tag+')':'')):''; }

function obraName(id){ const o=state.obras.find(o=>o.id===id); return o?o.nome:'(obra removida)'; }
function curObra(){ return state.currentObra; }
function saldoOf(obra,code){ return (state.estoque[obra]&&state.estoque[obra][code])||0; }
function totalSaldo(code){ let s=0; state.obras.forEach(o=>s+=saldoOf(o.id,code)); return s; }
function obrasComSaldo(code){ return state.obras.filter(o=>saldoOf(o.id,code)>0).map(o=>`${esc(o.nome)} (${numf(saldoOf(o.id,code))})`).join(', '); }
function addSaldo(obra,code,delta){ if(!state.estoque[obra])state.estoque[obra]={}; state.estoque[obra][code]=(state.estoque[obra][code]||0)+delta; }
function statusOf(p,saldo){ if(saldo<=p.min)return'low'; if(p.max>0&&saldo>=p.max)return'high'; return'good'; }
function toast(msg,type='ok'){ const t=document.createElement('div'); t.className='toast '+type; t.innerHTML=msg; $('#toasts').appendChild(t);
  setTimeout(()=>{t.style.transition='.3s';t.style.opacity='0';t.style.transform='translateX(40px)';setTimeout(()=>t.remove(),300);},3400); }

function resizeImage(file,max,cb){ const r=new FileReader(); r.onload=e=>{ const img=new Image();
  img.onload=()=>{ let w=img.width,h=img.height; if(w>h){if(w>max){h=Math.round(h*max/w);w=max;}}else{if(h>max){w=Math.round(w*max/h);h=max;}}
    const c=document.createElement('canvas');c.width=w;c.height=h;c.getContext('2d').drawImage(img,0,0,w,h);cb(c.toDataURL('image/jpeg',0.72)); };
  img.onerror=()=>toast('Não foi possível ler a imagem.','err'); img.src=e.target.result; }; r.readAsDataURL(file); }
function photoList(code){ const v=photos[code]; return Array.isArray(v)?v:(v?[v]:[]); }
function uploadPhoto(code,inp){ const files=[...inp.files].filter(f=>f.type.startsWith('image/')); if(!files.length){toast('Selecione imagem(ns).','err');return;}
  if(!Array.isArray(photos[code]))photos[code]=photos[code]?[photos[code]]:[];
  let pending=files.length;
  files.forEach(f=>resizeImage(f,680,src=>{ photos[code].push(src); if(--pending===0){ savePhotos(); renderEpGallery(code); toast('Foto(s) salva(s).','ok'); } }));
  inp.value=''; }
function removePhotoAt(code,idx){ const arr=photoList(code); arr.splice(idx,1); photos[code]=arr; if(!arr.length)delete photos[code]; savePhotos(); renderEpGallery(code); toast('Foto removida.','ok'); }
function renderEpGallery(code){ const b=document.getElementById('epPhoto'); if(!b)return; const arr=photoList(code);
  b.innerHTML=arr.length?arr.map((s,i)=>`<div style="position:relative;display:inline-block"><img src="${s}" style="width:82px;height:82px;object-fit:cover;border-radius:8px;border:1px solid #e4dfd4;cursor:zoom-in" onclick="openPhoto('${esc(code)}',${i})"><button class="btn danger sm" style="position:absolute;top:-6px;right:-6px;padding:1px 6px;border-radius:50%" onclick="removePhotoAt('${esc(code)}',${i})">✕</button></div>`).join(''):`<div class="editphoto ph">Sem foto</div>`; }
function thumb(code){ const arr=photoList(code); if(!arr.length)return `<div class="thumb ph" title="Adicionar foto" onclick="editProductModal('${esc(code)}')">📷</div>`;
  return `<div style="position:relative;display:inline-block"><img src="${arr[0]}" class="thumb" title="Ver foto" onclick="openPhoto('${esc(code)}',0)">${arr.length>1?`<span style="position:absolute;bottom:-4px;right:-4px;background:#2a2520;color:#fff;font-size:9px;border-radius:8px;padding:0 4px">+${arr.length-1}</span>`:''}</div>`; }
function openPhoto(code,idx){ const arr=photoList(code); if(!arr.length)return; let i=idx||0;
  let lb=document.getElementById('lightbox'); if(!lb){ lb=document.createElement('div'); lb.id='lightbox'; document.body.appendChild(lb); }
  const draw=()=>{ lb.innerHTML=`<div class="ovl" onclick="if(event.target===this)closeLightbox()" style="z-index:130"><div style="text-align:center;max-width:92vw"><img src="${arr[i]}" style="max-width:92vw;max-height:80vh;border-radius:10px;box-shadow:0 10px 40px rgba(0,0,0,.5)"><div style="margin-top:14px;display:flex;gap:10px;justify-content:center;align-items:center">${arr.length>1?`<button class="btn ghost sm" id="lbPrev">‹</button><span style="color:#fff;font-size:12px">${i+1} / ${arr.length}</span><button class="btn ghost sm" id="lbNext">›</button>`:''}<button class="btn primary sm" onclick="closeLightbox()">Fechar</button></div></div></div>`;
    if(arr.length>1){ document.getElementById('lbPrev').onclick=()=>{i=(i-1+arr.length)%arr.length;draw();}; document.getElementById('lbNext').onclick=()=>{i=(i+1)%arr.length;draw();}; } };
  draw(); }
function closeLightbox(){ const lb=document.getElementById('lightbox'); if(lb)lb.innerHTML=''; }

function periodTs(){ const f=$('#dashFrom')&&$('#dashFrom').value?new Date($('#dashFrom').value+'T00:00:00').getTime():0; const t=$('#dashTo')&&$('#dashTo').value?new Date($('#dashTo').value+'T23:59:59').getTime():Date.now(); return [f,t]; }
function movDeltaVal(m,obraId){ const p=findProduct(m.code); const c=p?(p.custo||0):0;
  if(obraId==='__all'){ if(m.tipo==='entrada')return m.qty*c; if(m.tipo==='baixa')return -m.qty*c; return 0; }
  if(m.tipo==='entrada')return m.obra===obraId?m.qty*c:0;
  if(m.tipo==='baixa')return m.obra===obraId?-m.qty*c:0;
  if(m.tipo==='transferencia'){ let d=0; if(m.obra===obraId)d-=m.qty*c; if(m.obraDest===obraId)d+=m.qty*c; return d; }
  return 0; }
let evoChartObj=null;
function emiMap(){ const m={}; state.notas.forEach(n=>{ if(n.dataEmissao)m[n.id]=new Date(n.dataEmissao+'T12:00:00').getTime(); }); return m; }
function mdate(m,emi){ if(m.tipo==='entrada'&&m.notaId&&emi[m.notaId])return emi[m.notaId]; return m.ts; }
function drawDashboard(){
  const [f,t]=periodTs(); const fobra=curObra(); const isAll=fobra==='__all'||!fobra; const emi=emiMap();
  const touchesObra=m=> isAll || m.obra===fobra || (m.tipo==='transferencia'&&m.obraDest===fobra);
  const inP=state.movements.filter(m=>{const d=mdate(m,emi); return d>=f&&d<=t && touchesObra(m);});
  const valEntr=inP.filter(m=>m.tipo==='entrada').reduce((s,m)=>s+m.valorTotal,0);
  const valBaixa=inP.filter(m=>m.tipo==='baixa').reduce((s,m)=>s+m.valorTotal,0);
  const valTransf=inP.filter(m=>m.tipo==='transferencia').reduce((s,m)=>s+m.valorTotal,0);
  const cnt=(arr,key)=>{ const set=new Set(); arr.forEach(m=>set.add(m[key]||m.id)); return set.size; };
  const nEntr=cnt(inP.filter(m=>m.tipo==='entrada'),'notaId');
  const nBaixa=cnt(inP.filter(m=>m.tipo==='baixa'),'baixaId');
  const nTransf=cnt(inP.filter(m=>m.tipo==='transferencia'),'romaneioId');
  const valEstoque = isAll ? state.products.reduce((s,p)=>s+totalSaldo(p.code)*(p.custo||0),0) : state.products.reduce((s,p)=>s+saldoOf(fobra,p.code)*(p.custo||0),0);
  const fobraLbl = isAll?'todas as obras':obraName(fobra);
  const cards=$('#dashCards'); if(cards)cards.innerHTML=`
    <div class="card ok" style="flex-basis:100%"><div class="stripe"></div>
      <div style="display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:8px">
        <div><div class="lbl">Valor atual em estoque</div><div class="sub">${esc(fobraLbl)} · global (sem período) · custo médio</div></div>
        <div class="val" style="font-size:32px">${money(valEstoque)}</div></div></div>
    <div class="card neutral"><div class="stripe"></div><div class="lbl">Movimentações no período</div><div class="val">${nEntr+nBaixa+nTransf}</div><div class="sub">${nEntr} entradas · ${nBaixa} saídas · ${nTransf} transf.</div></div>
    <div class="card neutral"><div class="stripe"></div><div class="lbl">Entradas no período</div><div class="val" style="font-size:18px">${money(valEntr)}</div><div class="sub pos">${nEntr} nota(s) · ${esc(fobraLbl)}</div></div>
    <div class="card alert"><div class="stripe"></div><div class="lbl">Saídas (consumo) no período</div><div class="val" style="font-size:18px">${money(valBaixa)}</div><div class="sub">${nBaixa} baixa(s) · ${esc(fobraLbl)}</div></div>
    <div class="card warn"><div class="stripe"></div><div class="lbl">Transferências no período</div><div class="val" style="font-size:18px">${money(valTransf)}</div><div class="sub">${nTransf} romaneio(s) · ${esc(fobraLbl)}</div></div>`;
  // resumo por obra (sempre todas as obras, valores do período)
  const res=$('#obraResumo'); if(res){ let rows=state.obras.map(ob=>{ let itens=0,val=0; state.products.forEach(p=>{const s=saldoOf(ob.id,p.code); if(s>0){itens++;val+=s*(p.custo||0);}});
      const ent=inP.filter(m=>m.tipo==='entrada'&&m.obra===ob.id).reduce((a,m)=>a+m.valorTotal,0);
      const bx=inP.filter(m=>m.tipo==='baixa'&&m.obra===ob.id).reduce((a,m)=>a+m.valorTotal,0);
      return `<tr><td><b>${esc(ob.nome)}</b></td><td class="num">${itens}</td><td class="num">${money(val)}</td><td class="num pos">${money(ent)}</td><td class="num neg">${money(bx)}</td></tr>`; }).join('');
    res.innerHTML=`<table><thead><tr><th>Obra</th><th class="num">Itens c/ saldo</th><th class="num">Valor em estoque</th><th class="num">Entradas (período)</th><th class="num">Baixas (período)</th></tr></thead><tbody>${rows||`<tr><td colspan="5" class="empty" style="padding:20px">Sem obras.</td></tr>`}</tbody></table>`; }
  // gráfico — por data de emissão (entradas) / data (saídas e transf.), respeitando o filtro de obra
  if($('#evoTitle'))$('#evoTitle').textContent='Evolução do estoque — '+esc(fobraLbl);
  const all=[...state.movements].map(m=>({m,d:mdate(m,emi)})).sort((a,b)=>a.d-b.d);
  const co=isAll?'__all':fobra;
  let running=0; all.forEach(x=>{ if(x.d<f)running+=movDeltaVal(x.m,co); });
  const labels=[], data=[]; labels.push(new Date(f).toLocaleDateString('pt-BR')); data.push(running);
  all.forEach(x=>{ if(x.d>=f&&x.d<=t){ running+=movDeltaVal(x.m,co); labels.push(new Date(x.d).toLocaleDateString('pt-BR')); data.push(running); } });
  labels.push(new Date(t).toLocaleDateString('pt-BR')); data.push(running);
  const cv=$('#evoChart'); if(cv&&window.Chart){ if(evoChartObj){evoChartObj.destroy();}
    evoChartObj=new Chart(cv.getContext('2d'),{type:'line',data:{labels,datasets:[{label:'Valor em estoque (R$)',data,borderColor:'#f5a623',backgroundColor:'rgba(245,166,35,.12)',fill:true,tension:.2,pointRadius:data.length>40?0:3}]},options:{responsive:true,maintainAspectRatio:false,plugins:{legend:{display:false},tooltip:{callbacks:{label:c=>money(c.parsed.y)}}},scales:{y:{ticks:{callback:v=>'R$ '+Number(v).toLocaleString('pt-BR')}}}}}); }
}

  const saldos=state.obras.filter(o=>saldoOf(o.id,code)>0).map(o=>`<tr><td>${esc(o.nome)}</td><td class="num">${numf(saldoOf(o.id,code))} ${esc(p.unit||'')}</td></tr>`).join('');
  modal(`<h3>${esc(p.desc)}</h3><p class="mp mono">${esc(p.code)}${p.aux?' · aux '+esc(p.aux):''}</p>
    ${fotos.length?`<div style="display:flex;flex-wrap:wrap;gap:6px;margin-bottom:12px">${fotos.map((s,i)=>`<img src="${s}" style="width:84px;height:84px;object-fit:cover;border-radius:8px;border:1px solid #e4dfd4;cursor:zoom-in" onclick="openPhoto('${esc(code)}',${i})">`).join('')}</div>`:'<p class="mp">Sem foto cadastrada.</p>'}

    ${p.ref?`<div style="font-size:13px;color:#6a6357;margin-bottom:12px"><b>Referências / Aplicação:</b><br>${esc(p.ref).replace(/\n/g,'<br>')}</div>`:''}
    <div class="tbl-wrap"><table><thead><tr><th>Obra</th><th class="num">Saldo</th></tr></thead><tbody>${saldos||'<tr><td colspan="2" class="empty" style="padding:14px">Sem saldo em nenhuma obra.</td></tr>'}</tbody></table></div>

}

function renderObras(){
  $('#topActions').innerHTML=`<button class="btn primary sm" onclick="obraModal()">+ Nova obra</button>`;
  let html=`<div class="sechead"><h3>Obras cadastradas</h3></div>`;
  if(!state.obras.length){ html+=`<div class="tbl-wrap"><div class="empty"><div class="ico">⌂</div>Nenhuma obra cadastrada.<br><button class="btn primary" onclick="obraModal()">+ Cadastrar primeira obra</button></div></div>`; $('#view').innerHTML=html; return; }
  html+=`<div class="tbl-wrap"><table><thead><tr><th>Obra</th><th>Local</th><th class="num">Itens c/ saldo</th><th class="num">Valor em estoque</th><th></th></tr></thead><tbody>`;
  state.obras.forEach(o=>{ let itens=0,val=0; state.products.forEach(p=>{const s=saldoOf(o.id,p.code); if(s>0){itens++;val+=s*(p.custo||0);}});
    html+=`<tr><td><b>${esc(o.nome)}</b></td><td class="muted">${esc(o.local||'—')}</td><td class="num">${itens}</td><td class="num">${money(val)}</td>
    <td class="num" style="white-space:nowrap"><button class="btn ghost sm" onclick="obraModal('${o.id}')">✎</button> <button class="btn danger sm" onclick="delObra('${o.id}')">✕</button></td></tr>`; });
  html+=`</tbody></table></div>`;
  $('#view').innerHTML=html;
}
function obraModal(id){ const o=id?state.obras.find(x=>x.id===id):null;
  modal(`<h3>${o?'Editar obra':'Nova obra'}</h3>
    <div class="field"><label>Nome da obra</label><input id="obNome" value="${o?esc(o.nome):''}" placeholder="Ex.: Obra 57 — Vias Guajará"></div>
    <div class="field"><label>Local / referência (opcional)</label><input id="obLocal" value="${o?esc(o.local||''):''}" placeholder="Cidade, contrato..."></div>
    <div style="display:flex;gap:10px;justify-content:flex-end"><button class="btn ghost" onclick="closeModal()">Cancelar</button><button class="btn primary" onclick="saveObra('${id||''}')">Salvar</button></div>`);
}
function saveObra(id){ const nome=$('#obNome').value.trim(); if(!nome){toast('Informe o nome da obra.','err');return;} const local=$('#obLocal').value.trim();
  if(id){ const o=state.obras.find(x=>x.id===id); o.nome=nome; o.local=local; } else { const nid=uid(); state.obras.push({id:nid,nome,local}); if(!state.currentObra)state.currentObra=nid; }
  save(); closeModal(); renderObras(); toast('Obra salva.','ok'); }
function delObra(id){ const itens=state.products.filter(p=>saldoOf(id,p.code)>0).length;
  if(itens>0){ toast('A obra tem saldo em estoque. Zere ou transfira antes de excluir.','err'); return; }
  const nomeObra=obraName(id); requireSupervisor(`Excluir obra "${nomeObra}"`,()=>{ state.obras=state.obras.filter(o=>o.id!==id); delete state.estoque[id];
    if(state.currentObra===id)state.currentObra=state.obras[0]?state.obras[0].id:null; save('Obra excluída: '+nomeObra); renderObras(); toast('Obra excluída.','ok'); }); }

/* ===== APLICAÇÕES ===== */
const APLIC_TIPOS=[['equipamento','⚙ EQUIPAMENTO'],['veiculo','🚚 VEÍCULO'],['sede','🏢 SEDE']];
const SEDE_SUB=[['oficina','OFICINA'],['escritorio','ESCRITÓRIO / ADM'],['lavajato','LAVAJATO'],['diretoria','DIRETORIA']];
function aplicTipoLabel(t,sub){ const f=APLIC_TIPOS.find(x=>x[0]===t); let l=f?f[1]:(t||'—'); if(t==='sede'&&sub){ const s=SEDE_SUB.find(x=>x[0]===sub); l+=' · '+(s?s[1]:sub); } return l; }
function renderAplic(){
  $('#topActions').innerHTML=`<button class="btn primary sm" onclick="aplicModal()">+ Nova aplicação</button>`;
  let html=`<div class="panel"><h3>Aplicações</h3><p class="desc">Cadastro de destinos onde o material é aplicado/consumido (equipamentos, veículos, oficina, escritório/ADM, lavajato, diretoria). Informe a placa/tag quando houver.</p></div>`;
  if(!state.aplicacoes.length){ html+=`<div class="tbl-wrap"><div class="empty"><div class="ico">⚙</div>Nenhuma aplicação cadastrada.<br><button class="btn primary" onclick="aplicModal()">+ Cadastrar primeira</button></div></div>`; $('#view').innerHTML=html; return; }
  html+=`<div class="tbl-wrap"><table><thead><tr><th>Nome</th><th>Tipo</th><th>Placa / Tag</th><th class="num">Consumos</th><th></th></tr></thead><tbody>`;
  state.aplicacoes.forEach(a=>{ const usos=state.movements.filter(m=>m.tipo==='baixa'&&m.aplic===a.id).length;
    html+=`<tr><td><b>${esc(a.nome)}</b></td><td>${esc(aplicTipoLabel(a.tipo,a.sub))}</td><td class="mono">${esc(a.tag||'—')}</td><td class="num">${usos}</td>
    <td class="num" style="white-space:nowrap"><button class="btn ghost sm" onclick="aplicModal('${a.id}')">✎</button> <button class="btn danger sm" onclick="delAplic('${a.id}')">✕</button></td></tr>`; });
  html+=`</tbody></table></div>`;
  $('#view').innerHTML=html;
}
function aplicModal(id){ const a=id?state.aplicacoes.find(x=>x.id===id):null;
  modal(`<h3>${a?'Editar aplicação':'Nova aplicação'}</h3>
    <div class="field"><label>Tipo</label><select id="apTipo" onchange="apTipoChange()">${APLIC_TIPOS.map(x=>`<option value="${x[0]}"${a&&a.tipo===x[0]?' selected':''}>${esc(x[1])}</option>`).join('')}</select></div>
    <div id="apSubWrap" style="display:none"><div class="field"><label>Setor da sede</label><select id="apSub">${SEDE_SUB.map(x=>`<option value="${x[0]}"${a&&a.sub===x[0]?' selected':''}>${esc(x[1])}</option>`).join('')}</select></div><p class="desc" style="margin-top:-4px">O setor já identifica a aplicação — não precisa de nome nem placa.</p></div>
    <div id="apNomeWrap">
      <div class="field"><label>Nome / identificação</label><input id="apNome" value="${a&&a.tipo!=='sede'?esc(a.nome||''):''}" placeholder="Ex.: Escavadeira CAT 320 / Caminhão Mercedes"></div>
      <div class="field"><label>Placa / Tag (opcional)</label><input id="apTag" class="mono" value="${a?esc(a.tag||''):''}" placeholder="ABC-1D23 ou TAG-001"></div></div>
    <div style="display:flex;gap:10px;justify-content:flex-end"><button class="btn ghost" onclick="closeModal()">Cancelar</button><button class="btn primary" onclick="saveAplic('${id||''}')">Salvar</button></div>`);
  apTipoChange();
}
function apTipoChange(){ const sede=$('#apTipo')&&$('#apTipo').value==='sede'; if($('#apSubWrap'))$('#apSubWrap').style.display=sede?'':'none'; if($('#apNomeWrap'))$('#apNomeWrap').style.display=sede?'none':''; }
function saveAplic(id){ const tipo=$('#apTipo').value; let nome,tag='',sub='';
  if(tipo==='sede'){ sub=$('#apSub')?$('#apSub').value:''; if(!sub){toast('Escolha o setor da sede.','err');return;} const s=SEDE_SUB.find(x=>x[0]===sub); nome='SEDE — '+(s?s[1]:sub); }
  else { nome=$('#apNome').value.trim(); if(!nome){toast('Informe o nome.','err');return;} tag=$('#apTag').value.trim(); }
  if(id){ const a=state.aplicacoes.find(x=>x.id===id); a.nome=nome; a.tipo=tipo; a.tag=tag; a.sub=sub; } else { state.aplicacoes.push({id:uid(),nome,tipo,tag,sub}); }
  save(); closeModal(); renderAplic(); toast('Aplicação salva.','ok'); }
function delAplic(id){ const nm=aplicName(id); requireSupervisor(`Excluir aplicação "${nm}"`,()=>{ state.aplicacoes=state.aplicacoes.filter(a=>a.id!==id); save('Aplicação excluída: '+nm); renderAplic(); toast('Aplicação excluída.','ok'); }); }

function drawNfSearch(q){ const box=$('#nfSearchResults'); if(!box)return; const list=searchProducts(q).slice(0,8); if(!q||!list.length){box.innerHTML='';return;}
  box.innerHTML=`<div class="tbl-wrap" style="margin-top:10px"><table><tbody>`+list.map(p=>`<tr><td>${esc(p.desc)}<br><span class="muted" style="font-size:11px">${esc(p.code)}${p.aux?' · aux '+esc(p.aux):''} · saldo total ${numf(totalSaldo(p.code))} ${esc(p.unit||'')} · custo ${money(p.custo||0)}</span></td><td class="num" style="width:80px"><button class="btn ghost sm" onclick="addNfExisting('${esc(p.code)}')">+ Add</button></td></tr>`).join('')+`</tbody></table></div>`; }
function addNfExisting(code){ const p=findProduct(code); if(!p)return; const ex=nfItems.find(i=>i.code===code); if(ex){ex.qty=(ex.qty||0)+1;} else nfItems.push({code:p.code,desc:p.desc,unit:p.unit,qty:1,custo:p.custo||0,preco:p.preco||0}); if($('#nfSearch'))$('#nfSearch').value=''; if($('#nfSearchResults'))$('#nfSearchResults').innerHTML=''; drawNfItems(); if($('#nfSearch'))$('#nfSearch').focus(); }
function tagsOf(root,name){ let r=root.getElementsByTagName(name); if(r.length)return r; return root.getElementsByTagNameNS('*',name); }
function txt(root,name){ const n=tagsOf(root,name)[0]; return n?n.textContent.trim():''; }
function importXml(content){
  try{
    const doc=new DOMParser().parseFromString(content,'text/xml');
    if(doc.getElementsByTagName('parsererror').length){toast('XML inválido.','err');return;}
    const ide=tagsOf(doc,'ide')[0]; const nNF=ide?txt(ide,'nNF'):'';
    const emit=tagsOf(doc,'emit')[0]; const forn=emit?txt(emit,'xNome'):'';
    const dets=[...tagsOf(doc,'det')];
    if(!dets.length){toast('Não encontrei itens (det) no XML.','err');return;}
    let add=0;
    dets.forEach(det=>{ const prod=tagsOf(det,'prod')[0]; if(!prod)return;
      const cEAN=txt(prod,'cEAN'); const cProd=txt(prod,'cProd');
      const code=/^\d{8,14}$/.test(cEAN)?cEAN:(cProd||genCode());
      const qty=parseFloat(txt(prod,'qCom'))||parseFloat(txt(prod,'qTrib'))||0;
      const custo=parseFloat(txt(prod,'vUnCom'))||parseFloat(txt(prod,'vUnTrib'))||0;
      nfItems.push({code, desc:txt(prod,'xProd'), unit:(txt(prod,'uCom')||'UN').toUpperCase(), qty, custo, preco:0}); add++; });
    if(nNF&&$('#nfNum'))$('#nfNum').value=nNF; if(forn&&$('#nfForn'))$('#nfForn').value=forn;
    const dhEmi=ide?(txt(ide,'dhEmi')||txt(ide,'dEmi')):''; if(dhEmi&&$('#nfData'))$('#nfData').value=dhEmi.slice(0,10);
    const emitCnpj=emit?txt(emit,'CNPJ'):''; if(emitCnpj&&$('#nfCnpjEmit'))$('#nfCnpjEmit').value=emitCnpj;
    const dest=tagsOf(doc,'dest')[0]; const destDoc=dest?(txt(dest,'CNPJ')||txt(dest,'CPF')):''; if(destDoc&&$('#nfCnpjTom'))$('#nfCnpjTom').value=destDoc;
    if($('#xmlText'))$('#xmlText').value='';
    drawNfItems(); toast(`XML lido · ${add} item(ns) carregado(s).`,'ok');
  }catch(e){ toast('Erro ao ler XML: '+e.message,'err'); }
}
function addNfItem(){ const desc=$('#itDesc').value.trim(); const qty=parseFloat($('#itQty').value);
  if(!desc){toast('Informe a descrição.','err');return;} if(!(qty>0)){toast('Quantidade inválida.','err');return;}
  const refTxt=($('#itRef')?$('#itRef').value.trim():''); const aplicId=($('#itAplic')&&$('#itAplic').value)?$('#itAplic').value:'';
  let ref=refTxt; if(aplicId){const an=aplicName(aplicId); ref=(ref?ref+' · ':'')+'Aplicação: '+an;}
  nfItems.push({code:$('#itCode').value.trim(),desc,unit:$('#itUnit').value.trim()||'UN',qty,custo:parseFloat($('#itCusto').value)||0,preco:parseFloat($('#itPreco').value)||0,ref});
  ['itCode','itDesc','itUnit','itQty','itCusto','itPreco','itRef'].forEach(id=>{if($('#'+id))$('#'+id).value='';}); if($('#itCode'))$('#itCode').focus(); drawNfItems(); }
function rmNfItem(i){ nfItems.splice(i,1); drawNfItems(); }
function drawNfItems(){ const b=$('#nfBody'); if(!b)return;
  if(!nfItems.length){ b.innerHTML=`<tr><td colspan="6" class="empty" style="padding:24px">Nenhum item. Carregue um XML, busque no estoque ou adicione manualmente.</td></tr>`; $('#nfTotal').textContent='R$ 0,00'; return; }
  let tot=0; b.innerHTML=nfItems.map((it,i)=>{const t=(it.qty||0)*(it.custo||0);tot+=t;const ex=it.code&&findProduct(it.code);
    return `<tr><td class="mono">${it.code?esc(it.code):'<span class="muted">auto</span>'}${ex?' <span class="pill good" style="font-size:9px">existe</span>':''}</td><td>${esc(it.desc)}</td><td class="num"><input class="inline-edit" type="number" step="any" min="0" value="${it.qty}" oninput="setNfQty(${i},this.value)"></td><td class="num"><input class="inline-edit" type="number" step="any" min="0" value="${it.custo}" oninput="setNfCusto(${i},this.value)"></td><td class="num" id="nft_${i}">${money(t)}</td><td class="num"><button class="btn danger sm" onclick="rmNfItem(${i})">✕</button></td></tr>`;}).join('');
  $('#nfTotal').textContent=money(tot); }
function setNfQty(i,v){ if(nfItems[i])nfItems[i].qty=parseFloat(v)||0; refreshNfTotals(); }
function setNfCusto(i,v){ if(nfItems[i])nfItems[i].custo=parseFloat(v)||0; refreshNfTotals(); }
function refreshNfTotals(){ let tot=0; nfItems.forEach((it,i)=>{const t=(it.qty||0)*(it.custo||0);tot+=t;const c=$('#nft_'+i);if(c)c.textContent=money(t);}); if($('#nfTotal'))$('#nfTotal').textContent=money(tot); }
function processNf(force){
  if(!nfItems.length){toast('Adicione ao menos um item.','err');return;}
  const obra=$('#nfObra').value; const numero=$('#nfNum').value.trim()||'s/nº'; const forn=$('#nfForn').value.trim(); const dataEmissao=$('#nfData').value||'';
  const cnpjTom=$('#nfCnpjTom')?$('#nfCnpjTom').value.trim():''; const cnpjEmit=$('#nfCnpjEmit')?$('#nfCnpjEmit').value.trim():'';
  const totalCheck=nfItems.reduce((s,it)=>s+it.qty*it.custo,0);
  const dup=state.notas.find(n=>n.numero===numero && (n.forn||'')===forn && (n.cnpjTomador||'')===cnpjTom && (n.dataEmissao||'')===dataEmissao && Math.abs((n.valor||0)-totalCheck)<0.01);
  if(dup && !force){ modal(`<h3>⚠ Possível nota duplicada</h3><p class="mp">Já existe uma nota com <b>mesmo número, fornecedor, CNPJ do tomador, data de emissão e valor</b> (lançada em ${fmtDate(dup.ts)}, obra ${esc(obraName(dup.obra))}). Lançar mesmo assim?</p><div style="display:flex;gap:10px;justify-content:flex-end"><button class="btn ghost" onclick="closeModal()">Cancelar</button><button class="btn danger" onclick="closeModal();processNf(true)">Lançar assim mesmo</button></div>`); return; }
  const doc=`NF ${numero}${forn?' · '+forn:''}`; const notaId=uid(); const ts=Date.now();
  let alerts=[], total=0; const notaItens=[];
  nfItems.forEach(it=>{ let p=it.code?findProduct(it.code):null;
    if(!p){ const code=it.code||genCode(); p={code,desc:it.desc,unit:it.unit,aux:'',min:0,max:0,custo:0,preco:it.preco||0,ref:it.ref||''}; state.products.push(p); }
    else if(it.ref && !p.ref){ p.ref=it.ref; }
    const qAnt=totalSaldo(p.code);
    if(it.custo>0){ const novo=qAnt+it.qty; p.custo=novo>0?((qAnt*(p.custo||0))+(it.qty*it.custo))/novo:it.custo; }
    if(it.preco>0)p.preco=it.preco; if(it.desc&&p.desc!==it.desc)p.desc=it.desc;
    addSaldo(obra,p.code,it.qty); total+=it.qty*it.custo; notaItens.push({code:p.code,desc:p.desc,qty:it.qty,custo:it.custo,unit:p.unit});
    state.movements.unshift({id:uid(),ts,tipo:'entrada',obra,notaId,code:p.code,desc:p.desc,qty:it.qty,valorUnit:it.custo,valorTotal:it.qty*it.custo,doc,saldo:saldoOf(obra,p.code)});
    if(p.max>0&&saldoOf(obra,p.code)>p.max)alerts.push(`${p.desc}: ${numf(saldoOf(obra,p.code))} acima do máximo`);
  });
  state.notas.unshift({id:notaId,numero,forn,dataEmissao,cnpjTomador:cnpjTom,cnpjEmit,obra,valor:total,itens:notaItens,ts});
  save('Entrada NF '+numero+' em '+obraName(obra)); const n=nfItems.length; nfItems=[];
  toast(`Entrada em ${esc(obraName(obra))} · ${n} item(ns).`,'ok'); alerts.forEach(a=>toast('⚠ '+a,'warn'));
  go('produtos');
}

function updateSaidaTotal(){ const el=$('#saidaTotal'); if(!el)return; let t=0; saidaCart.forEach(i=>{const p=findProduct(i.code); t+=(i.qty||0)*((p&&p.custo)||0);}); el.textContent=money(t); }
function drawBaixaHist(){ const list=state.movements.filter(m=>m.tipo==='baixa').slice(0,40);

function drawScanResults(q){ const box=$('#scanResults'); if(!box)return; q=(q||'').trim(); if(!q){box.innerHTML='';return;}
  const o=curObra()==='__all'?state.obras[0].id:curObra();
  if(findByCodeOrAux(q)){ box.innerHTML=''; return; }
  const list=searchProducts(q).filter(p=>saldoOf(o,p.code)>0).slice(0,8); if(!list.length){box.innerHTML='';return;}
  box.innerHTML=`<div class="tbl-wrap" style="margin:6px 0 10px"><table><tbody>`+list.map(p=>`<tr><td>${esc(p.desc)}<br><span class="muted" style="font-size:11px">${esc(p.code)}${p.aux?' · aux '+esc(p.aux):''} · saldo ${numf(saldoOf(o,p.code))} ${esc(p.unit||'')}</span></td><td class="num" style="width:90px"><button class="btn ghost sm" onclick="lookupScanPick('${esc(p.code)}')">Selecionar</button></td></tr>`).join('')+`</tbody></table></div>`; }
function lookupScanPick(code){ if($('#scanResults'))$('#scanResults').innerHTML=''; lookupScan(code,true); }
function lookupScan(code,exactCode){ code=String(code).trim(); if(!code)return; const o=curObra()==='__all'?state.obras[0].id:curObra();
  let p=findByCodeOrAux(code) || (exactCode?findProduct(code):null); const fc=$('#foundCard');
  if(!p){ const list=searchProducts(code); if(list.length===1){p=list[0];} else if(list.length>1){ drawScanResults(code); toast('Vários itens encontrados — escolha na lista.','warn'); return; } }
  if(!p){ fc.className='found-card show'; fc.style.borderColor='var(--red)'; fc.innerHTML=`<div style="text-align:center;color:#c0392b">Nada encontrado para: <span class="mono">${esc(code)}</span></div>`; $('#scanInput').value=''; $('#scanInput').focus(); toast('Produto não encontrado.','err'); return; }
  if($('#scanResults'))$('#scanResults').innerHTML='';
  const s=saldoOf(o,p.code); const st=statusOf(p,s);
  if(s<=0){ baixaProduct=null; fc.className='found-card show'; fc.style.borderColor='var(--red)';
    fc.innerHTML=`<div class="fc-head"><div><div class="code">${esc(p.code)}${p.aux?' · aux '+esc(p.aux):''} · ${esc(obraName(o))}</div><div class="name">${esc(p.desc)}</div></div></div>
      <div style="background:#fdeaea;border:1px solid #e0a0a0;border-radius:8px;padding:10px 12px;margin-top:8px;font-size:12.5px;color:#a02525">⛔ Sem saldo em <b>${esc(obraName(o))}</b> — não é possível dar baixa.${obrasComSaldo(p.code)?`<br>Há saldo em: ${obrasComSaldo(p.code)}. Troque a obra no topo.`:''}</div>
      <div style="display:flex;justify-content:flex-end;margin-top:10px"><button class="btn ghost" onclick="cancelBaixa()">Fechar</button></div>`;
    $('#scanInput').value=''; $('#scanInput').focus(); toast('Item zerado nesta obra — não pode ser baixado.','warn'); return; }
  baixaProduct=p;
  fc.style.borderColor='var(--amber)'; fc.className='found-card show';
  fc.innerHTML=`<div class="fc-head"><div><div class="code">${esc(p.code)}${p.aux?' · aux '+esc(p.aux):''} · ${esc(obraName(o))}</div><div class="name">${esc(p.desc)}</div></div>${st==='low'?'<span class="pill low">Abaixo do mín</span>':st==='high'?'<span class="pill high">Acima do máx</span>':'<span class="pill good">Normal</span>'}</div>
    <div class="fc-stats"><div class="fc-stat"><div class="l">Saldo na obra</div><div class="v">${numf(s)} <span style="font-size:11px">${esc(p.unit||'')}</span></div></div><div class="fc-stat"><div class="l">Custo médio</div><div class="v" style="font-size:15px">${money(p.custo||0)}</div></div><div class="fc-stat"><div class="l">Preço venda</div><div class="v" style="font-size:15px">${p.preco?money(p.preco):'—'}</div></div></div>
    <div class="field" style="margin:8px 0 0"><label>Quantidade a dar baixa</label><input id="baixaQty" type="number" step="any" min="0" max="${s}" autofocus></div>
    <div style="display:flex;gap:10px;justify-content:flex-end;margin-top:14px"><button class="btn ghost" onclick="cancelBaixa()">Cancelar</button><button class="btn primary" onclick="addScanToCart()">+ Adicionar à lista</button></div>`;
  $('#scanInput').value=''; const bq=$('#baixaQty'); bq.focus(); bq.addEventListener('keydown',e=>{if(e.key==='Enter'){e.preventDefault();addScanToCart();}});
}
function addScanToCart(){ const p=baixaProduct; if(!p)return; const o=curObra()==='__all'?state.obras[0].id:curObra();
  const qty=parseFloat($('#baixaQty').value); if(!(qty>0)){toast('Informe a quantidade.','err');return;}
  const s=saldoOf(o,p.code); const ex=saidaCart.find(i=>i.code===p.code); const have=ex?(ex.qty||0):0;
  if(have+qty>s){toast(`Saldo insuficiente: ${p.desc} (disponível ${numf(s)}).`,'err');return;}
  if(ex)ex.qty=have+qty; else saidaCart.push({code:p.code,qty});
  baixaProduct=null; const fc=$('#foundCard'); if(fc)fc.className='found-card'; drawSaidaCart(o);
  if($('#scanInput')){$('#scanInput').value='';$('#scanInput').focus();} }
function cancelBaixa(){ baixaProduct=null; const fc=$('#foundCard'); if(fc)fc.className='found-card'; if($('#scanInput'))$('#scanInput').focus(); }

function drawSaidaResults(q,o){ const box=$('#saidaResults'); if(!box)return; const list=searchProducts(q).filter(p=>saldoOf(o,p.code)>0).slice(0,8);
  if(!q||!list.length){ box.innerHTML=q&&!list.length?`<div class="muted" style="font-size:12px;padding:8px 2px">Nenhum item com saldo nesta obra.</div>`:''; return; }

function addSaida(code){ const o=curObra()==='__all'?state.obras[0].id:curObra(); if(saldoOf(o,code)<=0){toast('Item sem saldo nesta obra.','err');return;} if(!saidaCart.some(i=>i.code===code))saidaCart.push({code,qty:1}); if($('#saidaSearch'))$('#saidaSearch').value=''; if($('#saidaResults'))$('#saidaResults').innerHTML=''; drawSaidaCart(o); if($('#saidaSearch'))$('#saidaSearch').focus(); }
function rmSaida(code){ saidaCart=saidaCart.filter(i=>i.code!==code); const o=curObra()==='__all'?state.obras[0].id:curObra(); drawSaidaCart(o); }
function setSaidaQty(code,v){ const it=saidaCart.find(i=>i.code===code); if(it)it.qty=parseFloat(v)||0; const p=findProduct(code); const cell=$('#sv_'+CSS.escape(code)); if(cell&&p)cell.textContent=money((it?it.qty:0)*((p.custo)||0)); updateSaidaTotal(); }
function drawSaidaCart(o){ const b=$('#saidaCartBody'); if(!b)return;
  if(!saidaCart.length){ b.innerHTML=`<tr><td colspan="5" class="empty" style="padding:20px">Nenhum item. Pesquise acima e adicione.</td></tr>`; updateSaidaTotal(); return; }
  b.innerHTML=saidaCart.map(i=>{const p=findProduct(i.code);const s=saldoOf(o,i.code);const tot=(i.qty||0)*((p.custo)||0);return `<tr><td>${esc(p.desc)}<br><span class="muted" style="font-size:11px">${esc(p.code)}${p.aux?' · aux '+esc(p.aux):''}</span></td><td class="num ${s<=0?'neg':''}">${numf(s)} ${esc(p.unit||'')}</td><td class="num"><input class="inline-edit" type="number" step="any" min="0" value="${i.qty}" oninput="setSaidaQty('${esc(i.code)}',this.value)"></td><td class="num" id="sv_${esc(i.code)}">${money(tot)}</td><td class="num"><button class="btn danger sm" onclick="rmSaida('${esc(i.code)}')">✕</button></td></tr>`;}).join(''); updateSaidaTotal(); }
function confirmSaida(){ const o=curObra()==='__all'?state.obras[0].id:curObra(); if(!saidaCart.length){toast('Adicione itens à saída.','err');return;}
  const itens=saidaCart.filter(i=>i.qty>0); if(!itens.length){toast('Informe as quantidades.','err');return;}
  if(!state.aplicacoes.length){toast('Cadastre uma aplicação antes da saída.','err');return;}
  const aplic=($('#saidaAplic')?$('#saidaAplic').value:''); if(!aplic){toast('Informe a aplicação (obrigatório).','err'); if($('#saidaAplic'))$('#saidaAplic').focus(); return;}
  const resp=($('#saidaResp')?$('#saidaResp').value.trim():''); const obs=($('#saidaObs')?$('#saidaObs').value.trim():''); const wantReport=$('#saidaReport')&&$('#saidaReport').checked;
  const seq=++state.seq.baixa; const baixaId=uid(); const doc=`Baixa Nº ${seqf(seq)}`+(resp?' · '+resp:''); const repItens=[];
  itens.forEach(i=>{const p=findProduct(i.code); const vu=p.custo||0; addSaldo(o,p.code,-i.qty);
    state.movements.unshift({id:uid(),ts:Date.now(),seq,baixaId,tipo:'baixa',obra:o,aplic,obs,code:p.code,desc:p.desc,qty:i.qty,valorUnit:vu,valorTotal:i.qty*vu,doc,saldo:saldoOf(o,p.code)});
    repItens.push({code:p.code,aux:p.aux,desc:p.desc,qty:i.qty,unit:p.unit,valor:vu}); });
  save('Baixa Nº '+seqf(seq)+' · '+itens.length+' item(ns) em '+obraName(o)); toast(`Saída Nº ${seqf(seq)} · ${itens.length} item(ns) em ${esc(obraName(o))}.`,'ok');
  itens.forEach(i=>{const p=findProduct(i.code); if(saldoOf(o,p.code)<=p.min)toast(`⚠ ${p.desc} no mínimo (${numf(saldoOf(o,p.code))}).`,'warn');});
  if(wantReport)printSignReport({titulo:'Comprovante de Saída de Material',numero:seqf(seq),subtitulo:'Baixa de estoque',data:fmtDate(Date.now()),obra:obraName(o),aplicacao:aplicName(aplic),doc,responsavel:resp,obs,itens:repItens,assinaturas:['Solicitante','Responsável pelo almoxarifado','Recebedor']});
  saidaCart=[]; drawBaixaHist(); setBaixaMode(baixaMode); }

    (data||[]).map(r=>`<tr><td class="mono">REQ-${String(r.id).padStart(5,'0')}</td><td class="muted" style="font-size:12px">${fmtDate(new Date(r.criado_em).getTime())}</td><td>${esc(r.obra_nome)}</td><td>${r.itens.map(i=>esc(i.desc)+' ('+numf(i.qty)+' '+esc(i.unit||'')+')').join(', ')}</td><td><span class="pill ${r.status}">${reqStatusLabel(r.status)}</span>${r.motivo_rejeicao?`<br><span class="muted" style="font-size:11px">motivo: ${esc(r.motivo_rejeicao)}</span>`:''}</td><td class="num">${r.status==='pendente'?`<button class="btn ghost sm" onclick="cancelarRequisicao(${r.id})">Cancelar</button>`:''}</td></tr>`).join('')||`<tr><td colspan="6" class="empty" style="padding:24px">Nenhum pedido ainda.</td></tr>`}</tbody></table></div>`; }
function reqStatusLabel(s){ return {pendente:'Pendente',aprovada:'Aprovada',rejeitada:'Rejeitada',cancelada:'Cancelada'}[s]||s; }
async function cancelarRequisicao(id){ const {error}=await sb.from('requisicoes').update({status:'cancelada'}).eq('id',id); if(error){toast('Erro: '+error.message,'err');return;} toast('Requisição cancelada.','warn'); drawReqMeus(); refreshAprovBadge(); }

  <div class="sechead"><h3>Decididas recentemente</h3></div><div class="tbl-wrap" id="aprovHist"><div class="empty">Carregando...</div></div>`;

async function drawAprovPend(){ const box=$('#aprovPend'); if(!box)return;
  const {data,error}=await sb.from('requisicoes').select('*').eq('status','pendente').order('criado_em',{ascending:true});
  if(error){box.innerHTML='<div class="empty">Erro: '+esc(error.message)+'</div>';return;}
  box.innerHTML=`<table><thead><tr><th>Nº</th><th>Data</th><th>Obra</th><th>Solicitante</th><th>Itens</th><th>Observação</th><th></th></tr></thead><tbody>${
    (data||[]).map(r=>`<tr><td class="mono">REQ-${String(r.id).padStart(5,'0')}</td><td class="muted" style="font-size:12px">${fmtDate(new Date(r.criado_em).getTime())}</td><td>${esc(r.obra_nome)}</td><td>${esc(r.solicitante_nome)}</td><td>${r.itens.map(i=>esc(i.desc)+' ('+numf(i.qty)+' '+esc(i.unit||'')+')').join(', ')}</td><td class="muted" style="font-size:12px">${esc(r.observacao||'—')}</td><td class="num" style="white-space:nowrap"><button class="btn primary sm" onclick="aprovarRequisicao(${r.id})">✔ Aprovar</button> <button class="btn danger sm" onclick="rejeitarRequisicao(${r.id})">✕ Rejeitar</button></td></tr>`).join('')||`<tr><td colspan="7" class="empty" style="padding:24px">Nenhum pedido pendente.</td></tr>`}</tbody></table>`; }
async function drawAprovHist(){ const box=$('#aprovHist'); if(!box)return;
  const {data,error}=await sb.from('requisicoes').select('*').neq('status','pendente').order('decidido_em',{ascending:false}).limit(40);
  if(error){box.innerHTML='<div class="empty">Erro: '+esc(error.message)+'</div>';return;}
  box.innerHTML=`<table><thead><tr><th>Nº</th><th>Obra</th><th>Solicitante</th><th>Situação</th><th>Decidido por</th><th>Quando</th></tr></thead><tbody>${
    (data||[]).map(r=>`<tr><td class="mono">REQ-${String(r.id).padStart(5,'0')}</td><td>${esc(r.obra_nome)}</td><td>${esc(r.solicitante_nome)}</td><td><span class="pill ${r.status}">${reqStatusLabel(r.status)}</span>${r.motivo_rejeicao?`<br><span class="muted" style="font-size:11px">${esc(r.motivo_rejeicao)}</span>`:''}</td><td>${esc(r.decidido_por_nome||'—')}</td><td class="muted" style="font-size:12px">${r.decidido_em?fmtDate(new Date(r.decidido_em).getTime()):'—'}</td></tr>`).join('')||`<tr><td colspan="6" class="empty" style="padding:24px">Nenhuma decisão ainda.</td></tr>`}</tbody></table>`; }
async function aprovarRequisicao(id){
  const {data:r,error:e1}=await sb.from('requisicoes').select('*').eq('id',id).maybeSingle();
  if(e1||!r){toast('Erro ao carregar pedido.','err');return;}
  const faltando=r.itens.filter(i=>{const p=findProduct(i.code); return !p||saldoOf(r.obra_id,i.code)<i.qty;});
  if(faltando.length){ toast('Saldo insuficiente para: '+faltando.map(i=>i.desc).join(', ')+'. Faça uma entrada antes de aprovar.','err'); return; }
  const seq=++state.seq.baixa; const baixaId=uid(); const doc=`Requisição REQ-${String(r.id).padStart(5,'0')} aprovada · ${r.solicitante_nome}`;
  r.itens.forEach(i=>{ const p=findProduct(i.code); const vu=p.custo||0; addSaldo(r.obra_id,p.code,-i.qty);
    state.movements.unshift({id:uid(),ts:Date.now(),seq,baixaId,tipo:'baixa',obra:r.obra_id,aplic:'',obs:'Requisição REQ-'+String(r.id).padStart(5,'0'),code:p.code,desc:p.desc,qty:i.qty,valorUnit:vu,valorTotal:i.qty*vu,doc,saldo:saldoOf(r.obra_id,p.code)}); });
  await save('Requisição REQ-'+String(r.id).padStart(5,'0')+' aprovada ('+r.obra_nome+')');
  const {error:e2}=await sb.from('requisicoes').update({status:'aprovada',decidido_por:session.user.id,decidido_por_nome:profile.nome||profile.email,decidido_em:new Date().toISOString()}).eq('id',id);
  if(e2){toast('Baixa feita, mas houve erro ao marcar a requisição: '+e2.message,'err');return;}
  toast('Requisição aprovada e baixa lançada.','ok'); drawAprovPend(); drawAprovHist(); refreshAprovBadge(); }
function rejeitarRequisicao(id){ modal(`<h3>Rejeitar requisição</h3><p class="mp">Informe o motivo (visível ao solicitante).</p><div class="field"><textarea id="rjMotivo" rows="3" autofocus></textarea></div><div style="display:flex;gap:10px;justify-content:flex-end"><button class="btn ghost" onclick="closeModal()">Cancelar</button><button class="btn danger" id="rjOk">Rejeitar</button></div>`);
  $('#rjOk').onclick=async()=>{ const motivo=$('#rjMotivo').value.trim(); if(!motivo){toast('Informe o motivo.','err');return;}
    const {error}=await sb.from('requisicoes').update({status:'rejeitada',motivo_rejeicao:motivo,decidido_por:session.user.id,decidido_por_nome:profile.nome||profile.email,decidido_em:new Date().toISOString()}).eq('id',id);
    if(error){toast('Erro: '+error.message,'err');return;} closeModal(); toast('Requisição rejeitada.','warn'); drawAprovPend(); drawAprovHist(); refreshAprovBadge(); }; }

let _auditRows=[];
async function renderAuditoria(){
  if(!isEncarregado()){ $('#view').innerHTML='<div class="tbl-wrap"><div class="empty">Acesso restrito a encarregados/administradores.</div></div>'; return; }
  const d2=new Date(),d1=new Date(); d1.setDate(d1.getDate()-30);
  $('#view').innerHTML=`<div class="panel" style="margin-bottom:16px"><div class="row c4">
    <div class="field" style="margin:0"><label>De</label><input id="auFrom" type="date" value="${d1.toISOString().slice(0,10)}"></div>
    <div class="field" style="margin:0"><label>Até</label><input id="auTo" type="date" value="${d2.toISOString().slice(0,10)}"></div>
    <div class="field" style="margin:0"><label>Ação contém</label><input id="auAcao" placeholder="ex.: baixa, requisicao, exclu..."></div>
    <div class="field" style="margin:0;align-self:end;display:flex;gap:8px"><button class="btn ghost sm" onclick="drawAuditoria()">Filtrar</button><button class="btn dark sm" onclick="exportAuditoria()">⭳ Excel</button></div>
  </div></div><div class="tbl-wrap" id="auditView"><div class="empty">Carregando...</div></div>`;

}
async function drawAuditoria(){ const box=$('#auditView'); if(!box)return;
  const f=$('#auFrom').value?new Date($('#auFrom').value+'T00:00:00').toISOString():null;
  const t=$('#auTo').value?new Date($('#auTo').value+'T23:59:59').toISOString():null;
  let q=sb.from('audit_log').select('*').order('criado_em',{ascending:false}).limit(500);
  if(f)q=q.gte('criado_em',f); if(t)q=q.lte('criado_em',t);
  const {data,error}=await q; if(error){box.innerHTML='<div class="empty">Erro: '+esc(error.message)+'</div>';return;}
  const filtro=($('#auAcao').value||'').toLowerCase().trim();
  _auditRows=(data||[]).filter(r=>!filtro||String(r.acao).toLowerCase().includes(filtro));
  box.innerHTML=`<table><thead><tr><th>Quando</th><th>Usuário</th><th>Papel</th><th>Ação</th><th>Entidade</th><th>Detalhes</th></tr></thead><tbody>${
    _auditRows.map(r=>`<tr><td class="muted" style="font-size:12px">${fmtDate(new Date(r.criado_em).getTime())}</td><td>${esc(r.usuario_nome||'—')}</td><td>${papelLabel(r.papel||'')}</td><td>${esc(r.acao)}</td><td class="mono" style="font-size:11px">${esc(r.entidade||'—')}${r.entidade_id?' · '+esc(r.entidade_id):''}${r.key_afetada?' · '+esc(r.key_afetada):''}</td><td class="mono" style="font-size:10.5px;max-width:260px;white-space:normal">${r.detalhes?esc(JSON.stringify(r.detalhes)):''}</td></tr>`).join('')||`<tr><td colspan="6" class="empty" style="padding:24px">Nenhum evento no período.</td></tr>`}</tbody></table>`; }
function exportAuditoria(){ if(!_auditRows.length){toast('Nada para exportar.','err');return;}
  const rows=_auditRows.map(r=>({Quando:fmtDate(new Date(r.criado_em).getTime()),Usuario:r.usuario_nome,Papel:r.papel,Acao:r.acao,Entidade:r.entidade,EntidadeId:r.entidade_id,Detalhes:r.detalhes?JSON.stringify(r.detalhes):''}));
  const ws=XLSX.utils.json_to_sheet(rows); const wb=XLSX.utils.book_new(); XLSX.utils.book_append_sheet(wb,ws,'Auditoria');
  XLSX.writeFile(wb,'auditoria_estoque_'+new Date().toISOString().slice(0,10)+'.xlsx'); }

/* ===== TRANSFERÊNCIA ===== */
let trCart=[];
function renderTransfer(){
  if(needObra())return;
  if(state.obras.length<2){ $('#view').innerHTML=`<div class="tbl-wrap"><div class="empty"><div class="ico">⇄</div>Você precisa de pelo menos <b>2 obras</b> para transferir.<br><button class="btn primary" onclick="go('obras')">+ Cadastrar obra</button></div></div>`; return; }
  const cur=curObra()==='__all'?state.obras[0].id:curObra();
  $('#view').innerHTML=`
  <div class="panel"><h3>Transferir entre obras (romaneio)</h3><p class="desc">Selecione origem e destino, adicione vários itens e gere um romaneio único para assinatura.</p>
    <div class="row c2"><div class="field"><label>Obra origem</label><select id="trOrig" onchange="drawTrCart()">${obraOptions(cur,false)}</select></div><div class="field"><label>Obra destino</label><select id="trDest">${obraOptions(state.obras.find(o=>o.id!==cur)?.id,false)}</select></div></div>
    <div class="field" style="margin:0"><label>Produto (nome, código de barras ou auxiliar)</label><input id="trScan" placeholder="Leia o código ou digite para pesquisar"></div>
    <div id="trResults"></div>
    <div class="tbl-wrap" style="margin-top:14px"><table><thead><tr><th>Produto</th><th class="num">Saldo origem</th><th class="num">Qtd</th><th class="num">Valor</th><th></th></tr></thead><tbody id="trCartBody"></tbody></table></div>
    <div style="text-align:right;margin-top:6px;font-size:13px;color:#5a544a">Valor total: <b id="trTotal" class="mono">R$ 0,00</b></div>
    <div class="field" style="margin-top:10px"><label>Observação (opcional)</label><textarea id="trObs" rows="2" placeholder="Ex.: motivo, transportador... (Enter = nova linha)"></textarea></div>
    <div style="display:flex;justify-content:space-between;align-items:center;margin-top:14px;flex-wrap:wrap;gap:10px">
      <label style="display:flex;align-items:center;gap:8px;text-transform:none;font-weight:500;font-size:13px;margin:0;color:#1c1c1c"><input type="checkbox" id="trReport" checked style="width:auto"> Gerar romaneio para assinatura</label>
      <button class="btn primary" onclick="confirmTransfer()">⇄ Transferir e gerar romaneio</button></div>
  </div>
  <div class="sechead" style="margin-top:24px"><h3>Últimas transferências</h3></div>
  <div class="tbl-wrap"><table><thead><tr><th>Data</th><th>Nº</th><th>De → Para</th><th>Produto</th><th class="num">Qtd</th><th class="num">Valor</th><th></th></tr></thead><tbody id="trHist"></tbody></table></div>`;
  drawTrHist(); drawTrCart(); const inp=$('#trScan'); inp.focus();
  inp.oninput=e=>drawTrResults(e.target.value);
  inp.addEventListener('keydown',e=>{if(e.key==='Enter'){e.preventDefault(); const ex=findByCodeOrAux(inp.value.trim()); if(ex){addTr(ex.code);return;} const list=searchProducts(inp.value); if(list.length===1)addTr(list[0].code); else if(!list.length)toast('Nada encontrado.','err'); }});
}
function trOrigId(){ return $('#trOrig')?$('#trOrig').value:(state.obras[0]&&state.obras[0].id); }
function drawTrResults(q){ const box=$('#trResults'); if(!box)return; const orig=trOrigId(); const list=searchProducts(q).filter(p=>saldoOf(orig,p.code)>0).slice(0,8); if(!q){box.innerHTML='';return;} if(!list.length){box.innerHTML=`<div class="muted" style="font-size:12px;padding:8px 2px">Nenhum item com saldo na obra de origem.</div>`;return;}
  box.innerHTML=`<div class="tbl-wrap" style="margin-top:10px"><table><tbody>`+list.map(p=>`<tr><td>${esc(p.desc)}<br><span class="muted" style="font-size:11px">${esc(p.code)}${p.aux?' · aux '+esc(p.aux):''} · saldo ${numf(saldoOf(orig,p.code))} ${esc(p.unit||'')}</span></td><td class="num" style="width:80px"><button class="btn ghost sm" onclick="addTr('${esc(p.code)}')">+ Add</button></td></tr>`).join('')+`</tbody></table></div>`; }
function addTr(code){ const orig=trOrigId(); if(saldoOf(orig,code)<=0){toast('Item sem saldo na obra de origem.','err');return;} if(!trCart.some(i=>i.code===code))trCart.push({code,qty:1}); if($('#trScan'))$('#trScan').value=''; if($('#trResults'))$('#trResults').innerHTML=''; drawTrCart(); if($('#trScan'))$('#trScan').focus(); }
function rmTr(code){ trCart=trCart.filter(i=>i.code!==code); drawTrCart(); }
function setTrQty(code,v){ const it=trCart.find(i=>i.code===code); if(it)it.qty=parseFloat(v)||0; const p=findProduct(code); const cell=$('#tv_'+CSS.escape(code)); if(cell&&p)cell.textContent=money((it?it.qty:0)*((p.custo)||0)); updateTrTotal(); }
function updateTrTotal(){ const el=$('#trTotal'); if(!el)return; let t=0; trCart.forEach(i=>{const p=findProduct(i.code); t+=(i.qty||0)*((p&&p.custo)||0);}); el.textContent=money(t); }
function drawTrCart(){ const b=$('#trCartBody'); if(!b)return; const orig=trOrigId();
  if(!trCart.length){ b.innerHTML=`<tr><td colspan="5" class="empty" style="padding:20px">Nenhum item. Pesquise acima e adicione.</td></tr>`; updateTrTotal(); return; }
  b.innerHTML=trCart.map(i=>{const p=findProduct(i.code);const s=saldoOf(orig,i.code);const tot=(i.qty||0)*((p.custo)||0);return `<tr><td>${esc(p.desc)}<br><span class="muted" style="font-size:11px">${esc(p.code)}${p.aux?' · aux '+esc(p.aux):''}</span></td><td class="num ${i.qty>s?'neg':''}">${numf(s)} ${esc(p.unit||'')}</td><td class="num"><input class="inline-edit" type="number" step="any" min="0" value="${i.qty}" oninput="setTrQty('${esc(i.code)}',this.value)"></td><td class="num" id="tv_${esc(i.code)}">${money(tot)}</td><td class="num"><button class="btn danger sm" onclick="rmTr('${esc(i.code)}')">✕</button></td></tr>`;}).join(''); updateTrTotal(); }
function drawTrHist(){ const list=state.movements.filter(m=>m.tipo==='transferencia').slice(0,40);
  $('#trHist').innerHTML=list.length?list.map(m=>`<tr><td class="muted" style="font-size:12px">${fmtDate(m.ts)}</td><td class="mono">${m.seq?seqf(m.seq):'—'}</td><td style="font-size:12.5px">${esc(obraName(m.obra))} → ${esc(obraName(m.obraDest))}</td><td>${esc(m.desc)}${m.obs?`<br><span class="muted" style="font-size:11px">obs: ${esc(m.obs)}</span>`:''}</td><td class="num"><span class="pill tr">${numf(m.qty)}</span></td><td class="num">${money(m.valorTotal)}</td><td class="num"><button class="btn ghost sm" title="Romaneio (agrupado)" onclick="reportRomaneio('${m.romaneioId||m.id}')">🖨</button> <button class="btn danger sm" title="Excluir e estornar (supervisor)" onclick="delTrMov('${m.id}')">🗑</button></td></tr>`).join(''):`<tr><td colspan="7" class="empty" style="padding:24px">Nenhuma transferência.</td></tr>`; }
function delTrMov(id){ const m=state.movements.find(x=>x.id===id&&x.tipo==='transferencia'); if(!m)return; requireSupervisor('Excluir transferência Nº '+seqf(m.seq),()=>{ addSaldo(m.obra,m.code,m.qty); addSaldo(m.obraDest,m.code,-m.qty); state.movements=state.movements.filter(x=>x.id!==id); save('Transferência Nº '+seqf(m.seq)+' excluída e estornada'); drawTrHist(); toast('Transferência excluída e estornada.','warn'); }); }
function confirmTransfer(){ const orig=$('#trOrig').value, dest=$('#trDest').value;
  if(orig===dest){toast('Origem e destino devem ser diferentes.','err');return;}
  if(!trCart.length){toast('Adicione itens.','err');return;}
  const itens=trCart.filter(i=>i.qty>0); if(!itens.length){toast('Informe as quantidades.','err');return;}
  for(const i of itens){ const s=saldoOf(orig,i.code); if(i.qty>s){const p=findProduct(i.code); toast(`Saldo insuficiente: ${p.desc} (${numf(s)}).`,'err'); return;} }
  const wantReport=$('#trReport')&&$('#trReport').checked; const obs=($('#trObs')?$('#trObs').value.trim():''); const seq=++state.seq.transfer; const romaneioId=uid(); const ts=Date.now(); const repItens=[];
  itens.forEach(i=>{const p=findProduct(i.code); const vu=p.custo||0; addSaldo(orig,p.code,-i.qty); addSaldo(dest,p.code,i.qty);
    state.movements.unshift({id:uid(),ts,seq,romaneioId,tipo:'transferencia',obra:orig,obraDest:dest,obs,code:p.code,desc:p.desc,qty:i.qty,valorUnit:vu,valorTotal:i.qty*vu,doc:`Romaneio Nº ${seqf(seq)} · ${obraName(orig)} → ${obraName(dest)}`,saldo:saldoOf(orig,p.code),saldoDest:saldoOf(dest,p.code)});
    repItens.push({code:p.code,aux:p.aux,desc:p.desc,qty:i.qty,unit:p.unit,valor:vu}); });
  save('Transferência Nº '+seqf(seq)+' · '+obraName(orig)+' → '+obraName(dest)); toast(`Romaneio Nº ${seqf(seq)} · ${itens.length} item(ns) · ${esc(obraName(orig))} → ${esc(obraName(dest))}`,'ok');
  if(wantReport)printSignReport({titulo:'Romaneio de Transferência de Estoque',numero:seqf(seq),conferencia:true,recebimento:true,subtitulo:'Movimentação entre obras',data:fmtDate(ts),obra:obraName(orig),obraDest:obraName(dest),obs,itens:repItens,assinaturas:['Responsável obra origem','Responsável obra destino','Transportador / Conferente']});
  trCart=[]; drawTrCart(); drawTrHist(); if($('#trScan'))$('#trScan').focus(); }
function reportRomaneio(id){ const ms=state.movements.filter(m=>m.tipo==='transferencia'&&(m.romaneioId||m.id)===id); if(!ms.length)return; const m0=ms[0];
  const itens=ms.map(m=>{const p=findProduct(m.code); return {code:m.code,aux:p?p.aux:'',desc:m.desc,qty:m.qty,unit:p?p.unit:'',valor:m.valorUnit};});
  printSignReport({titulo:'Romaneio de Transferência de Estoque',numero:seqf(m0.seq),conferencia:true,recebimento:true,subtitulo:'Movimentação entre obras',data:fmtDate(m0.ts),obra:obraName(m0.obra),obraDest:obraName(m0.obraDest),obs:m0.obs,itens,assinaturas:['Responsável obra origem','Responsável obra destino','Transportador / Conferente']}); }

/* ===== CONSULTA ===== */
function renderConsulta(){ $('#view').innerHTML=`<div class="panel"><h3>Consultar produto</h3><p class="desc">Busque por <b>nome</b> ou <b>código de barras</b>. Veja saldo por obra e valores de entrada e saída.</p><div class="search" style="max-width:none"><span class="si">⌕</span><input id="consInput" placeholder="Nome ou código..." autocomplete="off"></div></div><div id="consResult"></div>`;
  const inp=$('#consInput'); inp.focus(); inp.addEventListener('keydown',e=>{if(e.key==='Enter'){const p=findProduct(inp.value.trim());if(p){showConsulta(p);return;}}}); inp.oninput=()=>drawConsList(inp.value); drawConsList(''); }
function drawConsList(q){ q=q.toLowerCase().trim(); const box=$('#consResult');
  const list=q?state.products.filter(p=>p.desc.toLowerCase().includes(q)||String(p.code).includes(q)||(p.aux&&String(p.aux).toLowerCase().includes(q))||(p.ref&&p.ref.toLowerCase().includes(q))):state.products.slice();
  if(!state.products.length){ box.innerHTML=`<div class="tbl-wrap"><div class="empty"><div class="ico">⌕</div>Nenhum produto cadastrado.</div></div>`; return; }

let importRows=[];
const COLMAP={codigo:'code','código':'code',code:'code',descricao:'desc','descrição':'desc',produto:'desc',nome:'desc',unidade:'unit',unid:'unit',un:'unit',quantidade:'qty',qtd:'qty',saldo:'qty',estoque:'qty',minimo:'min','mínimo':'min',min:'min',maximo:'max','máximo':'max',max:'max',custo:'custo','custo unitario':'custo',valor:'custo',preco:'preco','preço':'preco',venda:'preco',referencia:'ref','referência':'ref',aplicacao:'ref','aplicação':'ref','codigo auxiliar':'aux','código auxiliar':'aux','cod auxiliar':'aux',auxiliar:'aux','codigo outro sistema':'aux','outro sistema':'aux'};
function renderImportar(){ if(needObra())return;
  $('#view').innerHTML=`<div class="panel"><h3>Carga inicial por planilha</h3><p class="desc">Importe Excel/CSV para a obra selecionada. Produtos existentes têm o saldo <b>somado</b> na obra.</p>
    <button class="btn dark sm" onclick="downloadTemplate()">↓ Baixar modelo em Excel (.xlsx)</button>
    <div class="field" style="max-width:340px;margin-top:14px"><label>Obra de destino</label><select id="impObra">${obraOptions(curObra()==='__all'?(state.obras[0]&&state.obras[0].id):curObra(),false)}</select></div>
    <div class="filebox" onclick="document.getElementById('fileInput').click()"><div class="ico">↥</div><b>Selecionar planilha</b><br><span class="muted" style="font-size:12px">.xlsx, .xls ou .csv</span><input type="file" id="fileInput" accept=".xlsx,.xls,.csv" style="display:none"></div>
    <div class="help"><b>Colunas:</b> <code>codigo</code> · <code>codigo auxiliar</code> · <code>descricao</code> · <code>unidade</code> · <code>quantidade</code> · <code>minimo</code> · <code>maximo</code> · <code>custo</code> · <code>preco</code> · <code>referencia</code><br>Código vazio gera etiqueta automática.</div></div>
    <div id="importPreview"></div>`;
  $('#fileInput').onchange=handleFile; }
function handleFile(e){ const f=e.target.files[0]; if(!f)return; const r=new FileReader();
  r.onload=ev=>{ try{ const wb=XLSX.read(ev.target.result,{type:'binary'}); const json=XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]],{defval:''});
    if(!json.length){toast('Planilha vazia.','err');return;}
    importRows=json.map(row=>{ const o={}; Object.keys(row).forEach(k=>{const key=COLMAP[String(k).trim().toLowerCase().replace(/\s+/g,' ')]; if(key)o[key]=row[k];});
      const num=v=>parseFloat(String(v).replace(',','.'))||0;
      return {code:String(o.code||'').trim(),desc:String(o.desc||'').trim(),unit:String(o.unit||'UN').trim()||'UN',aux:String(o.aux||'').trim(),qty:num(o.qty),min:num(o.min),max:num(o.max),custo:num(o.custo),preco:num(o.preco),ref:String(o.ref||'').trim()}; }).filter(r=>r.desc);
    previewImport(); }catch(err){toast('Erro: '+err.message,'err');} };
  r.readAsBinaryString(f); }
function previewImport(){ if(!importRows.length){toast('Nenhuma linha válida.','err');return;} const box=$('#importPreview');
  box.innerHTML=`<div class="sechead"><h3>Pré-visualização · ${importRows.length} linha(s) → ${esc(obraName($('#impObra').value))}</h3><button class="btn primary sm" onclick="commitImport()">✓ Confirmar</button></div>
  <div class="tbl-wrap"><table><thead><tr><th>Código</th><th>Descrição</th><th>Un.</th><th class="num">Qtd</th><th class="num">Mín</th><th class="num">Máx</th><th class="num">Custo</th><th>Ação</th></tr></thead><tbody>`+importRows.map(r=>{const ex=r.code&&findProduct(r.code);return `<tr><td class="mono">${r.code?esc(r.code):'<span class="muted">auto</span>'}</td><td>${esc(r.desc)}</td><td>${esc(r.unit)}</td><td class="num">${numf(r.qty)}</td><td class="num">${numf(r.min)}</td><td class="num">${r.max>0?numf(r.max):'—'}</td><td class="num">${money(r.custo)}</td><td>${ex?'<span class="pill high">Atualiza</span>':'<span class="pill good">Novo</span>'}</td></tr>`;}).join('')+`</tbody></table></div>`; }
function commitImport(){ const obra=$('#impObra').value; let novos=0,atual=0;
  importRows.forEach(r=>{ let p=r.code?findProduct(r.code):null;
    if(p){ p.desc=r.desc||p.desc;p.unit=r.unit||p.unit;p.min=r.min;p.max=r.max;if(r.custo>0)p.custo=r.custo;if(r.preco>0)p.preco=r.preco;if(r.ref)p.ref=r.ref;if(r.aux)p.aux=r.aux; atual++; }
    else{ const code=r.code||genCode(); p={code,desc:r.desc,unit:r.unit,aux:r.aux,min:r.min,max:r.max,custo:r.custo,preco:r.preco,ref:r.ref}; state.products.push(p); novos++; }
    if(r.qty>0){ addSaldo(obra,p.code,r.qty); state.movements.unshift({ts:Date.now(),tipo:'entrada',obra,code:p.code,desc:p.desc,qty:r.qty,valorUnit:p.custo||0,valorTotal:r.qty*(p.custo||0),doc:'Carga inicial (planilha)',saldo:saldoOf(obra,p.code)}); } });
  save('Importação de planilha em '+obraName(obra)+' · '+novos+' novo(s), '+atual+' atualizado(s)'); importRows=[]; toast(`Importado em ${esc(obraName(obra))} · ${novos} novo(s), ${atual} atualizado(s).`,'ok'); go('produtos'); }
function downloadTemplate(){ const ws=XLSX.utils.aoa_to_sheet([['codigo','codigo auxiliar','descricao','unidade','quantidade','minimo','maximo','custo','preco','referencia'],['','SAP-1001','Cimento CP-II 50kg','SC',120,30,300,32.50,41.90,''],['','SAP-2050','Filtro hidráulico 1234','UN',8,2,20,180.00,0,'Escavadeira CAT 320'],['7891234560001','','Areia média','M3',15,5,40,55.00,90.00,'']]);
  const wb=XLSX.utils.book_new(); XLSX.utils.book_append_sheet(wb,ws,'Produtos'); XLSX.writeFile(wb,'modelo_estoque.xlsx'); }
