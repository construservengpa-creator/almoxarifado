<style>
:root{
  --bg:#1E2024; --s1:#272A30; --s2:#30343B; --line:#3B4048; --tx:#ECEDEF; --mu:#9AA1AC;
  --ac:#F5C433; --ac-ink:#1E2024; --ok:#62C48F; --bad:#F26D5B; --info:#7DB4E8; --warn:#F2A65A;
  --f-head:'Oswald','Arial Narrow',sans-serif;
  --f-body:'Inter',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
  --f-mono:'JetBrains Mono',ui-monospace,Consolas,monospace;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.45 var(--f-body)}
body{min-height:100dvh;padding-bottom:calc(16px + env(safe-area-inset-bottom))}
button,input,textarea{font:inherit;color:inherit}
button{cursor:pointer}
[hidden]{display:none!important}
:focus-visible{outline:2px solid var(--ac);outline-offset:2px}

.top{position:sticky;top:0;z-index:20;background:var(--bg);border-bottom:1px solid var(--line);
  padding:calc(10px + env(safe-area-inset-top)) 16px 10px;display:flex;align-items:center;gap:10px}
.top .cap-selo{width:34px;height:34px}
.login .cap-selo{width:56px;height:56px;margin-bottom:16px;box-shadow:0 6px 18px rgba(245,196,51,.18)}
.top h1{font:600 19px/1.1 var(--f-head);letter-spacing:.3px;margin:0;flex:1;text-transform:uppercase}
.top h1 small{display:block;font:500 11.5px/1.3 var(--f-body);color:var(--mu);text-transform:none;letter-spacing:0;margin-top:2px}
.icon-btn{background:var(--s1);border:1px solid var(--line);border-radius:10px;width:40px;height:40px;display:grid;place-items:center;font-size:17px}

.tabs{display:flex;gap:6px;padding:12px 16px 4px}
.tabs button{flex:1;background:var(--s1);border:1px solid var(--line);border-radius:10px;padding:9px 8px;font-weight:600;font-size:13.5px;color:var(--mu)}
.tabs button.on{background:var(--ac);border-color:var(--ac);color:var(--ac-ink)}
.tabs .n{display:inline-block;min-width:20px;padding:0 6px;border-radius:10px;background:var(--bad);color:#fff;font-size:11.5px;margin-left:4px}
.tabs button.on .n{background:var(--ac-ink);color:var(--ac)}

main{padding:8px 16px 0;max-width:640px;margin:0 auto}
.info{color:var(--mu);font-size:12.5px;margin:6px 2px 10px}
.empty{text-align:center;color:var(--mu);padding:46px 16px}
.empty b{display:block;color:var(--tx);font-size:16px;margin-bottom:4px}

.card{background:var(--s1);border:1px solid var(--line);border-radius:14px;padding:14px;margin-bottom:12px}
.card-hd{display:flex;align-items:flex-start;justify-content:space-between;gap:10px}
.req{font:500 13px var(--f-mono);color:var(--ac)}
.when{color:var(--mu);font-size:12px;white-space:nowrap}
.obra{font-weight:600;font-size:15.5px;margin:4px 0 2px}
.meta{color:var(--mu);font-size:12.5px}
.meta b{color:var(--tx);font-weight:500}
.tag{display:inline-block;font-size:11px;font-weight:600;padding:2px 8px;border-radius:20px;margin:6px 4px 0 0}
.tag.mutuo{background:rgba(125,180,232,.15);color:var(--info)}
.tag.falta{background:rgba(242,166,90,.15);color:var(--warn)}
.tag.ok{background:rgba(98,196,143,.15);color:var(--ok)}
.tag.rej{background:rgba(242,109,91,.15);color:var(--bad)}
.obs{background:var(--s2);border-radius:10px;padding:8px 10px;font-size:13px;margin-top:8px;white-space:pre-wrap}
.itens{list-style:none;margin:10px 0 0;padding:0;border-top:1px solid var(--line)}
.itens li{display:flex;justify-content:space-between;gap:10px;padding:8px 0;border-bottom:1px solid var(--line);font-size:13.5px}
.itens li:last-child{border-bottom:0}
.itens .q{font-family:var(--f-mono);white-space:nowrap;text-align:right}
.itens .q small{display:block;font-family:var(--f-body);font-size:11px;color:var(--mu)}
.itens .q small.falta{color:var(--warn)}
.acts{display:flex;gap:8px;margin-top:12px}
.btn{flex:1;border:0;border-radius:11px;padding:12px;font-weight:600;font-size:15px}
.btn.ok{background:var(--ok);color:#10261a}
.btn.no{background:transparent;border:1px solid var(--bad);color:var(--bad)}
.btn.pri{background:var(--ac);color:var(--ac-ink)}
.btn.ghost{background:var(--s2);color:var(--tx)}
.btn:disabled{opacity:.55}

.login{max-width:380px;margin:0 auto;padding:calc(48px + env(safe-area-inset-top)) 20px 20px}
.login h2{font:600 26px var(--f-head);text-transform:uppercase;margin:0 0 4px}
.login p{color:var(--mu);margin:0 0 22px;font-size:13.5px}
label.f{display:block;font-size:12px;color:var(--mu);margin:12px 0 5px;text-transform:uppercase;letter-spacing:.5px}
input.f,textarea.f{width:100%;background:var(--s1);border:1px solid var(--line);border-radius:10px;padding:12px;font-size:16px}
textarea.f{min-height:96px;resize:vertical}
.err{color:var(--bad);font-size:13px;min-height:18px;margin-top:10px}

.sheet-bg{position:fixed;inset:0;background:rgba(0,0,0,.55);z-index:50;display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--bg);border-top:1px solid var(--line);border-radius:18px 18px 0 0;width:100%;max-width:640px;padding:18px 16px calc(16px + env(safe-area-inset-bottom))}
.sheet h3{font:600 18px var(--f-head);text-transform:uppercase;margin:0 0 4px}
.sheet p{color:var(--mu);font-size:13px;margin:0 0 6px}

.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom));transform:translateX(-50%);z-index:60;
  background:var(--s2);border:1px solid var(--line);border-radius:12px;padding:11px 16px;font-size:14px;max-width:92vw;box-shadow:0 8px 24px rgba(0,0,0,.35)}
.toast.ok{border-color:var(--ok)} .toast.err{border-color:var(--bad)} .toast.warn{border-color:var(--warn)}
/* ===== Marca Capivara (kit comum a todas as aplicações Capivara) =====
   Selo amarelo com a capivara (#capivaraSilhueta) e tela de abertura. Usa
   variáveis próprias (--cap-*) para não depender do tema de cada aplicação. */
.cap-selo{display:inline-flex;align-items:center;justify-content:center;flex-shrink:0;
  width:34px;height:34px;border-radius:22%;background:#F5C433;color:#1A1E24;vertical-align:middle}
.cap-selo svg{width:100%;height:100%;display:block}
.cap-marca{text-transform:uppercase;letter-spacing:.08em}
.cap-marca .cap-mod{color:var(--cap-mod-cor,#F5C433)}

#capAbertura{position:fixed;inset:0;z-index:2147483000;display:flex;flex-direction:column;align-items:center;justify-content:center;
  background:radial-gradient(ellipse at 50% 35%,#1f252e 0%,#12151A 70%);color:#EDEFF2;cursor:pointer;
  font-family:'Inter',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;transition:opacity .5s ease,visibility .5s}
#capAbertura.saindo{opacity:0;visibility:hidden;pointer-events:none}
#capAbertura .cap-selo{width:112px;height:112px;box-shadow:0 18px 50px rgba(245,196,51,.22);animation:capPop .7s cubic-bezier(.2,1.4,.4,1) both}
#capAbertura .cap-nome{font-family:'Oswald','IBM Plex Sans Condensed','Arial Narrow',sans-serif;font-weight:600;font-size:52px;line-height:1;
  letter-spacing:.2em;margin:26px 0 0 .2em;text-transform:uppercase;animation:capSobe .6s .25s ease-out both}
#capAbertura .cap-modulo{font-family:'Oswald','IBM Plex Sans Condensed','Arial Narrow',sans-serif;font-weight:500;font-size:20px;line-height:1;
  letter-spacing:.42em;margin:10px 0 0 .42em;text-transform:uppercase;color:#F5C433;animation:capSobe .6s .32s ease-out both}
#capAbertura .cap-tag{font-family:'JetBrains Mono','IBM Plex Mono',ui-monospace,monospace;font-size:12px;color:#8D97A3;text-transform:uppercase;
  letter-spacing:.12em;margin-top:14px;text-align:center;padding:0 16px;animation:capSobe .6s .4s ease-out both}
/* estrada: a capivarinha "caminha" parada enquanto a faixa corre por baixo (indicador de carregamento) */
#capAbertura .cap-estrada{position:relative;width:min(260px,70vw);height:34px;margin-top:34px;overflow:hidden;animation:capSobe .6s .55s ease-out both;
  -webkit-mask-image:linear-gradient(90deg,transparent,#000 18%,#000 82%,transparent);mask-image:linear-gradient(90deg,transparent,#000 18%,#000 82%,transparent)}
#capAbertura .cap-faixa{position:absolute;left:0;right:-36px;bottom:0;height:3px;
  background:repeating-linear-gradient(90deg,#F5C433 0 22px,transparent 22px 36px);animation:capFaixa .6s linear infinite}
#capAbertura .cap-andando{position:absolute;left:50%;bottom:4px;width:34px;height:34px;margin-left:-17px;color:#F5C433;
  animation:capPasso .3s ease-in-out infinite alternate}
#capAbertura .pata-a{animation:capPata .3s ease-in-out infinite alternate}
#capAbertura .pata-b{animation:capPata .3s ease-in-out infinite alternate-reverse}
@keyframes capPop{from{transform:scale(.4) rotate(-8deg);opacity:0}to{transform:none;opacity:1}}
@keyframes capSobe{from{transform:translateY(12px);opacity:0}to{transform:none;opacity:1}}
@keyframes capFaixa{to{transform:translateX(-36px)}}
@keyframes capPasso{to{transform:translateY(-1.5px)}}
@keyframes capPata{to{transform:translateY(-2.5px)}}
@media (prefers-reduced-motion:reduce){#capAbertura,#capAbertura *{animation:none!important;transition:none!important}}
@media (max-width:480px){#capAbertura .cap-selo{width:88px;height:88px}#capAbertura .cap-nome{font-size:38px}#capAbertura .cap-modulo{font-size:16px}}
</style>
</head>

<div id="capAbertura" role="status" aria-label="Carregando Capivara Aprovações" title="Clique para pular">
  <span class="cap-selo"><svg viewBox="0 0 64 64" aria-hidden="true"><use href="#capivaraSilhueta"/></svg></span>

<script>
/* Tela de abertura Capivara: sai com fade depois de um tempo mínimo (para a
   animação não "piscar"). Por padrão sai quando a página termina de carregar;
   com data-manual="1" a própria aplicação chama capivaraFecharAbertura().
   Clique pula; após 8 s sai de qualquer jeito, para nunca prender a tela. */
(function(){
  var inicio = Date.now(), MINIMO = 1600;
  window.capivaraFecharAbertura = function(imediato){
    var el = document.getElementById('capAbertura');
    if (!el || el.classList.contains('saindo')) return;
    setTimeout(function(){
      el.classList.add('saindo');
      setTimeout(function(){ if (el.parentNode) el.parentNode.removeChild(el); }, 600);
    }, imediato ? 0 : Math.max(0, MINIMO - (Date.now() - inicio)));
  };
  var el = document.getElementById('capAbertura');
  if (!el) return;
  el.addEventListener('click', function(){ window.capivaraFecharAbertura(true); });
  setTimeout(function(){ window.capivaraFecharAbertura(true); }, 8000);
  if (!el.hasAttribute('data-manual')) {
    if (document.readyState === 'complete') window.capivaraFecharAbertura();
    else window.addEventListener('load', function(){ window.capivaraFecharAbertura(); });
  }
})();
</script>

<script>
/* App de celular para aprovar/rejeitar requisições de material.
   Mesmas regras da tela Aprovações do sistema (index.html → aprovarRequisicao / rejeitarRequisicao):
   - quem aprova: admin e encarregados; encarregado só das obras vinculadas a ele (admin e encarregado do
     almoxarifado aprovam de qualquer obra);
   - ao aprovar, confere o saldo item a item na obra de onde o material sai (no mútuo, a obra de estoque),
     descontando o que está bloqueado por devolução em aberto; o que faltar vira compra pendente e a
     requisição vai para "aguardando compra" — senão vai direto para separação. */
const SUPABASE_URL='https://qjmqburjyqlgwjihvlgp.supabase.co';
const SUPABASE_ANON_KEY='eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InFqbXFidXJqeXFsZ3dqaWh2bGdwIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODg4NzU0NzIsImV4cCI6MjEwNDQ1MTQ3Mn0.cOdmVw3W0HCilACqZIVFMCwsr6zxA0g_3CreKIuk9kw';
const sb=window.supabase.createClient(SUPABASE_URL,SUPABASE_ANON_KEY);

const $=s=>document.querySelector(s);
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const numf=n=>(Number(n)||0).toLocaleString('pt-BR',{maximumFractionDigits:3});
const reqN=id=>'REQ-'+String(id).padStart(5,'0');
const quando=iso=>{ if(!iso)return''; const d=new Date(iso); return d.toLocaleDateString('pt-BR',{day:'2-digit',month:'2-digit'})+' '+d.toLocaleTimeString('pt-BR',{hour:'2-digit',minute:'2-digit'}); };
function toast(msg,tipo='ok'){ const t=document.createElement('div'); t.className='toast '+tipo; t.textContent=msg; document.body.appendChild(t); setTimeout(()=>t.remove(),3600); }

let user=null, profile=null, aba='pend', pendentes=[], canal=null;

/* ---------- permissões (iguais às do sistema) ---------- */
const isAdmin=()=>!!profile&&profile.papel==='admin'&&profile.ativo;
const isEncarregado=()=>!!profile&&(profile.papel==='admin'||profile.papel==='encarregado')&&profile.ativo;
const isEncAlmox=()=>!!profile&&profile.papel==='encarregado'&&profile.setor==='almoxarifado'&&profile.ativo;
const veTodas=()=>isAdmin()||isEncAlmox();
const vinculadas=()=>Array.isArray(profile&&profile.obras_vinculadas)?profile.obras_vinculadas:[];
const podeAprovarObra=obraId=>veTodas()||(isEncarregado()&&vinculadas().includes(obraId));
const obraEstoque=r=>r.mutuo_estoque_obra_id?r.mutuo_estoque_obra_id:r.obra_id;

/* ---------- login ---------- */
async function carregarPerfil(){
  const {data,error}=await sb.from('profiles').select('id,nome,email,papel,ativo,setor,obras_vinculadas').eq('id',user.id).maybeSingle();
  if(error||!data)throw new Error('Não foi possível carregar o seu perfil.');
  if(!data.ativo)throw new Error('Seu usuário ainda não foi liberado pelo administrador.');
  if(!(data.papel==='admin'||data.papel==='encarregado'))throw new Error('Este aplicativo é para quem aprova requisições (encarregados e administradores).');
  profile=data;
}
async function iniciar(){
  const {data}=await sb.auth.getSession();
  if(!data.session){ mostrarLogin(); return; }
  user=data.session.user;
  try{ await carregarPerfil(); }catch(e){ await sb.auth.signOut(); mostrarLogin(e.message); return; }
  mostrarApp();
}
function mostrarLogin(msg){ $('#vApp').hidden=true; $('#vLogin').hidden=false; $('#lgErr').textContent=msg||''; if(canal){ sb.removeChannel(canal); canal=null; } }
$('#fLogin').addEventListener('submit',async ev=>{
  ev.preventDefault(); const b=$('#lgBtn'); b.disabled=true; $('#lgErr').textContent='';
  try{
    const {data,error}=await sb.auth.signInWithPassword({email:$('#lgE').value.trim().toLowerCase(),password:$('#lgS').value});
    if(error)throw new Error('E-mail ou senha inválidos.');
    user=data.user; await carregarPerfil(); mostrarApp();
  }catch(e){ await sb.auth.signOut().catch(()=>{}); $('#lgErr').textContent=e.message; }
  finally{ b.disabled=false; }
});
$('#bSair').onclick=async()=>{ await sb.auth.signOut(); user=null; profile=null; mostrarLogin(); };

/* ---------- app ---------- */
function mostrarApp(){
  $('#vLogin').hidden=true; $('#vApp').hidden=false;
  $('#who').textContent=(profile.nome||profile.email)+(isAdmin()?' · Admin':isEncAlmox()?' · Encarregado do almoxarifado':' · Encarregado');
  $('#escopo').textContent=veTodas()?'Requisições de todas as obras.':(vinculadas().length?'Somente das obras (centros de custo) vinculadas a você.':'Você ainda não tem obra vinculada — peça ao administrador.');
  if(!canal){
    /* Só recarrega quando a mudança interessa a esta tela: requisição pendente (nova ou alterada) ou uma das que estão
       na lista saindo de pendente. Antes recarregava (requisições + saldos) a cada separação, embalagem, expedição etc.
       de qualquer requisição do sistema. */
    canal=sb.channel('app_aprovacoes').on('postgres_changes',{event:'*',schema:'public',table:'requisicoes'},pl=>{
      const n=pl.new||{}, o=pl.old||{}, id=n.id??o.id;
      const interessa=n.status==='pendente'||pendentes.some(r=>r.id===id)||(aba==='hist'&&n.decidido_em);
      if(!interessa)return;
      clearTimeout(window._rt); window._rt=setTimeout(atualizar,600); }).subscribe();
  }
  atualizar();
}
$('#tPend').onclick=()=>{ aba='pend'; $('#tPend').classList.add('on'); $('#tHist').classList.remove('on'); atualizar(); };
$('#tHist').onclick=()=>{ aba='hist'; $('#tHist').classList.add('on'); $('#tPend').classList.remove('on'); atualizar(); };
$('#bRefresh').onclick=()=>{ atualizar(); toast('Atualizado.'); };
/* ao voltar para o app: atualiza, mas não mais de uma vez a cada 20 s (o tempo real já mantém a lista em dia) */
let _ultAtual=0;
document.addEventListener('visibilitychange',()=>{ if(!document.hidden&&profile&&Date.now()-_ultAtual>20000)atualizar(); });

function filtroObras(q){ if(veTodas())return q; const v=vinculadas(); return v.length?q.in('obra_id',v):null; }

let _atualizando=null, _deNovo=false;
async function atualizar(){
  if(!profile)return;
  if(_atualizando){ _deNovo=true; return _atualizando; }   /* chamadas em sequência viram uma só rodada a mais */
  _atualizando=(async()=>{ do{ _deNovo=false; _ultAtual=Date.now(); await _atualizar(); }while(_deNovo); })();
  try{ await _atualizando; } finally{ _atualizando=null; }
}
async function _atualizar(){
  if(aba==='pend')await desenharPendentes(); else await desenharHistorico();
}

/* saldo disponível = saldo da obra − bloqueado por devolução ao fornecedor em aberto */
async function saldosPara(reqs){
  const obras=[...new Set(reqs.map(obraEstoque))]; const codes=[...new Set(reqs.flatMap(r=>(r.itens||[]).map(i=>String(i.code))))];
  const saldo={};
  if(!obras.length||!codes.length)return saldo;
  const [s,d]=await Promise.all([
    sb.from('saldos_estoque').select('obra_id,code,saldo').in('obra_id',obras).in('code',codes),
    sb.from('devolucoes').select('obra_id,itens').in('status',['aguardando_nota','em_envio']).in('obra_id',obras)
  ]);
  if(s.error)throw s.error;
  (s.data||[]).forEach(x=>{ saldo[x.obra_id+'|'+x.code]=Number(x.saldo)||0; });
  (d.data||[]).forEach(dv=>(dv.itens||[]).forEach(it=>{ const k=dv.obra_id+'|'+it.code; if(k in saldo)saldo[k]-=Number(it.qty)||0; }));
  Object.keys(saldo).forEach(k=>{ if(saldo[k]<0)saldo[k]=0; });
  return saldo;
}

async function desenharPendentes(){
  const box=$('#lista');
  let q=filtroObras(sb.from('requisicoes').select('id,obra_id,obra_nome,ordem_servico,aplicacao_nome,solicitante_nome,observacao,itens,criado_em,status,mutuo_estoque_obra_id').eq('status','pendente').order('criado_em',{ascending:true}));
  if(!q){ pendentes=[]; contar(); box.innerHTML='<div class="empty"><b>Nenhuma obra vinculada</b>Peça ao administrador para vincular suas obras.</div>'; return; }
  const {data,error}=await q;
  if(error){ box.innerHTML='<div class="empty"><b>Erro ao carregar</b>'+esc(error.message)+'</div>'; return; }
  pendentes=data||[]; contar();
  if(!pendentes.length){ box.innerHTML='<div class="empty"><b>Tudo em dia ✓</b>Nenhuma requisição aguardando aprovação.</div>'; return; }
  let saldo={}; try{ saldo=await saldosPara(pendentes); }catch(e){ toast('Não foi possível conferir o saldo agora.','warn'); }
  box.innerHTML=pendentes.map(r=>{
    const ob=obraEstoque(r);
    const itens=(r.itens||[]).map(i=>{ const disp=saldo[ob+'|'+i.code]; const falta=disp!=null?Math.max((Number(i.qty)||0)-disp,0):null;
      return `<li><span>${esc(i.desc||i.code)}</span><span class="q">${numf(i.qty)} ${esc(i.unit||'')}${disp==null?'<small>saldo —</small>':falta>0?`<small class="falta">falta ${numf(falta)} · disp. ${numf(disp)}</small>`:`<small>disp. ${numf(disp)}</small>`}</span></li>`; }).join('');
    const nFalta=(r.itens||[]).filter(i=>{ const disp=saldo[ob+'|'+i.code]; return disp!=null&&(Number(i.qty)||0)>disp; }).length;
    return `<article class="card" id="r${r.id}">
      <div class="card-hd"><span class="req">${reqN(r.id)}</span><span class="when">${quando(r.criado_em)}</span></div>
      <div class="obra">${esc(r.obra_nome)}</div>
      <div class="meta">${r.ordem_servico?'OS <b>'+esc(r.ordem_servico)+'</b> · ':''}${esc(r.aplicacao_nome||'Sem aplicação')}</div>
      <div class="meta">Solicitante: <b>${esc(r.solicitante_nome||'—')}</b></div>
      ${r.mutuo_estoque_obra_id?`<span class="tag mutuo">💱 Mútuo — sai do estoque de outra empresa</span>`:''}
      ${nFalta?`<span class="tag falta">${nFalta} item(ns) sem saldo suficiente → vira compra</span>`:'<span class="tag ok">Saldo suficiente</span>'}
      ${r.observacao?`<div class="obs">${esc(r.observacao)}</div>`:''}
      <ul class="itens">${itens}</ul>
      ${podeAprovarObra(r.obra_id)?`<div class="acts"><button class="btn no" onclick="rejeitar(${r.id})">Rejeitar</button><button class="btn ok" onclick="aprovar(${r.id},this)">Aprovar</button></div>`:'<div class="meta" style="margin-top:10px">Você não está vinculado a esta obra.</div>'}
    </article>`; }).join('');
}
function contar(){ const n=pendentes.length, b=$('#nPend'); b.hidden=!n; b.textContent=n; document.title=(n?'('+n+') ':'')+'Aprovações · AMETA';
  try{ if(navigator.setAppBadge){ n?navigator.setAppBadge(n):navigator.clearAppBadge(); } }catch(e){} }

async function desenharHistorico(){
  const box=$('#lista');
  let q=filtroObras(sb.from('requisicoes').select('id,obra_nome,ordem_servico,aplicacao_nome,solicitante_nome,status,decidido_por_nome,decidido_em,motivo_rejeicao').neq('status','pendente').not('decidido_em','is',null).order('decidido_em',{ascending:false}).limit(30));
  if(!q){ box.innerHTML='<div class="empty"><b>Nenhuma obra vinculada</b></div>'; return; }
  const {data,error}=await q;
  if(error){ box.innerHTML='<div class="empty"><b>Erro ao carregar</b>'+esc(error.message)+'</div>'; return; }
  if(!(data||[]).length){ box.innerHTML='<div class="empty"><b>Nada por aqui</b>Nenhuma requisição decidida ainda.</div>'; return; }
  box.innerHTML=data.map(r=>`<article class="card">
      <div class="card-hd"><span class="req">${reqN(r.id)}</span><span class="when">${quando(r.decidido_em)}</span></div>
      <div class="obra">${esc(r.obra_nome)}</div>
      <div class="meta">${r.ordem_servico?'OS <b>'+esc(r.ordem_servico)+'</b> · ':''}${esc(r.aplicacao_nome||'')} · ${esc(r.solicitante_nome||'')}</div>
      <span class="tag ${r.status==='rejeitada'?'rej':r.status==='cancelada'?'falta':'ok'}">${r.status==='rejeitada'?'Rejeitada':r.status==='cancelada'?'Cancelada':'Aprovada'}</span>
      <div class="meta" style="margin-top:6px">por ${esc(r.decidido_por_nome||'—')}</div>
      ${r.motivo_rejeicao?`<div class="obs">${esc(r.motivo_rejeicao)}</div>`:''}
    </article>`).join('');
}

/* ---------- aprovar (mesma lógica de aprovarRequisicao do sistema) ---------- */
async function aprovar(id,btn){
  btn.disabled=true; btn.textContent='Aprovando…';
  try{
    const {data:r,error:e1}=await sb.from('requisicoes').select('id,obra_id,obra_nome,ordem_servico,aplicacao_nome,solicitante_nome,observacao,itens,criado_em,status,mutuo_estoque_obra_id').eq('id',id).maybeSingle();
    if(e1||!r)throw new Error('Requisição não encontrada.');
    if(r.status!=='pendente'){ toast(reqN(id)+' já foi decidida por outra pessoa.','warn'); atualizar(); return; }
    if(!podeAprovarObra(r.obra_id))throw new Error('Você não está vinculado à obra desta requisição.');
    const ob=obraEstoque(r); const saldo=await saldosPara([r]);
    const avaliados=(r.itens||[]).map(i=>{ const disponivel=Math.max(Math.min(saldo[ob+'|'+i.code]||0,Number(i.qty)||0),0);
      return {code:i.code,desc:i.desc,unit:i.unit||'',qty:Number(i.qty)||0,disponivel,faltante:Math.max((Number(i.qty)||0)-disponivel,0)}; });
    const {error:e2}=await sb.from('requisicao_itens_status').upsert(avaliados.map(i=>({requisicao_id:r.id,code:i.code,descricao:i.desc,unidade:i.unit,
      quantidade_solicitada:i.qty,quantidade_disponivel:i.disponivel,status:i.faltante>0?'faltante':'disponivel'})),{onConflict:'requisicao_id,code'});
    if(e2)throw new Error('Erro ao gravar a verificação de estoque: '+e2.message);
    const faltantes=avaliados.filter(i=>i.faltante>0);
    if(faltantes.length){
      const {error:e3}=await sb.from('compras_pendentes').insert(faltantes.map(i=>({requisicao_id:r.id,code:i.code,descricao:i.desc,quantidade:i.faltante,status:'pendente'})));
      if(e3)throw new Error('Verificação salva, mas houve erro ao gerar a compra pendente: '+e3.message);
    }
    const {data:upd,error:e4}=await sb.from('requisicoes').update({status:faltantes.length?'aguardando_compra':'em_separacao',decidido_por:user.id,decidido_por_nome:profile.nome||profile.email,decidido_em:new Date().toISOString()})
      .eq('id',id).eq('status','pendente').select('id');
    if(e4)throw new Error('Erro ao atualizar a requisição: '+e4.message);
    if(!upd||!upd.length)throw new Error('A aprovação não foi gravada — a requisição mudou ou seu usuário não tem permissão.');
    toast(faltantes.length?reqN(id)+' aprovada — faltantes enviados para compras.':reqN(id)+' aprovada — pronta para separação.','ok');
  }catch(e){ toast(e.message,'err'); }
  atualizar();
}

/* ---------- rejeitar ---------- */
function rejeitar(id){
  const bg=document.createElement('div'); bg.className='sheet-bg';
  bg.innerHTML=`<div class="sheet"><h3>Rejeitar ${reqN(id)}</h3><p>Informe o motivo — o solicitante vai ver.</p>
    <textarea class="f" id="rjM" placeholder="Motivo da rejeição"></textarea><div class="err" id="rjErr"></div>
    <div class="acts"><button class="btn ghost" id="rjC">Cancelar</button><button class="btn no" id="rjOk">Rejeitar</button></div></div>`;
  document.body.appendChild(bg); setTimeout(()=>$('#rjM').focus(),50);
  const fechar=()=>bg.remove();
  bg.addEventListener('click',ev=>{ if(ev.target===bg)fechar(); });
  $('#rjC').onclick=fechar;
  $('#rjOk').onclick=async()=>{
    const motivo=$('#rjM').value.trim(); if(!motivo){ $('#rjErr').textContent='Informe o motivo.'; return; }
    $('#rjOk').disabled=true;
    const {data:r}=await sb.from('requisicoes').select('obra_id,status').eq('id',id).maybeSingle();
    if(!r||r.status!=='pendente'){ fechar(); toast(reqN(id)+' já foi decidida por outra pessoa.','warn'); atualizar(); return; }
    if(!podeAprovarObra(r.obra_id)){ $('#rjErr').textContent='Você não está vinculado à obra desta requisição.'; $('#rjOk').disabled=false; return; }
    const {data:upd,error}=await sb.from('requisicoes').update({status:'rejeitada',motivo_rejeicao:motivo,decidido_por:user.id,decidido_por_nome:profile.nome||profile.email,decidido_em:new Date().toISOString()})
      .eq('id',id).eq('status','pendente').select('id');
    if(error||!upd||!upd.length){ $('#rjErr').textContent='Não foi possível rejeitar: '+(error?error.message:'a requisição mudou ou seu usuário não tem permissão.'); $('#rjOk').disabled=false; return; }
    fechar(); toast(reqN(id)+' rejeitada.','warn'); atualizar();
  };
}

iniciar();
</script>
