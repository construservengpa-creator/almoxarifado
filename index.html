<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Sans+Condensed:wght@600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#0f1419; --panel:#1a2129; --panel2:#222b35; --line:#2c3742;
    --ink:#e8edf2; --muted:#8a98a8; --muted2:#5d6b7a;
    --amber:#f5a623; --amber-dim:#a8731a; --green:#3ec98a; --red:#ef5b5b; --blue:#4aa8ff;
    --content:#f4f1ea;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:'IBM Plex Sans',sans-serif;background:var(--bg);color:var(--ink);display:flex;min-height:100vh;font-size:14px}
  .mono{font-family:'IBM Plex Mono',monospace}
  aside{width:236px;background:var(--panel);border-right:1px solid var(--line);display:flex;flex-direction:column;position:sticky;top:0;height:100vh;flex-shrink:0}
  .brand{padding:20px 20px;border-bottom:1px solid var(--line)}
  .brand h1{font-size:15px;font-weight:700;letter-spacing:.5px;display:flex;align-items:center;gap:9px}
  .brand .cap-selo{width:30px;height:30px}
  .gate-card .cap-selo{width:44px;height:44px}
  .brand .dot{width:11px;height:11px;background:var(--amber);border-radius:2px;transform:rotate(45deg)}
  .brand p{font-size:10.5px;color:var(--muted2);margin-top:4px;letter-spacing:1.5px;text-transform:uppercase}
  nav{padding:10px 10px;flex:1;overflow-y:auto}
  nav button{width:100%;text-align:left;background:none;border:none;color:var(--muted);padding:10px 13px;border-radius:8px;cursor:pointer;font-family:inherit;font-size:13.5px;display:flex;align-items:center;gap:11px;margin-bottom:2px;transition:.15s;font-weight:500}
  nav button:hover{background:var(--panel2);color:var(--ink)}
  nav button.active{background:var(--amber);color:#1a1206;font-weight:600}
  nav button .ic{width:18px;text-align:center;font-size:15px}
  nav button .badge{margin-left:auto;background:var(--red);color:#fff;font-size:10px;font-weight:700;padding:1px 7px;border-radius:10px}
  nav button.active .badge{background:#1a1206;color:var(--amber)}
  .navgrp-hd{display:flex;align-items:center;justify-content:space-between;padding:10px 13px 6px;margin-top:4px;font-size:9.5px;letter-spacing:1.2px;text-transform:uppercase;color:var(--muted2);font-weight:600;cursor:pointer;border-radius:8px}
  .navgrp-hd:hover{color:var(--muted)}
  .navgrp-hd .navgrp-hd-l{display:flex;align-items:center;gap:6px}
  .navgrp-hd .navgrp-chev{font-size:10px;transition:transform .15s}
  .navgrp-hd .badge{background:var(--red);color:#fff;font-size:10px;font-weight:700;padding:1px 7px;border-radius:10px}
  .navgrp-body button{padding-left:13px}
  .navgrp-divider{border-top:1px solid var(--line);margin:10px 6px 6px}
  main{flex:1;background:var(--content);color:#1c1c1c;min-width:0}
  .topbar{background:#fff;border-bottom:2px solid #e4dfd4;padding:16px 30px;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:20;gap:16px;flex-wrap:wrap}
  .topbar h2{font-size:19px;font-weight:700}
  .topbar h2 small{display:block;font-size:12px;font-weight:400;color:#8a8377;margin-top:2px}
  .wrap{padding:26px 30px;max-width:1200px}
  .cards{display:flex;flex-wrap:wrap;gap:16px;margin-bottom:24px}
  .cards>.card{flex:1 1 220px}
  .card{background:#fff;border:1px solid #e4dfd4;border-radius:12px;padding:18px 20px;position:relative;overflow:hidden}
  .card .lbl{font-size:11px;text-transform:uppercase;letter-spacing:.8px;color:#8a8377;font-weight:600}
  .card .val{font-size:26px;font-weight:700;margin-top:8px;font-family:'IBM Plex Mono',monospace}
  .card .sub{font-size:11.5px;color:#a09a8d;margin-top:3px}

/* ===== Marca Capivara (kit comum a todas as aplicações Capivara) =====
   Selo amarelo com a capivara (#capivaraSilhueta) e tela de abertura. Usa
   variáveis próprias (--cap-*) para não depender do tema de cada aplicação. */
.cap-selo{display:inline-flex;align-items:center;justify-content:center;flex-shrink:0;
  width:34px;height:34px;border-radius:22%;background:#F5C433;color:#1A1E24;vertical-align:middle}
.cap-selo svg{width:100%;height:100%;display:block}
.cap-marca{text-transform:uppercase;letter-spacing:.08em}
.cap-marca .cap-mod{color:var(--cap-mod-cor,#F5C433)}

#capAbertura{position:fixed;inset:0;z-index:2147483000;display:flex;flex-direction:column;align-items:center;justify-content:center;
  background:radial-gradient(ellipse at 50% 35%,#1f252e 0%,#12151A 70%);color:#EDEFF2;cursor:pointer;
  font-family:'Inter',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;transition:opacity .5s ease,visibility .5s}
#capAbertura.saindo{opacity:0;visibility:hidden;pointer-events:none}
#capAbertura .cap-selo{width:112px;height:112px;box-shadow:0 18px 50px rgba(245,196,51,.22);animation:capPop .7s cubic-bezier(.2,1.4,.4,1) both}
#capAbertura .cap-nome{font-family:'Oswald','IBM Plex Sans Condensed','Arial Narrow',sans-serif;font-weight:600;font-size:52px;line-height:1;
  letter-spacing:.2em;margin:26px 0 0 .2em;text-transform:uppercase;animation:capSobe .6s .25s ease-out both}
#capAbertura .cap-modulo{font-family:'Oswald','IBM Plex Sans Condensed','Arial Narrow',sans-serif;font-weight:500;font-size:20px;line-height:1;
  letter-spacing:.42em;margin:10px 0 0 .42em;text-transform:uppercase;color:#F5C433;animation:capSobe .6s .32s ease-out both}
#capAbertura .cap-tag{font-family:'JetBrains Mono','IBM Plex Mono',ui-monospace,monospace;font-size:12px;color:#8D97A3;text-transform:uppercase;
  letter-spacing:.12em;margin-top:14px;text-align:center;padding:0 16px;animation:capSobe .6s .4s ease-out both}
/* estrada: a capivarinha "caminha" parada enquanto a faixa corre por baixo (indicador de carregamento) */
#capAbertura .cap-estrada{position:relative;width:min(260px,70vw);height:34px;margin-top:34px;overflow:hidden;animation:capSobe .6s .55s ease-out both;
  -webkit-mask-image:linear-gradient(90deg,transparent,#000 18%,#000 82%,transparent);mask-image:linear-gradient(90deg,transparent,#000 18%,#000 82%,transparent)}
#capAbertura .cap-faixa{position:absolute;left:0;right:-36px;bottom:0;height:3px;
  background:repeating-linear-gradient(90deg,#F5C433 0 22px,transparent 22px 36px);animation:capFaixa .6s linear infinite}
#capAbertura .cap-andando{position:absolute;left:50%;bottom:4px;width:34px;height:34px;margin-left:-17px;color:#F5C433;
  animation:capPasso .3s ease-in-out infinite alternate}
#capAbertura .pata-a{animation:capPata .3s ease-in-out infinite alternate}
#capAbertura .pata-b{animation:capPata .3s ease-in-out infinite alternate-reverse}
@keyframes capPop{from{transform:scale(.4) rotate(-8deg);opacity:0}to{transform:none;opacity:1}}
@keyframes capSobe{from{transform:translateY(12px);opacity:0}to{transform:none;opacity:1}}
@keyframes capFaixa{to{transform:translateX(-36px)}}
@keyframes capPasso{to{transform:translateY(-1.5px)}}
@keyframes capPata{to{transform:translateY(-2.5px)}}
@media (prefers-reduced-motion:reduce){#capAbertura,#capAbertura *{animation:none!important;transition:none!important}}
@media (max-width:480px){#capAbertura .cap-selo{width:88px;height:88px}#capAbertura .cap-nome{font-size:38px}#capAbertura .cap-modulo{font-size:16px}}
</style>

<script>
/* Tela de abertura Capivara: sai com fade depois de um tempo mínimo (para a
   animação não "piscar"). Por padrão sai quando a página termina de carregar;
   com data-manual="1" a própria aplicação chama capivaraFecharAbertura().
   Clique pula; após 8 s sai de qualquer jeito, para nunca prender a tela. */
(function(){
  var inicio = Date.now(), MINIMO = 1600;
  window.capivaraFecharAbertura = function(imediato){
    var el = document.getElementById('capAbertura');
    if (!el || el.classList.contains('saindo')) return;
    setTimeout(function(){
      el.classList.add('saindo');
      setTimeout(function(){ if (el.parentNode) el.parentNode.removeChild(el); }, 600);
    }, imediato ? 0 : Math.max(0, MINIMO - (Date.now() - inicio)));
  };
  var el = document.getElementById('capAbertura');
  if (!el) return;
  el.addEventListener('click', function(){ window.capivaraFecharAbertura(true); });
  setTimeout(function(){ window.capivaraFecharAbertura(true); }, 8000);
  if (!el.hasAttribute('data-manual')) {
    if (document.readyState === 'complete') window.capivaraFecharAbertura();
    else window.addEventListener('load', function(){ window.capivaraFecharAbertura(); });
  }
})();
</script>

/* ===== Verificação de versão publicada (evita aba antiga rodando lógica velha/sem restrições) =====
   IMPORTANTE ao editar este arquivo: mude o valor de APP_VERSION a cada publicação (ex.: data/hora
   da publicação). É essa comparação que detecta uma aba desatualizada e avisa pra recarregar. */
const APP_VERSION='2026-10-09T16:00:00-03:00';
let _versionCheckTimer=null, _versionBannerShown=false;
function startVersionWatch(){
  clearInterval(_versionCheckTimer);
  _versionCheckTimer=setInterval(checkAppVersion,60*1000);

  window.addEventListener('focus',checkAppVersion);

/* Antes baixava o HTML inteiro (~400 KB) a cada 2 min e a cada foco da aba. Agora pergunta só o cabeçalho
   (ETag/Last-Modified) e baixa o arquivo apenas quando ele mudou — e no máximo uma vez a cada 30 s.
   O HEAD leva um parâmetro único: sem ele, a CDN do GitHub Pages podia responder por até 10 min com o
   cabeçalho da versão anterior depois de uma publicação, e o aviso de versão nova não aparecia. */
let _verTag=null, _verLast=0;
async function checkAppVersion(){
  if(_versionBannerShown||!isOnline)return;
  const agora=Date.now(); if(agora-_verLast<30000)return; _verLast=agora;
  let tag=null;
  try{ const h=await fetch(location.pathname+'?_h='+agora,{method:'HEAD',cache:'no-store'});
    tag=h.ok?(h.headers.get('etag')||h.headers.get('last-modified')):null;
    if(tag&&_verTag!==null&&tag===_verTag)return;
  }catch(e){}
  try{
    const res=await fetch(location.pathname+'?_v='+Date.now(),{cache:'no-store'});
    if(!res.ok)return;
    const text=await res.text();
    const m=text.match(/const APP_VERSION=['"]([^'"]+)['"]/);
    if(tag)_verTag=tag; /* só memoriza o cabeçalho depois de conferir o arquivo — se o download falhar, tenta de novo na próxima */
    if(m&&m[1]&&m[1]!==APP_VERSION)showVersionBanner(m[1]);
  }catch(e){ /* falha de rede não é motivo pra avisar nada */ }
}
function showVersionBanner(novaVersao){

  b.style.cssText='position:fixed;inset:0;z-index:99999;background:rgba(20,26,32,.92);color:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;padding:24px;text-align:center;font-size:15px';
  b.innerHTML='<div style="font-size:34px">🔄</div><div><b>Existe uma versão mais nova do sistema.</b><br><span style="font-size:13.5px;opacity:.85">Esta aba está desatualizada e foi bloqueada. Atualize para continuar.</span></div><button id="versionReloadBtn" style="background:#f5a623;color:#1a1206;border:none;border-radius:8px;padding:11px 26px;font-weight:700;font-size:14px;cursor:pointer">Atualizar agora</button>';
  try{ if(typeof stopNotifPolling==='function')stopNotifPolling(); }catch(e){}

}
/* Recarregar "normal" podia trazer de volta o HTML antigo (cache do navegador/GitHub Pages ou o service worker
   da Contagem, que controlava esta página) — e o aviso reaparecia logo em seguida. Abrir o endereço com um
   parâmetro único fura qualquer cache; ao carregar, o parâmetro é retirado da barra de endereço. */
async function atualizarParaVersaoNova(){
  try{ if(navigator.serviceWorker){ const regs=await navigator.serviceWorker.getRegistrations(); await Promise.all(regs.map(r=>r.update().catch(()=>{}))); } }catch(e){}
  location.replace(location.pathname+'?atualizado='+Date.now()+location.hash);
}

const Store={
  async get(k){ try{ const {data,error}=await sb.from('app_kv').select('value').eq('key',k).maybeSingle(); if(error)throw error; return data?data.value:null; }catch(e){ console.warn('Store.get sem rede, usando cache:',e); return undefined; } },
  /* Cada gravação envia o documento inteiro. Antes, várias alterações seguidas (ex.: mín/máx de vários produtos)
     disparavam gravações simultâneas na mesma linha do banco — uma esperava a outra e o servidor cancelava por
     tempo ("statement timeout"). Agora vai uma por vez por chave; as que chegam enquanto uma está em andamento
     viram UMA só gravação com o estado mais recente. Timeout é repetido automaticamente antes de avisar. */
  set(k,v,label){ const q=_saveQ[k]||(_saveQ[k]={busy:false,next:null,labels:[],waiters:[]});
    return new Promise(res=>{ q.next=v; if(label&&!q.labels.includes(label))q.labels.push(label); q.waiters.push(res); if(!q.busy)_drainSave(k); }); }
};
const _saveQ={};
function _saveTimeout(e){ return !!e&&(e.code==='57014'||/statement timeout/i.test(e.message||'')); }
async function _drainSave(k){ const q=_saveQ[k]; q.busy=true;
  while(q.next!==null){ const v=q.next, label=q.labels.join(' · ')||null, ws=q.waiters; q.next=null; q.labels=[]; q.waiters=[];
    let error=null;
    for(let t=0;t<3;t++){
      try{ ({error}=await sb.rpc('save_estado',{p_key:k,p_value:v,p_label:label})); }catch(e){ error={message:(e&&e.message)||String(e)}; }
      if(!error||!_saveTimeout(error)||q.next!==null)break; /* se já há estado mais novo na fila, ele substitui esta tentativa */
      await new Promise(r=>setTimeout(r,1500*(t+1)));
    }
    if(error&&q.next!==null){ q.waiters.push(...ws); continue; } /* o estado mais novo da fila inclui esta alteração: quem esperava recebe o resultado dele */
    if(error){ console.error(error);
      toast(_saveTimeout(error)?'Não foi possível salvar: o servidor demorou demais para gravar. A alteração NÃO foi gravada no banco — refaça em instantes.':'Erro ao salvar: '+error.message,'err'); }
    ws.forEach(r=>{ try{ r(error||null); }catch(e){} });
  }
  q.busy=false; }

let syncingQueue=false;
async function processOfflineQueue(){
  if(syncingQueue||!isOnline)return; const q0=getQueue(); if(!q0.length)return; syncingQueue=true;
  let q=q0;
  while(q.length && isOnline){
    const act=q[0];
    try{
      if(act.type==='requisicao'){ const {error}=await sb.from('requisicoes').insert(act.payload); if(error)throw error; }
      q=q.slice(1); setQueue(q);

  }

async function fetchAllRows(mk,page=1000){
  const first=await mk().range(0,page-1); if(first.error)return {data:null,error:first.error};
  let all=first.data||[]; if(all.length<page)return {data:all,error:null};
  for(let from=page;;from+=4*page){
    const rs=await Promise.all([0,1,2,3].map(i=>mk().range(from+i*page,from+(i+1)*page-1)));
    for(const {data,error} of rs){ if(error)return {data:null,error}; all=all.concat(data||[]); if(!data||data.length<page)return {data:all,error:null}; }

/* ===== LOTES E VALIDADE =====

const LOTES_SQL=`-- Controle de lotes e validade
-- Rodar uma vez no Supabase (SQL Editor) do projeto Estoque. Pode rodar de novo sem problema.

create table if not exists public.lotes_estoque (
  id            bigint generated always as identity primary key,
  obra_id       text        not null,
  code          text        not null,
  lote          text        not null check (length(trim(lote)) > 0),
  validade      date,
  fabricacao    date,
  saldo         numeric     not null default 0 check (saldo >= 0),
  criado_em     timestamptz not null default now(),
  atualizado_em timestamptz not null default now()
);
create unique index if not exists lotes_estoque_uk on public.lotes_estoque (obra_id, code, lote);
create index if not exists lotes_estoque_validade_idx on public.lotes_estoque (validade) where saldo > 0;

-- Quais lotes entraram/saíram em cada movimentação (rastreabilidade)
alter table public.movimentos_estoque add column if not exists lotes jsonb;

alter table public.lotes_estoque enable row level security;
drop policy if exists "lotes: leitura" on public.lotes_estoque;
create policy "lotes: leitura" on public.lotes_estoque
  for select to authenticated
  using (exists (select 1 from public.profiles p where p.id = auth.uid() and p.ativo));
-- Sem INSERT/UPDATE/DELETE direto: o saldo do lote só muda pela função abaixo.

-- Soma (ou subtrai) quantidade de um lote; cria o lote se ainda não existir. Nunca deixa saldo negativo.
-- Validade/fabricação informadas atualizam as do lote; nulas mantêm as atuais.
create or replace function public.mover_lote(p_obra text, p_code text, p_lote text, p_validade date,
                                             p_fabricacao date, p_delta numeric)
returns numeric language plpgsql security definer set search_path = public as $$
declare v_saldo numeric;
begin
  if not exists (select 1 from public.profiles p where p.id = auth.uid() and p.ativo) then
    raise exception 'Usuário sem acesso.';
  end if;
  if coalesce(trim(p_lote), '') = '' then raise exception 'Informe o lote.'; end if;
  insert into public.lotes_estoque as l (obra_id, code, lote, validade, fabricacao, saldo)
  values (p_obra, p_code, upper(trim(p_lote)), p_validade, p_fabricacao, greatest(coalesce(p_delta, 0), 0))
  on conflict (obra_id, code, lote) do update
     set saldo         = greatest(l.saldo + coalesce(p_delta, 0), 0),
         validade      = coalesce(excluded.validade, l.validade),
         fabricacao    = coalesce(excluded.fabricacao, l.fabricacao),
         atualizado_em = now()
  returning saldo into v_saldo;
  return v_saldo;
end $$;
grant execute on function public.mover_lote(text, text, text, date, date, numeric) to authenticated;

-- Atualização em tempo real entre usuários
do $$ begin
  alter publication supabase_realtime add table public.lotes_estoque;
exception when duplicate_object then null; end $$;

function resizeImage(file,max,cb){ const r=new FileReader(); r.onload=e=>{ const img=new Image();
  img.onload=()=>{ let w=img.width,h=img.height; if(w>h){if(w>max){h=Math.round(h*max/w);w=max;}}else{if(h>max){w=Math.round(w*max/h);h=max;}}
    const c=document.createElement('canvas');c.width=w;c.height=h;c.getContext('2d').drawImage(img,0,0,w,h);cb(c.toDataURL('image/jpeg',0.72)); };
  img.onerror=()=>toast('Não foi possível ler a imagem.','err'); img.src=e.target.result; }; r.readAsDataURL(file); }
/* Fotos do produto = as do documento (base64, adicionadas aqui) + as compactas tiradas na contagem, que ficam como

    const mudou=JSON.stringify(Object.keys(m).map(k=>[k,m[k].length]))!==JSON.stringify(Object.keys(fotosExt).map(k=>[k,fotosExt[k].length])); fotosExt=m; return mudou; }catch(e){ return false; } }

    const up=await sb.from('produto_fotos').update({code}).eq('code',k).select('id'); if(!up.error&&up.data&&up.data.length)return;

/* ===== Fotos como arquivo =====
   Antes as fotos do cadastro ficavam todas, em base64, num único registro (app_kv "...:fotos") baixado inteiro a cada
   abertura do sistema. Agora cada foto vira um arquivo na pasta "produtos" do Supabase e a tabela produto_fotos guarda
   só o endereço (o mesmo caminho das fotos da Contagem). Se o banco recusar (sem permissão, limite de fotos do
   produto etc.), a foto fica no formato antigo e continua aparecendo. */
async function _fotoId(code,dataUrl){ const b=new Uint8Array(await crypto.subtle.digest('SHA-256',new TextEncoder().encode(code+'|'+dataUrl)));
  const h=[...b.slice(0,16)].map(x=>x.toString(16).padStart(2,'0')).join('');
  return h.slice(0,8)+'-'+h.slice(8,12)+'-4'+h.slice(13,16)+'-'+(8|(parseInt(h[16],16)&3)).toString(16)+h.slice(17,20)+'-'+h.slice(20,32); }
function _dataUrlBlob(u){ const [cab,b64]=String(u).split(','); const bin=atob(b64); const a=new Uint8Array(bin.length); for(let i=0;i<bin.length;i++)a[i]=bin.charCodeAt(i);
  return new Blob([a],{type:(/data:([^;]+)/.exec(cab)||[])[1]||'image/jpeg'}); }
/* envia uma foto (dataURL) para o armazenamento; id fixo pelo conteúdo: repetir não duplica. Devolve true se ficou lá. */
async function fotoParaArquivo(code,dataUrl){
  try{ const id=await _fotoId(code,dataUrl), blob=_dataUrlBlob(dataUrl);
    const path='p/'+String(code).replace(/[^A-Za-z0-9._-]/g,'_')+'/'+id+'.jpg';
    const up=await sb.storage.from('produtos').upload(path,blob,{contentType:blob.type,upsert:false,cacheControl:'31536000'});
    if(up.error&&!/exist|duplicate/i.test(up.error.message||''))return false;
    const ins=await sb.from('produto_fotos').insert({id,code,path,bytes:blob.size,origem:'documento',criado_por_nome:profile.nome||profile.email});
    return !ins.error||ins.error.code==='23505';
  }catch(e){ console.warn('fotoParaArquivo',e); return false; } }
let _migrandoFotos=false;
async function migrarFotosAntigas(){
  if(_migrandoFotos||!isOnline||!profile||profile.papel!=='admin'||!profile.ativo)return;
  if(_photosReady)await _photosReady; if(!_photosLoaded)return;
  const codes=Object.keys(photos).filter(c=>fotosLocais(c).length); if(!codes.length)return;
  _migrandoFotos=true; let ok=0, ficou=0;
  try{
    for(const code of codes){
      const resta=[];
      for(const u of fotosLocais(code)){ if(await fotoParaArquivo(code,u))ok++; else { resta.push(u); ficou++; } }
      if(resta.length)photos[code]=resta; else delete photos[code];
      if(ok&&ok%40===0){ await savePhotos(); await loadFotosExt(); } /* grava aos poucos: se a aba fechar no meio, o já enviado não volta */
    }
    if(ok){ await savePhotos(); await loadFotosExt(); if(!usuarioInteragindo())refreshTelaAtual();
      toast(ok+' foto(s) antiga(s) passaram para arquivos — o sistema abre mais leve.'+(ficou?' '+ficou+' ficaram no formato antigo.':''),'ok'); }
  } finally { _migrandoFotos=false; } }
function uploadPhoto(code,inp){ if(!fotosProntas()){ inp.value=''; return; } const files=[...inp.files].filter(f=>f.type.startsWith('image/')); if(!files.length){toast('Selecione imagem(ns).','err');return;}
  if(!Array.isArray(photos[code]))photos[code]=photos[code]?[photos[code]]:[];
  let pending=files.length;
  let antigas=0;
  files.forEach(f=>resizeImage(f,680,async src=>{
    if(!(await fotoParaArquivo(code,src))){ photos[code].push(src); antigas++; }
    if(--pending===0){ if(!photos[code].length)delete photos[code]; if(antigas)savePhotos(); await loadFotosExt(); renderEpGallery(code); toast('Foto(s) salva(s).','ok'); } }));
  inp.value=''; }
function removePhotoAt(code,idx){ const loc=fotosLocais(code);
  if(idx>=loc.length){ const ex=(fotosExt[code]||[])[idx-loc.length]; if(ex)removeFotoExt(code,ex); return; }
  if(!fotosProntas())return; const arr=loc.slice(); arr.splice(idx,1); photos[code]=arr; if(!arr.length)delete photos[code]; savePhotos(); renderEpGallery(code); toast('Foto removida.','ok'); }

function periodTs(){ const f=$('#dashFrom')&&$('#dashFrom').value?new Date($('#dashFrom').value+'T00:00:00').getTime():0; const t=$('#dashTo')&&$('#dashTo').value?new Date($('#dashTo').value+'T23:59:59').getTime():Date.now(); return [f,t]; }
function movDeltaVal(m,obraId){ const p=findProduct(m.code); const c=p?(p.custo||0):0;
  if(obraId==='__all'){ if(m.tipo==='entrada')return m.qty*c; if(m.tipo==='baixa')return -m.qty*c; return 0; }
  if(m.tipo==='entrada')return m.obra===obraId?m.qty*c:0;
  if(m.tipo==='baixa')return m.obra===obraId?-m.qty*c:0;
  if(m.tipo==='transferencia'){ let d=0; if(m.obra===obraId)d-=m.qty*c; if(m.obraDest===obraId)d+=m.qty*c; return d; }
  return 0; }
let evoChartObj=null;

  const saldos=state.obras.filter(o=>saldoOf(o.id,code)>0||limObra(o.id,code)).map(o=>{ const L=limDe(p,o.id); const st=statusOf(p,saldoOf(o.id,code),o.id);
    const cel=f=>L.off?'—':ed?`<input class="inline-edit" type="number" step="any" style="width:70px;${L.proprio?'':'color:#a09a8d;font-style:italic'}" value="${L[f]}" onchange="setLimObra('${esc(o.id)}','${esc(code)}','${f}',this.value);productDetailModal('${esc(code)}')">`:(f==='max'&&!(L.max>0)?'—':numf(L[f]));
    return `<tr><td>${esc(o.nome)}${L.proprio&&!L.off?' <span class="pill good" style="font-size:9.5px">próprio</span>':''}</td><td class="num"><b class="${st==='low'?'neg':''}">${numf(saldoOf(o.id,code))}</b> ${esc(p.unit||'')}</td><td class="num">${cel('min')}</td><td class="num">${cel('max')}</td>
      <td class="num" style="white-space:nowrap">${ed?`<label style="display:inline-flex;align-items:center;gap:4px;text-transform:none;font-weight:500;margin:0;font-size:11.5px"><input type="checkbox" style="width:auto" ${L.off?'':'checked'} onchange="offLimObra('${esc(o.id)}','${esc(code)}',!this.checked);productDetailModal('${esc(code)}')"> controla</label>${L.proprio&&!L.off?` <a href="#" style="font-size:11px;color:#7a5100" onclick="resetLimObra('${esc(o.id)}','${esc(code)}');productDetailModal('${esc(code)}');return false">↺ padrão</a>`:''}`:(L.off?'não controla':'')}</td></tr>`; }).join('');
  modal(`<h3>${esc(p.desc)}</h3><p class="mp mono">${esc(p.code)}${p.aux?' · aux '+esc(p.aux):''}${p.fab?' · fabricante '+esc(p.fab):''}</p>
    ${fotos.length?`<div style="display:flex;flex-wrap:wrap;gap:6px;margin-bottom:12px">${fotos.map((s,i)=>`<img src="${s}" style="width:84px;height:84px;object-fit:cover;border-radius:8px;border:1px solid #e4dfd4;cursor:zoom-in" onclick="openPhoto('${esc(code)}',${i})">`).join('')}</div>`:'<p class="mp">Sem foto cadastrada.</p>'}
    <div style="display:flex;gap:18px;flex-wrap:wrap;font-size:13px;margin-bottom:12px">
      <div><b>Saldo total:</b> ${numf(totalSaldo(code))} ${esc(p.unit||'')}</div>
      <div><b>Custo médio:</b> ${money(p.custo||0)}</div>
      <div><b>Preço venda:</b> ${p.preco?money(p.preco):'—'}</div>
      <div><b>Mín / Máx padrão:</b> ${numf(p.min)} / ${p.max>0?numf(p.max):'—'}</div></div>
    ${p.ref?`<div style="font-size:13px;color:#6a6357;margin-bottom:12px"><b>Referências / Aplicação:</b><br>${esc(p.ref).replace(/\n/g,'<br>')}</div>`:''}
    <div class="tbl-wrap"><table><thead><tr><th>Obra</th><th class="num">Saldo</th><th class="num">Mín</th><th class="num">Máx</th><th class="num">Controle</th></tr></thead><tbody>${saldos||'<tr><td colspan="5" class="empty" style="padding:14px">Sem saldo em nenhuma obra.</td></tr>'}</tbody></table></div>
    <p class="muted" style="font-size:11.5px;margin-top:6px">Mín/Máx em cinza/itálico = padrão do produto. Para definir em uma obra sem saldo, selecione a obra no topo da tela Produtos.</p>
    ${lotesDetalheHTML(p)}
    <div style="display:flex;gap:10px;justify-content:flex-end;margin-top:14px">${lotesAtivos()?`<button class="btn ghost" style="margin-right:auto" onclick="lotesModal('${esc(code)}')">🏷 Lotes e validade</button>`:''}<button class="btn ghost" onclick="closeModal()">Fechar</button><button class="btn primary" onclick="closeModal();editProductModal('${esc(code)}')">Editar</button></div>`);
}
/* ===== OBRAS ===== */
function renderObras(){
  $('#topActions').innerHTML=`<button class="btn primary sm" onclick="obraModal()">+ Nova obra</button>`;
  let html=`<div class="sechead"><h3>Obras cadastradas</h3></div>`;
  if(!state.obras.length){ html+=`<div class="tbl-wrap"><div class="empty"><div class="ico">⌂</div>Nenhuma obra cadastrada.<br><button class="btn primary" onclick="obraModal()">+ Cadastrar primeira obra</button></div></div>`; $('#view').innerHTML=html; return; }
  html+=`<div class="tbl-wrap"><table><thead><tr><th>Obra</th><th>Empresa</th><th>Local</th><th class="num">Itens c/ saldo</th><th class="num">Valor em estoque</th><th></th></tr></thead><tbody>`;
  state.obras.forEach(o=>{ let itens=0,val=0; state.products.forEach(p=>{const s=saldoOf(o.id,p.code); if(s>0){itens++;val+=s*(p.custo||0);}});
    html+=`<tr><td><b>${esc(o.nome)}</b>${o.ehEstoque?' <span class="pill disponivel" style="font-size:10px">Estoque</span>':''}</td><td class="muted">${esc(o.empresa||'—')}</td><td class="muted">${esc(o.local||'—')}</td><td class="num">${itens}</td><td class="num">${money(val)}</td>
    <td class="num" style="white-space:nowrap"><button class="btn ghost sm" onclick="obraModal('${o.id}')">✎</button> <button class="btn danger sm" onclick="delObra('${o.id}')">✕</button></td></tr>`; });
  html+=`</tbody></table></div>`;
  $('#view').innerHTML=html;
}
function obraModal(id){ const o=id?state.obras.find(x=>x.id===id):null;
  modal(`<h3>${o?'Editar obra':'Nova obra'}</h3>
    <div class="field"><label>Nome da obra</label><input id="obNome" value="${o?esc(o.nome):''}" placeholder="Ex.: Obra 57 — Vias Guajará"></div>
    <div class="field"><label>Empresa (razão social)</label>${state.empresas&&state.empresas.length?`<select id="obEmpresaId">
      <option value="">— nenhuma —</option>${state.empresas.map(e=>`<option value="${e.id}" ${o&&o.empresaId===e.id?'selected':''}>${esc(e.razaoSocial)}</option>`).join('')}
      </select><div class="muted" style="font-size:11px;margin-top:4px">Não achou a empresa? <a href="javascript:void(0)" onclick="closeModal();go('empresas')">cadastre em Empresas</a>.</div>`
      :`<input disabled placeholder="cadastre em Empresas primeiro">`}</div>
    <div class="field"><label>Local / referência (opcional)</label><input id="obLocal" value="${o?esc(o.local||''):''}" placeholder="Cidade, contrato..."></div>
    <label style="display:flex;align-items:center;gap:8px;text-transform:none;font-weight:500;font-size:13px;margin:4px 0 0"><input type="checkbox" id="obEhEstoque" style="width:auto" ${o&&o.ehEstoque?'checked':''}> Esta obra é o estoque/almoxarifado central da empresa</label>
    <p class="muted" style="font-size:11px;margin:4px 0 0">Requisições formais de centros de custo dessa empresa são verificadas e separadas a partir do saldo desta obra.</p>
    <div style="display:flex;gap:10px;justify-content:flex-end;margin-top:10px"><button class="btn ghost" onclick="closeModal()">Cancelar</button><button class="btn primary" onclick="saveObra('${id||''}')">Salvar</button></div>`);
}
function saveObra(id){ const nome=$('#obNome').value.trim(); if(!nome){toast('Informe o nome da obra.','err');return;} const local=$('#obLocal').value.trim();
  const empresaId=$('#obEmpresaId')?$('#obEmpresaId').value:''; const emp=empresaId?state.empresas.find(e=>e.id===empresaId):null; const empresa=emp?emp.razaoSocial:'';
  const ehEstoque=$('#obEhEstoque')?$('#obEhEstoque').checked:false;
  if(id){ const o=state.obras.find(x=>x.id===id); o.nome=nome; o.local=local; o.empresa=empresa; o.empresaId=empresaId||null; o.ehEstoque=ehEstoque; } else { const nid=uid(); state.obras.push({id:nid,nome,local,empresa,empresaId:empresaId||null,ehEstoque}); if(!state.currentObra)state.currentObra=nid; }
  save(); closeModal(); renderObras(); toast('Obra salva.','ok'); }
function delObra(id){ const itens=state.products.filter(p=>saldoOf(id,p.code)>0).length;
  if(itens>0){ toast('A obra tem saldo em estoque. Zere ou transfira antes de excluir.','err'); return; }
  const nomeObra=obraName(id); requireSupervisor(`Excluir obra "${nomeObra}"`,()=>{ state.obras=state.obras.filter(o=>o.id!==id); delete state.estoque[id];
    if(state.currentObra===id)state.currentObra=state.obras[0]?state.obras[0].id:null; save('Obra excluída: '+nomeObra); renderObras(); toast('Obra excluída.','ok'); }); }

/* ===== EMPRESAS ===== */
function renderEmpresas(){
  $('#topActions').innerHTML=`<button class="btn primary sm" onclick="empresaModal()">+ Nova empresa</button>`;
  if(!state.empresas)state.empresas=[];
  let html=`<div class="panel"><h3>🏢 Empresas</h3><p class="desc">Razão social, CNPJ e endereço — usados no cabeçalho de emitente/destinatário das etiquetas de volume e no controle de mútuo. Vincule cada obra a uma empresa no cadastro de Obras.</p></div>`;
  if(!state.empresas.length){ html+=`<div class="tbl-wrap"><div class="empty"><div class="ico">🏢</div>Nenhuma empresa cadastrada.<br><button class="btn primary" onclick="empresaModal()">+ Cadastrar primeira empresa</button></div></div>`; $('#view').innerHTML=html; return; }
  html+=`<div class="tbl-wrap"><table><thead><tr><th>Razão social</th><th>CNPJ</th><th>Endereço</th><th class="num">Obras vinculadas</th><th></th></tr></thead><tbody>`;
  state.empresas.forEach(e=>{ const nObras=state.obras.filter(o=>o.empresaId===e.id).length;
    html+=`<tr><td><b>${esc(e.razaoSocial)}</b></td><td class="mono">${esc(e.cnpj||'—')}</td><td class="muted" style="font-size:12.5px">${esc(e.endereco||'—')}</td><td class="num">${nObras}</td>
    <td class="num" style="white-space:nowrap"><button class="btn ghost sm" onclick="empresaModal('${e.id}')">✎</button> <button class="btn danger sm" onclick="delEmpresa('${e.id}')">✕</button></td></tr>`; });
  html+=`</tbody></table></div>`;
  $('#view').innerHTML=html;
}
function empresaModal(id){ const e=id?state.empresas.find(x=>x.id===id):null;
  modal(`<h3>${e?'Editar empresa':'Nova empresa'}</h3>
    <div class="field"><label>Razão social</label><input id="emRazao" value="${e?esc(e.razaoSocial):''}" placeholder="Ex.: AMETA Engenharia Ltda"></div>
    <div class="field"><label>CNPJ</label><input id="emCnpj" value="${e?esc(e.cnpj||''):''}" placeholder="00.000.000/0000-00"></div>
    <div class="field"><label>Endereço completo</label><textarea id="emEndereco" rows="2" placeholder="Rua, número, bairro, cidade/UF, CEP">${e?esc(e.endereco||''):''}</textarea></div>
    <div style="display:flex;gap:10px;justify-content:flex-end"><button class="btn ghost" onclick="closeModal()">Cancelar</button><button class="btn primary" onclick="saveEmpresa('${id||''}')">Salvar</button></div>`);
}
function saveEmpresa(id){ const razaoSocial=$('#emRazao').value.trim(); if(!razaoSocial){toast('Informe a razão social.','err');return;}
  const cnpj=$('#emCnpj').value.trim(); const endereco=$('#emEndereco').value.trim();
  if(!state.empresas)state.empresas=[];
  if(id){ const e=state.empresas.find(x=>x.id===id); e.razaoSocial=razaoSocial; e.cnpj=cnpj; e.endereco=endereco;
    state.obras.filter(o=>o.empresaId===id).forEach(o=>o.empresa=razaoSocial);
  } else { state.empresas.push({id:uid(),razaoSocial,cnpj,endereco}); }
  save(); closeModal(); renderEmpresas(); toast('Empresa salva.','ok'); }
function delEmpresa(id){ const nObras=state.obras.filter(o=>o.empresaId===id).length;
  if(nObras>0){ toast('Existem obras vinculadas a essa empresa. Desvincule antes de excluir.','err'); return; }
  const e=state.empresas.find(x=>x.id===id); requireSupervisor(`Excluir empresa "${e?e.razaoSocial:''}"`,()=>{ state.empresas=state.empresas.filter(x=>x.id!==id); save('Empresa excluída: '+(e?e.razaoSocial:'')); renderEmpresas(); toast('Empresa excluída.','ok'); }); }

/* ===== APLICAÇÕES ===== */
function aplicTipoLabel(t,sub){ const f=(state.aplicTipos||[]).find(x=>x.id===t); let l=f?(f.icone?f.icone+' ':'')+f.label:(t||'—'); const tObj=f;
  if(tObj&&tObj.usaSetor&&sub){ const s=(state.setores||[]).find(x=>x.id===sub); l+=' · '+(s?s.nome:sub); } return l; }
function renderAplic(){
  $('#topActions').innerHTML=`<button class="btn primary sm" onclick="aplicModal()">+ Nova aplicação</button>`;
  let html=`<div class="panel"><h3>Aplicações</h3><p class="desc">Cadastro de destinos onde o material é aplicado/consumido (equipamentos, veículos, oficina, escritório/ADM, lavajato, diretoria). Informe a placa/tag quando houver. Tipos e setores são geridos em <a href="javascript:void(0)" onclick="go('tiposetor')">Tipos &amp; Setores</a>.</p></div>`;
  if(!state.aplicacoes.length){ html+=`<div class="tbl-wrap"><div class="empty"><div class="ico">⚙</div>Nenhuma aplicação cadastrada.<br><button class="btn primary" onclick="aplicModal()">+ Cadastrar primeira</button></div></div>`; $('#view').innerHTML=html; return; }
  html+=`<div class="tbl-wrap"><table><thead><tr><th>Nome</th><th>Tipo</th><th>Placa / Tag</th><th class="num">Consumos</th><th></th></tr></thead><tbody>`;
  state.aplicacoes.forEach(a=>{ const usos=state.movements.filter(m=>m.tipo==='baixa'&&m.aplic===a.id).length;
    html+=`<tr><td><b>${esc(a.nome)}</b></td><td>${esc(aplicTipoLabel(a.tipo,a.sub))}</td><td class="mono">${esc(a.tag||'—')}</td><td class="num" data-usos="${esc(a.id)}">${usos}</td>
    <td class="num" style="white-space:nowrap"><button class="btn ghost sm" onclick="aplicModal('${a.id}')">✎</button> <button class="btn danger sm" onclick="delAplic('${a.id}')">✕</button></td></tr>`; });
  html+=`</tbody></table></div>`;
  $('#view').innerHTML=html;
  if(isOnline&&movLoadedFrom!==0) sb.rpc('consumos_por_aplicacao').then(({data,error})=>{ if(error||!data)return; const m={}; data.forEach(r=>m[r.aplic]=r.qtd);
    document.querySelectorAll('[data-usos]').forEach(td=>{ td.textContent=numf(m[td.dataset.usos]||0); }); });
}
function aplicModal(id){ const a=id?state.aplicacoes.find(x=>x.id===id):null;
  if(!state.aplicTipos||!state.aplicTipos.length){ toast('Cadastre ao menos um tipo de aplicação primeiro.','err'); go('tiposetor'); return; }
  modal(`<h3>${a?'Editar aplicação':'Nova aplicação'}</h3>
    <div class="field"><label>Tipo</label><select id="apTipo" onchange="apTipoChange()">${state.aplicTipos.map(x=>`<option value="${x.id}"${a&&a.tipo===x.id?' selected':''}>${x.icone?esc(x.icone)+' ':''}${esc(x.label)}</option>`).join('')}</select></div>
    <div id="apSubWrap" style="display:none"><div class="field"><label>Setor</label><select id="apSub">${(state.setores||[]).map(x=>`<option value="${x.id}"${a&&a.sub===x.id?' selected':''}>${esc(x.nome)}</option>`).join('')}</select></div><p class="desc" style="margin-top:-4px">O setor já identifica a aplicação — não precisa de nome nem placa.</p></div>
    <div id="apNomeWrap">
      <div class="field"><label>Nome / identificação</label><input id="apNome" value="${a&&!aplicUsaSetor(a.tipo)?esc(a.nome||''):''}" placeholder="Ex.: Escavadeira CAT 320 / Caminhão Mercedes"></div>
      <div class="field"><label>Placa / Tag (opcional)</label><input id="apTag" class="mono" value="${a?esc(a.tag||''):''}" placeholder="ABC-1D23 ou TAG-001"></div></div>
    <div style="display:flex;gap:10px;justify-content:flex-end"><button class="btn ghost" onclick="closeModal()">Cancelar</button><button class="btn primary" onclick="saveAplic('${id||''}')">Salvar</button></div>`);
  apTipoChange();
}
function aplicUsaSetor(tipoId){ const t=(state.aplicTipos||[]).find(x=>x.id===tipoId); return !!(t&&t.usaSetor); }
function apTipoChange(){ const usaSetor=$('#apTipo')&&aplicUsaSetor($('#apTipo').value); if($('#apSubWrap'))$('#apSubWrap').style.display=usaSetor?'':'none'; if($('#apNomeWrap'))$('#apNomeWrap').style.display=usaSetor?'none':''; }
function saveAplic(id){ const tipo=$('#apTipo').value; let nome,tag='',sub='';
  if(aplicUsaSetor(tipo)){ sub=$('#apSub')?$('#apSub').value:''; if(!sub){toast('Escolha o setor.','err');return;} const s=(state.setores||[]).find(x=>x.id===sub); const t=state.aplicTipos.find(x=>x.id===tipo); nome=(t?t.label:tipo)+' — '+(s?s.nome:sub); }
  else { nome=$('#apNome').value.trim(); if(!nome){toast('Informe o nome.','err');return;} tag=$('#apTag').value.trim(); }
  if(id){ const a=state.aplicacoes.find(x=>x.id===id); a.nome=nome; a.tipo=tipo; a.tag=tag; a.sub=sub; } else { state.aplicacoes.push({id:uid(),nome,tipo,tag,sub}); }
  save(); closeModal(); renderAplic(); toast('Aplicação salva.','ok'); }
function delAplic(id){ const nm=aplicName(id); requireSupervisor(`Excluir aplicação "${nm}"`,()=>{ state.aplicacoes=state.aplicacoes.filter(a=>a.id!==id); save('Aplicação excluída: '+nm); renderAplic(); toast('Aplicação excluída.','ok'); }); }

/* ===== TIPOS DE APLICAÇÃO & SETORES ===== */

    <div class="tbl-wrap" style="margin-bottom:24px"><table><thead><tr><th>Ícone</th><th>Nome</th><th class="num">Usa setor?</th><th class="num">Aplicações</th><th></th></tr></thead><tbody>${
      state.aplicTipos.map(t=>{ const n=state.aplicacoes.filter(a=>a.tipo===t.id).length;
        return `<tr><td style="font-size:16px">${esc(t.icone||'')}</td><td><b>${esc(t.label)}</b></td><td class="num">${t.usaSetor?'Sim':'—'}</td><td class="num">${n}</td>
        <td class="num" style="white-space:nowrap"><button class="btn ghost sm" onclick="tipoAplicModal('${t.id}')">✎</button> <button class="btn danger sm" onclick="delTipoAplic('${t.id}')">✕</button></td></tr>`; }).join('')||'<tr><td colspan="5" class="empty" style="padding:20px">Nenhum tipo cadastrado.</td></tr>'
    }</tbody></table></div>
    <div class="sechead"><h3>Setores</h3><button class="btn primary sm" onclick="setorModal()">+ Novo setor</button></div>
    <div class="tbl-wrap"><table><thead><tr><th>Nome</th><th class="num">Aplicações</th><th></th></tr></thead><tbody>${
      state.setores.map(s=>{ const n=state.aplicacoes.filter(a=>a.sub===s.id).length;
        return `<tr><td><b>${esc(s.nome)}</b></td><td class="num">${n}</td>
        <td class="num" style="white-space:nowrap"><button class="btn ghost sm" onclick="setorModal('${s.id}')">✎</button> <button class="btn danger sm" onclick="delSetor('${s.id}')">✕</button></td></tr>`; }).join('')||'<tr><td colspan="3" class="empty" style="padding:20px">Nenhum setor cadastrado.</td></tr>'
    }</tbody></table></div>`;
  $('#view').innerHTML=html;
}
function tipoAplicModal(id){ const t=id?state.aplicTipos.find(x=>x.id===id):null;
  modal(`<h3>${t?'Editar tipo':'Novo tipo de aplicação'}</h3>
    <div class="row c2"><div class="field"><label>Ícone (emoji, opcional)</label><input id="tpIcone" value="${t?esc(t.icone||''):''}" placeholder="⚙"></div><div class="field"><label>Nome</label><input id="tpLabel" value="${t?esc(t.label):''}" placeholder="Ex.: EQUIPAMENTO"></div></div>
    <label style="display:flex;align-items:center;gap:8px;text-transform:none;font-weight:500;font-size:13px;margin:8px 0"><input type="checkbox" id="tpUsaSetor" style="width:auto" ${t&&t.usaSetor?'checked':''}> Este tipo usa "Setor" em vez de nome/placa (como Sede)</label>
    <div style="display:flex;gap:10px;justify-content:flex-end"><button class="btn ghost" onclick="closeModal()">Cancelar</button><button class="btn primary" onclick="saveTipoAplic('${id||''}')">Salvar</button></div>`);
}
function saveTipoAplic(id){ const label=$('#tpLabel').value.trim(); if(!label){toast('Informe o nome do tipo.','err');return;}
  const icone=$('#tpIcone').value.trim(); const usaSetor=$('#tpUsaSetor').checked;
  if(!state.aplicTipos)state.aplicTipos=[];
  if(id){ const t=state.aplicTipos.find(x=>x.id===id); t.label=label; t.icone=icone; t.usaSetor=usaSetor; } else { state.aplicTipos.push({id:uid(),label,icone,usaSetor}); }
  save(); closeModal(); renderTipoSetor(); toast('Tipo salvo.','ok'); }
function delTipoAplic(id){ const n=state.aplicacoes.filter(a=>a.tipo===id).length;
  if(n>0){ toast('Existem aplicações usando esse tipo. Reclassifique-as antes de excluir.','err'); return; }
  const t=state.aplicTipos.find(x=>x.id===id); requireSupervisor(`Excluir tipo "${t?t.label:''}"`,()=>{ state.aplicTipos=state.aplicTipos.filter(x=>x.id!==id); save('Tipo de aplicação excluído: '+(t?t.label:'')); renderTipoSetor(); toast('Tipo excluído.','ok'); }); }
function setorModal(id){ const s=id?state.setores.find(x=>x.id===id):null;
  modal(`<h3>${s?'Editar setor':'Novo setor'}</h3>
    <div class="field"><label>Nome do setor</label><input id="stNome" value="${s?esc(s.nome):''}" placeholder="Ex.: OFICINA"></div>
    <div style="display:flex;gap:10px;justify-content:flex-end"><button class="btn ghost" onclick="closeModal()">Cancelar</button><button class="btn primary" onclick="saveSetor('${id||''}')">Salvar</button></div>`);
}
function saveSetor(id){ const nome=$('#stNome').value.trim(); if(!nome){toast('Informe o nome do setor.','err');return;}

function tagsOf(root,name){ let r=root.getElementsByTagName(name); if(r.length)return r; return root.getElementsByTagNameNS('*',name); }
function txt(root,name){ const n=tagsOf(root,name)[0]; return n?n.textContent.trim():''; }
function importXml(content){
  try{
    const doc=new DOMParser().parseFromString(content,'text/xml');
    if(doc.getElementsByTagName('parsererror').length){toast('XML inválido.','err');return;}
    const ide=tagsOf(doc,'ide')[0]; const nNF=ide?txt(ide,'nNF'):'';
    const emit=tagsOf(doc,'emit')[0]; const forn=emit?txt(emit,'xNome'):'';
    const dets=[...tagsOf(doc,'det')];
    if(!dets.length){toast('Não encontrei itens (det) no XML.','err');return;}
    const emitCnpjX=emit?txt(emit,'CNPJ')||txt(emit,'CPF'):'';
    let add=0, auto=0;
    nfItems=nfItems.filter(i=>!i.reposPre); /* o XML substitui os itens pré-carregados da solicitação */
    const itensX=nfeItensCusto(doc); const acresTotal=itensX.reduce((t,x)=>t+x.acres,0);
    itensX.forEach(x=>{ const {cProd,cEAN,qty,custo,custoNF,ex,xProd,uCom,ncm,cst,rastro}=x; const eanOk=!!cEAN;
      const code=eanOk?cEAN:(cProd||genCode());
      const it={code, desc:xProd, unit:uCom, qty, custo, preco:0,
        xml:Object.assign({cProd, cEAN, xProd, uCom, qty, custo, custoNF, ncm, cst, rastro, cnpj:onlyDigits(emitCnpjX)},ex), link:null, fator:1, lembrar:true};
      autoVincular(it); if(it.link)auto++; nfLotesSync(it);
      nfItems.push(it); add++; });
    if(nNF&&$('#nfNum'))$('#nfNum').value=String(nNF).replace(/\D/g,''); if(forn&&$('#nfForn'))$('#nfForn').value=forn;
    const dhEmi=ide?(txt(ide,'dhEmi')||txt(ide,'dEmi')):''; if(dhEmi&&$('#nfData'))$('#nfData').value=dhEmi.slice(0,10);
    const emitCnpj=emit?txt(emit,'CNPJ'):''; if(emitCnpj&&$('#nfCnpjEmit'))$('#nfCnpjEmit').value=emitCnpj;
    { const dest=tagsOf(doc,'dest')[0];
      const tot=tagsOf(doc,'ICMSTot')[0]; const vNF=tot?parseFloat(txt(tot,'vNF'))||0:0;
      _nfXmlExtra={chave:nfeChave(doc),dest:dest?txt(dest,'xNome'):'',vNF}; }
    ctrlPreencherDoXml(doc);
    const dest=tagsOf(doc,'dest')[0]; const destDoc=dest?(txt(dest,'CNPJ')||txt(dest,'CPF')):''; if(destDoc&&$('#nfCnpjTom'))$('#nfCnpjTom').value=destDoc;
    if($('#xmlText'))$('#xmlText').value='';
    drawNfItems(); toast(`XML lido · ${add} item(ns) carregado(s)`+(auto?` · ${auto} vinculado(s) automaticamente`:'')+(add-auto?` · ${add-auto} sem vínculo`:'')+(Math.abs(acresTotal)>=0.005?` · ${money(acresTotal)} de frete/impostos/despesas${acresTotal<0?' (líquido de desconto)':''} incluídos no custo dos itens`:'')+'.','ok');
  }catch(e){ toast('Erro ao ler XML: '+e.message,'err'); }
}
/* Itens da NF-e com o custo de entrada = valor unitário da NF + frete, seguro, outras despesas, IPI e ICMS-ST do item − desconto.
   Frete/seguro/outras/desconto: usa o valor de cada item quando o emitente já rateou; senão rateia o total da nota
   (ICMSTot) proporcionalmente ao valor dos produtos. IPI e ICMS-ST (+ FCP-ST) vêm sempre por item. */
function nfeItensCusto(doc){
  const detsP=[...tagsOf(doc,'det')].map(det=>({det,prod:tagsOf(det,'prod')[0]})).filter(d=>d.prod);
  const vProdOf=d=>parseFloat(txt(d.prod,'vProd'))||0; const somaVProd=detsP.reduce((t,d)=>t+vProdOf(d),0);
  const totX=tagsOf(doc,'ICMSTot')[0];
  const ratear=tag=>{ const itens=detsP.map(d=>parseFloat(txt(d.prod,tag))||0); const tot=totX?parseFloat(txt(totX,tag))||0:0;
    if(itens.some(v=>v>0)||!(tot>0))return itens;
    const r=detsP.map(d=>somaVProd>0?+(tot*vProdOf(d)/somaVProd).toFixed(2):+(tot/detsP.length).toFixed(2));
    const dif=+(tot-r.reduce((a,b)=>a+b,0)).toFixed(2); if(dif&&r.length){ const iMax=r.indexOf(Math.max(...r)); r[iMax]=+(r[iMax]+dif).toFixed(2); } /* centavos do arredondamento vão para o maior item */
    return r; };
  const rat={frete:ratear('vFrete'),seg:ratear('vSeg'),outro:ratear('vOutro'),descto:ratear('vDesc')};
  return detsP.map(({det,prod},di)=>{
    const cEANraw=txt(prod,'cEAN'); const cEAN=/^\d{8,14}$/.test(cEANraw)?cEANraw:''; const cProd=txt(prod,'cProd');
    const qty=parseFloat(txt(prod,'qCom'))||parseFloat(txt(prod,'qTrib'))||0;
    const custoNF=parseFloat(txt(prod,'vUnCom'))||parseFloat(txt(prod,'vUnTrib'))||0;
    const ipiG=tagsOf(det,'IPI')[0]; const ipi=ipiG?parseFloat(txt(ipiG,'vIPI'))||0:0;
    const st=(parseFloat(txt(det,'vICMSST'))||0)+(parseFloat(txt(det,'vFCPST'))||0);
    const ex={frete:rat.frete[di]||0,seg:rat.seg[di]||0,outro:rat.outro[di]||0,ipi,st,descto:rat.descto[di]||0};
    const acres=ex.frete+ex.seg+ex.outro+ex.ipi+ex.st-ex.descto;
    const custo=acres&&qty>0?Math.max(0,+(custoNF+acres/qty).toFixed(6)):custoNF;
    return {cProd,cEAN,qty,custoNF,custo,ex,acres,rastro:nfeRastro(prod),xProd:txt(prod,'xProd'),uCom:(txt(prod,'uCom')||'UN').toUpperCase(),ncm:onlyDigits(txt(prod,'NCM')),cst:cstIcmsDoDet(det)}; }); }
function nfeChave(doc){ const inf=tagsOf(doc,'infNFe')[0]; const ch=onlyDigits((inf&&inf.getAttribute('Id'))||txt(doc,'chNFe')||''); return ch.length===44?ch:''; }
/* Valores da NF-e que compõem o custo de entrada além do valor unitário (em R$ do item; desconto subtrai) */
const NF_EXTRAS=[['frete','Frete'],['seg','Seguro'],['outro','Outras despesas'],['ipi','IPI'],['st','ICMS-ST'],['descto','Desconto']];
function nfExtrasLista(o){ return NF_EXTRAS.filter(([k])=>Number(o&&o[k])>0).map(([k,l])=>({k,l,v:Number(o[k]),neg:k==='descto'})); }
/* Custo médio ponderado de uma entrada: base = saldo total do produto (todas as obras); saldo negativo conta como zero,
   para não distorcer a média. Devolve o saldo/custo usados e o novo custo médio. */
function custoMedioEntrada(p,qty,custoUnit){ const qAnt=Math.max(0,totalSaldo(p.code)); const custoAnt=p.custo||0;
  if(!(custoUnit>0)||!(qty>0))return {qAnt,custoAnt,custoMedio:custoAnt};
  return {qAnt,custoAnt,custoMedio:((qAnt*custoAnt)+(qty*custoUnit))/(qAnt+qty)}; }
/* CST do ICMS do item: origem + CST (ex.: 000, 060) ou origem + CSOSN no Simples Nacional (ex.: 0102) */
function cstIcmsDoDet(det){ const icms=tagsOf(det,'ICMS')[0]; if(!icms)return ''; const g=[...icms.children][0]||icms;
  const cst=txt(g,'CST')||txt(g,'CSOSN'); return cst?txt(g,'orig')+cst:''; }

/* ===== Integração com o Controle de Notas Fiscais =====
   Após a entrada, avisa o Controle de Notas (outro sistema/projeto Supabase) pela API receber-nota-estoque:
   se a nota já estiver lá, só vincula; senão é incluída em "Entradas". A API confere o login deste usuário.
   Falha aqui não desfaz a entrada — só avisa. */
const CONTROLE_NOTAS_API='https://kygainafarusnsstvvhc.supabase.co/functions/v1/receber-nota-estoque';
async function ctrlApi(body){
  const {data:sd}=await sb.auth.getSession(); const tk=sd&&sd.session&&sd.session.access_token; if(!tk)throw new Error('sessão expirada — entre de novo');
  const res=await fetch(CONTROLE_NOTAS_API,{method:'POST',headers:{'Content-Type':'application/json',Authorization:'Bearer '+tk},body:JSON.stringify(body)});
  const r=await res.json().catch(()=>({}));
  if(!res.ok)throw new Error(r.error||('HTTP '+res.status));
  return r;
}
async function enviarNotaControle(nota,anexos){
  if(!isOnline||!nota.numero||nota.numero==='s/nº'||!nota.fornecedor){ if(nota.numero&&nota.numero!=='s/nº'&&!nota.fornecedor)toast('Controle de notas: nota não enviada — informe o fornecedor.','warn'); else if(!isOnline)toast('Sem conexão: a nota não foi enviada ao Controle de Notas. Depois use "Enviar ao Controle" nos detalhes da nota.','warn'); return false; }
  let r;
  try{
    r=await ctrlApi(nota);
    toast(r.resultado==='criada'?'Controle de notas: NF '+esc(nota.numero)+' incluída'+(r.obraVinculada?'':' (sem obra — ajuste lá)')+'.':'Controle de notas: NF '+esc(nota.numero)+' já constava — vinculada e completada.','ok');
  }catch(e){ toast('Não foi possível avisar o Controle de Notas: '+esc((e&&e.message)||String(e)),'warn'); return false; }
  if(anexos&&anexos.length&&r&&r.id)await ctrlEnviarAnexos(r.id,nota.estoqueNotaId,anexos);

}
/* Anexos (boleto, CT-e...) vão para os "Documentos anexados" da nota no Controle, um por vez */
const CTRL_ANEXO_MAX=15*1024*1024;
function ctrlLerAnexos(px){ const out=[];
  [['CtrlAnexos','nota'],['CtrlAnexosFrete','frete']].forEach(([id,categoria])=>{ const e=$('#'+px+id); if(!e||!e.files)return;
    if(categoria==='frete'){ const f=$('#'+px+'CtrlFrete'); if(!f||f.value!=='sim')return; }
    [...e.files].forEach(file=>out.push({file,categoria})); });
  return out; }
function ctrlArquivoBase64(file){ return new Promise((ok,fail)=>{ const r=new FileReader(); r.onload=()=>ok(String(r.result).split(',')[1]||''); r.onerror=()=>fail(new Error('não foi possível ler o arquivo')); r.readAsDataURL(file); }); }
async function ctrlEnviarAnexos(notaId,estoqueNotaId,anexos){ let ok=0; const falhas=[];
  for(const a of anexos){
    try{
      if(a.file.size>CTRL_ANEXO_MAX)throw new Error('maior que 15 MB');
      const base64=await ctrlArquivoBase64(a.file);
      await ctrlApi({acao:'anexo',notaId,estoqueNotaId,categoria:a.categoria,nome:a.file.name,mime:a.file.type||'application/octet-stream',base64});
      ok++;
    }catch(e){ falhas.push(a.file.name+' ('+((e&&e.message)||'erro')+')'); }
  }
  if(ok)toast('Controle de notas: '+ok+' anexo(s) enviado(s).','ok');
  if(falhas.length)toast('Anexos não enviados: '+esc(falhas.join(', '))+'. Anexe pelos detalhes da nota ou direto no Controle.','warn'); }

/* ===== Aplicação direta na entrada da NF =====
   Material comprado para aplicar direto (OS): logo após a entrada, gera a requisição e percorre o mesmo fluxo da tela —
   aprovação → separação (baixa do estoque item a item) → tipo de envio "aplicacao_direta" — até ficar em
   "Aguardando retirada". Se alguma etapa for recusada (permissão/conexão), para ali e a requisição segue pelo fluxo manual. */
function nfApdDados(){ const c=$('#nfApd'); if(!c||!c.checked)return null;
  if(_nfRepos){ toast('Aplicação direta não pode ser usada numa nota vinculada a reposição.','err'); return false; }
  const aplic=$('#saidaAplic')?$('#saidaAplic').value:''; if(!aplic){ toast('Aplicação direta: informe a aplicação.','err'); if($('#saidaAplicSearch'))$('#saidaAplicSearch').focus(); return false; }
  const os=($('#nfApdOS').value||'').trim(); if(!os){ toast('Aplicação direta: informe o número da Ordem de Serviço.','err'); $('#nfApdOS').focus(); return false; }
  const obra=$('#nfObra').value;
  if(!isOnline){ toast('Aplicação direta precisa de conexão — a requisição é gerada na hora.','err'); return false; }
  /* qualquer usuário do almoxarifado (operador, encarregado) ou admin: a aprovação é automática por ser compra já destinada à OS */
  if(!isAlmoxarife()){ toast('Aplicação direta: disponível para o almoxarifado (operador ou encarregado) e administradores.','err'); return false; }
  return {aplic,os}; }
async function requisicaoAplicacaoDireta({obra,itens,numero,forn,aplic,os}){
  const quem=profile.nome||profile.email;
  const porCode=new Map(); itens.forEach(i=>{ const x=porCode.get(i.code); if(x){ x.qty+=Number(i.qty)||0; if(i.lotes)x.lotes=(x.lotes||[]).concat(i.lotes); } else porCode.set(i.code,{code:i.code,desc:i.desc,unit:i.unit||'',qty:Number(i.qty)||0,lotes:i.lotes?i.lotes.slice():null}); });
  const lista=[...porCode.values()].filter(i=>i.qty>0);
  const falta=lista.filter(i=>saldoOf(obra,i.code)<i.qty-1e-9);
  if(falta.length){ toast('Entrada feita, mas a requisição de aplicação direta NÃO foi gerada: saldo disponível insuficiente em '+falta.map(i=>i.desc).join(', ')+' (há devolução bloqueando saldo?).','err'); go('produtos'); return; }
  const etapa=(msg,reqN)=>{ toast('Entrada feita'+(reqN?' e '+reqN+' criada':'')+', mas a automação parou: '+msg+(reqN?' — continue pelo fluxo normal.':''),'err'); refreshAprovBadge(); refreshSeparacaoBadge(); refreshRetiradasBadge(); refreshGlobalAlerts(); go('produtos'); };
  // 1) cria a requisição
  const payload={obra_id:obra,obra_nome:obraName(obra),solicitante_id:session.user.id,solicitante_nome:quem,
    itens:lista.map(i=>({code:i.code,desc:i.desc,unit:i.unit,qty:i.qty})),
    observacao:'Aplicação direta — NF '+numero+(forn?' · '+forn:''),ordem_servico:os,aplicacao_id:aplic,aplicacao_nome:aplicName(aplic)};
  const {data:ins,error:e1}=await sb.from('requisicoes').insert(payload).select('id');
  if(e1||!ins||!ins.length)return etapa('não foi possível criar a requisição'+(e1?' ('+e1.message+')':''));
  const reqId=ins[0].id, reqN='REQ-'+String(reqId).padStart(5,'0');
  // 2) aprovação (tudo disponível — o saldo acabou de entrar)
  const {error:e2}=await sb.from('requisicao_itens_status').upsert(lista.map(i=>({requisicao_id:reqId,code:i.code,descricao:i.desc,unidade:i.unit,quantidade_solicitada:i.qty,quantidade_disponivel:i.qty,status:'disponivel'})),{onConflict:'requisicao_id,code'});
  if(e2)return etapa('erro ao gravar os itens da aprovação ('+e2.message+')',reqN);
  const {error:e3}=await updReq(reqId,{status:'em_separacao',decidido_por:session.user.id,decidido_por_nome:quem+' (automática — aplicação direta)',decidido_em:new Date().toISOString()});
  if(e3)return etapa('a aprovação automática foi recusada pelo banco ('+e3.message+') — a requisição ficou aguardando aprovação de um encarregado',reqN);
  // 3) separação item a item (mesma reserva + baixa da tela de Separação)
  for(const i of lista){
    const {data:claim,error:eC}=await sb.from('requisicao_itens_status').update({quantidade_disponivel:0,quantidade_separada:i.qty,status:'separado',atualizado_em:new Date().toISOString()})
      .eq('requisicao_id',reqId).eq('code',i.code).eq('quantidade_separada',0).select('id');
    if(eC||!claim||!claim.length){ await save('Separação '+reqN+' (aplicação direta)'); return etapa('separação de '+i.desc+' não gravou'+(eC?' ('+eC.message+')':''),reqN); }
    const p=findProduct(i.code); const vu=p?(p.custo||0):0;
    const lt=addSaldo(obra,i.code,-i.qty,i.lotes);
    const {data:numData,error:eNum}=await sb.rpc('proximo_numero_documento',{p_tipo:'baixa'});
    pushMov({id:uid(),ts:Date.now(),seq:eNum?0:numData,tipo:'baixa',obra,aplic,obs:payload.observacao,os,code:i.code,desc:i.desc,qty:i.qty,valorUnit:vu,valorTotal:i.qty*vu,doc:'Separação '+reqN,saldo:saldoOf(obra,i.code),lotes:lt||undefined});
  }
  await save('Separação '+reqN+' (aplicação direta)');
  const c=await concluirSeparacaoReq(reqId); if(!c.ok){ _sepPresas.set(reqId,c.motivo); return etapa('separação não concluída ('+c.motivo+')',reqN); }
  // 4) tipo de envio: balcão — aplicação direta (vai para "Aguardando retirada")
  const {error:e4}=await updReq(reqId,{tipo_envio:'aplicacao_direta',status:'romaneio_emitido'});
  if(e4)return etapa('tipo de envio não gravado ('+e4.message+')',reqN);
  try{ await sb.rpc('log_event',{p_acao:'aplicacao_direta_nf',p_entidade:'requisicoes',p_entidade_id:String(reqId),p_detalhes:{nf:numero,fornecedor:forn||null,os,aplicacao:aplicName(aplic)}}); }catch(e){}
  toast(reqN+' gerada (OS '+os+') — aguardando retirada.','ok');
  refreshAprovBadge(); refreshSeparacaoBadge(); refreshExpedBadge(); refreshRetiradasBadge(); refreshMinhasBadge(); refreshGlobalAlerts();
  go(podeVerRetiradas()?'retiradas':'produtos');
}

/* ===== PRODUTOS ===== */
function renderProdutos(){
  $('#topActions').innerHTML=`${obraSelectorHTML(true)} <button class="btn ghost sm" onclick="newProductModal()">+ Produto</button> <button class="btn dark sm" onclick="labelsModal()">🏷 Etiquetas</button>`;
  const o=curObra(); const all=o==='__all'; const sal=c=>all?totalSaldo(c):saldoOf(o,c);
  let html=`<div class="sechead"><h3>Produtos${all?' (saldo total)':' · saldo em '+esc(obraName(o))}</h3><span class="muted" style="font-size:11.5px">${all?'Mín/Máx: padrão do produto (vale nas obras sem valor próprio)':'Mín/Máx desta obra — em cinza/itálico = padrão do produto'}</span>
    <div style="display:flex;gap:8px;align-items:center;flex-wrap:wrap">
      <div class="search" style="min-width:180px"><span class="si">⌕</span><input id="prodSearch" placeholder="Nome, código, auxiliar ou equipamento..."></div>
      <label style="display:flex;align-items:center;gap:6px;font-size:12px;text-transform:none;font-weight:500;margin:0;color:#5a544a"><input type="checkbox" id="prodZero" style="width:auto"> Incluir zerados</label>
    </div></div>`;
  if(!state.products.length){ html+=`<div class="tbl-wrap"><div class="empty"><div class="ico">≣</div>Nenhum produto.</div></div>`; $('#view').innerHTML=html; return; }
  html+=`<div class="tbl-wrap"><table class="fixa"><colgroup><col style="width:70px"><col style="width:170px"><col style="width:110px"><col><col style="width:90px"><col style="width:100px"><col style="width:100px"><col style="width:110px"><col style="width:100px"><col style="width:96px"></colgroup><thead><tr><th>Foto</th><th>Cód. barras</th><th>Cód. aux.</th><th>Produto</th><th class="num">Saldo</th><th class="num">Mín</th><th class="num">Máx</th><th class="num">Custo</th><th class="num">Venda</th><th></th></tr></thead><tbody id="prodRows"></tbody></table></div>`;
  $('#view').innerHTML=html;
  const draw=()=>{ const q=($('#prodSearch').value||'').toLowerCase(); const zero=$('#prodZero').checked;
    let list=state.products.filter(p=>{ const s=sal(p.code);
      if(!zero && !(s>0))return false;
      if(q && !(p.desc.toLowerCase().includes(q)||String(p.code).includes(q)||(p.aux&&String(p.aux).toLowerCase().includes(q))||(p.fab&&String(p.fab).toLowerCase().includes(q))||(p.ref&&p.ref.toLowerCase().includes(q))||(p.grupo&&p.grupo.toLowerCase().includes(q))||(p.localizacao&&p.localizacao.toLowerCase().includes(q))||(p.endereco&&p.endereco.toLowerCase().includes(q))))return false;
      return true; });
    const sig=[q,zero,curObra()].join('|'); if(window._prodSig!==sig){ window._prodSig=sig; window._prodLim=LIST_PAGE; }
    const full=list; list=full.slice(0,window._prodLim||LIST_PAGE);
    const ed=podeEditarLimites();
    $('#prodRows').innerHTML=list.map(p=>{const s=sal(p.code);const st=statusOf(p,s,o); const L=limDe(p,o);
      const inp=f=>all?`<input class="inline-edit" type="number" step="any" value="${p[f]}" ${ed?'':'disabled'} title="Padrão do produto (vale nas obras sem valor próprio)" onchange="setField('${esc(p.code)}','${f}',this.value)">`
        :L.off?`<span class="muted" style="font-size:11px">não controla</span>`
        :`<input class="inline-edit" type="number" step="any" value="${L[f]}" ${ed?'':'disabled'} style="${L.proprio?'':'color:#a09a8d;font-style:italic'}" title="${L.proprio?'Valor próprio desta obra':'Padrão do produto — altere para definir o valor desta obra'}" onchange="setLimObra('${esc(o)}','${esc(p.code)}','${f}',this.value)">`;
      return `<tr><td>${thumb(p.code)}</td>
      <td><svg class="bc" id="bc_${esc(p.code)}"></svg><div class="mono" style="font-size:11px;color:#8a8377;text-align:center">${esc(p.code)}</div></td>
      <td class="mono">${esc(p.aux||'—')}</td>
      <td>${esc(p.desc)}<br><span class="muted" style="font-size:11px">${esc(p.unit||'UN')}</span>${p.grupo?` · <span class="muted" style="font-size:11px">${esc(p.grupo)}</span>`:''}${(p.localizacao||p.endereco)?`<div class="refline">📍 ${esc([p.localizacao,p.endereco].filter(Boolean).join(' · '))}</div>`:''}${p.ref?`<div class="refline clamp" title="${esc(p.ref)}" onclick="this.classList.toggle('aberta')">↳ ${esc(p.ref)}</div>`:''}</td>
      <td class="num"><b class="${st==='low'?'neg':''}">${numf(s)}</b></td>
      <td class="num">${inp('min')}</td>
      <td class="num">${inp('max')}${!all&&L.proprio&&ed?`<div><a href="#" style="font-size:10.5px;color:#7a5100" title="Voltar ao padrão do produto" onclick="resetLimObra('${esc(o)}','${esc(p.code)}');renderProdutos();return false">↺ padrão</a></div>`:''}</td>
      <td class="num">${money(p.custo||0)}</td>
      <td class="num">${p.preco?money(p.preco):'—'}</td>
      <td class="num" style="white-space:nowrap"><button class="btn ghost sm" title="Editar (custo, venda, foto, equipamento)" onclick="editProductModal('${esc(p.code)}')">✎</button> <button class="btn danger sm" title="Excluir (supervisor)" onclick="delProduct('${esc(p.code)}')">✕</button></td></tr>`;}).join('')+listMoreRow(10,list.length,full.length,'prodMais')||`<tr><td colspan="10" class="empty" style="padding:28px">Nada encontrado.</td></tr>`;
    watchListMore($('#prodRows'),'prodMais');
    withBarcode(()=>list.forEach(p=>{try{JsBarcode('#bc_'+CSS.escape(p.code),String(p.code),{format:'CODE128',width:1.3,height:32,fontSize:0,margin:2,displayValue:false});}catch(e){}})); };
  window.prodMais=all=>{ window._prodLim=all?Infinity:(window._prodLim||LIST_PAGE)+LIST_PAGE*2; draw(); };
  draw(); ['prodSearch','prodZero'].forEach(id=>{const el=$('#'+id); if(el){el.oninput=draw; el.onchange=draw;}});
}
function setField(code,f,v){ const p=findProduct(code); if(!p)return;
  if((f==='min'||f==='max')&&!podeEditarLimites()){ toast('Somente admin e almoxarifado alteram mínimo/máximo.','err'); return; }
  p[f]=parseFloat(v)||0; save();
  if(f==='min'||f==='max'){ if(p.max>0&&p.min>p.max)toast('Mínimo maior que o máximo.','warn'); } refreshBadge(); }
function delProduct(code){ const p=findProduct(code); if(!p)return;
  /* o saldo vive na tabela saldos_estoque: excluir o cadastro com saldo deixava esse saldo "invisível" no banco */
  const comSaldo=state.obras.filter(o=>saldoTotalOf(o.id,code)!==0);
  if(comSaldo.length){ toast('Este produto ainda tem saldo em '+comSaldo.map(o=>o.nome+' ('+numf(saldoTotalOf(o.id,code))+')').join(', ')+'. Zere o saldo (Ajuste de saldo) ou transfira antes de excluir.','err'); return; }
  requireSupervisor(`Excluir produto "${p.desc}"`,()=>{ state.products=state.products.filter(x=>String(x.code)!==String(code));
    state.obras.forEach(o=>{ if(state.estoque[o.id])delete state.estoque[o.id][code]; }); delete photos[code]; savePhotos(); { const exs=fotosExt[code]||[]; if(exs.length){ delete fotosExt[code]; sb.from('produto_fotos').delete().eq('code',code).then(()=>sb.storage.from('produtos').remove(exs.map(x=>x.path))).catch(()=>{}); } } save('Produto excluído: '+p.desc+' ('+code+')'); renderProdutos(); toast('Produto excluído.','ok'); }); }
function qrPayloadFor(p){
  const lines=[
    'CÓDIGO: '+p.code,
    p.aux?('AUXILIAR: '+p.aux):null,
    'DESCRIÇÃO: '+p.desc,
    'UNIDADE: '+(p.unit||'UN'),
    'MÍNIMO: '+numf(p.min||0),
    'MÁXIMO: '+numf(p.max||0),
    'CUSTO: '+money(p.custo||0),
    p.preco?('VENDA: '+money(p.preco)):null,
    p.grupo?('GRUPO: '+p.grupo):null,
    p.ncm?('NCM: '+p.ncm):null,
    (p.localizacao||p.endereco)?('LOCAL: '+[p.localizacao,p.endereco].filter(Boolean).join(' · ')):null,
    p.ref?('REFERÊNCIA: '+p.ref):null
  ].filter(Boolean);
  return lines.join('\n');
}
function editProductModal(code){ const p=findProduct(code); if(!p)return;
  let saldos=state.obras.map(o=>`${esc(o.nome)}: <b>${numf(saldoOf(o.id,code))}</b>`).join(' · ')||'sem obras';
  const grupos=[...new Set(state.products.map(x=>x.grupo).filter(Boolean))]; const locais=[...new Set(state.products.map(x=>x.localizacao).filter(Boolean))];
  modal(`<h3>Editar produto</h3><p class="mp mono">${esc(p.code)}</p>
    <div class="tabs"><button id="epTabCad" class="on" onclick="epTab('cad')">Cadastro</button><button id="epTabFis" onclick="epTab('fis')">Fiscal e composição do custo</button></div>
    <div id="epPaneCad">
    <div style="display:flex;gap:18px;align-items:flex-start;margin-bottom:14px;flex-wrap:wrap">
      <div style="text-align:center;min-width:180px"><div id="epPhoto" style="display:flex;flex-wrap:wrap;justify-content:center;gap:6px"></div>
      <input type="file" id="epFile" accept="image/*" multiple capture="environment" style="display:none" onchange="uploadPhoto('${esc(code)}',this)">
      <div style="margin-top:10px"><button class="btn ghost sm" onclick="document.getElementById('epFile').click()">📷 Adicionar foto(s)</button></div></div>
      <div style="text-align:center;min-width:150px"><div class="muted" style="font-size:11px;margin-bottom:4px">QR do cadastro (todas as informações)</div><div id="epQR" style="display:flex;justify-content:center"></div></div>
      <div style="flex:1;min-width:200px"><div class="field"><label>Descrição</label><input id="epDesc" value="${esc(p.desc)}"></div><div class="field"><label>Unidade</label><input id="epUnit" value="${esc(p.unit||'UN')}"></div></div></div>
    <div class="field"><label>Código auxiliar (outro sistema)</label><input id="epAux" class="mono" value="${esc(p.aux||'')}" placeholder="Código usado em outro sistema"></div>
    ${fabCampoHTML('ep',p.fab,`lerFabNoModal('ep',()=>editProductModal('${esc(code)}'),'${esc(code)}')`)}
    <div class="row c2"><div class="field"><label>Custo médio (R$)</label><input id="epCusto" type="number" step="any" value="${p.custo||0}"></div><div class="field"><label>Preço venda (R$)</label><input id="epPreco" type="number" step="any" value="${p.preco||0}"></div></div>
    <div class="row c3">
      <div class="field" style="margin:0"><label>Grupo do insumo</label><input id="epGrupo" list="grupoListE" value="${esc(p.grupo||'')}" placeholder="Ex.: Elétrica, EPI..."></div>
      <div class="field" style="margin:0"><label>Estoque (Localização)</label><input id="epLocal" list="localListE" value="${esc(p.localizacao||'')}" placeholder="Ex.: Almoxarifado Central"></div>
      <div class="field" style="margin:0"><label>Endereço</label><input id="epEndereco" value="${esc(p.endereco||'')}" placeholder="Ex.: Corredor B, Prateleira 3"></div>
    </div>
    <div class="row c2" style="align-items:start;margin-top:14px">
      <div class="field" style="margin:0"><label style="display:flex;align-items:center;gap:8px;text-transform:none;font-weight:600;margin:0"><input type="checkbox" id="epLote" style="width:auto" ${p.controlaLote?'checked':''}> 🏷 Controla lote e validade</label>
        <div class="muted" style="font-size:11px;margin-top:3px">A entrada por nota passa a exigir lote/validade; as saídas consomem primeiro o lote que vence primeiro. ${lotesAtivos()?`<a href="#" onclick="closeModal();lotesModal('${esc(code)}');return false">Ver lotes</a>`:''}</div></div>
      <div class="field" style="margin:0"><label>Alertar vencimento com (dias de antecedência)</label><input id="epDiasVenc" type="number" min="0" step="1" value="${p.diasAlertaVenc||''}" placeholder="padrão: ${diasAlertaVenc(null)} dias"></div>
    </div>
    <datalist id="grupoListE">${grupos.map(g=>`<option value="${esc(g)}">`).join('')}</datalist>
    <datalist id="localListE">${locais.map(l=>`<option value="${esc(l)}">`).join('')}</datalist>
    <div class="field"><label>Referências / Aplicação</label><textarea id="epRef" rows="3" placeholder="Ex.: usado na escavadeira CAT 320 · filtro hidráulico">${esc(p.ref||'')}</textarea></div>
    <div style="font-size:11.5px;color:#8a8377;margin-bottom:14px">Saldo por obra — ${saldos}</div>
    </div>
    <div id="epPaneFis" style="display:none">
      <div class="row c2"><div class="field"><label>NCM</label><input id="epNcm" class="mono" value="${esc(p.ncm||'')}" placeholder="8 dígitos" data-noupper></div><div class="field"><label>CST (ICMS)</label><input id="epCst" class="mono" value="${esc(p.cst||'')}" placeholder="Ex.: 000, 060, 0102" data-noupper></div></div>
      <p class="muted" style="font-size:11.5px;margin:-6px 0 14px">Preenchidos automaticamente pelo XML da última nota recebida. CST = origem + CST do ICMS (ou CSOSN no Simples Nacional).</p>
      ${composicaoCustoHTML(p)}
      ${isEncarregado()?`<div style="margin:12px 0 4px"><button class="btn ghost sm" onclick="recalcAbrir(['${esc(code)}'])">🧮 Recalcular custo médio deste produto</button></div>`:''}
    </div>
    <div style="display:flex;gap:10px;justify-content:flex-end;flex-wrap:wrap">${podeUnificar()?`<button class="btn ghost" style="margin-right:auto" onclick="unificarModal(['${esc(code)}'])">⇄ Unificar com outro produto</button>`:''}<button class="btn ghost" onclick="closeModal()">Fechar</button><button class="btn primary" onclick="saveEditProduct('${esc(code)}')">Salvar</button></div>`);
  renderEpGallery(code); loadFotosExt().then(mudou=>{ if(mudou&&document.getElementById('epPhoto'))renderEpGallery(code); });
  const qrBox=$('#epQR'); if(qrBox){ qrBox.innerHTML=''; try{
    const qr=qrcode(0,'M'); qr.addData(qrPayloadFor(p)); qr.make();
    qrBox.innerHTML=qr.createSvgTag({cellSize:4,margin:4});
    const svg=qrBox.querySelector('svg'); if(svg){svg.style.maxWidth='140px';svg.style.width='100%';svg.style.height='auto';}
  }catch(e){ qrBox.innerHTML='<span class="muted" style="font-size:10.5px;color:#b03030">Erro: '+esc(e&&e.message||String(e))+'</span>'; toast('QR: '+(e&&e.message||e),'err'); } }
}
function epTab(t){ ['cad','fis'].forEach(k=>{ const b=$('#epTab'+(k==='cad'?'Cad':'Fis')), pn=$('#epPane'+(k==='cad'?'Cad':'Fis')); if(b)b.classList.toggle('on',k===t); if(pn)pn.style.display=k===t?'':'none'; }); }
/* Composição do custo: a partir das notas de entrada do produto (mais recente primeiro), mostra valor unitário da NF,
   frete rateado, custo de entrada e como o custo médio ponderado foi recalculado (saldo anterior × custo anterior + entrada). */
function composicaoCustoHTML(p){ const u=esc(p.unit||'UN');
  const ents=[]; state.notas.forEach(n=>(n.itens||[]).forEach(it=>{ if(it.code===p.code)ents.push({n,it}); }));
  ents.sort((a,b)=>(b.n.ts||0)-(a.n.ts||0));
  const head=`<div class="sechead" style="margin:4px 0 8px"><h3 style="margin:0;font-size:14px">Composição do custo</h3><span class="muted" style="font-size:12px">Custo médio atual: <b>${money(p.custo||0)}</b> / ${u}</span></div>`;
  if(!ents.length)return head+`<div class="tbl-wrap"><div class="empty" style="padding:18px">Nenhuma nota de entrada registrada para este produto. O custo atual veio do cadastro, de importação ou de ajuste manual.</div></div>`;
  const acr=it=>nfExtrasLista(it).reduce((t,e)=>t+(e.neg?-e.v:e.v),0);
  const un=it=>it.custoNF!=null?it.custoNF:(it.custo||0)-(it.qty>0?acr(it)/it.qty:0);
  const dt=n=>n.dataEmissao?new Date(n.dataEmissao+'T00:00:00').toLocaleDateString('pt-BR'):fmtDate(n.ts);
  const {n:n0,it:i0}=ents[0]; const q0=i0.qty||1;
  let det=`<div style="border:1px solid #e4dfd4;border-radius:10px;padding:12px 14px;margin-bottom:14px;font-size:13px;line-height:1.7;background:#fbf9f4">
    <div style="font-size:11px;color:#8a8377;text-transform:uppercase;letter-spacing:.5px;font-weight:700;margin-bottom:4px">Última entrada · NF ${esc(n0.numero)} · ${esc(n0.forn||'sem fornecedor')} · ${dt(n0)}</div>
    ${i0.xmlUnit&&i0.fator&&i0.fator!==1?`<div class="muted" style="font-size:12px">Na nota: ${numf(i0.xmlQty)} ${esc(i0.xmlUnit)} · 1 ${esc(i0.xmlUnit)} = ${numf(i0.fator)} ${u} → ${numf(i0.qty)} ${u}</div>`:''}
    <div style="display:grid;grid-template-columns:1fr auto;gap:0 16px;max-width:420px">
      <span>Valor unitário na NF</span><span class="mono" style="text-align:right">${money(un(i0))}</span>
      ${nfExtrasLista(i0).map(e=>`<span>${e.neg?'−':'+'} ${e.l} (${money(e.v)} ÷ ${numf(q0)} ${u})</span><span class="mono" style="text-align:right">${e.neg?'−':''}${money(e.v/q0)}</span>`).join('')||`<span class="muted">Sem frete, impostos ou despesas adicionais na nota</span><span></span>`}
      <span style="border-top:1px solid #e4dfd4;font-weight:700">= Custo unitário de entrada</span><span class="mono" style="text-align:right;border-top:1px solid #e4dfd4;font-weight:700">${money(i0.custo||0)}</span>
    </div>`;
  if(i0.qAnt!=null){ const q=i0.qAnt;
    det+=`<div style="margin-top:10px;padding-top:8px;border-top:1px dashed #e4dfd4">
      <div><b>Custo médio ponderado</b> = (saldo anterior × custo anterior + qtd. entrada × custo de entrada) ÷ (saldo anterior + qtd. entrada)</div>
      <div class="mono" style="font-size:12.5px">= (${numf(q)} × ${money(i0.custoAnt||0)} + ${numf(i0.qty)} × ${money(i0.custo||0)}) ÷ (${numf(q)} + ${numf(i0.qty)}) = <b>${money(i0.custoMedio||0)}</b></div>
      ${Math.abs((i0.custoMedio||0)-(p.custo||0))>0.005?`<div class="muted" style="font-size:12px">O custo médio atual (${money(p.custo||0)}) foi alterado depois desta entrada (edição manual, unificação ou outra movimentação).</div>`:''}</div>`; }
  else det+=`<div class="muted" style="font-size:12px;margin-top:8px">O cálculo do custo médio desta entrada não foi guardado (nota lançada antes desse registro ou com XML reprocessado). Use "Recalcular custo médio deste produto" abaixo.</div>`;
  det+=`</div>`;
  const linhas=ents.slice(0,15).map(({n,it})=>`<tr><td style="white-space:nowrap">${dt(n)}</td><td><span class="mono">NF ${esc(n.numero)}</span><div class="muted" style="font-size:11px">${esc(n.forn||'—')}${it.ncm?' · NCM '+esc(it.ncm):''}${it.cst?' · CST '+esc(it.cst):''}</div></td><td class="num">${numf(it.qty)}</td><td class="num">${money(un(it))}</td><td class="num">${acr(it)?money(acr(it)/(it.qty||1)):'—'}</td><td class="num"><b>${money(it.custo||0)}</b></td><td class="num">${it.custoMedio!=null?money(it.custoMedio):'—'}</td></tr>`).join('');
  return head+det+`<div class="tbl-wrap"><table class="comp-custo" style="font-size:12px"><thead><tr><th>Data</th><th>Nota</th><th class="num">Qtd (${u})</th><th class="num">Un. NF</th><th class="num" title="Frete, seguro, outras despesas, IPI e ICMS-ST, menos desconto, por unidade">Acrésc. un.</th><th class="num">Custo entrada</th><th class="num">Custo médio após</th></tr></thead><tbody>${linhas}</tbody></table></div>${ents.length>15?`<p class="muted" style="font-size:11.5px;margin-top:6px">Mostrando as 15 entradas mais recentes de ${ents.length}.</p>`:''}`;
}
function saveEditProduct(code){ const p=findProduct(code); if(!p)return; const d=$('#epDesc').value.trim(); if(!d){toast('Descrição obrigatória.','err');return;}
  if($('#epFab')){ const fl=fabNormalizar($('#epFab').value); const cf=fabConflito(fl,code); if(cf){ toast(esc(cf.msg),'err'); return; } if(fl.some(c=>c.length<4||c.length>60)){ toast('Código de barras do fabricante inválido (de 4 a 60 caracteres).','err'); return; } p.fab=fl.join(', '); }
  p.desc=d; p.unit=$('#epUnit').value.trim()||'UN'; p.aux=($('#epAux')?$('#epAux').value.trim():(p.aux||'')); if($('#epCusto'))p.custo=parseFloat($('#epCusto').value)||0; if($('#epPreco'))p.preco=parseFloat($('#epPreco').value)||0; p.ref=$('#epRef').value.trim();
  p.grupo=($('#epGrupo')?$('#epGrupo').value.trim():''); p.localizacao=($('#epLocal')?$('#epLocal').value.trim():''); p.endereco=($('#epEndereco')?$('#epEndereco').value.trim():'');
  if($('#epNcm'))p.ncm=onlyDigits($('#epNcm').value); if($('#epCst'))p.cst=onlyDigits($('#epCst').value);
  if($('#epLote')){ if($('#epLote').checked)p.controlaLote=true; else delete p.controlaLote; }
  if($('#epDiasVenc')){ const d=parseInt($('#epDiasVenc').value,10); if(d>0)p.diasAlertaVenc=d; else delete p.diasAlertaVenc; }
  save(); closeModal(); renderProdutos(); toast('Produto atualizado.','ok'); }
function newProductModal(){ const grupos=[...new Set(state.products.map(p=>p.grupo).filter(Boolean))]; const locais=[...new Set(state.products.map(p=>p.localizacao).filter(Boolean))];
  modal(`<h3>Novo produto</h3><p class="mp">O código de barras é gerado se ficar em branco. Saldo entra na obra <b>${esc(obraName(curObra()==='__all'?state.obras[0].id:curObra()))}</b>.</p>
    <div class="field"><label>Código (opcional)</label><input id="npCode" class="mono" placeholder="auto"></div>
    <div class="field"><label>Descrição</label><input id="npDesc"></div>

async function reqBloqueioEdicao(id){
  const {data:r,error}=await sb.from('requisicoes').select('status').eq('id',id).maybeSingle();

  if((its||[]).some(i=>Number(i.quantidade_separada)>0)) return 'Esta requisição já tem separação realizada — somente visualização.';

function baixaFiltro(q){ const t=String(q||'').trim().toLowerCase(); if(!t)return null;
  const mr=/^req[\s\-#.nº°]*0*(\d+)$/.exec(t); if(mr){ const n=parseInt(mr[1],10); return {req:n,soReq:true,fn:m=>reqIdFromDoc(m.doc)===n}; }

/* ===== Trava do Ajuste de Saldo (ajuste manual) =====
   O ajuste manual nasce BLOQUEADO para os demais perfis. Só o usuário controlador (Daniel) libera e fecha;
   ele próprio sempre pode ajustar. O estado fica em state.config.ajusteManual (documento compartilhado),

   Não afeta os ajustes vindos da rotina Inventário (contagem autorizada). */
function ajusteManualLiberado(){ const a=state.config&&state.config.ajusteManual; return !!(a&&a.aberto); }
